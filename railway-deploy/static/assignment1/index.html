<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1 | UCLA Anderson MGMT298D</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; }
        ::-webkit-scrollbar-thumb { background: #2774AE; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffe033; }

        .select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #1a1a1a;
            background: #ffffff;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .select:focus {
            border-color: #FFD100;
            box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // UCLA Blue Theme Colors
        const colors = {
            primary: '#2774AE',
            accent: '#FFD100',
            darkBlue: '#005587',
            lightBlue: '#8BB8E8',
            positive: '#22c55e',
            negative: '#ef4444',
            warning: '#f59e0b',
            background: '#ffffff',
            headerBg: '#2774AE',
            cardBg: '#ffffff',
            cardBorder: 'rgba(0, 0, 0, 0.1)',
            inputBg: '#ffffff',
            text: '#1a1a1a',
            textMuted: '#666666',
            textDim: '#888888',
            modelA: '#ff6b6b',
            modelB: '#4ecdc4',
            modelC: '#45b7d1'
        };

        // Scatter Chart Component with Perfect Fit Line
        function ScatterChart({ data, xKey, yKey, title, color }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                const points = data.map(d => ({ x: d[xKey], y: d[yKey] }));

                // Calculate bounds for perfect fit line
                const allValues = [...points.map(p => p.x), ...points.map(p => p.y)];
                const minVal = Math.min(...allValues);
                const maxVal = Math.max(...allValues);

                chartRef.current = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            {
                                label: 'Predictions',
                                data: points,
                                backgroundColor: color + '99',
                                borderColor: color,
                                borderWidth: 1,
                                pointRadius: 4
                            },
                            {
                                label: 'Perfect Fit',
                                data: [{ x: minVal, y: minVal }, { x: maxVal, y: maxVal }],
                                type: 'line',
                                borderColor: '#ef4444',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                pointRadius: 0,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: title,
                                color: colors.text,
                                font: { size: 14, weight: '500' }
                            },
                            legend: {
                                labels: { color: colors.textMuted, font: { size: 10 } }
                            }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: 'Actual Reviews/Month', color: colors.textMuted },
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: colors.textMuted }
                            },
                            y: {
                                title: { display: true, text: 'Predicted Reviews/Month', color: colors.textMuted },
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: colors.textMuted }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, xKey, yKey, title, color]);

            return <canvas ref={canvasRef} />;
        }

        // Bar Chart Component
        function BarChart({ data, labels, title, colorArray }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'MAE',
                            data: data,
                            backgroundColor: colorArray,
                            borderColor: colorArray.map(c => c),
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: title,
                                color: colors.text,
                                font: { size: 14, weight: '500' }
                            },
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: colors.textMuted, font: { size: 11 } }
                            },
                            y: {
                                title: { display: true, text: 'Mean Absolute Error (MAE)', color: colors.textMuted },
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: colors.textMuted }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, labels, title, colorArray]);

            return <canvas ref={canvasRef} />;
        }

        // Horizontal Bar Chart for Feature Importance
        function FeatureImportanceChart({ coefficients }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !coefficients || coefficients.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                const sorted = [...coefficients].sort((a, b) => b.abs_coefficient - a.abs_coefficient);

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: sorted.map(c => c.feature),
                        datasets: [{
                            label: 'Coefficient',
                            data: sorted.map(c => c.coefficient),
                            backgroundColor: sorted.map(c => c.coefficient >= 0 ? colors.positive + 'cc' : colors.negative + 'cc'),
                            borderColor: sorted.map(c => c.coefficient >= 0 ? colors.positive : colors.negative),
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            title: {
                                display: true,
                                text: 'Feature Coefficients (Model C)',
                                color: colors.text,
                                font: { size: 14, weight: '500' }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: colors.textMuted }
                            },
                            y: {
                                grid: { display: false },
                                ticks: { color: colors.textMuted, font: { size: 10 } }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [coefficients]);

            return <canvas ref={canvasRef} />;
        }

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('patterns');
            const [neighborhoods, setNeighborhoods] = useState([]);
            const [selectedNeighborhood, setSelectedNeighborhood] = useState('All');
            const [isLoading, setIsLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);

            // Fetch neighborhoods on mount
            useEffect(() => {
                fetch('/api/neighborhoods')
                    .then(res => res.json())
                    .then(data => {
                        setNeighborhoods(['All', ...data.neighborhoods]);
                    })
                    .catch(err => console.error('Failed to load neighborhoods:', err));
            }, []);

            // Run analysis
            const runAnalysis = async () => {
                setIsLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/analyze/${encodeURIComponent(selectedNeighborhood)}`);
                    if (!res.ok) throw new Error('Analysis failed');
                    const data = await res.json();
                    setResults(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            // Run on neighborhood change
            useEffect(() => {
                if (selectedNeighborhood) {
                    runAnalysis();
                }
            }, [selectedNeighborhood]);

            // Prepare scatter data
            const getScatterData = (predKey) => {
                if (!results?.sample_data) return [];
                return results.sample_data.map(d => ({
                    actual: d.actual,
                    predicted: d[predKey]
                }));
            };

            return (
                <div style={{ minHeight: '100vh' }}>
                    {/* Header */}
                    <header style={{
                        background: '#2774AE',
                        borderBottom: '2px solid #FFD100',
                        padding: '1rem 2rem',
                        position: 'sticky',
                        top: 0,
                        zIndex: 100
                    }}>
                        <div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                                <p style={{ fontSize: '0.65rem', color: '#FFD100', fontWeight: 400, marginBottom: '0.25rem', textTransform: 'uppercase', letterSpacing: '0.2em' }}>
                                    MGMT298D: Science and Strategy of AI
                                </p>
                                <h1 style={{ fontSize: '1.4rem', fontWeight: 600, color: '#f5f5f5', letterSpacing: '0' }}>
                                    Assignment 1: Linear Regression with Feature Engineering
                                </h1>
                                <p style={{ fontSize: '0.85rem', color: '#b0b0b0', marginTop: '0.25rem' }}>
                                    Application: Predicting Airbnb Listing Engagement
                                </p>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <span style={{
                                    fontSize: '1rem',
                                    fontWeight: 500,
                                    color: '#f5f5f5'
                                }}>
                                    UCLA Anderson
                                </span>
                            </div>
                        </div>
                    </header>

                    <div style={{ maxWidth: '1400px', margin: '0 auto', padding: '24px' }}>
                        {/* Introduction */}
                        <div style={{
                            background: colors.cardBg,
                            borderRadius: '12px',
                            padding: '24px',
                            border: `1px solid ${colors.cardBorder}`,
                            marginBottom: '24px'
                        }}>
                            <p style={{ color: colors.text, lineHeight: 1.7, fontSize: '0.95rem' }}>
                                This interactive tool demonstrates how <strong style={{ color: colors.primary }}>feature engineering</strong> improves regression models.
                                We'll predict monthly review frequency for Airbnb listings in Los Angeles using listing characteristics.
                            </p>
                            <p style={{ color: colors.textMuted, lineHeight: 1.7, fontSize: '0.9rem', marginTop: '12px' }}>
                                <strong style={{ color: colors.accent }}>The Business Question:</strong> Can we identify which listing features drive guest engagement to optimize host strategies?
                            </p>
                        </div>

                        {/* Controls */}
                        <div style={{
                            display: 'flex',
                            gap: '16px',
                            alignItems: 'flex-end',
                            marginBottom: '24px'
                        }}>
                            <div style={{ flex: 1, maxWidth: '400px' }}>
                                <label style={{ display: 'block', fontSize: '0.8rem', color: colors.textMuted, marginBottom: '8px' }}>
                                    Select Neighborhood
                                </label>
                                <select
                                    className="select"
                                    value={selectedNeighborhood}
                                    onChange={(e) => setSelectedNeighborhood(e.target.value)}
                                >
                                    {neighborhoods.map(n => (
                                        <option key={n} value={n}>{n === 'All' ? 'All Neighborhoods' : n}</option>
                                    ))}
                                </select>
                            </div>
                            <button
                                onClick={runAnalysis}
                                disabled={isLoading}
                                style={{
                                    padding: '12px 32px',
                                    background: isLoading ? colors.textDim : `linear-gradient(135deg, ${colors.primary} 0%, ${colors.darkBlue} 100%)`,
                                    border: 'none',
                                    borderRadius: '8px',
                                    color: 'white',
                                    fontSize: '0.9rem',
                                    fontWeight: '500',
                                    cursor: isLoading ? 'not-allowed' : 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '8px',
                                    transition: 'all 0.2s ease'
                                }}
                            >
                                {isLoading ? <><div className="spinner"></div> Analyzing...</> : 'Run Analysis'}
                            </button>
                        </div>

                        {/* Tabs */}
                        <div style={{ display: 'flex', gap: '4px', marginBottom: '24px', borderBottom: `1px solid ${colors.cardBorder}`, paddingBottom: '12px' }}>
                            {[
                                { id: 'patterns', label: 'Data Patterns', icon: '📈' },
                                { id: 'comparison', label: 'Model Comparison', icon: '🎯' },
                                { id: 'summary', label: 'Summary', icon: '📋' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    style={{
                                        padding: '10px 24px',
                                        border: 'none',
                                        background: activeTab === tab.id ? colors.primary : 'transparent',
                                        borderRadius: '6px',
                                        fontSize: '0.85rem',
                                        fontWeight: activeTab === tab.id ? '500' : '400',
                                        color: activeTab === tab.id ? 'white' : colors.textMuted,
                                        cursor: 'pointer',
                                        transition: 'all 0.2s ease',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '8px'
                                    }}
                                >
                                    <span>{tab.icon}</span> {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Error Display */}
                        {error && (
                            <div style={{
                                background: 'rgba(239, 68, 68, 0.1)',
                                border: '1px solid rgba(239, 68, 68, 0.3)',
                                borderRadius: '8px',
                                padding: '16px',
                                marginBottom: '24px',
                                color: colors.negative
                            }}>
                                Error: {error}
                            </div>
                        )}

                        {/* Loading State */}
                        {isLoading && (
                            <div style={{
                                display: 'flex',
                                justifyContent: 'center',
                                alignItems: 'center',
                                height: '300px',
                                color: colors.textMuted
                            }}>
                                <div className="spinner" style={{ marginRight: '12px' }}></div>
                                Running analysis...
                            </div>
                        )}

                        {/* Results */}
                        {!isLoading && results && (
                            <div className="fade-in">
                                {/* Tab: Data Patterns */}
                                {activeTab === 'patterns' && (
                                    <div>
                                        <div style={{
                                            background: colors.cardBg,
                                            borderRadius: '12px',
                                            padding: '24px',
                                            border: `1px solid ${colors.cardBorder}`,
                                            marginBottom: '20px'
                                        }}>
                                            <h3 style={{ fontSize: '1rem', fontWeight: '500', color: colors.text, marginBottom: '12px' }}>
                                                Understanding the Target Variable
                                            </h3>
                                            <p style={{ color: colors.textMuted, fontSize: '0.9rem', lineHeight: 1.7 }}>
                                                We're predicting <strong style={{ color: colors.primary }}>reviews per month</strong> — a proxy for listing popularity and guest engagement.
                                                More reviews typically indicate higher occupancy and better host performance.
                                            </p>
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginTop: '20px' }}>
                                                <div style={{ background: '#005587', borderRadius: '8px', padding: '16px', textAlign: 'center' }}>
                                                    <div style={{ fontSize: '0.7rem', color: colors.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Training Set</div>
                                                    <div style={{ fontSize: '1.8rem', fontWeight: '600', color: colors.primary, marginTop: '4px' }}>{results.n_train.toLocaleString()}</div>
                                                    <div style={{ fontSize: '0.75rem', color: colors.textMuted }}>listings</div>
                                                </div>
                                                <div style={{ background: '#005587', borderRadius: '8px', padding: '16px', textAlign: 'center' }}>
                                                    <div style={{ fontSize: '0.7rem', color: colors.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Test Set</div>
                                                    <div style={{ fontSize: '1.8rem', fontWeight: '600', color: colors.primary, marginTop: '4px' }}>{results.n_test.toLocaleString()}</div>
                                                    <div style={{ fontSize: '0.75rem', color: colors.textMuted }}>listings</div>
                                                </div>
                                                <div style={{ background: '#005587', borderRadius: '8px', padding: '16px', textAlign: 'center' }}>
                                                    <div style={{ fontSize: '0.7rem', color: colors.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Neighborhood</div>
                                                    <div style={{ fontSize: '1rem', fontWeight: '600', color: colors.accent, marginTop: '8px' }}>{results.neighborhood}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Feature Groups */}
                                        <div style={{
                                            background: colors.cardBg,
                                            borderRadius: '12px',
                                            padding: '24px',
                                            border: `1px solid ${colors.cardBorder}`
                                        }}>
                                            <h3 style={{ fontSize: '1rem', fontWeight: '500', color: colors.text, marginBottom: '20px' }}>
                                                Feature Engineering Strategy
                                            </h3>
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                                                <div style={{ background: 'rgba(255, 107, 107, 0.1)', borderRadius: '8px', padding: '16px', border: '1px solid rgba(255, 107, 107, 0.3)' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' }}>
                                                        <span style={{ background: colors.modelA, color: 'white', padding: '4px 8px', borderRadius: '4px', fontSize: '0.75rem', fontWeight: '600' }}>Model A</span>
                                                        <span style={{ color: colors.text, fontSize: '0.85rem', fontWeight: '500' }}>Property Size</span>
                                                    </div>
                                                    <ul style={{ color: colors.textMuted, fontSize: '0.8rem', lineHeight: 1.8, marginLeft: '16px' }}>
                                                        <li>Accommodates (guests)</li>
                                                    </ul>
                                                </div>
                                                <div style={{ background: 'rgba(78, 205, 196, 0.1)', borderRadius: '8px', padding: '16px', border: '1px solid rgba(78, 205, 196, 0.3)' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' }}>
                                                        <span style={{ background: colors.modelB, color: 'white', padding: '4px 8px', borderRadius: '4px', fontSize: '0.75rem', fontWeight: '600' }}>Model B</span>
                                                        <span style={{ color: colors.text, fontSize: '0.85rem', fontWeight: '500' }}>+ Availability</span>
                                                    </div>
                                                    <ul style={{ color: colors.textMuted, fontSize: '0.8rem', lineHeight: 1.8, marginLeft: '16px' }}>
                                                        <li>Accommodates</li>
                                                        <li>Days available (365)</li>
                                                    </ul>
                                                </div>
                                                <div style={{ background: 'rgba(69, 183, 209, 0.1)', borderRadius: '8px', padding: '16px', border: '1px solid rgba(69, 183, 209, 0.3)' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' }}>
                                                        <span style={{ background: colors.modelC, color: 'white', padding: '4px 8px', borderRadius: '4px', fontSize: '0.75rem', fontWeight: '600' }}>Model C</span>
                                                        <span style={{ color: colors.text, fontSize: '0.85rem', fontWeight: '500' }}>+ Host & Ratings</span>
                                                    </div>
                                                    <ul style={{ color: colors.textMuted, fontSize: '0.8rem', lineHeight: 1.8, marginLeft: '16px' }}>
                                                        <li>All Model B features</li>
                                                        <li>Bedrooms, bathrooms</li>
                                                        <li>Minimum nights</li>
                                                        <li>Superhost status</li>
                                                        <li>Instant bookable</li>
                                                        <li>Host experience</li>
                                                        <li>Review scores</li>
                                                        <li>Room type</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Tab: Model Comparison */}
                                {activeTab === 'comparison' && (
                                    <div>
                                        <div style={{
                                            background: colors.cardBg,
                                            borderRadius: '12px',
                                            padding: '20px',
                                            border: `1px solid ${colors.cardBorder}`,
                                            marginBottom: '20px'
                                        }}>
                                            <p style={{ color: colors.textMuted, fontSize: '0.9rem', lineHeight: 1.7 }}>
                                                Points closer to the <span style={{ color: colors.negative }}>red diagonal line</span> indicate better predictions.
                                                Compare how each model's predictions scatter around the perfect fit line.
                                            </p>
                                        </div>

                                        {/* Scatter Plots */}
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginBottom: '20px' }}>
                                            <div style={{ background: colors.cardBg, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.cardBorder}` }}>
                                                <div style={{ height: '280px' }}>
                                                    <ScatterChart
                                                        data={getScatterData('pred_a')}
                                                        xKey="actual"
                                                        yKey="predicted"
                                                        title={`Model A: MAE = ${results.model_a.mae.toFixed(2)}`}
                                                        color={colors.modelA}
                                                    />
                                                </div>
                                            </div>
                                            <div style={{ background: colors.cardBg, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.cardBorder}` }}>
                                                <div style={{ height: '280px' }}>
                                                    <ScatterChart
                                                        data={getScatterData('pred_b')}
                                                        xKey="actual"
                                                        yKey="predicted"
                                                        title={`Model B: MAE = ${results.model_b.mae.toFixed(2)}`}
                                                        color={colors.modelB}
                                                    />
                                                </div>
                                            </div>
                                            <div style={{ background: colors.cardBg, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.cardBorder}` }}>
                                                <div style={{ height: '280px' }}>
                                                    <ScatterChart
                                                        data={getScatterData('pred_c')}
                                                        xKey="actual"
                                                        yKey="predicted"
                                                        title={`Model C: MAE = ${results.model_c.mae.toFixed(2)}`}
                                                        color={colors.modelC}
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Bar Chart & Feature Importance */}
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                                            <div style={{ background: colors.cardBg, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.cardBorder}` }}>
                                                <div style={{ height: '300px' }}>
                                                    <BarChart
                                                        data={[results.model_a.mae, results.model_b.mae, results.model_c.mae]}
                                                        labels={['A: Size Only', 'B: + Availability', 'C: + Host & Ratings']}
                                                        title="Model Comparison (Lower is Better)"
                                                        colorArray={[colors.modelA, colors.modelB, colors.modelC]}
                                                    />
                                                </div>
                                            </div>
                                            <div style={{ background: colors.cardBg, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.cardBorder}` }}>
                                                <div style={{ height: '300px' }}>
                                                    <FeatureImportanceChart coefficients={results.model_c.coefficients} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Tab: Summary */}
                                {activeTab === 'summary' && (
                                    <div style={{
                                        background: colors.cardBg,
                                        borderRadius: '12px',
                                        padding: '32px',
                                        border: `1px solid ${colors.cardBorder}`
                                    }}>
                                        <h2 style={{ fontSize: '1.2rem', fontWeight: '600', color: colors.text, marginBottom: '24px' }}>
                                            Results for {results.neighborhood}
                                        </h2>

                                        <div style={{ marginBottom: '32px' }}>
                                            <h3 style={{ fontSize: '0.9rem', fontWeight: '500', color: colors.textMuted, marginBottom: '16px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                                Dataset
                                            </h3>
                                            <p style={{ color: colors.text, fontSize: '0.95rem' }}>
                                                <strong>{results.n_train.toLocaleString()}</strong> training observations, <strong>{results.n_test.toLocaleString()}</strong> test observations
                                            </p>
                                        </div>

                                        <div style={{ marginBottom: '32px' }}>
                                            <h3 style={{ fontSize: '0.9rem', fontWeight: '500', color: colors.textMuted, marginBottom: '16px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                                Model Performance (Mean Absolute Error)
                                            </h3>
                                            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                                                <thead>
                                                    <tr style={{ borderBottom: `1px solid ${colors.cardBorder}` }}>
                                                        <th style={{ padding: '12px', textAlign: 'left', color: colors.textMuted, fontSize: '0.85rem' }}>Model</th>
                                                        <th style={{ padding: '12px', textAlign: 'left', color: colors.textMuted, fontSize: '0.85rem' }}>Features</th>
                                                        <th style={{ padding: '12px', textAlign: 'right', color: colors.textMuted, fontSize: '0.85rem' }}>MAE</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr style={{ borderBottom: `1px solid ${colors.cardBorder}` }}>
                                                        <td style={{ padding: '12px', color: colors.modelA, fontWeight: '500' }}>Model A</td>
                                                        <td style={{ padding: '12px', color: colors.text }}>Property size only</td>
                                                        <td style={{ padding: '12px', color: colors.text, textAlign: 'right', fontFamily: 'monospace' }}>{results.model_a.mae.toFixed(4)}</td>
                                                    </tr>
                                                    <tr style={{ borderBottom: `1px solid ${colors.cardBorder}` }}>
                                                        <td style={{ padding: '12px', color: colors.modelB, fontWeight: '500' }}>Model B</td>
                                                        <td style={{ padding: '12px', color: colors.text }}>+ Availability</td>
                                                        <td style={{ padding: '12px', color: colors.text, textAlign: 'right', fontFamily: 'monospace' }}>{results.model_b.mae.toFixed(4)}</td>
                                                    </tr>
                                                    <tr>
                                                        <td style={{ padding: '12px', color: colors.modelC, fontWeight: '500' }}>Model C</td>
                                                        <td style={{ padding: '12px', color: colors.text }}>+ Host & ratings features</td>
                                                        <td style={{ padding: '12px', color: colors.text, textAlign: 'right', fontFamily: 'monospace' }}>{results.model_c.mae.toFixed(4)}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        <div style={{ marginBottom: '32px' }}>
                                            <h3 style={{ fontSize: '0.9rem', fontWeight: '500', color: colors.textMuted, marginBottom: '16px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                                Key Insights
                                            </h3>
                                            <ul style={{ color: colors.text, fontSize: '0.95rem', lineHeight: 2, marginLeft: '20px' }}>
                                                <li>
                                                    Adding <strong style={{ color: colors.modelB }}>availability features</strong> (Model B) {results.improvement_ab >= 0 ? 'reduced' : 'increased'} error by <strong style={{ color: results.improvement_ab >= 0 ? colors.positive : colors.negative }}>{Math.abs(results.improvement_ab).toFixed(1)}%</strong>
                                                </li>
                                                <li>
                                                    Adding <strong style={{ color: colors.modelC }}>host & rating features</strong> (Model C) {results.improvement_ac >= 0 ? 'reduced' : 'increased'} error by <strong style={{ color: results.improvement_ac >= 0 ? colors.positive : colors.negative }}>{Math.abs(results.improvement_ac).toFixed(1)}%</strong>
                                                </li>
                                                <li>
                                                    The best predictors of engagement are often <strong style={{ color: colors.primary }}>availability</strong> and <strong style={{ color: colors.primary }}>host quality signals</strong>
                                                </li>
                                            </ul>
                                        </div>

                                        <div style={{
                                            background: 'rgba(39, 116, 174, 0.1)',
                                            borderRadius: '8px',
                                            padding: '24px',
                                            border: `1px solid ${colors.cardBorder}`
                                        }}>
                                            <h3 style={{ fontSize: '0.9rem', fontWeight: '500', color: colors.accent, marginBottom: '16px' }}>
                                                What This Means for Hosts
                                            </h3>
                                            <p style={{ color: colors.textMuted, fontSize: '0.9rem', lineHeight: 1.8 }}>
                                                Understanding what drives reviews helps Airbnb hosts optimize their listings:
                                            </p>
                                            <ol style={{ color: colors.text, fontSize: '0.9rem', lineHeight: 2, marginLeft: '20px', marginTop: '12px' }}>
                                                <li><strong>Maximize availability</strong> — Listings available more days get more bookings and reviews</li>
                                                <li><strong>Invest in becoming a Superhost</strong> — Host quality signals matter to guests</li>
                                                <li><strong>Enable instant booking</strong> — Reduces friction and increases conversions</li>
                                                <li><strong>Maintain high ratings</strong> — Review scores predict future engagement</li>
                                            </ol>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Footer */}
                        <div style={{
                            marginTop: '40px',
                            paddingTop: '20px',
                            borderTop: `1px solid ${colors.cardBorder}`,
                            textAlign: 'center'
                        }}>
                            <h4 style={{ fontSize: '0.9rem', fontWeight: '500', color: colors.accent, marginBottom: '12px' }}>
                                Key Takeaways
                            </h4>
                            <div style={{ display: 'flex', justifyContent: 'center', gap: '32px', flexWrap: 'wrap' }}>
                                <div style={{ color: colors.textMuted, fontSize: '0.85rem' }}>
                                    <strong style={{ color: colors.text }}>1.</strong> Feature engineering matters
                                </div>
                                <div style={{ color: colors.textMuted, fontSize: '0.85rem' }}>
                                    <strong style={{ color: colors.text }}>2.</strong> More features ≠ always better
                                </div>
                                <div style={{ color: colors.textMuted, fontSize: '0.85rem' }}>
                                    <strong style={{ color: colors.text }}>3.</strong> Simple models with good features often win
                                </div>
                            </div>
                            <p style={{ color: colors.textDim, fontSize: '0.75rem', marginTop: '20px' }}>
                                MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
