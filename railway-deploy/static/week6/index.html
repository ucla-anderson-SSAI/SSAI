                                            ]}
                                            height={250}
                                        />
                                    </div>

                                    {/* Loss Curves */}
                                    <div className="light-card">
                                        <div className="light-card-title">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                            </svg>
                                            Loss Curves
                                        </div>
                                        <LineChartComponent
                                            data={trainingHistory}
                                            lines={[
                                                { dataKey: 'loss', stroke: colors.negative, name: 'Train Loss' },
                                                { dataKey: 'val_loss', stroke: '#f59e0b', name: 'Val Loss' }
                                            ]}
                                            height={250}
                                        />
                                    </div>

                                    {/* Confusion Matrix */}
                                    <div className="light-card">
                                        <div className="light-card-title">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                                <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
                                            </svg>
                                            Confusion Matrix
                                        </div>
                                        <ConfusionMatrix matrix={confusionMatrix} />
                                    </div>

                                    {/* MLP vs CNN Comparison */}
                                    <div className="light-card">
                                        <div className="light-card-title">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <line x1="18" y1="20" x2="18" y2="10"/>
                                                <line x1="12" y1="20" x2="12" y2="4"/>
                                                <line x1="6" y1="20" x2="6" y2="14"/>
                                            </svg>
                                            MLP vs CNN Comparison
                                        </div>
                                        <ComparisonChart
                                            mlpAcc={0.55}
                                            cnnAcc={metrics.accuracy || 0.5}
                                        />
                                        <div style={{ marginTop: 16, fontSize: 12, color: '#666', textAlign: 'center' }}>
                                            CNNs consistently outperform MLPs on image tasks due to spatial feature learning
                                        </div>
                                    </div>

                                    {/* Sample Predictions */}
                                    <div className="light-card full-width">
                                        <div className="light-card-title">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                                <polyline points="21 15 16 10 5 21"/>
                                            </svg>
                                            Sample Predictions
                                        </div>
                                        <PredictionsGrid predictions={predictions} />
                                    </div>
                                </div>

                            </div>
                        </div>
                </div>

                {/* Footer */}
                <p style={{ color: '#888', fontSize: '0.75rem', marginTop: '20px', textAlign: 'center' }}>
                    MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                </p>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
