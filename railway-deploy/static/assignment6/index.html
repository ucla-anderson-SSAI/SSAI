<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6: CNNs and Transfer Learning | UCLA Anderson</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track { background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #2774AE, #005587);
            border-radius: 4px;
        }

        .app-container {
            min-height: 100vh;
            position: relative;
            background: #ffffff;
        }

        /* Header */
        .header {
            background: #2774AE;
            padding: 1rem 2rem;
            border-bottom: 2px solid #FFD100;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left .course-label {
            font-size: 0.65rem;
            font-weight: 400;
            color: #FFD100;
            margin-bottom: 0.25rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f5f5f5;
            letter-spacing: 0;
        }

        .header-left p {
            color: #b0b0b0;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .header-right {
            text-align: right;
        }

        .header-right .ucla-anderson {
            font-size: 1rem;
            color: #f5f5f5;
            font-weight: 500;
        }

        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .tab-btn {
            padding: 0.8rem 2rem;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: #ffffff;
            color: #666666;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            background: rgba(39, 116, 174, 0.1);
            color: #2774AE;
            border-color: rgba(39, 116, 174, 0.3);
        }

        .tab-btn.active {
            background: #2774AE;
            color: #ffffff;
            border-color: #2774AE;
        }

        .tab-icon {
            font-size: 1.1rem;
        }

        /* Main Content */
        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* CNN Builder Tab */
        .cnn-builder {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        .pipeline-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #2774AE;
        }

        .section-title-icon {
            width: 36px;
            height: 36px;
            background: rgba(39, 116, 174, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* CNN Pipeline Visualization */
        .pipeline-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 2rem;
            overflow-x: auto;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .pipeline-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            min-width: fit-content;
            padding: 1rem 0;
        }

        .pipeline-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.5s ease;
        }

        .block-visual {
            position: relative;
            transition: all 0.5s ease;
        }

        /* Input Image Block */
        .input-block .block-visual {
            width: 80px;
            height: 80px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 1px;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(39, 116, 174, 0.3);
        }

        .pixel {
            transition: background 0.3s ease;
        }

        /* Conv Block */
        .conv-block .block-visual {
            position: relative;
            perspective: 500px;
        }

        .feature-cube {
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 10s ease-in-out infinite;
        }

        @keyframes rotateCube {
            0%, 100% { transform: rotateX(-10deg) rotateY(-15deg); }
            50% { transform: rotateX(-10deg) rotateY(15deg); }
        }

        .cube-face {
            position: absolute;
            border: 1px solid rgba(39, 116, 174, 0.5);
            display: grid;
            gap: 1px;
            background: rgba(39, 116, 174, 0.1);
        }

        .cube-front {
            transform: translateZ(var(--depth));
            background: linear-gradient(135deg, rgba(39, 116, 174, 0.3), rgba(0, 85, 135, 0.2));
        }

        .cube-back {
            transform: translateZ(calc(var(--depth) * -1));
            background: rgba(39, 116, 174, 0.1);
        }

        .cube-top {
            transform: rotateX(90deg) translateZ(var(--height));
            background: linear-gradient(135deg, rgba(139, 184, 232, 0.3), rgba(39, 116, 174, 0.2));
        }

        .cube-side {
            transform: rotateY(90deg) translateZ(var(--width));
            background: rgba(139, 184, 232, 0.2);
        }

        /* Pool Block */
        .pool-block .block-visual {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD100, #e6bc00);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #003B5C;
            box-shadow: 0 4px 15px rgba(255, 209, 0, 0.4);
        }

        /* Flatten Block */
        .flatten-block .block-visual {
            width: 20px;
            height: 100px;
            background: linear-gradient(180deg, #2774AE, #005587, #8BB8E8);
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(39, 116, 174, 0.4);
        }

        /* Dense Block */
        .dense-block .block-visual {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .neuron {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #2774AE, #005587);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(39, 116, 174, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .neuron:nth-child(2) { animation-delay: 0.2s; }
        .neuron:nth-child(3) { animation-delay: 0.4s; }
        .neuron:nth-child(4) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Output Block */
        .output-block .block-visual {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
        }

        .output-class {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            color: #003B5C;
            transition: all 0.3s ease;
        }

        .output-class.active {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(39, 116, 174, 0.6);
        }

        /* Connection Arrows */
        .connection-arrow {
            display: flex;
            align-items: center;
            color: #2774AE;
            font-size: 1.5rem;
            opacity: 0.6;
            animation: flowArrow 1.5s ease-in-out infinite;
        }

        @keyframes flowArrow {
            0%, 100% { opacity: 0.3; transform: translateX(0); }
            50% { opacity: 0.8; transform: translateX(5px); }
        }

        .block-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666666;
            text-align: center;
        }

        .block-dims {
            font-size: 0.65rem;
            color: #2774AE;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(39, 116, 174, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Data Flow Animation */
        .data-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2774AE;
            border-radius: 50%;
            box-shadow: 0 0 10px #2774AE, 0 0 20px #2774AE;
            animation: flowData 3s linear infinite;
        }

        @keyframes flowData {
            0% { left: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* Filter Visualization */
        .filter-viz {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(39, 116, 174, 0.15);
        }

        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-kernel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #f8f9fa;
            padding: 4px;
            border-radius: 6px;
        }

        .kernel-cell {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .filter-name {
            font-size: 0.7rem;
            color: #666666;
        }

        /* Controls Panel */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .control-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2774AE;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group {
            margin-bottom: 1.25rem;
        }

        .control-label {
            font-size: 0.8rem;
            color: #666666;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-value {
            font-family: 'JetBrains Mono', monospace;
            color: #2774AE;
            font-weight: 600;
        }

        .slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(39, 116, 174, 0.2);
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #2774AE, #005587);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(39, 116, 174, 0.5);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(39, 116, 174, 0.3);
            background: rgba(39, 116, 174, 0.1);
            color: #666666;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background: rgba(39, 116, 174, 0.2);
            color: #2774AE;
        }

        .option-btn.active {
            background: linear-gradient(135deg, #2774AE, #005587);
            color: #ffffff;
            border-color: transparent;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
            background: rgba(39, 116, 174, 0.2);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle.active {
            background: linear-gradient(135deg, #2774AE, #005587);
        }

        .toggle-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #e5e5e5;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle.active .toggle-knob {
            left: 27px;
        }

        /* Metrics Display */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .metric-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #2774AE;
        }

        .metric-label {
            font-size: 0.7rem;
            color: #666666;
            margin-top: 0.25rem;
        }

        /* Transfer Learning Tab */
        .transfer-learning {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .model-selection {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .model-card {
            flex: 1;
            background: #ffffff;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .model-card:hover {
            border-color: rgba(39, 116, 174, 0.5);
            background: #f8f9fa;
        }

        .model-card.selected {
            border-color: #2774AE;
            background: rgba(39, 116, 174, 0.08);
        }

        .model-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .model-name {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
        }

        .model-params {
            font-size: 0.75rem;
            color: #666666;
            font-family: 'JetBrains Mono', monospace;
        }

        .strategy-toggle {
            display: flex;
            background: #f0f0f0;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }

        .strategy-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            color: #666666;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .strategy-btn.active {
            background: #2774AE;
            color: #ffffff;
        }

        .layers-viz {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .layer-bar {
            height: 30px;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .layer-frozen {
            background: linear-gradient(90deg, #8BB8E8, #2774AE);
            color: white;
        }

        .layer-trainable {
            background: linear-gradient(90deg, #FFD100, #e6bc00);
            color: #003B5C;
        }

        /* Comparison Chart */
        .comparison-chart {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Run Button */
        .run-button {
            width: 100%;
            padding: 1rem;
            background: #2774AE;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .run-button:hover {
            background: #005587;
        }

        .run-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .cnn-builder {
                grid-template-columns: 1fr;
            }

            .transfer-learning {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Chart.js Bar Chart Component for comparison data
        const ChartBar = ({ data, dataKey1, dataKey2, label1, label2, color1, color2 }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                if (chartRef.current) {
                    chartRef.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d.name),
                        datasets: [
                            {
                                label: label1,
                                data: data.map(d => d[dataKey1]),
                                backgroundColor: color1,
                                borderColor: color1,
                                borderWidth: 1,
                                borderRadius: 4
                            },
                            {
                                label: label2,
                                data: data.map(d => d[dataKey2]),
                                backgroundColor: color2,
                                borderColor: color2,
                                borderWidth: 1,
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#888888'
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(10,10,10,0.95)',
                                titleColor: '#e5e5e5',
                                bodyColor: '#888888',
                                borderColor: 'rgba(39,116,174,0.3)',
                                borderWidth: 1
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#888888' },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' }
                            },
                            y: {
                                ticks: { color: '#888888' },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }
                };
            }, [data, dataKey1, dataKey2, label1, label2, color1, color2]);

            return <canvas ref={canvasRef} style={{ height: '100%', width: '100%' }} />;
        };

        // CIFAR-10 Classes
        const CIFAR10_CLASSES = ['airplane', 'auto', 'bird', 'cat', 'deer', 'dog', 'frog', 'horse', 'ship', 'truck'];

        // Filter Kernels
        const FILTER_KERNELS = [
            { name: 'Horizontal Edge', values: [[-1,-1,-1],[0,0,0],[1,1,1]] },
            { name: 'Vertical Edge', values: [[-1,0,1],[-1,0,1],[-1,0,1]] },
            { name: 'Diagonal', values: [[1,0,-1],[0,0,0],[-1,0,1]] },
            { name: 'Sharpen', values: [[0,-1,0],[-1,5,-1],[0,-1,0]] },
            { name: 'Blur', values: [[1,1,1],[1,1,1],[1,1,1]] },
            { name: 'Corner', values: [[-1,-1,2],[-1,2,-1],[2,-1,-1]] }
        ];

        // Generate random pixel colors for input visualization
        const generatePixels = () => {
            const colors = ['#2774AE', '#005587', '#8BB8E8', '#FFD100', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6'];
            return Array(64).fill(0).map(() => colors[Math.floor(Math.random() * colors.length)]);
        };

        // Input Image Block Component
        const InputBlock = ({ pixels }) => (
            <div className="pipeline-block input-block">
                <div className="block-visual">
                    {pixels.map((color, i) => (
                        <div key={i} className="pixel" style={{ background: color }} />
                    ))}
                </div>
                <div className="block-label">Input</div>
                <div className="block-dims">32x32x3</div>
            </div>
        );

        // Conv Block Component
        const ConvBlock = ({ index, filters, size, batchNorm }) => {
            const inputSize = 32 / Math.pow(2, index);
            const outputSize = inputSize;
            const depth = Math.min(filters / 8, 12);

            return (
                <div className="pipeline-block conv-block">
                    <div className="block-visual" style={{
                        width: `${Math.max(40, outputSize * 1.5)}px`,
                        height: `${Math.max(40, outputSize * 1.5)}px`
                    }}>
                        <div className="feature-cube" style={{
                            width: `${Math.max(35, outputSize * 1.2)}px`,
                            height: `${Math.max(35, outputSize * 1.2)}px`,
                            '--depth': `${depth}px`,
                            '--width': `${Math.max(35, outputSize * 1.2) / 2}px`,
                            '--height': `${Math.max(35, outputSize * 1.2) / 2}px`
                        }}>
                            {/* Simplified cube representation */}
                            <div style={{
                                width: '100%',
                                height: '100%',
                                background: `linear-gradient(135deg, rgba(39, 116, 174, ${0.3 + index * 0.1}), rgba(0, 85, 135, ${0.2 + index * 0.1}))`,
                                borderRadius: '6px',
                                border: '2px solid rgba(39, 116, 174, 0.5)',
                                boxShadow: `${depth}px ${depth}px 0 rgba(139, 184, 232, 0.3), 0 0 15px rgba(39, 116, 174, 0.3)`,
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                fontSize: '0.7rem',
                                fontWeight: '600',
                                color: '#1a1a1a'
                            }}>
                                {filters}
                            </div>
                        </div>
                    </div>
                    <div className="block-label">Conv{index + 1}{batchNorm ? '+BN' : ''}</div>
                    <div className="block-dims">{outputSize}x{outputSize}x{filters}</div>
                </div>
            );
        };

        // Pool Block Component
        const PoolBlock = ({ type, index }) => {
            const size = 32 / Math.pow(2, index + 1);
            return (
                <div className="pipeline-block pool-block">
                    <div className="block-visual">
                        {type === 'max' ? String.fromCharCode(8595) : '~'}
                    </div>
                    <div className="block-label">{type === 'max' ? 'MaxPool' : 'AvgPool'}</div>
                    <div className="block-dims">2x2</div>
                </div>
            );
        };

        // Flatten Block Component
        const FlattenBlock = ({ size }) => (
            <div className="pipeline-block flatten-block">
                <div className="block-visual" />
                <div className="block-label">Flatten</div>
                <div className="block-dims">{size}</div>
            </div>
        );

        // Dense Block Component
        const DenseBlock = ({ units }) => (
            <div className="pipeline-block dense-block">
                <div className="block-visual">
                    {Array(Math.min(6, Math.ceil(units / 64))).fill(0).map((_, i) => (
                        <div key={i} className="neuron" />
                    ))}
                </div>
                <div className="block-label">Dense</div>
                <div className="block-dims">{units}</div>
            </div>
        );

        // Output Block Component
        const OutputBlock = ({ prediction }) => {
            const classColors = ['#2774AE', '#005587', '#8BB8E8', '#FFD100', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef'];
            return (
                <div className="pipeline-block output-block">
                    <div className="block-visual">
                        {CIFAR10_CLASSES.map((cls, i) => (
                            <div
                                key={i}
                                className={`output-class ${prediction === i ? 'active' : ''}`}
                                style={{ background: classColors[i] }}
                                title={cls}
                            >
                                {cls.substring(0, 2)}
                            </div>
                        ))}
                    </div>
                    <div className="block-label">Output</div>
                    <div className="block-dims">10 classes</div>
                </div>
            );
        };

        // Connection Arrow Component
        const ConnectionArrow = () => (
            <div className="connection-arrow">{String.fromCharCode(8594)}</div>
        );

        // Filter Visualization Component
        const FilterVisualization = () => (
            <div className="filter-viz">
                <div className="section-title" style={{ fontSize: '1rem' }}>
                    <span className="section-title-icon">O</span>
                    First Layer Filter Patterns
                </div>
                <div className="filter-grid">
                    {FILTER_KERNELS.map((filter, idx) => (
                        <div key={idx} className="filter-item">
                            <div className="filter-kernel">
                                {filter.values.flat().map((val, i) => (
                                    <div
                                        key={i}
                                        className="kernel-cell"
                                        style={{
                                            background: val > 0
                                                ? `rgba(39, 116, 174, ${Math.abs(val) / 5})`
                                                : val < 0
                                                    ? `rgba(255, 209, 0, ${Math.abs(val) / 5})`
                                                    : 'rgba(255,255,255,0.1)',
                                            color: Math.abs(val) > 0 ? '#e5e5e5' : '#666'
                                        }}
                                    >
                                        {val}
                                    </div>
                                ))}
                            </div>
                            <div className="filter-name">{filter.name}</div>
                        </div>
                    ))}
                </div>
            </div>
        );

        // CNN Pipeline Visualization
        const CNNPipeline = ({ config }) => {
            const [pixels] = useState(generatePixels());
            const [prediction, setPrediction] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setPrediction(Math.floor(Math.random() * 10));
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            const calculateFlattenSize = () => {
                const finalSize = 32 / Math.pow(2, config.convBlocks);
                return finalSize * finalSize * config.filters;
            };

            return (
                <div className="pipeline-container">
                    <div className="pipeline-wrapper">
                        <InputBlock pixels={pixels} />
                        <ConnectionArrow />

                        {Array(config.convBlocks).fill(0).map((_, i) => (
                            <React.Fragment key={i}>
                                <ConvBlock
                                    index={i}
                                    filters={config.filters * Math.pow(2, Math.min(i, 2))}
                                    size={config.kernelSize}
                                    batchNorm={config.batchNorm}
                                />
                                <ConnectionArrow />
                                <PoolBlock type={config.poolType} index={i} />
                                {i < config.convBlocks - 1 && <ConnectionArrow />}
                            </React.Fragment>
                        ))}

                        <ConnectionArrow />
                        <FlattenBlock size={calculateFlattenSize()} />
                        <ConnectionArrow />
                        <DenseBlock units={256} />
                        <ConnectionArrow />
                        <OutputBlock prediction={prediction} />
                    </div>

                    <FilterVisualization />
                </div>
            );
        };

        // CNN Builder Tab
        const CNNBuilderTab = () => {
            const [config, setConfig] = useState({
                convBlocks: 2,
                filters: 32,
                kernelSize: 3,
                poolType: 'max',
                batchNorm: true,
                dropout: 0.25
            });
            const [metrics, setMetrics] = useState({
                trainAcc: 0,
                testAcc: 0,
                params: 0,
                time: 0,
                memory: 0
            });
            const [isTraining, setIsTraining] = useState(false);

            const calculateParams = useMemo(() => {
                let params = 0;
                let inputChannels = 3;

                for (let i = 0; i < config.convBlocks; i++) {
                    const outputChannels = config.filters * Math.pow(2, Math.min(i, 2));
                    params += config.kernelSize * config.kernelSize * inputChannels * outputChannels + outputChannels;
                    if (config.batchNorm) params += outputChannels * 4;
                    inputChannels = outputChannels;
                }

                const finalSize = 32 / Math.pow(2, config.convBlocks);
                const flattenSize = finalSize * finalSize * inputChannels;
                params += flattenSize * 256 + 256;
                params += 256 * 10 + 10;

                return params;
            }, [config]);

            const runTraining = async () => {
                setIsTraining(true);

                // Simulate training with progressive updates
                for (let epoch = 0; epoch < 10; epoch++) {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    setMetrics({
                        trainAcc: Math.min(95, 60 + epoch * 4 + Math.random() * 3),
                        testAcc: Math.min(88, 55 + epoch * 3.5 + Math.random() * 2),
                        params: calculateParams,
                        time: (epoch + 1) * 5,
                        memory: Math.round(calculateParams / 10000)
                    });
                }

                setIsTraining(false);
            };

            return (
                <div className="cnn-builder">
                    <div className="pipeline-section">
                        <div className="section-title">
                            <span className="section-title-icon">N</span>
                            CNN Architecture Pipeline
                        </div>
                        <CNNPipeline config={config} />
                    </div>

                    <div className="controls-panel">
                        <div className="control-card">
                            <div className="control-title">
                                <span>*</span> Architecture Controls
                            </div>

                            <div className="control-group">
                                <div className="control-label">
                                    <span>Conv Blocks</span>
                                    <span className="control-value">{config.convBlocks}</span>
                                </div>
                                <input
                                    type="range"
                                    className="slider"
                                    min="1" max="4"
                                    value={config.convBlocks}
                                    onChange={(e) => setConfig({...config, convBlocks: parseInt(e.target.value)})}
                                />
                            </div>

                            <div className="control-group">
                                <div className="control-label">Base Filters</div>
                                <div className="button-group">
                                    {[16, 32, 64, 128].map(f => (
                                        <button
                                            key={f}
                                            className={`option-btn ${config.filters === f ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, filters: f})}
                                        >
                                            {f}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="control-group">
                                <div className="control-label">Kernel Size</div>
                                <div className="button-group">
                                    {[3, 5].map(k => (
                                        <button
                                            key={k}
                                            className={`option-btn ${config.kernelSize === k ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, kernelSize: k})}
                                        >
                                            {k}x{k}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="control-group">
                                <div className="control-label">Pooling Type</div>
                                <div className="button-group">
                                    {['max', 'avg'].map(p => (
                                        <button
                                            key={p}
                                            className={`option-btn ${config.poolType === p ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, poolType: p})}
                                        >
                                            {p === 'max' ? 'Max' : 'Average'}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="control-group">
                                <div className="toggle-container">
                                    <span className="control-label" style={{ marginBottom: 0 }}>Batch Normalization</span>
                                    <div
                                        className={`toggle ${config.batchNorm ? 'active' : ''}`}
                                        onClick={() => setConfig({...config, batchNorm: !config.batchNorm})}
                                    >
                                        <div className="toggle-knob" />
                                    </div>
                                </div>
                            </div>

                            <div className="control-group">
                                <div className="control-label">
                                    <span>Dropout Rate</span>
                                    <span className="control-value">{config.dropout.toFixed(2)}</span>
                                </div>
                                <input
                                    type="range"
                                    className="slider"
                                    min="0" max="0.5" step="0.05"
                                    value={config.dropout}
                                    onChange={(e) => setConfig({...config, dropout: parseFloat(e.target.value)})}
                                />
                            </div>
                        </div>

                        <div className="control-card">
                            <div className="control-title">
                                <span>#</span> Model Metrics
                            </div>
                            <div className="metrics-grid">
                                <div className="metric-item">
                                    <div className="metric-value">{metrics.trainAcc.toFixed(1)}%</div>
                                    <div className="metric-label">Train Accuracy</div>
                                </div>
                                <div className="metric-item">
                                    <div className="metric-value">{metrics.testAcc.toFixed(1)}%</div>
                                    <div className="metric-label">Test Accuracy</div>
                                </div>
                                <div className="metric-item">
                                    <div className="metric-value">{(calculateParams / 1000).toFixed(0)}K</div>
                                    <div className="metric-label">Parameters</div>
                                </div>
                                <div className="metric-item">
                                    <div className="metric-value">{metrics.time}s</div>
                                    <div className="metric-label">Training Time</div>
                                </div>
                            </div>
                        </div>

                        <button
                            className="run-button"
                            onClick={runTraining}
                            disabled={isTraining}
                        >
                            {isTraining ? (
                                <>
                                    <div className="loading-spinner" />
                                    Training...
                                </>
                            ) : (
                                <>
                                    <span>|></span>
                                    Train CNN Model
                                </>
                            )}
                        </button>
                    </div>
                </div>
            );
        };

        // Transfer Learning Tab
        const TransferLearningTab = () => {
            const [selectedModel, setSelectedModel] = useState('vgg16');
            const [strategy, setStrategy] = useState('feature');
            const [freezeLayers, setFreezeLayers] = useState(80);
            const [metrics, setMetrics] = useState(null);
            const [isTraining, setIsTraining] = useState(false);

            const models = [
                { id: 'vgg16', name: 'VGG16', params: '138M', icon: 'V' },
                { id: 'resnet50', name: 'ResNet50', params: '25M', icon: 'R' },
                { id: 'mobilenet', name: 'MobileNet', params: '3.4M', icon: 'M' }
            ];

            const comparisonData = [
                { name: 'Scratch', accuracy: 72, time: 100, params: 100 },
                { name: 'Feature Ext.', accuracy: 89, time: 25, params: 15 },
                { name: 'Fine-tune', accuracy: 94, time: 60, params: 100 }
            ];

            const totalLayers = selectedModel === 'vgg16' ? 16 : selectedModel === 'resnet50' ? 50 : 28;
            const frozenLayers = Math.round(totalLayers * freezeLayers / 100);
            const trainableLayers = totalLayers - frozenLayers;

            const runTransferLearning = async () => {
                setIsTraining(true);
                await new Promise(resolve => setTimeout(resolve, 2000));

                const baseAcc = selectedModel === 'mobilenet' ? 85 : selectedModel === 'resnet50' ? 91 : 88;
                const strategyBonus = strategy === 'finetune' ? 5 : 0;

                setMetrics({
                    accuracy: baseAcc + strategyBonus + Math.random() * 3,
                    trainTime: strategy === 'feature' ? 15 : 45,
                    params: strategy === 'feature' ? frozenLayers * 1000 : totalLayers * 10000
                });
                setIsTraining(false);
            };

            return (
                <div className="transfer-learning">
                    <div className="pipeline-section">
                        <div className="section-title">
                            <span className="section-title-icon">T</span>
                            Transfer Learning Configuration
                        </div>

                        <div className="model-selection">
                            {models.map(model => (
                                <div
                                    key={model.id}
                                    className={`model-card ${selectedModel === model.id ? 'selected' : ''}`}
                                    onClick={() => setSelectedModel(model.id)}
                                >
                                    <div className="model-icon" style={{
                                        width: '50px',
                                        height: '50px',
                                        margin: '0 auto 0.5rem',
                                        background: 'linear-gradient(135deg, #2774AE, #005587)',
                                        borderRadius: '12px',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        fontSize: '1.5rem',
                                        fontWeight: '700',
                                        color: '#1a1a1a'
                                    }}>{model.icon}</div>
                                    <div className="model-name">{model.name}</div>
                                    <div className="model-params">{model.params} params</div>
                                </div>
                            ))}
                        </div>

                        <div className="strategy-toggle">
                            <button
                                className={`strategy-btn ${strategy === 'feature' ? 'active' : ''}`}
                                onClick={() => setStrategy('feature')}
                            >
                                Feature Extraction
                            </button>
                            <button
                                className={`strategy-btn ${strategy === 'finetune' ? 'active' : ''}`}
                                onClick={() => setStrategy('finetune')}
                            >
                                Fine-tuning
                            </button>
                        </div>

                        <div className="control-group" style={{ marginBottom: '1.5rem' }}>
                            <div className="control-label">
                                <span>Layers to Freeze</span>
                                <span className="control-value">{freezeLayers}% ({frozenLayers}/{totalLayers})</span>
                            </div>
                            <input
                                type="range"
                                className="slider"
                                min="0" max="100"
                                value={freezeLayers}
                                onChange={(e) => setFreezeLayers(parseInt(e.target.value))}
                            />
                        </div>

                        <div className="layers-viz">
                            <div className="control-label" style={{ marginBottom: '1rem' }}>Layer Configuration</div>
                            <div className="layer-bar layer-frozen" style={{ width: `${freezeLayers}%`, minWidth: freezeLayers > 0 ? '80px' : '0' }}>
                                {frozenLayers > 0 && `Frozen (${frozenLayers})`}
                            </div>
                            <div className="layer-bar layer-trainable" style={{ width: `${100 - freezeLayers}%`, minWidth: trainableLayers > 0 ? '80px' : '0' }}>
                                {trainableLayers > 0 && `Trainable (${trainableLayers})`}
                            </div>
                        </div>

                        <button
                            className="run-button"
                            onClick={runTransferLearning}
                            disabled={isTraining}
                            style={{ marginTop: '1.5rem' }}
                        >
                            {isTraining ? (
                                <>
                                    <div className="loading-spinner" />
                                    Training...
                                </>
                            ) : (
                                <>
                                    <span>|></span>
                                    Run Transfer Learning
                                </>
                            )}
                        </button>

                        {metrics && (
                            <div className="metrics-grid" style={{ marginTop: '1.5rem' }}>
                                <div className="metric-item">
                                    <div className="metric-value">{metrics.accuracy.toFixed(1)}%</div>
                                    <div className="metric-label">Test Accuracy</div>
                                </div>
                                <div className="metric-item">
                                    <div className="metric-value">{metrics.trainTime}min</div>
                                    <div className="metric-label">Training Time</div>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="pipeline-section">
                        <div className="section-title">
                            <span className="section-title-icon">^</span>
                            Training Strategy Comparison
                        </div>

                        <div className="comparison-chart" style={{ height: '300px' }}>
                            <ChartBar
                                data={comparisonData}
                                dataKey1="accuracy"
                                dataKey2="time"
                                label1="Accuracy %"
                                label2="Time (rel)"
                                color1="#2774AE"
                                color2="#FFD100"
                            />
                        </div>

                        <div style={{ marginTop: '1.5rem', padding: '1rem', background: '#f8f9fa', borderRadius: '10px' }}>
                            <h4 style={{ color: '#2774AE', marginBottom: '0.75rem' }}>Strategy Guide</h4>
                            <ul style={{ color: '#888888', fontSize: '0.85rem', lineHeight: 1.8, paddingLeft: '1.5rem' }}>
                                <li><strong>Feature Extraction:</strong> Freeze all pretrained layers, only train new classifier</li>
                                <li><strong>Fine-tuning:</strong> Unfreeze some layers to adapt features to new domain</li>
                                <li>Use feature extraction for small datasets or similar domains</li>
                                <li>Use fine-tuning when you have more data or different domain</li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('cnn');

            const tabs = [
                { id: 'cnn', label: 'CNN Builder', icon: '[N]' },
                { id: 'transfer', label: 'Transfer Learning', icon: '[T]' }
            ];

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="header-left">
                                <div className="course-label">MGMT298D: Science and Strategy of AI</div>
                                <h1>Assignment 6: CNNs and Transfer Learning</h1>
                                <p>Exploring convolutional neural networks and pre-trained models</p>
                            </div>
                            <div className="header-right">
                                <span className="ucla-anderson">UCLA Anderson</span>
                            </div>
                        </div>
                    </header>

                    <nav className="tab-navigation">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                                onClick={() => setActiveTab(tab.id)}
                            >
                                <span className="tab-icon">{tab.icon}</span>
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="main-content">
                        {activeTab === 'cnn' && <CNNBuilderTab />}
                        {activeTab === 'transfer' && <TransferLearningTab />}
                    </main>
                    {/* Footer */}
                    <div style={{ textAlign: 'center', marginTop: '40px', paddingTop: '20px' }}>
                        <p style={{ color: '#888', fontSize: '0.75rem' }}>
                            MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
