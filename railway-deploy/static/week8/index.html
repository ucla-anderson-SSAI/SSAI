<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8: AI Strategy | UCLA Anderson</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2774AE;
            --accent: #FFD100;
            --darkBlue: #005587;
            --lightBlue: #8BB8E8;
            --positive: #22c55e;
            --negative: #ef4444;
            --darkBg: #ffffff;
            --darkCard: #1a1d24;
            --darkText: #005587;
            --darkMuted: #666666;
            --lightBg: #f5f5f5;
            --lightCard: #ffffff;
            --textPrimary: #1a1a1a;
            --textMuted: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track { background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--darkBlue));
            border-radius: 4px;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--darkBg);
            border-bottom: 2px solid var(--accent);
            padding: 20px 24px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .course-info {
            font-size: 0.65rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 6px;
        }

        .week-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--darkText);
            letter-spacing: -0.01em;
        }

        .week-subtitle {
            font-size: 0.85rem;
            color: var(--darkMuted);
            margin-top: 4px;
        }

        .ucla-branding {
            text-align: right;
        }

        .ucla-label {
            font-size: 0.65rem;
            color: var(--darkMuted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 2px;
        }

        .ucla-school {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 500;
        }

        /* Tab Navigation - Light controls section */
        .controls-section {
            background: var(--lightCard);
            padding: 12px 32px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .controls-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .tab-nav {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px;
            border-radius: 10px;
        }

        .tab-btn {
            padding: 10px 24px;
            border: none;
            background: transparent;
            color: var(--textMuted);
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(39, 116, 174, 0.1);
            color: var(--textPrimary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(39, 116, 174, 0.3);
        }

        /* Main Content - Light background */
        .main-content {
            flex: 1;
            padding: 24px 32px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            background: var(--lightBg);
        }

        /* Cards - All light themed */
        .card {
            background: var(--lightCard);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--darkBlue);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Grid Layout */
        .playground-grid {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 24px;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        /* Controls - Light themed */
        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--textMuted);
        }

        .control-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
            font-weight: 600;
        }

        .slider-container {
            position: relative;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(39, 116, 174, 0.15);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(39, 116, 174, 0.4);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .slider-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--lightBlue));
            pointer-events: none;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #fafafa;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 14px;
            color: var(--textPrimary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        textarea::placeholder {
            color: var(--textMuted);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(39, 116, 174, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 116, 174, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(39, 116, 174, 0.2);
            color: var(--primary);
            border: 1px solid rgba(39, 116, 174, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(39, 116, 174, 0.3);
        }

        /* Token Probability Chart */
        .token-chart-container {
            height: 300px;
            margin-bottom: 20px;
        }

        .token-bar {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sampling Visualization */
        .sampling-viz {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .token-chip {
            padding: 8px 14px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .token-chip.included {
            background: rgba(39, 116, 174, 0.15);
            border: 1px solid var(--primary);
            color: var(--darkBlue);
        }

        .token-chip.excluded {
            background: #f0f0f0;
            border: 1px solid #ddd;
            color: #999;
            opacity: 0.6;
        }

        .token-chip.selected {
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            border: 1px solid var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 116, 174, 0.4);
            transform: scale(1.05);
        }

        .token-prob {
            font-size: 10px;
            opacity: 0.8;
        }

        /* Generated Text Display */
        .generated-text {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            min-height: 150px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
        }

        .generated-token {
            display: inline;
            padding: 2px 4px;
            border-radius: 4px;
            margin: 1px;
            transition: background 0.3s;
        }

        .generated-token:hover {
            background: rgba(39, 116, 174, 0.2);
        }

        .token-high-prob {
            background: rgba(34, 197, 94, 0.15);
            border-bottom: 2px solid var(--positive);
        }

        .token-med-prob {
            background: rgba(255, 209, 0, 0.2);
            border-bottom: 2px solid var(--accent);
        }

        .token-low-prob {
            background: rgba(239, 68, 68, 0.15);
            border-bottom: 2px solid var(--negative);
        }

        /* Metrics - Light themed */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .metric-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
        }

        .metric-label {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Temperature Indicator */
        .temp-indicator {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(39, 116, 174, 0.08);
            border-radius: 8px;
            font-size: 12px;
        }

        .temp-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--textPrimary);
        }

        .temp-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .temp-cold { background: var(--primary); }
        .temp-warm { background: var(--accent); }
        .temp-hot { background: var(--negative); }

        /* Agent Visualization */
        .agent-flow {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .agent-step {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 16px;
            background: #fafafa;
            border-radius: 12px;
            border-left: 4px solid;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-thought {
            border-left-color: var(--primary);
        }

        .step-action {
            border-left-color: var(--accent);
        }

        .step-observation {
            border-left-color: var(--positive);
        }

        .step-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .step-thought .step-icon {
            background: rgba(39, 116, 174, 0.15);
        }

        .step-action .step-icon {
            background: rgba(255, 209, 0, 0.2);
        }

        .step-observation .step-icon {
            background: rgba(34, 197, 94, 0.15);
        }

        .step-content {
            flex: 1;
        }

        .step-type {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .step-thought .step-type { color: var(--primary); }
        .step-action .step-type { color: #b8860b; }
        .step-observation .step-type { color: var(--positive); }

        .step-text {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
        }

        /* Tool badges */
        .tool-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(255, 209, 0, 0.15);
            border: 1px solid rgba(255, 209, 0, 0.4);
            border-radius: 6px;
            font-size: 11px;
            color: #b8860b;
            margin-right: 8px;
        }

        /* Checkboxes - Light themed */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #fafafa;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--textPrimary);
        }

        .checkbox-item:hover {
            border-color: rgba(39, 116, 174, 0.4);
            background: rgba(39, 116, 174, 0.05);
        }

        .checkbox-item.checked {
            border-color: var(--primary);
            background: rgba(39, 116, 174, 0.1);
        }

        .checkbox-box {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(39, 116, 174, 0.5);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: white;
            font-size: 12px;
        }

        .checkbox-item.checked .checkbox-box {
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            border-color: var(--primary);
        }

        .checkbox-label {
            font-size: 13px;
            flex: 1;
        }

        .checkbox-icon {
            font-size: 16px;
        }

        /* Instructions Tab - Light themed */
        .instructions-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
        }

        .instruction-section {
            background: var(--lightCard);
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .instruction-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--darkBlue);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instruction-text {
            font-size: 14px;
            line-height: 1.8;
            color: #555;
        }

        .instruction-text p {
            margin-bottom: 12px;
        }

        .instruction-text ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .instruction-text li {
            margin-bottom: 8px;
        }

        .instruction-text strong {
            color: var(--darkBlue);
        }

        .code-block {
            background: var(--darkCard);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow-x: auto;
            margin: 12px 0;
            color: var(--darkText);
        }

        .highlight-violet { color: var(--lightBlue); }
        .highlight-blue { color: var(--primary); }
        .highlight-cyan { color: #22d3ee; }
        .highlight-green { color: var(--positive); }
        .highlight-yellow { color: var(--accent); }

        /* Sampling Mode Selector - Light themed */
        .sampling-modes {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .sampling-mode-btn {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #fafafa;
            color: var(--textMuted);
            font-size: 12px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sampling-mode-btn:hover {
            border-color: rgba(39, 116, 174, 0.5);
            color: var(--textPrimary);
        }

        .sampling-mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            border-color: var(--primary);
            color: white;
        }

        /* Distribution Visualization */
        .distribution-viz {
            height: 220px;
            position: relative;
            margin: 20px 0;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 0 10px 30px 10px;
        }

        .dist-bar {
            flex: 1;
            background: linear-gradient(180deg, var(--primary), var(--darkBlue));
            border-radius: 4px 4px 0 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-width: 40px;
            cursor: pointer;
        }

        .dist-bar:hover {
            filter: brightness(1.1);
        }

        .dist-bar.excluded {
            background: linear-gradient(180deg, #bbb, #999);
            opacity: 0.5;
        }

        .dist-bar.greedy-selected {
            background: linear-gradient(180deg, var(--positive), #16a34a);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .dist-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: #666;
            white-space: nowrap;
        }

        .dist-bar-prob {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--darkBlue);
        }

        /* Cutoff Line */
        .cutoff-line {
            position: absolute;
            top: 0;
            bottom: 30px;
            width: 3px;
            background: var(--negative);
            border-radius: 2px;
            transition: left 0.3s ease;
            z-index: 10;
        }

        .cutoff-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--negative);
            white-space: nowrap;
            font-weight: 600;
        }

        /* Loading Animation */
        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }

        /* Agent Progress */
        .agent-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #fafafa;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .progress-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: rgba(39, 116, 174, 0.1);
            border: 2px solid rgba(39, 116, 174, 0.3);
            transition: all 0.3s;
            color: var(--primary);
        }

        .progress-circle.active {
            background: linear-gradient(135deg, var(--primary), var(--darkBlue));
            border-color: var(--lightBlue);
            color: white;
            animation: pulseGlow 2s infinite;
        }

        .progress-circle.complete {
            background: linear-gradient(135deg, var(--positive), #16a34a);
            border-color: var(--positive);
            color: white;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 116, 174, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(39, 116, 174, 0); }
        }

        .progress-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }

        .progress-line {
            flex: 1;
            height: 2px;
            background: rgba(39, 116, 174, 0.2);
        }

        .progress-line.complete {
            background: linear-gradient(90deg, var(--positive), var(--primary));
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .playground-grid {
                grid-template-columns: 1fr;
            }
            .agents-grid {
                grid-template-columns: 1fr;
            }
            .instructions-content {
                grid-template-columns: 1fr;
            }
        }

        /* Temperature explanation */
        .temp-explanation {
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(39, 116, 174, 0.1);
            border: 1px solid rgba(39, 116, 174, 0.3);
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            color: #444;
        }

        .temp-explanation strong {
            color: var(--darkBlue);
        }

        /* Cumulative probability indicator */
        .cumulative-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(39, 116, 174, 0.08);
            border: 1px solid rgba(39, 116, 174, 0.2);
            border-radius: 8px;
            font-size: 12px;
        }

        .cumulative-bar {
            flex: 1;
            height: 8px;
            background: rgba(39, 116, 174, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .cumulative-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--lightBlue));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Table styling for instructions */
        .instruction-section table {
            color: #444;
        }

        .instruction-section th {
            color: var(--darkBlue) !important;
        }

        .instruction-section tr {
            border-bottom: 1px solid #e0e0e0;
        }

        /* Settings effect panel */
        .settings-effect {
            margin-top: 24px;
            padding: 16px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .settings-effect-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--darkBlue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-effect-text {
            font-size: 13px;
            color: #555;
            line-height: 1.7;
        }

        .settings-effect-text strong {
            color: var(--darkBlue);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Simulated token data
        const generateTokenProbabilities = (temperature, baseTokens) => {
            const tokens = baseTokens || [
                { token: "the", baseProb: 0.35 },
                { token: "a", baseProb: 0.20 },
                { token: "an", baseProb: 0.12 },
                { token: "this", baseProb: 0.10 },
                { token: "that", baseProb: 0.08 },
                { token: "one", baseProb: 0.06 },
                { token: "some", baseProb: 0.04 },
                { token: "any", baseProb: 0.03 },
                { token: "each", baseProb: 0.015 },
                { token: "every", baseProb: 0.005 }
            ];

            // Apply temperature scaling
            const scaledLogits = tokens.map(t => Math.log(t.baseProb) / temperature);
            const maxLogit = Math.max(...scaledLogits);
            const expLogits = scaledLogits.map(l => Math.exp(l - maxLogit));
            const sumExp = expLogits.reduce((a, b) => a + b, 0);

            return tokens.map((t, i) => ({
                ...t,
                probability: expLogits[i] / sumExp,
                logit: scaledLogits[i]
            }));
        };

        // Token Probability Chart Component
        const TokenProbabilityChart = ({ temperature, topK, topP, samplingMode }) => {
            const [tokens, setTokens] = useState([]);
            const [selectedToken, setSelectedToken] = useState(null);
            const [animatedProbs, setAnimatedProbs] = useState([]);

            useEffect(() => {
                const newTokens = generateTokenProbabilities(temperature);
                setTokens(newTokens);

                // Animate the probability changes
                const timer = setTimeout(() => {
                    setAnimatedProbs(newTokens.map(t => t.probability));
                }, 50);

                return () => clearTimeout(timer);
            }, [temperature]);

            // Determine which tokens are included based on sampling mode
            const getIncludedTokens = () => {
                const sorted = [...tokens].sort((a, b) => b.probability - a.probability);

                if (samplingMode === 'greedy') {
                    return [sorted[0]?.token];
                } else if (samplingMode === 'topk') {
                    return sorted.slice(0, topK).map(t => t.token);
                } else if (samplingMode === 'topp') {
                    let cumProb = 0;
                    const included = [];
                    for (const t of sorted) {
                        if (cumProb >= topP) break;
                        included.push(t.token);
                        cumProb += t.probability;
                    }
                    return included;
                }
                return sorted.map(t => t.token);
            };

            const includedTokens = getIncludedTokens();

            // Calculate cumulative probability for Top-P visualization
            const getCumulativeProbability = () => {
                const sorted = [...tokens].sort((a, b) => b.probability - a.probability);
                let cumProb = 0;
                for (const t of sorted) {
                    if (!includedTokens.includes(t.token)) break;
                    cumProb += t.probability;
                }
                return cumProb;
            };

            const cumulativeProb = getCumulativeProbability();

            return (
                <div>
                    <div className="distribution-viz">
                        {tokens.map((t, i) => {
                            const isIncluded = includedTokens.includes(t.token);
                            const isGreedySelected = samplingMode === 'greedy' && i === 0;
                            const height = Math.max(t.probability * 180, 10);
                            return (
                                <div
                                    key={t.token}
                                    className={`dist-bar ${!isIncluded ? 'excluded' : ''} ${isGreedySelected ? 'greedy-selected' : ''}`}
                                    style={{ height: `${height}px` }}
                                    onMouseEnter={() => setSelectedToken(t)}
                                    onMouseLeave={() => setSelectedToken(null)}
                                >
                                    <span className="dist-bar-prob">{(t.probability * 100).toFixed(1)}%</span>
                                    <span className="dist-bar-label">{t.token}</span>
                                </div>
                            );
                        })}
                    </div>

                    {samplingMode === 'topp' && (
                        <div className="cumulative-indicator">
                            <span style={{ color: 'var(--primary)' }}>Cumulative:</span>
                            <div className="cumulative-bar">
                                <div
                                    className="cumulative-fill"
                                    style={{ width: `${Math.min(cumulativeProb / topP * 100, 100)}%` }}
                                />
                            </div>
                            <span style={{ color: 'var(--darkBlue)', fontFamily: 'JetBrains Mono' }}>
                                {(cumulativeProb * 100).toFixed(1)}% / {(topP * 100).toFixed(0)}%
                            </span>
                        </div>
                    )}

                    <div className="sampling-viz">
                        {tokens.map(t => {
                            const isIncluded = includedTokens.includes(t.token);
                            const isSelected = selectedToken?.token === t.token;
                            return (
                                <div
                                    key={t.token}
                                    className={`token-chip ${isIncluded ? 'included' : 'excluded'} ${isSelected ? 'selected' : ''}`}
                                >
                                    <span>{t.token}</span>
                                    <span className="token-prob">{(t.probability * 100).toFixed(1)}%</span>
                                </div>
                            );
                        })}
                    </div>

                    <div className="temp-explanation">
                        {samplingMode === 'greedy' && (
                            <span><strong>Greedy Sampling:</strong> Always selects the single most probable token. Deterministic output - same input always produces same output.</span>
                        )}
                        {samplingMode === 'topk' && (
                            <span><strong>Top-K Sampling:</strong> Samples from the {topK} most likely tokens. Currently selecting from {Math.min(topK, tokens.length)} tokens regardless of their probability values.</span>
                        )}
                        {samplingMode === 'topp' && (
                            <span><strong>Top-P (Nucleus) Sampling:</strong> Samples from the smallest set of tokens whose cumulative probability exceeds {(topP * 100).toFixed(0)}%. Currently {includedTokens.length} tokens included.</span>
                        )}
                    </div>
                </div>
            );
        };

        // Temperature Visualizer
        const TemperatureVisualizer = ({ temperature }) => {
            const getTempState = () => {
                if (temperature <= 0.5) return { class: 'temp-cold', label: 'Deterministic', desc: 'Very focused, predictable' };
                if (temperature <= 1.0) return { class: 'temp-warm', label: 'Balanced', desc: 'Good mix of creativity' };
                return { class: 'temp-hot', label: 'Creative', desc: 'High randomness, diverse' };
            };

            const state = getTempState();

            return (
                <div className="temp-indicator">
                    <div className="temp-label">
                        <div className={`temp-dot ${state.class}`}></div>
                        <span>{state.label}</span>
                    </div>
                    <span style={{ fontSize: '11px', color: 'var(--textMuted)' }}>{state.desc}</span>
                </div>
            );
        };

        // Generated Text Display
        const GeneratedText = ({ tokens, isGenerating }) => {
            return (
                <div className="generated-text">
                    {tokens.map((t, i) => (
                        <span
                            key={i}
                            className={`generated-token ${
                                t.prob > 0.5 ? 'token-high-prob' :
                                t.prob > 0.2 ? 'token-med-prob' : 'token-low-prob'
                            }`}
                            title={`Probability: ${(t.prob * 100).toFixed(1)}%`}
                        >
                            {t.text}
                        </span>
                    ))}
                    {isGenerating && (
                        <span className="loading-dots" style={{ display: 'inline-flex', marginLeft: '8px' }}>
                            <span className="loading-dot"></span>
                            <span className="loading-dot"></span>
                            <span className="loading-dot"></span>
                        </span>
                    )}
                </div>
            );
        };

        // Agent Step Component
        const AgentStep = ({ step, index }) => {
            const icons = {
                thought: '🧠',
                action: '⚡',
                observation: '👁️'
            };

            return (
                <div className={`agent-step step-${step.type}`} style={{ animationDelay: `${index * 0.2}s` }}>
                    <div className="step-icon">{icons[step.type]}</div>
                    <div className="step-content">
                        <div className="step-type">{step.type}</div>
                        <div className="step-text">
                            {step.tool && <span className="tool-badge">🔧 {step.tool}</span>}
                            {step.content}
                        </div>
                    </div>
                </div>
            );
        };

        // Agent Progress Component
        const AgentProgress = ({ currentStep, totalSteps }) => {
            const steps = ['Think', 'Act', 'Observe', 'Repeat'];

            return (
                <div className="agent-progress">
                    {steps.map((step, i) => (
                        <React.Fragment key={step}>
                            <div className="progress-step">
                                <div className={`progress-circle ${
                                    i < currentStep ? 'complete' :
                                    i === currentStep ? 'active' : ''
                                }`}>
                                    {i < currentStep ? '✓' : i + 1}
                                </div>
                                <span className="progress-label">{step}</span>
                            </div>
                            {i < steps.length - 1 && (
                                <div className={`progress-line ${i < currentStep ? 'complete' : ''}`}></div>
                            )}
                        </React.Fragment>
                    ))}
                </div>
            );
        };

        // Playground Tab
        const PlaygroundTab = () => {
            const [temperature, setTemperature] = useState(0.7);
            const [topK, setTopK] = useState(5);
            const [topP, setTopP] = useState(0.9);
            const [maxTokens, setMaxTokens] = useState(150);
            const [prompt, setPrompt] = useState("The future of artificial intelligence will");
            const [samplingMode, setSamplingMode] = useState('topp');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedTokens, setGeneratedTokens] = useState([]);
            const [metrics, setMetrics] = useState({
                tokens: 0,
                cost: 0,
                latency: 0,
                tokensPerSec: 0
            });

            const simulateGeneration = async () => {
                setIsGenerating(true);
                setGeneratedTokens([]);

                const sampleResponses = [
                    { text: " transform", prob: 0.72 },
                    { text: " every", prob: 0.45 },
                    { text: " aspect", prob: 0.68 },
                    { text: " of", prob: 0.89 },
                    { text: " human", prob: 0.52 },
                    { text: " life", prob: 0.61 },
                    { text: ",", prob: 0.78 },
                    { text: " from", prob: 0.55 },
                    { text: " healthcare", prob: 0.42 },
                    { text: " to", prob: 0.85 },
                    { text: " education", prob: 0.38 },
                    { text: ".", prob: 0.67 },
                    { text: " AI", prob: 0.71 },
                    { text: " systems", prob: 0.59 },
                    { text: " will", prob: 0.64 },
                    { text: " become", prob: 0.48 },
                    { text: " increasingly", prob: 0.35 },
                    { text: " sophisticated", prob: 0.29 },
                    { text: ",", prob: 0.82 },
                    { text: " capable", prob: 0.44 }
                ];

                const startTime = Date.now();
                const tokens = [];

                for (let i = 0; i < Math.min(maxTokens / 10, sampleResponses.length); i++) {
                    await new Promise(r => setTimeout(r, 100 + Math.random() * 150));

                    // Adjust probability based on temperature
                    const adjustedProb = Math.pow(sampleResponses[i].prob, 1 / temperature);
                    tokens.push({ ...sampleResponses[i], prob: Math.min(adjustedProb, 1) });
                    setGeneratedTokens([...tokens]);
                }

                const endTime = Date.now();
                const latency = endTime - startTime;

                setMetrics({
                    tokens: tokens.length,
                    cost: (tokens.length * 0.00003).toFixed(5),
                    latency: latency,
                    tokensPerSec: ((tokens.length / latency) * 1000).toFixed(1)
                });

                setIsGenerating(false);
            };

            return (
                <div className="playground-grid">
                    {/* Controls Panel - Light */}
                    <div className="card">
                        <div className="card-title">
                            <div className="card-title-icon">⚙️</div>
                            Generation Controls
                        </div>

                        <div className="control-group">
                            <div className="control-label">
                                <span>Temperature</span>
                                <span className="control-value">{temperature.toFixed(2)}</span>
                            </div>
                            <input
                                type="range"
                                min="0.1"
                                max="2.0"
                                step="0.05"
                                value={temperature}
                                onChange={(e) => setTemperature(parseFloat(e.target.value))}
                            />
                            <TemperatureVisualizer temperature={temperature} />
                        </div>

                        <div className="control-group">
                            <div className="control-label">
                                <span>Sampling Mode</span>
                            </div>
                            <div className="sampling-modes">
                                <button
                                    className={`sampling-mode-btn ${samplingMode === 'greedy' ? 'active' : ''}`}
                                    onClick={() => setSamplingMode('greedy')}
                                >
                                    Greedy
                                </button>
                                <button
                                    className={`sampling-mode-btn ${samplingMode === 'topk' ? 'active' : ''}`}
                                    onClick={() => setSamplingMode('topk')}
                                >
                                    Top-K
                                </button>
                                <button
                                    className={`sampling-mode-btn ${samplingMode === 'topp' ? 'active' : ''}`}
                                    onClick={() => setSamplingMode('topp')}
                                >
                                    Top-P
                                </button>
                            </div>
                        </div>

                        {samplingMode === 'topk' && (
                            <div className="control-group">
                                <div className="control-label">
                                    <span>Top-K</span>
                                    <span className="control-value">{topK}</span>
                                </div>
                                <input
                                    type="range"
                                    min="1"
                                    max="10"
                                    step="1"
                                    value={topK}
                                    onChange={(e) => setTopK(parseInt(e.target.value))}
                                />
                            </div>
                        )}

                        {samplingMode === 'topp' && (
                            <div className="control-group">
                                <div className="control-label">
                                    <span>Top-P (Nucleus)</span>
                                    <span className="control-value">{topP.toFixed(2)}</span>
                                </div>
                                <input
                                    type="range"
                                    min="0.1"
                                    max="1.0"
                                    step="0.05"
                                    value={topP}
                                    onChange={(e) => setTopP(parseFloat(e.target.value))}
                                />
                            </div>
                        )}

                        <div className="control-group">
                            <div className="control-label">
                                <span>Max Tokens</span>
                                <span className="control-value">{maxTokens}</span>
                            </div>
                            <input
                                type="range"
                                min="50"
                                max="500"
                                step="10"
                                value={maxTokens}
                                onChange={(e) => setMaxTokens(parseInt(e.target.value))}
                            />
                        </div>

                        <div className="control-group">
                            <div className="control-label">
                                <span>Prompt</span>
                            </div>
                            <textarea
                                value={prompt}
                                onChange={(e) => setPrompt(e.target.value)}
                                placeholder="Enter your prompt here..."
                            />
                        </div>

                        <button
                            className="btn btn-primary"
                            onClick={simulateGeneration}
                            disabled={isGenerating}
                        >
                            {isGenerating ? (
                                <>
                                    <span className="loading-dots">
                                        <span className="loading-dot"></span>
                                        <span className="loading-dot"></span>
                                        <span className="loading-dot"></span>
                                    </span>
                                    Generating...
                                </>
                            ) : (
                                <>✨ Generate</>
                            )}
                        </button>
                    </div>

                    {/* Visualization Panel - Light */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
                        <div className="card">
                            <div className="card-title">
                                <div className="card-title-icon">📊</div>
                                Token Probability Distribution
                            </div>
                            <TokenProbabilityChart
                                temperature={temperature}
                                topK={topK}
                                topP={topP}
                                samplingMode={samplingMode}
                            />
                        </div>

                        <div className="card">
                            <div className="card-title">
                                <div className="card-title-icon">📝</div>
                                Generated Output
                            </div>
                            <GeneratedText tokens={generatedTokens} isGenerating={isGenerating} />
                            <div style={{ marginTop: '12px', fontSize: '11px', color: '#666' }}>
                                <span style={{ color: 'var(--positive)' }}>■</span> High prob (&gt;50%)
                                <span style={{ color: 'var(--accent)', marginLeft: '12px' }}>■</span> Medium (20-50%)
                                <span style={{ color: 'var(--negative)', marginLeft: '12px' }}>■</span> Low (&lt;20%)
                            </div>
                        </div>
                    </div>

                    {/* Metrics Panel - Light */}
                    <div className="card">
                        <div className="card-title">
                            <div className="card-title-icon">📈</div>
                            Generation Metrics
                        </div>

                        <div className="metrics-grid">
                            <div className="metric-card">
                                <div className="metric-value">{metrics.tokens}</div>
                                <div className="metric-label">Tokens</div>
                            </div>
                            <div className="metric-card">
                                <div className="metric-value">${metrics.cost}</div>
                                <div className="metric-label">Est. Cost</div>
                            </div>
                            <div className="metric-card">
                                <div className="metric-value">{metrics.latency}ms</div>
                                <div className="metric-label">Latency</div>
                            </div>
                            <div className="metric-card">
                                <div className="metric-value">{metrics.tokensPerSec}</div>
                                <div className="metric-label">Tokens/sec</div>
                            </div>
                        </div>

                        <div className="settings-effect">
                            <div className="settings-effect-title">
                                <span>💡</span>
                                Current Settings Effect
                            </div>
                            <div className="settings-effect-text">
                                {temperature < 0.5 && (
                                    <p>Very low temperature makes output highly deterministic - the model almost always picks the highest probability token.</p>
                                )}
                                {temperature >= 0.5 && temperature <= 1.0 && (
                                    <p>Balanced temperature provides a good mix of coherence and creativity - suitable for most tasks.</p>
                                )}
                                {temperature > 1.0 && (
                                    <p>High temperature increases randomness significantly - good for creative tasks but may reduce coherence.</p>
                                )}
                                {samplingMode === 'greedy' && (
                                    <p style={{ marginTop: '8px' }}><strong>Greedy:</strong> Always selects the single most likely token.</p>
                                )}
                                {samplingMode === 'topk' && (
                                    <p style={{ marginTop: '8px' }}><strong>Top-K ({topK}):</strong> Samples from the {topK} most likely tokens.</p>
                                )}
                                {samplingMode === 'topp' && (
                                    <p style={{ marginTop: '8px' }}><strong>Top-P ({topP}):</strong> Samples from tokens comprising {(topP * 100).toFixed(0)}% cumulative probability.</p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Agents Tab
        const AgentsTab = () => {
            const [goal, setGoal] = useState("What is the population of Tokyo and how does it compare to New York?");
            const [tools, setTools] = useState({
                search: true,
                calculate: true,
                wikipedia: false,
                weather: false
            });
            const [autoMode, setAutoMode] = useState(true);
            const [showReasoning, setShowReasoning] = useState(true);
            const [isRunning, setIsRunning] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);
            const [steps, setSteps] = useState([]);

            const sampleAgentRun = [
                {
                    type: 'thought',
                    content: 'I need to find the population of Tokyo and New York to compare them. Let me start by searching for Tokyo\'s population.'
                },
                {
                    type: 'action',
                    tool: 'search',
                    content: 'Searching for "Tokyo population 2024"'
                },
                {
                    type: 'observation',
                    content: 'Tokyo metropolitan area has a population of approximately 37.4 million people, making it the most populous metropolitan area in the world.'
                },
                {
                    type: 'thought',
                    content: 'Good, I found Tokyo\'s population. Now I need to find New York\'s population for comparison.'
                },
                {
                    type: 'action',
                    tool: 'search',
                    content: 'Searching for "New York City population 2024"'
                },
                {
                    type: 'observation',
                    content: 'New York City has a population of approximately 8.3 million people. The greater New York metropolitan area has about 20 million people.'
                },
                {
                    type: 'thought',
                    content: 'Now I have both populations. Let me calculate the difference to provide a clear comparison.'
                },
                {
                    type: 'action',
                    tool: 'calculate',
                    content: 'Calculating: 37.4 million - 20 million = 17.4 million difference'
                },
                {
                    type: 'observation',
                    content: 'Result: Tokyo metropolitan area is 17.4 million people larger, which is approximately 87% larger than the NYC metro area.'
                },
                {
                    type: 'thought',
                    content: 'I now have all the information needed to answer the question comprehensively.'
                }
            ];

            const runAgent = async () => {
                setIsRunning(true);
                setSteps([]);
                setCurrentStep(0);

                for (let i = 0; i < sampleAgentRun.length; i++) {
                    await new Promise(r => setTimeout(r, autoMode ? 1200 : 2000));
                    setSteps(prev => [...prev, sampleAgentRun[i]]);
                    setCurrentStep(Math.floor(i / 3) % 4);
                }

                setCurrentStep(4);
                setIsRunning(false);
            };

            const toggleTool = (tool) => {
                setTools(prev => ({ ...prev, [tool]: !prev[tool] }));
            };

            return (
                <div className="agents-grid">
                    {/* Controls - Light */}
                    <div className="card">
                        <div className="card-title">
                            <div className="card-title-icon">🤖</div>
                            Agent Configuration
                        </div>

                        <div className="control-group">
                            <div className="control-label">
                                <span>Agent Goal</span>
                            </div>
                            <textarea
                                value={goal}
                                onChange={(e) => setGoal(e.target.value)}
                                placeholder="What should the agent accomplish?"
                                style={{ height: '100px' }}
                            />
                        </div>

                        <div className="control-group">
                            <div className="control-label">
                                <span>Available Tools</span>
                            </div>
                            <div className="checkbox-group">
                                {Object.entries(tools).map(([tool, enabled]) => (
                                    <div
                                        key={tool}
                                        className={`checkbox-item ${enabled ? 'checked' : ''}`}
                                        onClick={() => toggleTool(tool)}
                                    >
                                        <div className="checkbox-box">
                                            {enabled && '✓'}
                                        </div>
                                        <span className="checkbox-label" style={{ textTransform: 'capitalize' }}>
                                            {tool}
                                        </span>
                                        <span className="checkbox-icon">
                                            {tool === 'search' && '🔍'}
                                            {tool === 'calculate' && '🧮'}
                                            {tool === 'wikipedia' && '📚'}
                                            {tool === 'weather' && '🌤️'}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="control-group">
                            <div className="checkbox-group">
                                <div
                                    className={`checkbox-item ${autoMode ? 'checked' : ''}`}
                                    onClick={() => setAutoMode(!autoMode)}
                                >
                                    <div className="checkbox-box">{autoMode && '✓'}</div>
                                    <span className="checkbox-label">Auto Mode (continuous)</span>
                                    <span className="checkbox-icon">⚡</span>
                                </div>
                                <div
                                    className={`checkbox-item ${showReasoning ? 'checked' : ''}`}
                                    onClick={() => setShowReasoning(!showReasoning)}
                                >
                                    <div className="checkbox-box">{showReasoning && '✓'}</div>
                                    <span className="checkbox-label">Show Reasoning</span>
                                    <span className="checkbox-icon">💭</span>
                                </div>
                            </div>
                        </div>

                        <button
                            className="btn btn-primary"
                            onClick={runAgent}
                            disabled={isRunning}
                        >
                            {isRunning ? (
                                <>
                                    <span className="loading-dots">
                                        <span className="loading-dot"></span>
                                        <span className="loading-dot"></span>
                                        <span className="loading-dot"></span>
                                    </span>
                                    Agent Running...
                                </>
                            ) : (
                                <>🚀 Run Agent</>
                            )}
                        </button>
                    </div>

                    {/* Agent Flow - Light */}
                    <div className="card">
                        <div className="card-title">
                            <div className="card-title-icon">🔄</div>
                            ReAct Agent Flow
                        </div>

                        <AgentProgress currentStep={currentStep} totalSteps={4} />

                        <div className="agent-flow">
                            {steps.map((step, i) => (
                                (showReasoning || step.type !== 'thought') && (
                                    <AgentStep key={i} step={step} index={i} />
                                )
                            ))}

                            {steps.length === 0 && !isRunning && (
                                <div style={{
                                    textAlign: 'center',
                                    padding: '60px 20px',
                                    color: '#888'
                                }}>
                                    <div style={{ fontSize: '48px', marginBottom: '16px' }}>🤖</div>
                                    <p>Configure your agent and click "Run Agent" to see the ReAct pattern in action</p>
                                </div>
                            )}
                        </div>

                        {steps.length === sampleAgentRun.length && (
                            <div style={{
                                marginTop: '20px',
                                padding: '16px',
                                background: 'rgba(34, 197, 94, 0.1)',
                                border: '1px solid rgba(34, 197, 94, 0.3)',
                                borderRadius: '12px'
                            }}>
                                <div style={{ fontWeight: '600', color: 'var(--positive)', marginBottom: '8px' }}>
                                    ✅ Agent Complete
                                </div>
                                <div style={{ fontSize: '14px', lineHeight: '1.7', color: '#444' }}>
                                    <strong>Answer:</strong> Tokyo's metropolitan area (37.4M) is approximately 87% larger than New York's metro area (20M), with a difference of about 17.4 million people.
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            return (
                <div className="app-container">
                    <header style={{
                        background: '#2774AE',
                        borderBottom: '2px solid #FFD100',
                        padding: '1rem 2rem',
                        position: 'sticky',
                        top: 0,
                        zIndex: 100
                    }}>
                        <div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                                <p style={{ fontSize: '0.65rem', color: '#FFD100', fontWeight: 400, marginBottom: '0.25rem', textTransform: 'uppercase', letterSpacing: '0.2em' }}>
                                    MGMT298D: Science and Strategy of AI
                                </p>
                                <h1 style={{ fontSize: '1.4rem', fontWeight: 600, color: '#f5f5f5', letterSpacing: '0' }}>
                                    Week 8: AI Strategy
                                </h1>
                                <p style={{ fontSize: '0.85rem', color: '#b0b0b0', marginTop: '0.25rem' }}>
                                    Token Probabilities, Sampling & ReAct Patterns
                                </p>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <span style={{
                                    fontSize: '1rem',
                                    fontWeight: 500,
                                    color: '#f5f5f5'
                                }}>
                                    UCLA Anderson
                                </span>
                            </div>
                        </div>
                    </header>

                    <main className="main-content">
                        <PlaygroundTab />
                        <div style={{ marginTop: '32px' }}>
                            <AgentsTab />
                        </div>
                    </main>

                    {/* Footer */}
                    <p style={{ color: '#888', fontSize: '0.75rem', marginTop: '20px', textAlign: 'center' }}>
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </p>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
