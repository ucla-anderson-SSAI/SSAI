<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Starter</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <p class="eyebrow">Product Sprint starter</p>
        <h1>App Starter</h1>
        <p>
          Customize the product idea, audience, and task. The app sends a structured prompt to Gemini and can optionally add text from the knowledge base.
        </p>
      </section>

      <section class="workspace">
        <form id="app-form" class="panel">
          <label>
            App name
            <input name="appName" value="MBA Strategy Coach">
          </label>

          <label>
            Intended user
            <input name="audience" value="MBA students evaluating AI strategy decisions">
          </label>

          <label>
            Task the app helps with
            <input name="task" value="help the user reason through a business tradeoff and produce a practical recommendation">
          </label>

          <label>
            User request
            <textarea name="question" rows="6">A startup wants to add an AI assistant to its product. Should it use an API or rent GPUs and host an open model?</textarea>
          </label>

          <label class="check">
            <input type="checkbox" name="useKnowledgeBase" checked>
            Use knowledge base from the docs folder
          </label>

          <button type="submit">Generate answer</button>
        </form>

        <section class="panel output">
          <div class="output-header">
            <h2>Model answer</h2>
            <span id="status">Ready</span>
          </div>
          <pre id="answer">Run the app locally, add your API key, then submit the form.</pre>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
