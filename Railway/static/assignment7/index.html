<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // Chart.js Bar Chart Component for Comparison Data
        const ComparisonChart = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                if (chartRef.current) {
                    chartRef.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d.metric),
                        datasets: [
                            {
                                label: 'LSTM',
                                data: data.map(d => d.LSTM),
                                backgroundColor: '#ef4444',
                                borderColor: '#ef4444',
                                borderWidth: 1,
                                borderRadius: 4
                            },
                            {
                                label: 'Transformer',
                                data: data.map(d => d.Transformer),
                                backgroundColor: '#22c55e',
                                borderColor: '#22c55e',
                                borderWidth: 1,
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: { color: '#888888' }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(10, 10, 10, 0.95)',
                                titleColor: '#e5e5e5',
                                bodyColor: '#888888',
                                borderColor: 'rgba(39, 116, 174, 0.3)',
                                borderWidth: 1
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#666666', font: { size: 12 } },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' }
                            },
                            y: {
                                ticks: { color: '#666666', font: { size: 12 } },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }
                };
            }, [data]);

            return <canvas ref={canvasRef} style={{ height: '100%', width: '100%' }} />;
        };

        // Sample attention data
        const sampleSentence = ["The", "movie", "was", "not", "good", "but", "the", "acting", "was", "brilliant"];

        // Generate attention weights for each head
        const generateAttentionWeights = (numHeads) => {
            const heads = {};
            for (let h = 0; h < numHeads; h++) {
                const weights = [];
                for (let i = 0; i < sampleSentence.length; i++) {
                    const row = [];
                    for (let j = 0; j < sampleSentence.length; j++) {
                        let weight = Math.random() * 0.3;

                        // Head 0: Local attention pattern
                        if (h === 0 && Math.abs(i - j) <= 1) weight = 0.5 + Math.random() * 0.3;

                        // Head 1: Semantic attention - "brilliant" attends to "acting"
                        if (h === 1) {
                            if (i === 9 && j === 7) weight = 0.85;  // brilliant -> acting
                            if (i === 4 && j === 3) weight = 0.75;  // good -> not
                            if (i === 9 && j === 8) weight = 0.65;  // brilliant -> was
                        }

                        // Head 2: Syntactic patterns
                        if (h === 2) {
                            if ((i === 0 || i === 6) && (j === 1 || j === 7)) weight = 0.7;  // determiners -> nouns
                            if ((i === 2 || i === 8) && (j === 4 || j === 9)) weight = 0.6;  // was -> adjectives
                        }

                        // Head 3: Global attention
                        if (h === 3) {
                            if (j === 0 || j === 5) weight = 0.4 + Math.random() * 0.2;  // attend to position markers
                        }

                        row.push(Math.min(weight, 1));
                    }
                    // Normalize row
                    const sum = row.reduce((a, b) => a + b, 0);
                    weights.push(row.map(w => w / sum));
                }
                heads[h] = weights;
            }
            return heads;
        };

        // Icon components
        const TransformerIcon = () => (
            <svg viewBox="0 0 50 50" className="transformer-icon">
                <defs>
                    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#2774AE"/>
                        <stop offset="100%" stopColor="#FFD100"/>
                    </linearGradient>
                </defs>
                <rect x="10" y="5" width="30" height="8" rx="2" fill="url(#iconGrad)" opacity="0.8"/>
                <rect x="8" y="17" width="34" height="12" rx="3" fill="url(#iconGrad)"/>
                <rect x="10" y="33" width="30" height="8" rx="2" fill="url(#iconGrad)" opacity="0.8"/>
                <rect x="12" y="45" width="26" height="4" rx="1" fill="url(#iconGrad)" opacity="0.6"/>
                <circle cx="25" cy="23" r="4" fill="#003B5C"/>
                <path d="M22 23 L25 20 L28 23 L25 26 Z" fill="#2774AE"/>
            </svg>
        );

        // Architecture Diagram Component
        const ArchitectureDiagram = ({ embedDim, numHeads, numBlocks, ffDim }) => {
            const blockHeight = 140;
            const width = 500;
            const height = 200 + numBlocks * blockHeight;

            return (
                <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', maxWidth: '500px', height: 'auto' }}>
                    <defs>
                        <linearGradient id="uclaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#2774AE"/>
                            <stop offset="100%" stopColor="#005587"/>
                        </linearGradient>
                        <linearGradient id="uclaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#FFD100"/>
                            <stop offset="100%" stopColor="#FFC72C"/>
                        </linearGradient>
                        <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#002845"/>
                            <stop offset="100%" stopColor="#003B5C"/>
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    {/* Input Embeddings */}
                    <g transform="translate(150, 20)">
                        <rect x="0" y="0" width="200" height="40" rx="8" fill="url(#darkGrad)" stroke="#2774AE" strokeWidth="2"/>
                        <text x="100" y="25" textAnchor="middle" fill="#e5e5e5" fontSize="12" fontWeight="600">Token Embeddings</text>
                    </g>

                    {/* Plus Sign */}
                    <text x="250" y="75" textAnchor="middle" fill="#FFD100" fontSize="20" fontWeight="bold">+</text>

                    {/* Positional Encoding */}
                    <g transform="translate(150, 85)">
                        <rect x="0" y="0" width="200" height="35" rx="8" fill="url(#darkGrad)" stroke="#8BB8E8" strokeWidth="2"/>
                        <text x="100" y="22" textAnchor="middle" fill="#e5e5e5" fontSize="11" fontWeight="600">Positional Encoding</text>
                    </g>

                    {/* Arrow to blocks */}
                    <path d="M250 125 L250 145" stroke="#2774AE" strokeWidth="2" fill="none" markerEnd="url(#arrowhead)"/>

                    {/* Transformer Blocks */}
                    {Array.from({ length: numBlocks }, (_, blockIdx) => {
                        const blockY = 155 + blockIdx * blockHeight;
                        return (
                            <g key={blockIdx} transform={`translate(50, ${blockY})`}>
                                {/* Block Container */}
                                <rect x="0" y="0" width="400" height={blockHeight - 15} rx="12" fill="url(#darkGrad)" stroke="#2774AE" strokeWidth="2" opacity="0.9"/>

                                {/* Block Label */}
                                <text x="200" y="18" textAnchor="middle" fill="#666666" fontSize="10" fontWeight="600">BLOCK {blockIdx + 1}</text>

                                {/* Multi-Head Attention */}
                                <g transform="translate(20, 30)">
                                    <rect x="0" y="0" width="170" height="45" rx="8" fill="url(#uclaBlueGrad)" filter="url(#glow)"/>
                                    <text x="85" y="20" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="700">Multi-Head Attention</text>
                                    <text x="85" y="35" textAnchor="middle" fill="#ffffff" fontSize="10">{numHeads} heads x {embedDim/numHeads}d</text>

                                    {/* Attention Heads Visual */}
                                    {Array.from({ length: Math.min(numHeads, 4) }, (_, i) => (
                                        <circle key={i} cx={40 + i * 30} cy="55" r="6" fill="#003B5C" opacity="0.6"/>
                                    ))}
                                </g>

                                {/* Add & Norm 1 */}
                                <g transform="translate(210, 35)">
                                    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#uclaGoldGrad)"/>
                                    <text x="40" y="20" textAnchor="middle" fill="#003B5C" fontSize="10" fontWeight="600">Add & Norm</text>
                                </g>

                                {/* Feed Forward */}
                                <g transform="translate(20, 85)">
                                    <rect x="0" y="0" width="170" height="30" rx="8" fill="url(#uclaBlueGrad)" opacity="0.8"/>
                                    <text x="85" y="20" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="700">FFN ({ffDim})</text>
                                </g>

                                {/* Add & Norm 2 */}
                                <g transform="translate(210, 85)">
                                    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#uclaGoldGrad)"/>
                                    <text x="40" y="20" textAnchor="middle" fill="#003B5C" fontSize="10" fontWeight="600">Add & Norm</text>
                                </g>

                                {/* Residual Connections */}
                                <path d="M310 50 Q340 50 340 70 Q340 90 310 100" stroke="#FFD100" strokeWidth="1.5" fill="none" strokeDasharray="4"/>
                                <path d="M190 50 L200 50" stroke="#2774AE" strokeWidth="2"/>
                                <path d="M290 50 L360 50 L360 100 L290 100" stroke="#2774AE" strokeWidth="1.5" fill="none" opacity="0.5"/>
                            </g>
                        );
                    })}

                    {/* Output */}
                    <g transform={`translate(150, ${160 + numBlocks * blockHeight})`}>
                        <rect x="0" y="0" width="200" height="35" rx="8" fill="url(#uclaBlueGrad)"/>
                        <text x="100" y="22" textAnchor="middle" fill="#ffffff" fontSize="12" fontWeight="700">Classification Head</text>
                    </g>

                    {/* Dimension Annotations */}
                    <g transform={`translate(470, 100)`}>
                        <text x="0" y="0" fill="#666666" fontSize="10">embed_dim: {embedDim}</text>
                        <text x="0" y="18" fill="#666666" fontSize="10">num_heads: {numHeads}</text>
                        <text x="0" y="36" fill="#666666" fontSize="10">head_dim: {embedDim/numHeads}</text>
                        <text x="0" y="54" fill="#666666" fontSize="10">ff_dim: {ffDim}</text>
                    </g>

                    {/* Arrow marker definition */}
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#2774AE"/>
                        </marker>
                    </defs>
                </svg>
            );
        };

        // Attention Heatmap Component
        const AttentionHeatmap = ({ weights, tokens, selectedToken, onTokenSelect, activeHead }) => {
            const [hoveredCell, setHoveredCell] = useState(null);

            const getColor = (weight) => {
                const intensity = Math.floor(weight * 255);
                if (weight < 0.2) return `rgba(39, 116, 174, ${0.1 + weight * 0.3})`;
                if (weight < 0.4) return `rgba(39, 116, 174, ${0.2 + weight * 0.4})`;
                if (weight < 0.6) return `rgba(39, 116, 174, ${0.4 + weight * 0.5})`;
                return `rgba(39, 116, 174, ${0.6 + weight * 0.4})`;
            };

            const currentWeights = weights[activeHead] || weights[0];

            return (
                <div>
                    <div className="token-labels">
                        {tokens.map((token, idx) => (
                            <div
                                key={idx}
                                className={`token-label ${hoveredCell && hoveredCell.j === idx ? 'highlighted' : ''} ${selectedToken === idx ? 'highlighted' : ''}`}
                                style={{ flex: 1 }}
                            >
                                {token}
                            </div>
                        ))}
                    </div>
                    <div className="heatmap-grid">
                        {tokens.map((token, i) => (
                            <div key={i} className="heatmap-row">
                                <div className={`row-label ${hoveredCell && hoveredCell.i === i ? 'highlighted' : ''} ${selectedToken === i ? 'highlighted' : ''}`}>
                                    {token}
                                </div>
                                <div className="heatmap-row-cells" style={{ display: 'grid', gridTemplateColumns: `repeat(${tokens.length}, 1fr)`, gap: '3px' }}>
                                    {currentWeights[i].map((weight, j) => (
                                        <div
                                            key={j}
                                            className={`heatmap-cell ${selectedToken === i && j === selectedToken ? 'selected' : ''}`}
                                            style={{
                                                backgroundColor: getColor(weight),
                                                aspectRatio: '1'
                                            }}
                                            onMouseEnter={() => setHoveredCell({ i, j })}
                                            onMouseLeave={() => setHoveredCell(null)}
                                            onClick={() => onTokenSelect(i)}
                                            title={`${tokens[i]} -> ${tokens[j]}: ${weight.toFixed(3)}`}
                                        >
                                            {weight.toFixed(2)}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="color-scale">
                        <span className="scale-label">Low</span>
                        <div className="scale-bar"></div>
                        <span className="scale-label">High</span>
                    </div>

                    {hoveredCell && (
                        <div style={{ marginTop: '12px', padding: '10px', background: 'rgba(39, 116, 174, 0.1)', borderRadius: '8px' }}>
                            <span style={{ color: '#2774AE', fontWeight: 600 }}>"{tokens[hoveredCell.i]}"</span>
                            <span style={{ color: '#888888' }}> attends to </span>
                            <span style={{ color: '#FFD100', fontWeight: 600 }}>"{tokens[hoveredCell.j]}"</span>
                            <span style={{ color: '#666666' }}> with weight </span>
                            <span style={{ color: '#2774AE', fontFamily: 'JetBrains Mono', fontWeight: 600 }}>
                                {currentWeights[hoveredCell.i][hoveredCell.j].toFixed(4)}
                            </span>
                        </div>
                    )}
                </div>
            );
        };

        // Question Card Component
        const QuestionCard = ({ number, question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);

            return (
                <div className={`question-card ${isOpen ? 'open' : ''}`}>
                    <div className="question-header" onClick={() => setIsOpen(!isOpen)}>
                        <div className="question-number">{number}</div>
                        <div className="question-text">{question}</div>
                        <div className="question-toggle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </div>
                    </div>
                    <div className="question-answer">
                        <div className="answer-content" dangerouslySetInnerHTML={{ __html: answer }} />
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeHead, setActiveHead] = useState(0);
            const [selectedToken, setSelectedToken] = useState(null);
            const [metrics, setMetrics] = useState({
                accuracy: 0.876,
                parameters: '1.2M',
                entropy: 2.34,
                trainingTime: '12.5 min'
            });

            const attentionWeights = useMemo(() => generateAttentionWeights(8), []);

            const getTopAttentions = (tokenIdx) => {
                if (tokenIdx === null) return [];
                const weights = attentionWeights[activeHead][tokenIdx];
                return weights
                    .map((w, i) => ({ token: sampleSentence[i], weight: w, idx: i }))
                    .sort((a, b) => b.weight - a.weight)
                    .slice(0, 3);
            };

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="header">
                        <div className="header-content">
                            <div className="header-left">
                                <div className="course-label">MGMT298D: Science and Strategy of AI</div>
                                <h1>Assignment 7: Transformers & Attention</h1>
                                <p>Understanding attention mechanisms for IMDb sentiment analysis</p>
                            </div>
                            <div className="header-right">
                                <span className="ucla-anderson">UCLA Anderson</span>
                            </div>
                        </div>
                    </header>

                    {/* Metrics Grid */}
                    <div className="metrics-grid">
                        <div className="metric-card">
                            <div className="metric-value">{(metrics.accuracy * 100).toFixed(1)}%</div>
                            <div className="metric-label">Test Accuracy</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-value">{metrics.parameters}</div>
                            <div className="metric-label">Parameters</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-value">{metrics.entropy}</div>
                            <div className="metric-label">Attention Entropy</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-value">{metrics.trainingTime}</div>
                            <div className="metric-label">Training Time</div>
                        </div>
                    </div>

                    {/* Main Simulator Content */}
                    <div className="fade-in">
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <circle cx="12" cy="12" r="3"/>
                                                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42"/>
                                            </svg>
                                        </div>
                                        Interactive Attention Heatmap
                                    </div>
                                </div>

                                {/* Sample Sentence */}
                                <div className="sample-sentence">
                                    <div className="sentence-label">Sample Sentence (Click tokens to explore attention)</div>
                                    <div className="sentence-tokens">
                                        {sampleSentence.map((token, idx) => (
                                            <div
                                                key={idx}
                                                className={`sentence-token ${selectedToken === idx ? 'selected' : ''} ${selectedToken !== null && getTopAttentions(selectedToken).some(a => a.idx === idx) ? 'attended' : ''}`}
                                                onClick={() => setSelectedToken(selectedToken === idx ? null : idx)}
                                            >
                                                {token}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="attention-container">
                                    <div className="heatmap-wrapper">
                                        {/* Head Tabs */}
                                        <div className="head-tabs">
                                            {[0, 1, 2, 3].map(head => (
                                                <button
                                                    key={head}
                                                    className={`head-tab ${activeHead === head ? 'active' : ''}`}
                                                    onClick={() => setActiveHead(head)}
                                                >
                                                    Head {head + 1}
                                                </button>
                                            ))}
                                        </div>

                                        <AttentionHeatmap
                                            weights={attentionWeights}
                                            tokens={sampleSentence}
                                            selectedToken={selectedToken}
                                            onTokenSelect={setSelectedToken}
                                            activeHead={activeHead}
                                        />
                                    </div>

                                    <div className="attention-info">
                                        <div className="info-panel">
                                            <div className="info-title">Attention Flow</div>
                                            {selectedToken !== null ? (
                                                <div className="attention-flow">
                                                    <div style={{ marginBottom: '12px' }}>
                                                        <span className="flow-token source">{sampleSentence[selectedToken]}</span>
                                                        <span style={{ color: '#666666', margin: '0 8px' }}>attends to:</span>
                                                    </div>
                                                    {getTopAttentions(selectedToken).map((att, idx) => (
                                                        <div key={idx} style={{ marginBottom: '8px' }}>
                                                            <span className="flow-token target">
                                                                {att.token}
                                                                <span className="attention-weight">{(att.weight * 100).toFixed(1)}%</span>
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <p style={{ color: '#666666', fontSize: '14px' }}>Click a token to see its attention pattern</p>
                                            )}
                                        </div>

                                        <div className="info-panel">
                                            <div className="info-title">Head {activeHead + 1} Pattern</div>
                                            <p style={{ color: '#888888', fontSize: '13px', lineHeight: '1.6' }}>
                                                {activeHead === 0 && "This head focuses on local, adjacent token relationships."}
                                                {activeHead === 1 && "This head captures semantic relationships: 'brilliant' strongly attends to 'acting', 'good' is modified by 'not'."}
                                                {activeHead === 2 && "This head learns syntactic patterns: determiners attend to nouns, verbs to adjectives."}
                                                {activeHead === 3 && "This head provides global context, attending to sentence boundaries and connectors."}
                                            </p>
                                        </div>

                                        <div className="info-panel">
                                            <div className="info-title">Key Insights</div>
                                            <ul style={{ color: '#888888', fontSize: '13px', lineHeight: '1.8', paddingLeft: '16px' }}>
                                                <li><strong style={{ color: '#2774AE' }}>"brilliant"</strong> attends to <strong style={{ color: '#FFD100' }}>"acting"</strong> (semantic link)</li>
                                                <li><strong style={{ color: '#2774AE' }}>"not"</strong> modifies <strong style={{ color: '#FFD100' }}>"good"</strong> (negation)</li>
                                                <li>Different heads capture different relationships</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    {/* Footer */}
                    <div style={{ textAlign: 'center', marginTop: '40px', paddingTop: '20px' }}>
                        <p style={{ color: '#888', fontSize: '0.75rem' }}>
                            MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
