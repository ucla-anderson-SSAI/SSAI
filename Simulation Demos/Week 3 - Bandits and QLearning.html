        * { margin: 0; padding: 0; box-sizing: border-box; }

        .flash-green { animation: flash 0.3s ease-out; background: rgba(46,125,50,0.15) !important; }
        .gold-line { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: #FFD100; }
    </style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const C = {
    pri: '#2774AE', dk: '#005587', lt: '#8BB8E8', or: '#E8600F', gn: '#2E7D32', pu: '#6A1B9A',
    bg: '#fff', bdr: 'rgba(0,0,0,0.1)', tx: '#1a1a1a', mut: '#666',
    strat: { random:'#999', epsilon_greedy:'#E8600F', ucb:'#2774AE', thompson:'#2E7D32' },
};
const SN = ['random','epsilon_greedy','ucb','thompson'];
const SL = {random:'Random',epsilon_greedy:'ε-Greedy',ucb:'UCB',thompson:'Thompson'};

/* ═══════════ SEEDED RNG ═══════════ */
function makeRng(seed) {
    let s = seed | 0;
    const rng = {
        random() { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; },
        randInt(lo,hi) { return lo+Math.floor(rng.random()*(hi-lo)); },
        normal() { const u=1-rng.random(),v=rng.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); },
        gamma(shape) { if(shape<1)return rng.gamma(shape+1)*Math.pow(rng.random(),1/shape);
            const d=shape-1/3,c=1/Math.sqrt(9*d);
            while(true){let x,v;do{x=rng.normal();v=1+c*x;}while(v<=0);v=v*v*v;const u=rng.random();
            if(u<1-0.0331*(x*x)*(x*x))return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}},
        beta(a,b) { if(a<=0||b<=0)return 0.5; const ga=rng.gamma(a),gb=rng.gamma(b); return ga/(ga+gb); },
    };
    return rng;
}

/* ═══════════ STEP-BY-STEP BANDIT (returns pick function + state) ═══════════ */
function createBanditStepper(method, trueRates, prices, epsilon, ucbC, seed) {
    const k = trueRates.length;
    const rng = makeRng(seed);
    const pulls = Array(k).fill(0), conv = Array(k).fill(0);
    const totRew = Array(k).fill(0), estRev = Array(k).fill(0);
    /* Thompson models revenue directly via a Gaussian posterior on mean revenue per pull.
       Track sum of revenue (sumR) and sum of squared revenue (sumR2) for a running variance.
       Posterior ~ Normal(mean = sumR/n, variance = sampleVar/n), sampled each step. */
    const sumR = Array(k).fill(0), sumR2 = Array(k).fill(0);
    let t = 0, cumRev = 0;

    function step() {
        let arm;
        if (method === 'random') {
            arm = rng.randInt(0, k);
        } else if (method === 'epsilon_greedy') {
            if (t < k) arm = t;
            else if (rng.random() < epsilon) arm = rng.randInt(0, k);
            else { arm = 0; for (let a=1;a<k;a++) if (estRev[a]>estRev[arm]) arm=a; }
        } else if (method === 'ucb') {
            if (t < k) arm = t;
            else { let best=-Infinity; arm=0;
                for (let a=0;a<k;a++){const v=totRew[a]/Math.max(pulls[a],1)+ucbC*Math.sqrt(Math.log(t)/Math.max(pulls[a],1));if(v>best){best=v;arm=a;}} }
        } else { // thompson — Gaussian posterior on mean revenue per pull
            if (t < k) arm = t; /* one pull per arm to seed variance estimate */
            else {
                let best=-Infinity; arm=0;
                for(let a=0;a<k;a++){
                    const n = pulls[a];
                    const mean = sumR[a]/n;
                    /* sample variance with Bessel's correction; floor to avoid collapse */
                    const rawVar = n>1 ? (sumR2[a] - n*mean*mean)/(n-1) : prices[a]*prices[a];
                    const sVar = Math.max(rawVar, 1e-6);
                    /* posterior variance of the mean shrinks as 1/n */
                    const postSd = Math.sqrt(sVar / n);
                    /* sample from Normal(mean, postSd) using Box-Muller */
                    const u1 = Math.max(rng.random(), 1e-12), u2 = rng.random();
                    const z = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
                    const sample = mean + postSd * z;
                    if (sample > best) { best = sample; arm = a; }
                }
            }
        }
        pulls[arm]++;
        const converted = rng.random() < trueRates[arm];
        if (converted) conv[arm]++;
        const rev = converted ? prices[arm] : 0;
        sumR[arm] += rev; sumR2[arm] += rev*rev;
        totRew[arm] += rev; estRev[arm] = totRew[arm]/pulls[arm];
        cumRev += rev; t++;
        return { arm, converted, rev, cumRev, t, pulls: [...pulls], conv: [...conv],
            estRates: conv.map((c2,i)=>c2/Math.max(pulls[i],1)) };
    }
    return { step, getState: () => ({ pulls:[...pulls], conv:[...conv], cumRev, t,
        estRates: conv.map((c2,i)=>c2/Math.max(pulls[i],1)) }) };
}

/* ═══════════ Q-LEARNING ENGINE (Bakery Model) ═══════════ */
/* 2 specialty birthday cakes, 3-day weekend (Fri/Sat/Sun)
   At most 1 customer per day; purchase probability depends on price & day.
   States: (day, inventory) — only 5 reachable decision states.
   Actions: price at $15 or $35. */
const DAYS=["Fri","Sat","Sun"], PRICES=[15,35];
const PROB_BUY={15:[0.4,0.5,0.9], 35:[0.02,0.15,0.8]};
const INV_LABELS=["1 cake","2 cakes"];
const START_INV=2;

/* Reachable states: (Fri,2),(Sat,2),(Sat,1),(Sun,2),(Sun,1) */
const REACHABLE=[{d:0,inv:2},{d:1,inv:2},{d:1,inv:1},{d:2,inv:2},{d:2,inv:1}];

/* Map inventory 1->index 0, 2->index 1 for Q-table */
const invIdx=inv=>inv-1;

function computeDP(){
    const V=Array.from({length:4},()=>new Float64Array(3)); /* V[day][inv] */
    for(let d=2;d>=0;d--)for(let inv=1;inv<=2;inv++){
        let best=-1;
        for(let ai=0;ai<PRICES.length;ai++){
            const price=PRICES[ai],p=PROB_BUY[price][d];
            const ev=p*(price+V[d+1][inv-1])+(1-p)*V[d+1][inv];
            if(ev>best)best=ev;
        }
        V[d][inv]=best;
    }
    return {optimal:+V[0][2].toFixed(2), V};
}

/* ═══════════ SHARED UI ═══════════ */
const Card = ({children,style}) => <div style={{background:C.bg,borderRadius:12,padding:'1rem',border:`1px solid ${C.bdr}`,...style}}>{children}</div>;
const Slider = ({label,value,onChange,min,max,step,disabled,desc}) => (
    <div style={{marginBottom:'1.25rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.5rem'}}>
            <label style={{fontSize:'0.875rem',fontWeight:500}}>{label}</label>
            <span style={{fontSize:'0.875rem',fontWeight:600,background:'rgba(39,116,174,0.2)',padding:'0.125rem 0.5rem',borderRadius:4}}>
                {typeof value==='number'&&value%1!==0?value.toFixed(step<0.1?3:2):value}</span>
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(parseFloat(e.target.value))} disabled={disabled}
            style={{width:'100%',height:6,borderRadius:3,appearance:'none',cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.4:1,
                background:`linear-gradient(to right,${C.pri} 0%,${C.pri} ${((value-min)/(max-min))*100}%,rgba(39,116,174,0.2) ${((value-min)/(max-min))*100}%,rgba(39,116,174,0.2) 100%)`}} />
        {desc&&<p style={{fontSize:'0.7rem',color:C.mut,marginTop:'0.25rem'}}>{desc}</p>}
    </div>);
const RunBtn = ({onClick,running,label}) => (
    <button onClick={onClick} disabled={running} style={{width:'100%',padding:'1rem',borderRadius:10,border:'none',cursor:running?'not-allowed':'pointer',
        fontWeight:600,fontSize:'1rem',background:running?'rgba(39,116,174,0.2)':C.pri,color:running?C.lt:'#fff',
        display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',boxShadow:running?'none':'0 4px 15px rgba(39,116,174,0.3)'}}>
        {running?<><div style={{width:20,height:20,border:'3px solid rgba(39,116,174,0.3)',borderTop:`3px solid ${C.pri}`,borderRadius:'50%'}} className="spin"/>Running...</>:label}
    </button>);
const Header = ({tab,setTab}) => (
    <header style={{background:'#f8fafc',padding:'1rem 2rem 0',position:'sticky',top:0,zIndex:100,borderBottom:'1px solid rgba(0,0,0,0.08)'}}>
        <div style={{maxWidth:1400,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',paddingBottom:'0.75rem'}}>
            <h1 style={{fontSize:'1.4rem',fontWeight:700,color:'#0f172a'}}>Bandits and Q-Learning Demo</h1>
        </div>
        <div style={{maxWidth:1400,margin:'0 auto',display:'flex'}}>
            {[{id:'bandits',l:'Multi-Armed Bandits'},{id:'qlearning',l:'Q-Learning'}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'0.6rem 1.5rem',border:'none',cursor:'pointer',fontSize:'0.85rem',fontWeight:600,
                    background:tab===t.id?'#fff':'transparent',color:tab===t.id?'#0f172a':'#94a3b8',borderRadius:'8px 8px 0 0'}}>{t.l}</button>))}
        </div></header>);

/* ════════════════════════════════════════════════
   BANDITS TAB — Animated, dropdown, persistent chart
   ════════════════════════════════════════════════ */
const BanditsTab = () => {
    const [nArr, setNArr] = useState(1000);
    const [eps, setEps] = useState(0.3);
    const ucbC = 2.0;
    const [seed, setSeed] = useState(42);
    const [r0, setR0] = useState(0.090);
    const [r1, setR1] = useState(0.075);
    const [r2, setR2] = useState(0.025);
    const [r3, setR3] = useState(0.010);
    const [method, setMethod] = useState('thompson');
    const [running, setRunning] = useState(false);
    const [speed, setSpeed] = useState(10);
    const pr = [29.99, 39.99, 49.99, 59.99];

    // Live state
    const [liveStep, setLiveStep] = useState(null); // {arm, converted, rev, cumRev, t, pulls, conv, estRates}
    const [progress, setProgress] = useState(0);

    // Persistent chart data: { [method]: { x:[], y:[], total, pulls, conv, estRates } }
    const [chartData, setChartData] = useState({});
    const cancelRef = useRef(false);

    const run = useCallback(() => {
        cancelRef.current = false;
        setRunning(true); setProgress(0); setLiveStep(null);
        const tr = [r0,r1,r2,r3];
        const stepper = createBanditStepper(method, tr, pr, eps, ucbC, seed);
        const cumX = [], cumY = [];
        const batchSize = Math.max(1, Math.floor(nArr / 1000)); // steps per frame
        const targetMs = 200000 / speed; // 1x=200s, 5x=40s, 10x=20s
        const interval = targetMs / (nArr / batchSize);
        let done = 0;

        function tick() {
            if (cancelRef.current) { setRunning(false); return; }
            for (let i = 0; i < batchSize && done < nArr; i++) {
                const res = stepper.step();
                done++;
                if (done % Math.max(1, Math.floor(nArr / 200)) === 0 || done === nArr) {
                    cumX.push(done); cumY.push(Math.round(res.cumRev * 100) / 100);
                }
                if (done === nArr || done % batchSize === 0) {
                    setLiveStep(res);
                    setProgress(done / nArr);
                }
            }
            // Update chart data progressively
            const finalState = stepper.getState();
            setChartData(prev => ({
                ...prev,
                [method]: { x: [...cumX], y: [...cumY], total: Math.round(finalState.cumRev*100)/100,
                    pulls: finalState.pulls, conv: finalState.conv, estRates: finalState.estRates }
            }));
            if (done < nArr) {
                setTimeout(tick, interval);
            } else {
                setRunning(false);
            }
        }
        tick();
    }, [nArr, eps, ucbC, seed, r0, r1, r2, r3, method, speed]);

    const stop = () => { cancelRef.current = true; };

    const tr = [r0,r1,r2,r3];
    const expR = pr.map((p,i)=>p*tr[i]);
    const bestA = expR.indexOf(Math.max(...expR));

    return (
        <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:'1.25rem',padding:'1.25rem',maxWidth:1450,margin:'0 auto'}}>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                <Card>
                    <h2 style={{fontSize:'1.1rem',fontWeight:600,marginBottom:'1rem'}}>Strategy</h2>
                    <select value={method} onChange={e=>setMethod(e.target.value)} disabled={running}
                        style={{width:'100%',padding:'0.75rem',borderRadius:8,border:`1px solid ${C.bdr}`,fontSize:'0.9rem',fontWeight:600,
                            color:C.strat[method],background:C.bg,cursor:'pointer',marginBottom:'1rem',appearance:'auto'}}>
                        {SN.map(s=><option key={s} value={s}>{SL[s]}</option>)}
                    </select>
                    <Slider label="Arrivals" value={nArr} onChange={setNArr} min={100} max={5000} step={100} disabled={running}/>
                    <Slider label="ε (epsilon-greedy)" value={eps} onChange={setEps} min={0.01} max={0.5} step={0.01} disabled={running || (method!=='epsilon_greedy')}/>
                    <div style={{marginBottom:'0.5rem'}}>
                        <label style={{fontSize:'0.875rem',fontWeight:500,display:'block',marginBottom:'0.5rem'}}>Speed</label>
                        <div style={{display:'flex',gap:'0.5rem'}}>
                            {[1,5,10].map(s=><button key={s} onClick={()=>setSpeed(s)} disabled={running}
                                style={{flex:1,padding:'0.4rem',borderRadius:6,border:'none',cursor:running?'not-allowed':'pointer',
                                    fontSize:'0.8rem',fontWeight:600,
                                    background:speed===s?C.pri:'rgba(39,116,174,0.1)',
                                    color:speed===s?'#fff':C.tx,opacity:running?0.4:1}}>{s}×</button>)}
                        </div>
                    </div>
                </Card>
                {running ?
                    <button onClick={stop} style={{width:'100%',padding:'1rem',borderRadius:10,border:'none',cursor:'pointer',fontWeight:600,fontSize:'1rem',background:'#C62828',color:'#fff'}}>
                        Stop</button> :
                    <RunBtn onClick={run} running={false} label={`Run ${SL[method]}`}/>}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                {/* Live price tiles */}
                <LiveTiles prices={pr} liveStep={liveStep} progress={progress} running={running} method={method} nArr={nArr}/>
                {/* Summary row */}
                <BanditSummary chartData={chartData} bestA={bestA} pr={pr} tr={tr} expR={expR}/>
                {/* Cumulative chart */}
                <BanditChart chartData={chartData} nArr={nArr}/>
                {/* Bottom row */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
                    <BanditPulls chartData={chartData} pr={pr}/>
                    <BanditRates chartData={chartData} pr={pr} tr={tr} expR={expR} bestA={bestA}/>
                </div>
            </div>
        </div>
    );
};

/* ──── Live Price Tiles ──── */
const LiveTiles = ({prices, liveStep, progress, running, method, nArr}) => {
    const armColors = ['#8BB8E8','#2774AE','#005587','#1a1a1a'];
    const [flashArm, setFlashArm] = useState(-1);
    const prevStep = useRef(null);

    useEffect(() => {
        if (liveStep && liveStep !== prevStep.current) {
            setFlashArm(liveStep.arm);
            prevStep.current = liveStep;
            const id = setTimeout(() => setFlashArm(-1), 200);
            return () => clearTimeout(id);
        }
    }, [liveStep]);

    return (
        <Card>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.75rem'}}>
                <div>
                    <h3 style={{fontSize:'1rem',fontWeight:600}}>Live Simulation {running && <span style={{fontSize:'0.8rem',color:C.or}}>● RUNNING</span>}</h3>
                    <p style={{fontSize:'0.75rem',color:C.mut}}>
                        {running ? `${SL[method]} — Customer ${liveStep?.t || 0} of ${nArr}` :
                            liveStep ? `${SL[method]} — Complete (${nArr} customers)` : '\u00A0'}
                    </p>
                </div>
                {liveStep && <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'0.7rem',color:C.mut}}>Cumulative Revenue</div>
                    <div style={{fontSize:'1.4rem',fontWeight:700,color:C.gn}}>${liveStep.cumRev.toFixed(2)}</div>
                </div>}
            </div>
            {/* Progress bar */}
            <div style={{height:4,background:'rgba(39,116,174,0.1)',borderRadius:2,marginBottom:'1rem',overflow:'hidden'}}>
                <div style={{height:'100%',width:`${progress*100}%`,background:C.strat[method],borderRadius:2,transition:'width 0.1s'}}/>
            </div>
            {/* Price tiles */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'0.75rem'}}>
                {prices.map((p,i) => {
                    const isChosen = flashArm === i;
                    const converted = isChosen && liveStep?.converted;
                    const pulls = liveStep?.pulls?.[i] || 0;
                    const conversions = liveStep?.conv?.[i] || 0;
                    const total = liveStep?.t || 0;
                    const pct = total > 0 ? ((pulls/total)*100).toFixed(0) : 0;
                    return (
                        <div key={i} style={{
                            padding:'1rem', borderRadius:10, textAlign:'center',
                            border: isChosen ? `3px solid ${converted?C.gn:C.or}` : `1px solid ${C.bdr}`,
                            background: isChosen ? (converted ? 'rgba(46,125,50,0.08)' : 'rgba(232,96,15,0.06)') : C.bg,
                            transform: isChosen ? 'scale(1.03)' : 'scale(1)',
                            transition: 'all 0.15s ease',
                        }}>
                            <div style={{fontSize:'1.5rem',fontWeight:700,color:armColors[i],marginBottom:'0.25rem'}}>${p}</div>
                            <div style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.5rem'}}>
                                {isChosen ? (converted ? '✓ Converted!' : '✗ No sale') : '\u00A0'}
                            </div>
                            <div style={{fontSize:'0.75rem',textAlign:'center'}}>
                                <span style={{color:C.mut}}>Conversion rate: </span>
                                <span style={{fontWeight:600,color:C.gn}}>{conversions}/{pulls}</span>
                            </div>
                        </div>
                    );
                })}
            </div>
        </Card>
    );
};

/* ──── Summary ──── */
const BanditSummary = ({chartData, bestA, pr, tr, expR}) => {
    const items = SN.map(s => ({
        l: SL[s], v: chartData[s] ? `$${chartData[s].total.toLocaleString()}` : '---', c: C.strat[s]
    }));
    return <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'0.75rem'}}>
        {items.map((it,i)=><Card key={i} style={{textAlign:'center',padding:'0.75rem'}}>
            <div style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.25rem'}}>{it.l}</div>
            <div style={{fontSize:'0.95rem',fontWeight:600,color:it.c}}>{it.v}</div>
        </Card>)}
    </div>;
};

/* ──── Cumulative Revenue Chart (persistent lines, no flicker) ──── */
const BanditChart = ({chartData, nArr}) => {
    const ref = useRef(null), ch = useRef(null);

    // Create chart once on mount
    useEffect(() => {
        if (!ref.current) return;
        const datasets = SN.map(s => ({
            label: SL[s], data: [],
            borderColor: C.strat[s], borderWidth: 2.5, pointRadius: 0, tension: 0.3, fill: false, hidden: false,
        }));

        ch.current = new Chart(ref.current.getContext('2d'),{type:'line',data:{datasets},options:{
            responsive:true,maintainAspectRatio:false,animation:false,
            plugins:{legend:{labels:{color:C.tx,font:{size:11,weight:'500'},usePointStyle:true,padding:15}},tooltip:{mode:'index',intersect:false}},
            scales:{x:{type:'linear',min:0,max:nArr,title:{display:true,text:'Customer',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut}},
                y:{min:0,title:{display:true,text:'Cumulative Revenue ($)',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut,callback:v=>`$${v.toLocaleString()}`}}}}});
        return () => { if (ch.current) { ch.current.destroy(); ch.current = null; } };
    }, []); // only on mount

    // Update data in-place when chartData/nArr changes
    useEffect(() => {
        if (!ch.current) return;
        const chart = ch.current;
        SN.forEach((s, i) => {
            if (chartData[s]) {
                chart.data.datasets[i].data = chartData[s].x.map((x, j) => ({x, y: chartData[s].y[j]}));
            } else {
                chart.data.datasets[i].data = [];
            }
        });
        chart.options.scales.x.max = nArr;
        chart.update('none');
    }, [chartData, nArr]);

    return <Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.5rem'}}>Cumulative Revenue</h3>
        <div style={{height:300}}><canvas ref={ref}/></div>
    </Card>;
};

/* ──── Pulls Distribution ──── */
const BanditPulls = ({chartData, pr}) => {
    const hasData = SN.some(s => chartData[s]);
    if (!hasData) return <Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:250}}><p style={{color:C.mut}}>Run a strategy to see results</p></Card>;
    const ac = ['#8BB8E8','#2774AE','#005587','#1a1a1a'];
    return <Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.75rem'}}>Arm Selection Distribution</h3>
        {SN.filter(s=>chartData[s]).map(s=>{const d=chartData[s],n=d.pulls.reduce((a,b)=>a+b,0);return <div key={s} style={{marginBottom:'0.75rem'}}>
            <div style={{fontSize:'0.8rem',fontWeight:600,color:C.strat[s],marginBottom:'0.25rem'}}>{SL[s]} — ${d.total.toLocaleString()}</div>
            <div style={{display:'flex',height:22,borderRadius:4,overflow:'hidden'}}>
                {d.pulls.map((cnt,i)=>{const pct=(cnt/n)*100;return pct>0?
                    <div key={i} style={{width:`${pct}%`,background:ac[i],display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:'0.65rem',color:i<2?'#1a1a1a':'#fff',fontWeight:500}}>{pct>8?`$${pr[i]} (${Math.round(pct)}%)`:''}</div>:null;})}
            </div></div>;})}
        <div style={{display:'flex',gap:'1rem',marginTop:'0.5rem',justifyContent:'center'}}>
            {pr.map((p,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:'0.25rem'}}>
                <div style={{width:10,height:10,borderRadius:2,background:ac[i]}}/><span style={{fontSize:'0.7rem',color:C.mut}}>${p}</span></div>)}
        </div>
    </Card>;
};

/* ──── Rates Table ──── */
const BanditRates = ({chartData, pr, tr, expR, bestA}) => {
    const ran = SN.filter(s=>chartData[s]);
    if (!ran.length) return <Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:250}}><p style={{color:C.mut}}>Waiting...</p></Card>;
    return <Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.75rem'}}>Estimated vs True Rates</h3>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}>
            <thead><tr style={{borderBottom:`2px solid ${C.bdr}`}}>
                <th style={{padding:'0.4rem',textAlign:'left',color:C.mut}}>Price</th>
                <th style={{padding:'0.4rem',textAlign:'center',color:C.mut}}>True</th>
                <th style={{padding:'0.4rem',textAlign:'center',color:C.mut}}>Exp Rev</th>
                {ran.map(s=><th key={s} style={{padding:'0.4rem',textAlign:'center',color:C.strat[s],fontWeight:600}}>{SL[s]}</th>)}
            </tr></thead>
            <tbody>{pr.map((p,i)=><tr key={i} style={{borderBottom:`1px solid ${C.bdr}`,background:i===bestA?'rgba(46,125,50,0.06)':'transparent'}}>
                <td style={{padding:'0.4rem',fontWeight:600}}>${p}{i===bestA&&<span style={{fontSize:'0.65rem',color:C.gn}}> ★</span>}</td>
                <td style={{padding:'0.4rem',textAlign:'center'}}>{(tr[i]*100).toFixed(1)}%</td>
                <td style={{padding:'0.4rem',textAlign:'center',fontWeight:500}}>${expR[i].toFixed(2)}</td>
                {ran.map(s=><td key={s} style={{padding:'0.4rem',textAlign:'center'}}>{(chartData[s].estRates[i]*100).toFixed(1)}%</td>)}
            </tr>)}</tbody>
        </table>
    </Card>;
};

/* ════════════════════════════════
   Q-LEARNING TAB (unchanged)
   ════════════════════════════════ */
const QLTab = () => {
    const [nEp,setNEp]=useState(1000);const [alpha,setAlpha]=useState(0.2);const [gamma,setGamma]=useState(0.9);
    const [epsQ,setEpsQ]=useState(0.1);const seed=42;
    const [running,setRunning]=useState(false);const [res,setRes]=useState(null);const [snapIdx,setSnapIdx]=useState(null);
    const [progress,setProgress]=useState(0);const [speed,setSpeed]=useState(10);const cancelRef=useRef(false);

    const run=useCallback(()=>{
        cancelRef.current=false;setRunning(true);setProgress(0);setRes(null);setSnapIdx(null);
        const rng=makeRng(seed);
        const nDays=DAYS.length,nInv=INV_LABELS.length,nAct=PRICES.length;
        /* Q[day][invIdx][action] — invIdx: 0=1cake, 1=2cakes */
        const Q=Array.from({length:nDays},()=>Array.from({length:nInv},()=>new Float64Array(nAct)));
        const epRevs=[],snaps=[];
        const snapAt=[1,2,5,10,25,50,100,200,500,1000,2000,5000].filter(e=>e<=nEp);
        let done=0;const dpRes=computeDP();
        const batchSize=Math.max(1,Math.floor(nEp/1000));
        const targetMs=200000/speed;const interval=targetMs/(nEp/batchSize);

        function tick(){
            if(cancelRef.current){setRunning(false);return;}
            for(let b=0;b<batchSize&&done<nEp;b++){
                let inv=START_INV,totRev=0;
                /* Decaying epsilon: high exploration early, low late */
                const curEps=Math.max(0.05, epsQ*(1 - done/(nEp*0.8)));
                for(let d=0;d<nDays;d++){
                    if(inv===0)break;
                    const si=invIdx(inv);let act;
                    if(rng.random()<curEps)act=rng.randInt(0,nAct);
                    else{act=0;for(let a=1;a<nAct;a++)if(Q[d][si][a]>Q[d][si][act])act=a;}
                    const price=PRICES[act];
                    const prob=PROB_BUY[price][d];
                    const sold=rng.random()<prob?1:0;
                    const rev=sold*price;
                    const nextInv=inv-sold;
                    totRev+=rev;
                    let maxNextQ=0;
                    if(d<nDays-1&&nextInv>0){
                        const nsi=invIdx(nextInv);
                        for(let a=0;a<nAct;a++)maxNextQ=Math.max(maxNextQ,Q[d+1][nsi][a]);
                    }
                    const target=rev+gamma*maxNextQ;
                    Q[d][si][act]+=alpha*(target-Q[d][si][act]);
                    inv=nextInv;
                }
                epRevs.push(totRev);done++;
                if(snapAt.includes(done)){
                    const pol={},qv={};
                    for(const st of REACHABLE){
                        const k=`${DAYS[st.d]}_${INV_LABELS[invIdx(st.inv)]}`;
                        const si=invIdx(st.inv);let ba=0;
                        for(let a=1;a<nAct;a++)if(Q[st.d][si][a]>Q[st.d][si][ba])ba=a;
                        pol[k]=PRICES[ba];qv[k]=PRICES.map((_,a)=>+Q[st.d][si][a].toFixed(2));
                    }
                    snaps.push({episode:done,policy:pol,qValues:qv,revenue:totRev});
                }
            }
            setProgress(done/nEp);
            /* Rolling avg: true 100-episode window, no downsampling */
            const win=100;
            const roll=epRevs.map((_,i)=>{const w=Math.min(win,i+1);let sm=0;for(let j=i-w+1;j<=i;j++)sm+=epRevs[j];return sm/w;});
            /* Episode revenue: downsample if needed */
            const dsBucket=(arr,mx)=>{if(arr.length<=mx)return{x:arr.map((_2,i)=>i),y:arr};const step=Math.ceil(arr.length/mx);const x=[],y=[];for(let i=0;i<arr.length;i+=step){let sm=0,n=0;for(let j=i;j<Math.min(i+step,arr.length);j++){sm+=arr[j];n++;}x.push(i+Math.floor(step/2));y.push(+(sm/n).toFixed(2));}return{x,y};};
            const d1=dsBucket(epRevs,500);
            /* Rolling avg: no downsampling — send every point */
            const rollX=roll.map((_,i)=>i);
            const rollY=roll.map(v=>+v.toFixed(2));
            const last100=epRevs.slice(-100);const avg100=last100.length?+(last100.reduce((a2,b2)=>a2+b2,0)/last100.length).toFixed(2):0;
            setRes({revsX:d1.x,revs:d1.y,rollX,roll:rollY,snaps:[...snaps],dp:dpRes.optimal,avg50:avg100,done});
            if(snaps.length>0)setSnapIdx(snaps.length-1);
            if(done<nEp)setTimeout(tick,interval);else setRunning(false);
        }
        tick();
    },[nEp,alpha,gamma,epsQ,speed]);

    const stop=()=>{cancelRef.current=true;};

    return (
        <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:'1.25rem',padding:'1.25rem',maxWidth:1450,margin:'0 auto'}}>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                <Card><h2 style={{fontSize:'1.1rem',fontWeight:600,marginBottom:'1rem'}}>Q-Learning Parameters</h2>
                    <Slider label="Episodes" value={nEp} onChange={setNEp} min={100} max={5000} step={100} disabled={running}/>
                    <Slider label="α (learning rate)" value={alpha} onChange={setAlpha} min={0.01} max={0.5} step={0.01} disabled={running}/>
                    <Slider label="γ (discount)" value={gamma} onChange={setGamma} min={0.5} max={1.0} step={0.05} disabled={running}/>
                    <Slider label="ε (exploration)" value={epsQ} onChange={setEpsQ} min={0.01} max={1.0} step={0.01} disabled={running}/>
                    <div style={{marginBottom:'0.5rem'}}>
                        <label style={{fontSize:'0.875rem',fontWeight:500,display:'block',marginBottom:'0.5rem'}}>Speed</label>
                        <div style={{display:'flex',gap:'0.5rem'}}>
                            {[1,5,10].map(s=><button key={s} onClick={()=>setSpeed(s)} disabled={running}
                                style={{flex:1,padding:'0.4rem',borderRadius:6,border:'none',cursor:running?'not-allowed':'pointer',
                                    fontSize:'0.8rem',fontWeight:600,
                                    background:speed===s?C.pri:'rgba(39,116,174,0.1)',
                                    color:speed===s?'#fff':C.tx,opacity:running?0.4:1}}>{s}×</button>)}
                        </div>
                    </div>
                    </Card>
                {running ?
                    <button onClick={stop} style={{width:'100%',padding:'1rem',borderRadius:10,border:'none',cursor:'pointer',fontWeight:600,fontSize:'1rem',background:'#C62828',color:'#fff'}}>
                        Stop</button> :
                    <RunBtn onClick={run} running={false} label="Train Q-Learning"/>}
                <Card><h3 style={{fontSize:'0.95rem',fontWeight:600,marginBottom:'0.5rem'}}>Purchase Probabilities</h3>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.75rem'}}>
                        <thead><tr style={{borderBottom:`2px solid ${C.bdr}`}}>
                            <th style={{padding:'0.3rem',textAlign:'left',color:C.mut}}>Day</th>
                            {PRICES.map(p=><th key={p} style={{padding:'0.3rem',textAlign:'center',color:C.pri,fontWeight:600}}>${p}</th>)}</tr></thead>
                        <tbody>{DAYS.map((d,i)=><tr key={d} style={{borderBottom:`1px solid ${C.bdr}`}}>
                            <td style={{padding:'0.3rem',fontWeight:500}}>{d}</td>
                            {PRICES.map(p=><td key={p} style={{padding:'0.3rem',textAlign:'center'}}>{PROB_BUY[p][i]}</td>)}</tr>)}</tbody></table>
                    </Card>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                {/* Progress bar */}
                <Card>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.5rem'}}>
                        <h3 style={{fontSize:'1rem',fontWeight:600}}>Training {running && <span style={{fontSize:'0.8rem',color:C.or}}>● RUNNING</span>}</h3>
                        {res && <div style={{textAlign:'right'}}>
                            <div style={{fontSize:'0.7rem',color:C.mut}}>Episode</div>
                            <div style={{fontSize:'1.2rem',fontWeight:700,color:C.pri}}>{res.done || 0} / {nEp}</div>
                        </div>}
                    </div>
                    <div style={{height:4,background:'rgba(39,116,174,0.1)',borderRadius:2,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${progress*100}%`,background:C.pri,borderRadius:2,transition:'width 0.1s'}}/>
                    </div>
                </Card>
                <QSummary res={res}/><QChart res={res} nEp={nEp}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}><QPolicy res={res} snapIdx={snapIdx} setSnapIdx={setSnapIdx}/><QTable res={res} snapIdx={snapIdx}/></div>
            </div>
        </div>);
};
const QSummary=({res})=>{const items=res?[{l:'Optimal',v:`$${res.dp}`},{l:'Avg Last 100',v:`$${res.avg50}`}]:[{l:'Optimal',v:'---'},{l:'Avg Last 100',v:'---'}];return<div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'0.75rem'}}>{items.map((it,i)=><Card key={i} style={{textAlign:'center',padding:'0.75rem'}}><div style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.25rem'}}>{it.l}</div><div style={{fontSize:'1rem',fontWeight:600}}>{it.v}</div></Card>)}</div>;};
const QChart=({res,nEp})=>{const ref=useRef(null),ch=useRef(null);
    useEffect(()=>{if(!ref.current)return;
        const datasets=[
            {label:'Episode Revenue',data:[],borderColor:'rgba(39,116,174,0.25)',backgroundColor:'rgba(39,116,174,0.08)',borderWidth:1,pointRadius:0,fill:true},
            {label:'Rolling Avg',data:[],borderColor:C.or,borderWidth:2.5,pointRadius:0,tension:0.3,fill:false},
            {label:'Optimal',data:[],borderColor:C.gn,borderWidth:2,borderDash:[8,4],pointRadius:0,fill:false}];
        ch.current=new Chart(ref.current.getContext('2d'),{type:'line',data:{datasets},options:{
            responsive:true,maintainAspectRatio:false,animation:false,
            plugins:{legend:{labels:{color:C.tx,font:{size:11,weight:'500'},usePointStyle:true,padding:15}}},
            scales:{x:{type:'linear',min:0,max:nEp||500,title:{display:true,text:'Episode',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut}},
                y:{min:0,max:50,title:{display:true,text:'Revenue ($)',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut,callback:v=>`$${v}`}}}}});
        return()=>{if(ch.current){ch.current.destroy();ch.current=null;}};},[]); 
    useEffect(()=>{if(!ch.current)return;const chart=ch.current;
        if(res){chart.data.datasets[0].data=res.revsX.map((x,i)=>({x,y:res.revs[i]}));
            chart.data.datasets[1].data=res.rollX.map((x,i)=>({x,y:res.roll[i]}));
            const mx=res.revsX.length?Math.max(...res.revsX):nEp;
            chart.data.datasets[2].data=[{x:0,y:res.dp},{x:mx,y:res.dp}];
        }else{chart.data.datasets[0].data=[];chart.data.datasets[1].data=[];chart.data.datasets[2].data=[];}
        chart.options.scales.x.max=nEp;chart.update('none');},[res,nEp]);
    return<Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.5rem'}}>Revenue per Episode</h3><div style={{height:280}}><canvas ref={ref}/></div></Card>;};
const QPolicy=({res,snapIdx,setSnapIdx})=>{if(!res)return<Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:200}}><p style={{color:C.mut}}>Waiting...</p></Card>;const snap=res.snaps[snapIdx]||res.snaps[res.snaps.length-1];const pc={15:'#8BB8E8',35:'#005587'};return<Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.5rem'}}>Learned Policy</h3><div style={{display:'flex',gap:'0.3rem',marginBottom:'0.75rem',flexWrap:'wrap'}}>{res.snaps.map((s,i)=><button key={i} onClick={()=>setSnapIdx(i)} style={{padding:'0.25rem 0.5rem',borderRadius:4,border:'none',cursor:'pointer',fontSize:'0.7rem',fontWeight:500,background:snapIdx===i?C.pri:'rgba(39,116,174,0.1)',color:snapIdx===i?'#fff':C.tx}}>Ep {s.episode}</button>)}</div><table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.75rem'}}><thead><tr><th style={{padding:'0.3rem',textAlign:'left',color:C.mut,fontSize:'0.7rem'}}>Day\Inv</th>{INV_LABELS.map(l=><th key={l} style={{padding:'0.3rem',textAlign:'center',color:C.mut,fontSize:'0.65rem'}}>{l}</th>)}</tr></thead><tbody>{DAYS.map((d,di)=><tr key={d}><td style={{padding:'0.3rem',fontWeight:600,fontSize:'0.75rem'}}>{d}</td>{INV_LABELS.map((iv,ii)=>{const k=`${d}_${iv}`;const isReachable=REACHABLE.some(st=>st.d===di&&invIdx(st.inv)===ii);const p=snap.policy[k];if(!isReachable)return<td key={iv} style={{padding:'0.3rem',textAlign:'center',color:'#ccc',fontSize:'0.7rem'}}>—</td>;return<td key={iv} style={{padding:'0.3rem',textAlign:'center',fontWeight:700,background:pc[p]||'#eee',color:p===35?'#fff':'#1a1a1a',borderRadius:3,fontSize:'0.8rem'}}>${p}</td>;})}</tr>)}</tbody></table><div style={{display:'flex',gap:'1rem',marginTop:'0.5rem',justifyContent:'center'}}>{PRICES.map(p=><div key={p} style={{display:'flex',alignItems:'center',gap:'0.25rem'}}><div style={{width:12,height:12,borderRadius:2,background:pc[p]}}/><span style={{fontSize:'0.7rem',color:C.mut}}>${p}</span></div>)}</div></Card>;};
const QTable=({res,snapIdx})=>{if(!res)return<Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:200}}><p style={{color:C.mut}}>Waiting...</p></Card>;const snap=res.snaps[snapIdx]||res.snaps[res.snaps.length-1];return<Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.5rem'}}>Q-Values (reachable states)</h3><table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}><thead><tr style={{borderBottom:`2px solid ${C.bdr}`}}><th style={{padding:'0.4rem',textAlign:'left',color:C.mut}}>State</th>{PRICES.map(p=><th key={p} style={{padding:'0.4rem',textAlign:'center',color:C.pri,fontWeight:600}}>Q(·,${p})</th>)}<th style={{padding:'0.4rem',textAlign:'center',color:C.gn,fontWeight:600}}>Best</th></tr></thead><tbody>{REACHABLE.map(st=>{const k=`${DAYS[st.d]}_${INV_LABELS[invIdx(st.inv)]}`;const qv=snap.qValues[k]||PRICES.map(()=>0);const mx=Math.max(...qv);const bi=qv.indexOf(mx);return<tr key={k} style={{borderBottom:`1px solid ${C.bdr}`}}><td style={{padding:'0.4rem',fontWeight:600}}>{DAYS[st.d]}, {st.inv} {st.inv===1?'cake':'cakes'}</td>{qv.map((v,i)=><td key={i} style={{padding:'0.4rem',textAlign:'center',fontWeight:v===mx&&mx>0?700:400,color:v===mx&&mx>0?C.gn:C.tx,background:v===mx&&mx>0?'rgba(46,125,50,0.08)':'transparent'}}>{v.toFixed(1)}</td>)}<td style={{padding:'0.4rem',textAlign:'center',fontWeight:700,color:C.gn}}>${PRICES[bi]}</td></tr>;})}</tbody></table></Card>;};

/* ════════════ APP ════════════ */
const App = () => {
    const [tab, setTab] = useState('bandits');
    return <div style={{minHeight:'100vh',paddingBottom:'2rem'}}>
        <Header tab={tab} setTab={setTab}/>
        <main className="fade-in" key={tab}>{tab==='bandits'?<BanditsTab/>:<QLTab/>}</main>
    </div>;
};
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
