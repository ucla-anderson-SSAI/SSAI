<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const C = {
    pri: '#2774AE', dk: '#005587', lt: '#8BB8E8', or: '#E8600F', gn: '#2E7D32', pu: '#6A1B9A',
    bg: '#fff', bdr: 'rgba(0,0,0,0.1)', tx: '#1a1a1a', mut: '#666',
    strat: { random:'#999', epsilon_greedy:'#E8600F', ucb:'#2774AE', thompson:'#2E7D32' },
};
const SN = ['random','epsilon_greedy','ucb','thompson'];
const SL = {random:'Random',epsilon_greedy:'ε-Greedy',ucb:'UCB',thompson:'Thompson'};

/* ═══════════ SEEDED RNG ═══════════ */
function makeRng(seed) {
    let s = seed | 0;
    const rng = {
        random() { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; },
        randInt(lo,hi) { return lo+Math.floor(rng.random()*(hi-lo)); },
        normal() { const u=1-rng.random(),v=rng.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); },
        gamma(shape) { if(shape<1)return rng.gamma(shape+1)*Math.pow(rng.random(),1/shape);
            const d=shape-1/3,c=1/Math.sqrt(9*d);
            while(true){let x,v;do{x=rng.normal();v=1+c*x;}while(v<=0);v=v*v*v;const u=rng.random();
            if(u<1-0.0331*(x*x)*(x*x))return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}},
        beta(a,b) { if(a<=0||b<=0)return 0.5; const ga=rng.gamma(a),gb=rng.gamma(b); return ga/(ga+gb); },
    };
    return rng;
}

/* ═══════════ STEP-BY-STEP BANDIT (returns pick function + state) ═══════════ */
function createBanditStepper(method, trueRates, prices, epsilon, ucbC, seed) {
    const k = trueRates.length;
    const rng = makeRng(seed);
    const pulls = Array(k).fill(0), conv = Array(k).fill(0);
    const totRew = Array(k).fill(0), estRev = Array(k).fill(0);
    const als = Array(k).fill(1), bts = Array(k).fill(1);
    let t = 0, cumRev = 0;

    function step() {
        let arm;
        if (method === 'random') {
            arm = rng.randInt(0, k);
        } else if (method === 'epsilon_greedy') {
            if (t < k) arm = t;
            else if (rng.random() < epsilon) arm = rng.randInt(0, k);
            else { arm = 0; for (let a=1;a<k;a++) if (estRev[a]>estRev[arm]) arm=a; }
        } else if (method === 'ucb') {
            if (t < k) arm = t;
            else { let best=-Infinity; arm=0;
                for (let a=0;a<k;a++){const v=totRew[a]/Math.max(pulls[a],1)+ucbC*Math.sqrt(Math.log(t)/Math.max(pulls[a],1));if(v>best){best=v;arm=a;}} }
        } else { // thompson
            let best=-Infinity; arm=0;
            for(let a=0;a<k;a++){const v=rng.beta(als[a],bts[a])*prices[a];if(v>best){best=v;arm=a;}}
        }
        pulls[arm]++;
        const converted = rng.random() < trueRates[arm];
        if (converted) { conv[arm]++; if(method==='thompson') als[arm]++; }
        else { if(method==='thompson') bts[arm]++; }
        const rev = converted ? prices[arm] : 0;
        totRew[arm] += rev; estRev[arm] = totRew[arm]/pulls[arm];
        cumRev += rev; t++;
        return { arm, converted, rev, cumRev, t, pulls: [...pulls], conv: [...conv],
            estRates: conv.map((c2,i)=>c2/Math.max(pulls[i],1)) };
    }
    return { step, getState: () => ({ pulls:[...pulls], conv:[...conv], cumRev, t,
        estRates: conv.map((c2,i)=>c2/Math.max(pulls[i],1)) }) };
}

/* ═══════════ Q-LEARNING ENGINE (unchanged) ═══════════ */
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], PRICES=[1,2,3];
const DEMAND={1:[10,12,15,18,30,45,60],2:[4,5,7,9,15,22,28],3:[2,3,4,5,8,12,15]};
const INV_BINS=[25,50,75], INV_LABELS=["Low (0-25)","Med (26-50)","High (51-75)","VHigh (76+)"];
const getInvBin=inv=>{for(let i=0;i<INV_BINS.length;i++)if(inv<=INV_BINS[i])return i;return INV_BINS.length;};

function computeDP(startInv){const V=Array.from({length:8},()=>new Float64Array(startInv+1));for(let d=6;d>=0;d--)for(let inv=0;inv<=startInv;inv++){let best=0;for(const p of PRICES){const sold=Math.min(DEMAND[p][d],inv),rev=sold*p,fut=d<6?V[d+1][inv-sold]:0;best=Math.max(best,rev+fut);}V[d][inv]=best;}return V[0][startInv];}

function runQL(p){const rng=makeRng(p.seed);const Q=Array.from({length:7},()=>Array.from({length:4},()=>new Float64Array(3)));const epRevs=[],snaps=[];const snapAt=[1,2,3,5,10,25,50,100,200,500,1000,2000].filter(e=>e<=p.nEpisodes);let eps=p.epsilon;for(let ep=0;ep<p.nEpisodes;ep++){let inv=p.inventory,totRev=0;for(let d=0;d<7;d++){const si=getInvBin(inv);let act;if(rng.random()<eps)act=rng.randInt(0,3);else{act=0;for(let a=1;a<3;a++)if(Q[d][si][a]>Q[d][si][act])act=a;}const price=PRICES[act],base=DEMAND[price][d];const noisy=Math.max(0,Math.round(base*(1+(rng.random()-0.5)*0.4)));const sold=Math.min(noisy,inv),rev=sold*price;inv-=sold;totRev+=rev;let target;if(d<6){const nsi=getInvBin(inv);let bst=Q[d+1][nsi][0];for(let a=1;a<3;a++)bst=Math.max(bst,Q[d+1][nsi][a]);target=rev+p.gamma*bst;}else target=rev;Q[d][si][act]+=p.alpha*(target-Q[d][si][act]);}epRevs.push(totRev);eps*=p.epsilonDecay;if(snapAt.includes(ep+1)){const pol={},qv={};for(let d=0;d<7;d++)for(let ib=0;ib<4;ib++){const k=`${DAYS[d]}_${INV_LABELS[ib]}`;let ba=0;for(let a=1;a<3;a++)if(Q[d][ib][a]>Q[d][ib][ba])ba=a;pol[k]=PRICES[ba];qv[k]=[+Q[d][ib][0].toFixed(2),+Q[d][ib][1].toFixed(2),+Q[d][ib][2].toFixed(2)];}snaps.push({episode:ep+1,policy:pol,qValues:qv,revenue:totRev});}}const win=Math.max(1,Math.floor(p.nEpisodes/20));const roll=epRevs.map((_,i)=>{const s=Math.max(0,i-win+1);let sm=0;for(let j=s;j<=i;j++)sm+=epRevs[j];return+(sm/(i-s+1)).toFixed(2);});const ds=(arr,mx)=>{if(arr.length<=mx)return{x:arr.map((_,i)=>i),y:arr};const step=Math.ceil(arr.length/mx);const x=[],y=[];for(let i=0;i<arr.length;i+=step){x.push(i);y.push(arr[i]);}return{x,y};};const d1=ds(epRevs,300),d2=ds(roll,300);const last50=epRevs.slice(-50);return{revsX:d1.x,revs:d1.y,rollX:d2.x,roll:d2.y,snaps,dp:computeDP(p.inventory),avg50:+(last50.reduce((a,b)=>a+b,0)/last50.length).toFixed(2)};}

/* ═══════════ SHARED UI ═══════════ */
const Card = ({children,style}) => <div style={{background:C.bg,borderRadius:12,padding:'1rem',border:`1px solid ${C.bdr}`,...style}}>{children}</div>;
const Slider = ({label,value,onChange,min,max,step,disabled,desc}) => (
    <div style={{marginBottom:'1.25rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.5rem'}}>
            <label style={{fontSize:'0.875rem',fontWeight:500}}>{label}</label>
            <span style={{fontSize:'0.875rem',fontWeight:600,background:'rgba(39,116,174,0.2)',padding:'0.125rem 0.5rem',borderRadius:4}}>
                {typeof value==='number'&&value%1!==0?value.toFixed(step<0.1?3:2):value}</span>
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(parseFloat(e.target.value))} disabled={disabled}
            style={{width:'100%',height:6,borderRadius:3,appearance:'none',cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.4:1,
                background:`linear-gradient(to right,${C.pri} 0%,${C.pri} ${((value-min)/(max-min))*100}%,rgba(39,116,174,0.2) ${((value-min)/(max-min))*100}%,rgba(39,116,174,0.2) 100%)`}} />
        {desc&&<p style={{fontSize:'0.7rem',color:C.mut,marginTop:'0.25rem'}}>{desc}</p>}
    </div>);
const RunBtn = ({onClick,running,label}) => (
    <button onClick={onClick} disabled={running} style={{width:'100%',padding:'1rem',borderRadius:10,border:'none',cursor:running?'not-allowed':'pointer',
        fontWeight:600,fontSize:'1rem',background:running?'rgba(39,116,174,0.2)':C.pri,color:running?C.lt:'#fff',
        display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',boxShadow:running?'none':'0 4px 15px rgba(39,116,174,0.3)'}}>
        {running?<><div style={{width:20,height:20,border:'3px solid rgba(39,116,174,0.3)',borderTop:`3px solid ${C.pri}`,borderRadius:'50%'}} className="spin"/>Running...</>:label}
    </button>);
const Header = ({tab,setTab}) => (
    <header style={{background:'#2774AE',padding:'1rem 2rem 0',position:'sticky',top:0,zIndex:100}}>
        <div style={{maxWidth:1400,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',paddingBottom:'0.75rem'}}>
            <div><p style={{fontSize:'0.65rem',color:'#FFD100',fontWeight:400,marginBottom:'0.25rem',textTransform:'uppercase',letterSpacing:'0.2em'}}>MGMT298D: Science and Strategy of AI</p>
                <h1 style={{fontSize:'1.4rem',fontWeight:600,color:'#f5f5f5'}}>Week 7: Bandits & Reinforcement Learning</h1></div>
            <span style={{fontSize:'1rem',fontWeight:500,color:'#f5f5f5'}}>UCLA Anderson</span>
        </div>
        <div style={{maxWidth:1400,margin:'0 auto',display:'flex'}}>
            {[{id:'bandits',l:'Multi-Armed Bandits'},{id:'qlearning',l:'Q-Learning'}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'0.6rem 1.5rem',border:'none',cursor:'pointer',fontSize:'0.85rem',fontWeight:600,
                    background:tab===t.id?'#fff':'transparent',color:tab===t.id?'#2774AE':'rgba(255,255,255,0.7)',borderRadius:'8px 8px 0 0'}}>{t.l}</button>))}
        </div><div className="gold-line"/></header>);

/* ════════════════════════════════════════════════
   BANDITS TAB — Animated, dropdown, persistent chart
   ════════════════════════════════════════════════ */
const BanditsTab = () => {
    const [nArr, setNArr] = useState(1000);
    const [eps, setEps] = useState(0.1);
    const [ucbC, setUcbC] = useState(2.0);
    const [seed, setSeed] = useState(42);
    const [r0, setR0] = useState(0.03);
    const [r1, setR1] = useState(0.05);
    const [r2, setR2] = useState(0.04);
    const [r3, setR3] = useState(0.02);
    const [method, setMethod] = useState('thompson');
    const [running, setRunning] = useState(false);
    const pr = [29.99, 39.99, 49.99, 59.99];

    // Live state
    const [liveStep, setLiveStep] = useState(null); // {arm, converted, rev, cumRev, t, pulls, conv, estRates}
    const [progress, setProgress] = useState(0);

    // Persistent chart data: { [method]: { x:[], y:[], total, pulls, conv, estRates } }
    const [chartData, setChartData] = useState({});
    const cancelRef = useRef(false);

    const run = useCallback(() => {
        cancelRef.current = false;
        setRunning(true); setProgress(0); setLiveStep(null);
        const tr = [r0,r1,r2,r3];
        const stepper = createBanditStepper(method, tr, pr, eps, ucbC, seed);
        const cumX = [], cumY = [];
        const batchSize = Math.max(1, Math.floor(nArr / 1000)); // steps per frame
        const targetMs = 20000; // 20 seconds
        const interval = targetMs / (nArr / batchSize);
        let done = 0;

        function tick() {
            if (cancelRef.current) { setRunning(false); return; }
            for (let i = 0; i < batchSize && done < nArr; i++) {
                const res = stepper.step();
                done++;
                if (done % Math.max(1, Math.floor(nArr / 200)) === 0 || done === nArr) {
                    cumX.push(done); cumY.push(Math.round(res.cumRev * 100) / 100);
                }
                if (done === nArr || done % batchSize === 0) {
                    setLiveStep(res);
                    setProgress(done / nArr);
                }
            }
            // Update chart data progressively
            const finalState = stepper.getState();
            setChartData(prev => ({
                ...prev,
                [method]: { x: [...cumX], y: [...cumY], total: Math.round(finalState.cumRev*100)/100,
                    pulls: finalState.pulls, conv: finalState.conv, estRates: finalState.estRates }
            }));
            if (done < nArr) {
                setTimeout(tick, interval);
            } else {
                setRunning(false);
            }
        }
        tick();
    }, [nArr, eps, ucbC, seed, r0, r1, r2, r3, method]);

    const stop = () => { cancelRef.current = true; };

    const tr = [r0,r1,r2,r3];
    const expR = pr.map((p,i)=>p*tr[i]);
    const bestA = expR.indexOf(Math.max(...expR));
    const oracle = Math.round(Math.max(...expR)*nArr*100)/100;

    return (
        <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:'1.25rem',padding:'1.25rem',maxWidth:1450,margin:'0 auto'}}>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                <Card>
                    <h2 style={{fontSize:'1.1rem',fontWeight:600,marginBottom:'1rem'}}>Strategy</h2>
                    <select value={method} onChange={e=>setMethod(e.target.value)} disabled={running}
                        style={{width:'100%',padding:'0.75rem',borderRadius:8,border:`1px solid ${C.bdr}`,fontSize:'0.9rem',fontWeight:600,
                            color:C.strat[method],background:C.bg,cursor:'pointer',marginBottom:'1rem',appearance:'auto'}}>
                        {SN.map(s=><option key={s} value={s}>{SL[s]}</option>)}
                    </select>
                    <Slider label="Arrivals" value={nArr} onChange={setNArr} min={100} max={5000} step={100} disabled={running} desc="Total customer arrivals"/>
                    <Slider label="ε (epsilon-greedy)" value={eps} onChange={setEps} min={0.01} max={0.5} step={0.01} disabled={running || (method!=='epsilon_greedy')} desc="Exploration probability"/>
                    <Slider label="c (UCB)" value={ucbC} onChange={setUcbC} min={0.1} max={5.0} step={0.1} disabled={running || (method!=='ucb')} desc="Confidence parameter"/>
                    <Slider label="Seed" value={seed} onChange={setSeed} min={1} max={100} step={1} disabled={running} desc="Random seed"/>
                </Card>
                <Card>
                    <h2 style={{fontSize:'1.1rem',fontWeight:600,marginBottom:'0.5rem'}}>True Conversion Rates</h2>
                    <p style={{fontSize:'0.7rem',color:C.mut,marginBottom:'1rem'}}>Hidden from algorithms — they must learn</p>
                    {[r0,r1,r2,r3].map((r,i)=><Slider key={i} label={`$${pr[i]} conv.`} value={r} onChange={[setR0,setR1,setR2,setR3][i]} min={0.005} max={0.15} step={0.005} disabled={running}/>)}
                </Card>
                {running ?
                    <button onClick={stop} style={{width:'100%',padding:'1rem',borderRadius:10,border:'none',cursor:'pointer',fontWeight:600,fontSize:'1rem',background:'#C62828',color:'#fff'}}>
                        Stop</button> :
                    <RunBtn onClick={run} running={false} label={`Run ${SL[method]}`}/>}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                {/* Live price tiles */}
                <LiveTiles prices={pr} liveStep={liveStep} progress={progress} running={running} method={method} nArr={nArr}/>
                {/* Summary row */}
                <BanditSummary chartData={chartData} oracle={oracle} bestA={bestA} pr={pr} tr={tr} expR={expR}/>
                {/* Cumulative chart */}
                <BanditChart chartData={chartData} oracle={oracle} nArr={nArr}/>
                {/* Bottom row */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
                    <BanditPulls chartData={chartData} pr={pr}/>
                    <BanditRates chartData={chartData} pr={pr} tr={tr} expR={expR} bestA={bestA}/>
                </div>
            </div>
        </div>
    );
};

/* ──── Live Price Tiles ──── */
const LiveTiles = ({prices, liveStep, progress, running, method, nArr}) => {
    const armColors = ['#8BB8E8','#2774AE','#005587','#1a1a1a'];
    const [flashArm, setFlashArm] = useState(-1);
    const prevStep = useRef(null);

    useEffect(() => {
        if (liveStep && liveStep !== prevStep.current) {
            setFlashArm(liveStep.arm);
            prevStep.current = liveStep;
            const id = setTimeout(() => setFlashArm(-1), 200);
            return () => clearTimeout(id);
        }
    }, [liveStep]);

    return (
        <Card>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.75rem'}}>
                <div>
                    <h3 style={{fontSize:'1rem',fontWeight:600}}>Live Simulation {running && <span style={{fontSize:'0.8rem',color:C.or}}>● RUNNING</span>}</h3>
                    <p style={{fontSize:'0.75rem',color:C.mut}}>
                        {running ? `${SL[method]} — Customer ${liveStep?.t || 0} of ${nArr}` :
                            liveStep ? `${SL[method]} — Complete (${nArr} customers)` : 'Select a strategy and click Run'}
                    </p>
                </div>
                {liveStep && <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'0.7rem',color:C.mut}}>Cumulative Revenue</div>
                    <div style={{fontSize:'1.4rem',fontWeight:700,color:C.gn}}>${liveStep.cumRev.toFixed(2)}</div>
                </div>}
            </div>
            {/* Progress bar */}
            <div style={{height:4,background:'rgba(39,116,174,0.1)',borderRadius:2,marginBottom:'1rem',overflow:'hidden'}}>
                <div style={{height:'100%',width:`${progress*100}%`,background:C.strat[method],borderRadius:2,transition:'width 0.1s'}}/>
            </div>
            {/* Price tiles */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'0.75rem'}}>
                {prices.map((p,i) => {
                    const isChosen = flashArm === i;
                    const converted = isChosen && liveStep?.converted;
                    const pulls = liveStep?.pulls?.[i] || 0;
                    const conversions = liveStep?.conv?.[i] || 0;
                    const total = liveStep?.t || 0;
                    const pct = total > 0 ? ((pulls/total)*100).toFixed(0) : 0;
                    return (
                        <div key={i} style={{
                            padding:'1rem', borderRadius:10, textAlign:'center',
                            border: isChosen ? `3px solid ${converted?C.gn:C.or}` : `1px solid ${C.bdr}`,
                            background: isChosen ? (converted ? 'rgba(46,125,50,0.08)' : 'rgba(232,96,15,0.06)') : C.bg,
                            transform: isChosen ? 'scale(1.03)' : 'scale(1)',
                            transition: 'all 0.15s ease',
                        }}>
                            <div style={{fontSize:'1.5rem',fontWeight:700,color:armColors[i],marginBottom:'0.25rem'}}>${p}</div>
                            <div style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.5rem'}}>
                                {isChosen ? (converted ? '✓ Converted!' : '✗ No sale') : '\u00A0'}
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.75rem'}}>
                                <span style={{color:C.mut}}>Shown</span>
                                <span style={{fontWeight:600}}>{pulls} ({pct}%)</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.75rem'}}>
                                <span style={{color:C.mut}}>Conv</span>
                                <span style={{fontWeight:600,color:C.gn}}>{conversions}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.75rem'}}>
                                <span style={{color:C.mut}}>Est Rate</span>
                                <span style={{fontWeight:600}}>{pulls>0?((conversions/pulls)*100).toFixed(1):'--'}%</span>
                            </div>
                        </div>
                    );
                })}
            </div>
        </Card>
    );
};

/* ──── Summary ──── */
const BanditSummary = ({chartData, oracle, bestA, pr, tr, expR}) => {
    const items = SN.map(s => ({
        l: SL[s], v: chartData[s] ? `$${chartData[s].total.toLocaleString()}` : '---', c: C.strat[s]
    }));
    items.push({l:'Oracle (best arm)',v:`$${oracle.toLocaleString()}`,c:C.pu});
    items.push({l:'Best Arm',v:`$${pr[bestA]} @ ${(tr[bestA]*100).toFixed(1)}%`,c:C.tx});
    return <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'0.75rem'}}>
        {items.map((it,i)=><Card key={i} style={{textAlign:'center',padding:'0.75rem'}}>
            <div style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.25rem'}}>{it.l}</div>
            <div style={{fontSize:'0.95rem',fontWeight:600,color:it.c}}>{it.v}</div>
        </Card>)}
    </div>;
};

/* ──── Cumulative Revenue Chart (persistent lines, no flicker) ──── */
const BanditChart = ({chartData, oracle, nArr}) => {
    const ref = useRef(null), ch = useRef(null);

    // Create chart once on mount
    useEffect(() => {
        if (!ref.current) return;
        const datasets = SN.map(s => ({
            label: SL[s], data: [],
            borderColor: C.strat[s], borderWidth: 2.5, pointRadius: 0, tension: 0.3, fill: false, hidden: false,
        }));
        datasets.push({label:'Oracle',data:[{x:0,y:0},{x:nArr,y:oracle}],borderColor:C.pu,borderWidth:1.5,borderDash:[6,3],pointRadius:0,fill:false});

        ch.current = new Chart(ref.current.getContext('2d'),{type:'line',data:{datasets},options:{
            responsive:true,maintainAspectRatio:false,animation:false,
            plugins:{legend:{labels:{color:C.tx,font:{size:11,weight:'500'},usePointStyle:true,padding:15}},tooltip:{mode:'index',intersect:false}},
            scales:{x:{type:'linear',min:0,max:nArr,title:{display:true,text:'Customer',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut}},
                y:{min:0,title:{display:true,text:'Cumulative Revenue ($)',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut,callback:v=>`$${v.toLocaleString()}`}}}}});
        return () => { if (ch.current) { ch.current.destroy(); ch.current = null; } };
    }, []); // only on mount

    // Update data in-place when chartData/oracle/nArr changes
    useEffect(() => {
        if (!ch.current) return;
        const chart = ch.current;
        // Update strategy datasets (indices 0-3)
        SN.forEach((s, i) => {
            if (chartData[s]) {
                chart.data.datasets[i].data = chartData[s].x.map((x, j) => ({x, y: chartData[s].y[j]}));
            } else {
                chart.data.datasets[i].data = [];
            }
        });
        // Update oracle line (index 4)
        chart.data.datasets[4].data = [{x:0,y:0},{x:nArr,y:oracle}];
        chart.options.scales.x.max = nArr;
        chart.update('none'); // 'none' = no animation
    }, [chartData, oracle, nArr]);

    return <Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.25rem'}}>Cumulative Revenue</h3>
        <p style={{fontSize:'0.75rem',color:C.mut,marginBottom:'0.5rem'}}>Each strategy you run gets added — rerunning same strategy overwrites its line</p>
        <div style={{height:300}}><canvas ref={ref}/></div>
    </Card>;
};

/* ──── Pulls Distribution ──── */
const BanditPulls = ({chartData, pr}) => {
    const hasData = SN.some(s => chartData[s]);
    if (!hasData) return <Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:250}}><p style={{color:C.mut}}>Run a strategy to see results</p></Card>;
    const ac = ['#8BB8E8','#2774AE','#005587','#1a1a1a'];
    return <Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.25rem'}}>Arm Selection Distribution</h3>
        <p style={{fontSize:'0.75rem',color:C.mut,marginBottom:'0.75rem'}}>Best strategies concentrate on the best arm</p>
        {SN.filter(s=>chartData[s]).map(s=>{const d=chartData[s],n=d.pulls.reduce((a,b)=>a+b,0);return <div key={s} style={{marginBottom:'0.75rem'}}>
            <div style={{fontSize:'0.8rem',fontWeight:600,color:C.strat[s],marginBottom:'0.25rem'}}>{SL[s]} — ${d.total.toLocaleString()}</div>
            <div style={{display:'flex',height:22,borderRadius:4,overflow:'hidden'}}>
                {d.pulls.map((cnt,i)=>{const pct=(cnt/n)*100;return pct>0?
                    <div key={i} style={{width:`${pct}%`,background:ac[i],display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:'0.65rem',color:i<2?'#1a1a1a':'#fff',fontWeight:500}}>{pct>8?`$${pr[i]} (${Math.round(pct)}%)`:''}</div>:null;})}
            </div></div>;})}
        <div style={{display:'flex',gap:'1rem',marginTop:'0.5rem',justifyContent:'center'}}>
            {pr.map((p,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:'0.25rem'}}>
                <div style={{width:10,height:10,borderRadius:2,background:ac[i]}}/><span style={{fontSize:'0.7rem',color:C.mut}}>${p}</span></div>)}
        </div>
    </Card>;
};

/* ──── Rates Table ──── */
const BanditRates = ({chartData, pr, tr, expR, bestA}) => {
    const ran = SN.filter(s=>chartData[s]);
    if (!ran.length) return <Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:250}}><p style={{color:C.mut}}>Waiting...</p></Card>;
    return <Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.25rem'}}>Estimated vs True Rates</h3>
        <p style={{fontSize:'0.75rem',color:C.mut,marginBottom:'0.75rem'}}>How accurately each learned conversion rates</p>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}>
            <thead><tr style={{borderBottom:`2px solid ${C.bdr}`}}>
                <th style={{padding:'0.4rem',textAlign:'left',color:C.mut}}>Price</th>
                <th style={{padding:'0.4rem',textAlign:'center',color:C.mut}}>True</th>
                <th style={{padding:'0.4rem',textAlign:'center',color:C.mut}}>Exp Rev</th>
                {ran.map(s=><th key={s} style={{padding:'0.4rem',textAlign:'center',color:C.strat[s],fontWeight:600}}>{SL[s]}</th>)}
            </tr></thead>
            <tbody>{pr.map((p,i)=><tr key={i} style={{borderBottom:`1px solid ${C.bdr}`,background:i===bestA?'rgba(46,125,50,0.06)':'transparent'}}>
                <td style={{padding:'0.4rem',fontWeight:600}}>${p}{i===bestA&&<span style={{fontSize:'0.65rem',color:C.gn}}> ★</span>}</td>
                <td style={{padding:'0.4rem',textAlign:'center'}}>{(tr[i]*100).toFixed(1)}%</td>
                <td style={{padding:'0.4rem',textAlign:'center',fontWeight:500}}>${expR[i].toFixed(2)}</td>
                {ran.map(s=><td key={s} style={{padding:'0.4rem',textAlign:'center'}}>{(chartData[s].estRates[i]*100).toFixed(1)}%</td>)}
            </tr>)}</tbody>
        </table>
    </Card>;
};

/* ════════════════════════════════
   Q-LEARNING TAB (unchanged)
   ════════════════════════════════ */
const QLTab = () => {
    const [nEp,setNEp]=useState(500);const [alpha,setAlpha]=useState(0.3);const [gamma,setGamma]=useState(1.0);
    const [epsQ,setEpsQ]=useState(0.2);const [decay,setDecay]=useState(0.995);const [inv,setInv]=useState(100);
    const [seed,setSeed]=useState(42);const [running,setRunning]=useState(false);const [res,setRes]=useState(null);const [snapIdx,setSnapIdx]=useState(null);
    const run=useCallback(()=>{setRunning(true);setTimeout(()=>{const r=runQL({nEpisodes:nEp,alpha,gamma,epsilon:epsQ,epsilonDecay:decay,inventory:inv,seed});setRes(r);setSnapIdx(r.snaps.length-1);setRunning(false);},50);},[nEp,alpha,gamma,epsQ,decay,inv,seed]);
    return (
        <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:'1.25rem',padding:'1.25rem',maxWidth:1450,margin:'0 auto'}}>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                <Card><h2 style={{fontSize:'1.1rem',fontWeight:600,marginBottom:'1rem'}}>Q-Learning Parameters</h2>
                    <Slider label="Episodes" value={nEp} onChange={setNEp} min={50} max={2000} step={50} desc="Training episodes"/>
                    <Slider label="α (learning rate)" value={alpha} onChange={setAlpha} min={0.01} max={1.0} step={0.01} desc="How much to update Q per step"/>
                    <Slider label="γ (discount)" value={gamma} onChange={setGamma} min={0.5} max={1.0} step={0.05} desc="Future reward discount"/>
                    <Slider label="ε (exploration)" value={epsQ} onChange={setEpsQ} min={0.01} max={0.5} step={0.01} desc="Initial exploration rate"/>
                    <Slider label="ε decay" value={decay} onChange={setDecay} min={0.9} max={1.0} step={0.005} desc="Multiply ε each episode"/>
                    <Slider label="Inventory" value={inv} onChange={setInv} min={50} max={200} step={10} desc="Starting glasses"/>
                    <Slider label="Seed" value={seed} onChange={setSeed} min={1} max={100} step={1}/></Card>
                <RunBtn onClick={run} running={running} label="Train Q-Learning"/>
                <Card><h3 style={{fontSize:'0.95rem',fontWeight:600,marginBottom:'0.5rem'}}>Demand Schedule</h3>
                    <p style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.5rem'}}>Glasses demanded/day (±20% noise)</p>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.75rem'}}>
                        <thead><tr style={{borderBottom:`2px solid ${C.bdr}`}}>
                            <th style={{padding:'0.3rem',textAlign:'left',color:C.mut}}>Day</th>
                            {PRICES.map(p=><th key={p} style={{padding:'0.3rem',textAlign:'center',color:C.pri,fontWeight:600}}>${p}</th>)}</tr></thead>
                        <tbody>{DAYS.map((d,i)=><tr key={d} style={{borderBottom:`1px solid ${C.bdr}`}}>
                            <td style={{padding:'0.3rem',fontWeight:500}}>{d}</td>
                            {PRICES.map(p=><td key={p} style={{padding:'0.3rem',textAlign:'center'}}>{DEMAND[p][i]}</td>)}</tr>)}</tbody></table></Card>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                <QSummary res={res}/><QChart res={res}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}><QPolicy res={res} snapIdx={snapIdx} setSnapIdx={setSnapIdx}/><QTable res={res} snapIdx={snapIdx}/></div>
            </div>
        </div>);
};
const QSummary=({res})=>{const items=res?[{l:'DP Optimal Revenue',v:`$${res.dp}`},{l:'Avg Last 50',v:`$${res.avg50}`},{l:'Gap',v:`$${(res.dp-res.avg50).toFixed(2)}`},{l:'Days',v:'7 (Mon–Sun)'},{l:'Prices',v:'$1, $2, $3'},{l:'States',v:'7 × 4 = 28'}]:[{l:'DP Optimal',v:'---'},{l:'Avg Last 50',v:'---'},{l:'Gap',v:'---'},{l:'Days',v:'7'},{l:'Prices',v:'$1, $2, $3'},{l:'States',v:'28'}];return<div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'0.75rem'}}>{items.map((it,i)=><Card key={i} style={{textAlign:'center',padding:'0.75rem'}}><div style={{fontSize:'0.7rem',color:C.mut,marginBottom:'0.25rem'}}>{it.l}</div><div style={{fontSize:'1rem',fontWeight:600}}>{it.v}</div></Card>)}</div>;};
const QChart=({res})=>{const ref=useRef(null),ch=useRef(null);useEffect(()=>{if(!ref.current||!res)return;if(ch.current)ch.current.destroy();const mx=Math.max(...res.revsX);ch.current=new Chart(ref.current.getContext('2d'),{type:'line',data:{datasets:[{label:'Episode Revenue',data:res.revsX.map((x,i)=>({x,y:res.revs[i]})),borderColor:'rgba(39,116,174,0.25)',backgroundColor:'rgba(39,116,174,0.08)',borderWidth:1,pointRadius:0,fill:true},{label:'Rolling Avg',data:res.rollX.map((x,i)=>({x,y:res.roll[i]})),borderColor:C.or,borderWidth:2.5,pointRadius:0,tension:0.3,fill:false},{label:'DP Optimal',data:[{x:0,y:res.dp},{x:mx,y:res.dp}],borderColor:C.gn,borderWidth:2,borderDash:[8,4],pointRadius:0,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:C.tx,font:{size:11,weight:'500'},usePointStyle:true,padding:15}}},scales:{x:{type:'linear',title:{display:true,text:'Episode',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut}},y:{title:{display:true,text:'Revenue ($)',color:C.tx,font:{size:12,weight:'600'}},grid:{color:'rgba(0,0,0,0.06)'},ticks:{color:C.mut,callback:v=>`$${v}`}}}}});return()=>{if(ch.current)ch.current.destroy();};},[res]);return<Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.25rem'}}>Revenue per Episode</h3><p style={{fontSize:'0.75rem',color:C.mut,marginBottom:'0.5rem'}}>Rolling average should approach DP optimal</p><div style={{height:280}}>{res?<canvas ref={ref}/>:<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%'}}><p style={{color:C.mut}}>Click "Train Q-Learning"</p></div>}</div></Card>;};
const QPolicy=({res,snapIdx,setSnapIdx})=>{if(!res)return<Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:300}}><p style={{color:C.mut}}>Waiting...</p></Card>;const snap=res.snaps[snapIdx]||res.snaps[res.snaps.length-1];const pc={1:'#8BB8E8',2:'#2774AE',3:'#005587'};return<Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.25rem'}}>Learned Policy</h3><p style={{fontSize:'0.75rem',color:C.mut,marginBottom:'0.5rem'}}>Optimal price per (day, inventory) — Ep {snap.episode}</p><div style={{display:'flex',gap:'0.3rem',marginBottom:'0.75rem',flexWrap:'wrap'}}>{res.snaps.map((s,i)=><button key={i} onClick={()=>setSnapIdx(i)} style={{padding:'0.25rem 0.5rem',borderRadius:4,border:'none',cursor:'pointer',fontSize:'0.7rem',fontWeight:500,background:snapIdx===i?C.pri:'rgba(39,116,174,0.1)',color:snapIdx===i?'#fff':C.tx}}>Ep {s.episode}</button>)}</div><table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.75rem'}}><thead><tr><th style={{padding:'0.3rem',textAlign:'left',color:C.mut,fontSize:'0.7rem'}}>Day\Inv</th>{INV_LABELS.map(l=><th key={l} style={{padding:'0.3rem',textAlign:'center',color:C.mut,fontSize:'0.65rem'}}>{l}</th>)}</tr></thead><tbody>{DAYS.map(d=><tr key={d}><td style={{padding:'0.3rem',fontWeight:600,fontSize:'0.75rem'}}>{d}</td>{INV_LABELS.map(iv=>{const k=`${d}_${iv}`,p=snap.policy[k];return<td key={iv} style={{padding:'0.3rem',textAlign:'center',fontWeight:700,background:pc[p]||'#eee',color:p===3?'#fff':'#1a1a1a',borderRadius:3,fontSize:'0.8rem'}}>${p}</td>;})}</tr>)}</tbody></table><div style={{display:'flex',gap:'1rem',marginTop:'0.5rem',justifyContent:'center'}}>{PRICES.map(p=><div key={p} style={{display:'flex',alignItems:'center',gap:'0.25rem'}}><div style={{width:12,height:12,borderRadius:2,background:pc[p]}}/><span style={{fontSize:'0.7rem',color:C.mut}}>${p}</span></div>)}</div></Card>;};
const QTable=({res,snapIdx})=>{if(!res)return<Card style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:300}}><p style={{color:C.mut}}>Waiting...</p></Card>;const snap=res.snaps[snapIdx]||res.snaps[res.snaps.length-1];const selInv=INV_LABELS[3];return<Card><h3 style={{fontSize:'1rem',fontWeight:600,marginBottom:'0.25rem'}}>Q-Values</h3><p style={{fontSize:'0.75rem',color:C.mut,marginBottom:'0.75rem'}}>Q(state, action) for inv = {selInv} — Ep {snap.episode}</p><table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}><thead><tr style={{borderBottom:`2px solid ${C.bdr}`}}><th style={{padding:'0.4rem',textAlign:'left',color:C.mut}}>Day</th>{PRICES.map(p=><th key={p} style={{padding:'0.4rem',textAlign:'center',color:C.pri,fontWeight:600}}>Q(·,${p})</th>)}<th style={{padding:'0.4rem',textAlign:'center',color:C.gn,fontWeight:600}}>Best</th></tr></thead><tbody>{DAYS.map(d=>{const k=`${d}_${selInv}`,qv=snap.qValues[k]||[0,0,0],mx=Math.max(...qv),bi=qv.indexOf(mx);return<tr key={d} style={{borderBottom:`1px solid ${C.bdr}`}}><td style={{padding:'0.4rem',fontWeight:600}}>{d}</td>{qv.map((v,i)=><td key={i} style={{padding:'0.4rem',textAlign:'center',fontWeight:v===mx&&mx>0?700:400,color:v===mx&&mx>0?C.gn:C.tx,background:v===mx&&mx>0?'rgba(46,125,50,0.08)':'transparent'}}>{v.toFixed(1)}</td>)}<td style={{padding:'0.4rem',textAlign:'center',fontWeight:700,color:C.gn}}>${PRICES[bi]}</td></tr>;})}</tbody></table></Card>;};

/* ════════════ APP ════════════ */
const App = () => {
    const [tab, setTab] = useState('bandits');
    return <div style={{minHeight:'100vh',paddingBottom:'2rem'}}>
        <Header tab={tab} setTab={setTab}/>
        <main className="fade-in" key={tab}>{tab==='bandits'?<BanditsTab/>:<QLTab/>}</main>
        <div style={{textAlign:'center',marginTop:40,paddingTop:20}}>
            <p style={{color:'#888',fontSize:'0.75rem'}}>MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management</p>
        </div>
    </div>;
};
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
