<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 6: Tiny LLM Lab</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --blue: #2774ae;
      --gold: #ffd100;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8dee8;
      --panel: #ffffff;
      --soft: #f5f7fb;
      --green: #12805c;
      --red: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--soft);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      background: #fff;
      border-bottom: 4px solid var(--gold);
      padding: 22px 28px 18px;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    .course {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 750;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      max-width: 720px;
      line-height: 1.45;
    }

    main {
      max-width: 1180px;
      margin: 22px auto;
      padding: 0 18px 28px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .tab {
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #eef2f7;
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      border-radius: 6px 6px 0 0;
    }

    .tab.active {
      background: #fff;
      color: var(--blue);
    }

    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .panel {
      padding: 18px;
    }

    .card {
      padding: 16px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    p {
      color: var(--muted);
      line-height: 1.45;
      margin: 0 0 12px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin: 14px 0 6px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font-size: 15px;
      background: #fff;
      color: var(--ink);
    }

    button {
      border: 0;
      background: var(--blue);
      color: #fff;
      border-radius: 6px;
      padding: 10px 13px;
      margin-top: 12px;
      cursor: pointer;
      font-weight: 750;
      min-height: 40px;
    }

    button.secondary {
      background: #e8eef6;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
    }

    .metric .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--blue);
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .item {
      display: grid;
      grid-template-columns: 42px 110px 1fr 52px;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }

    .rank {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .bar {
      height: 10px;
      background: #e6edf5;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--blue);
    }

    .token .fill { background: var(--green); }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #344054;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      overflow-wrap: anywhere;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
      margin-top: 8px;
    }

    .error { color: var(--red); }

    .experiment-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 850px) {
      .grid, .experiment-grid, .metric-row {
        grid-template-columns: 1fr;
      }

      h1 { font-size: 24px; }
      header { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <div class="course">MGMT298D: Science and Strategy of AI</div>
      <h1>Week 6: Tiny LLM Lab</h1>
      <div class="subtitle">Explore word embeddings, analogies, next-token predictions, and why more data and more training change language-model behavior.</div>
    </div>
  </header>

  <main id="root"></main>

  <script type="text/babel">
    const API = "";
    const { useEffect, useState } = React;

    async function postJson(path, body) {
      const response = await fetch(`${API}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function ScoreList({ rows, tokenMode=false }) {
      if (!rows || rows.length === 0) return <p>No results yet.</p>;
      const max = Math.max(...rows.map((r) => tokenMode ? r.probability : r.similarity), 0.01);
      return (
        <div className="list">
          {rows.map((row) => {
            const value = tokenMode ? row.probability : row.similarity;
            const label = tokenMode ? row.token : row.word;
            const rank = row.rank || rows.indexOf(row) + 1;
            return (
              <div className={`item ${tokenMode ? "token" : ""}`} key={label}>
                <span className="rank">#{rank}</span>
                <strong>{label}</strong>
                <div className="bar"><div className="fill" style={{ width: `${(value / max) * 100}%` }} /></div>
                <span>{value.toFixed(2)}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function EmbeddingsTab() {
      const [word, setWord] = useState("king");
      const [nearest, setNearest] = useState(null);
      const [a, setA] = useState("king");
      const [b, setB] = useState("woman");
      const [c, setC] = useState("man");
      const [limit, setLimit] = useState(5);
      const [analogy, setAnalogy] = useState(null);
      const [status, setStatus] = useState("");

      async function runNearest() {
        try {
          setStatus("");
          const data = await postJson("/api/nearest", { word });
          setNearest(data);
        } catch (err) {
          setStatus(err.message);
        }
      }

      async function runAnalogy() {
        try {
          setStatus("");
          const data = await postJson("/api/analogy", { a, b, c, limit });
          setAnalogy(data);
        } catch (err) {
          setStatus(err.message);
        }
      }

      useEffect(() => {
        runNearest();
        runAnalogy();
      }, []);

      return (
        <div className="grid">
          <section className="panel">
            <h2>Word Embeddings</h2>
            <p>Embeddings place words in a vector space. Nearby words have similar contexts or meanings.</p>

            <label>Find nearest neighbors</label>
            <input value={word} onChange={(e) => setWord(e.target.value)} />
            <button onClick={runNearest}>Find Neighbors</button>

            <label>Analogy</label>
            <div className="row">
              <input value={a} onChange={(e) => setA(e.target.value)} />
              <input value={b} onChange={(e) => setB(e.target.value)} />
              <input value={c} onChange={(e) => setC(e.target.value)} />
            </div>
            <label>Ranked results</label>
            <select value={limit} onChange={(e) => setLimit(Number(e.target.value))}>
              <option value={5}>Top 5</option>
              <option value={10}>Top 10</option>
            </select>
            <button className="secondary" onClick={runAnalogy}>Compute A + B - C</button>
            <div className={`status ${status ? "error" : ""}`}>{status}</div>
          </section>

          <section>
            <div className="card">
              <h3>Nearest Words</h3>
              {nearest && <p>Words closest to <strong>{nearest.word}</strong>.</p>}
              <ScoreList rows={nearest?.neighbors} />
            </div>
            <div className="card">
              <h3>Vector Arithmetic</h3>
              {analogy && <p><span className="mono">{analogy.formula} = ?</span></p>}
              <ScoreList rows={analogy?.results} />
            </div>
          </section>
        </div>
      );
    }

    function LmTab() {
      const [prompt, setPrompt] = useState("the fish tacos were");
      const [data, setData] = useState(null);
      const [status, setStatus] = useState("");

      async function run() {
        try {
          setStatus("");
          const result = await postJson("/api/generate", { prompt });
          setData(result);
        } catch (err) {
          setStatus(err.message);
        }
      }

      useEffect(() => { run(); }, []);

      return (
        <div>
          <div className="grid">
            <section className="panel">
              <h2>Next-Token Prediction</h2>
              <p>A language model predicts a distribution over the next token, then generates by repeatedly sampling or choosing from that distribution.</p>
              <label>Prompt</label>
              <input value={prompt} onChange={(e) => setPrompt(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") run(); }} />
              <button onClick={run}>Compare Experiments</button>
              <div className={`status ${status ? "error" : ""}`}>{status}</div>
            </section>

            <section className="panel">
              <h2>Training Setups</h2>
              <div className="metric-row">
                <div className="metric"><div className="value">10k</div><div className="label">reviews, 1 epoch</div></div>
                <div className="metric"><div className="value">500k</div><div className="label">reviews, 1 epoch</div></div>
                <div className="metric"><div className="value">5x</div><div className="label">epochs on 500k</div></div>
              </div>
              <p>The app shows representative outcomes from the Week 6 training experiments without running heavy training jobs on the web server.</p>
            </section>
          </div>

          {data && (
            <div className="experiment-grid" style={{ marginTop: 16 }}>
              {data.results.map((result) => (
                <div className="card" key={result.key}>
                  <h3>{result.label}</h3>
                  <div className="metric-row">
                    <div className="metric"><div className="value">{result.train_loss.toFixed(2)}</div><div className="label">train loss</div></div>
                    <div className="metric"><div className="value">{result.val_loss.toFixed(2)}</div><div className="label">val loss</div></div>
                    <div className="metric"><div className="value">{result.top_tokens[0].token}</div><div className="label">top next token</div></div>
                  </div>
                  <h3>Top Next Tokens</h3>
                  <ScoreList rows={result.top_tokens} tokenMode />
                  <h3 style={{ marginTop: 16 }}>Generated Continuation</h3>
                  <div className="mono">{result.continuation}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState("lm");
      return (
        <>
          <div className="tabs">
            <button className={`tab ${tab === "lm" ? "active" : ""}`} onClick={() => setTab("lm")}>Tiny LLM</button>
            <button className={`tab ${tab === "embeddings" ? "active" : ""}`} onClick={() => setTab("embeddings")}>Embeddings</button>
          </div>
          {tab === "lm" ? <LmTab /> : <EmbeddingsTab />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
