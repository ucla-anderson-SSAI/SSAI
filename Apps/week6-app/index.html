<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 6: Embeddings and Transformers</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2774ae;
      --gold: #ffd100;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8dee8;
      --panel: #fff;
      --soft: #f5f7fb;
      --green: #12805c;
      --red: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ffffff;
      color: #1a1a1a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }

    .header {
      background: #2774AE;
      padding: 1rem 2rem 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left .course-label {
      font-size: 0.65rem;
      font-weight: 400;
      color: #FFD100;
      margin-bottom: 0.25rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .header-left h1 {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.2;
      font-weight: 600;
      color: #f5f5f5;
    }

    .header-left p {
      color: #c0c0c0;
      font-size: 0.85rem;
      margin: 0.25rem 0 0;
      line-height: 1.45;
      max-width: 820px;
    }

    .header-right .ucla-anderson {
      font-size: 1rem;
      color: #f5f5f5;
      font-weight: 500;
      white-space: nowrap;
      margin-left: 2rem;
    }

    .header-gold-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #FFD100;
    }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      overflow-x: auto;
    }

    .tab {
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #eef2f7;
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 750;
      border-radius: 6px 6px 0 0;
      white-space: nowrap;
      min-height: 40px;
    }

    .tab.active {
      background: #fff;
      color: var(--blue);
    }

    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .panel { padding: 18px; }
    .card { padding: 16px; margin-bottom: 14px; }

    label {
      display: block;
      font-weight: 750;
      font-size: 13px;
      margin: 14px 0 6px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font-size: 15px;
      background: #fff;
      color: var(--ink);
    }

    button {
      border: 0;
      background: var(--blue);
      color: #fff;
      border-radius: 6px;
      padding: 10px 13px;
      margin-top: 12px;
      cursor: pointer;
      font-weight: 750;
      min-height: 40px;
    }

    button.secondary {
      background: #e8eef6;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .preset-btn {
      margin-top: 0;
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      text-align: left;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .preset-btn:hover {
      border-color: rgba(39, 116, 174, 0.45);
      background: rgba(39, 116, 174, 0.06);
      color: var(--blue);
    }

    button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 66px;
    }

    .metric .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--blue);
      overflow-wrap: anywhere;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .item {
      display: grid;
      grid-template-columns: 42px 120px 1fr 58px;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }

    .rank {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .bar {
      height: 10px;
      background: #e6edf5;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--blue);
    }

    .token .fill { background: var(--green); }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #344054;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
      margin-top: 8px;
    }

    .error { color: var(--red); }

    @media (max-width: 850px) {
      .grid, .metric-row, .two { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .preset-grid { grid-template-columns: 1fr; }
      .item { grid-template-columns: 36px 96px 1fr 52px; }
      .header { padding-left: 18px; padding-right: 18px; }
      .header-content { align-items: flex-start; gap: 0.75rem; }
      .header-right { display: none; }
      main { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <div class="course-label">MGMT298D: Science and Strategy of AI</div>
        <h1>Week 6: Embeddings and Transformers</h1>
        <p>Yelp Review Generation</p>
      </div>
      <div class="header-right">
        <div class="ucla-anderson">UCLA Anderson</div>
      </div>
    </div>
    <div class="header-gold-line"></div>
  </header>

  <main id="root"></main>

  <script type="text/babel">
    const { useEffect, useState } = React;

    async function postJson(path, body) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function ScoreList({ rows, tokenMode=false }) {
      if (!rows || rows.length === 0) return <p>No results yet.</p>;
      const max = Math.max(...rows.map((r) => tokenMode ? r.probability : r.similarity), 0.01);
      return (
        <div className="list">
          {rows.map((row, i) => {
            const value = tokenMode ? row.probability : row.similarity;
            const label = tokenMode ? row.token : row.word;
            const width = Math.max(2, (value / max) * 100);
            return (
              <div className={`item ${tokenMode ? "token" : ""}`} key={`${label}-${i}`}>
                <span className="rank">#{row.rank || i + 1}</span>
                <strong>{label}</strong>
                <div className="bar"><div className="fill" style={{ width: `${width}%` }} /></div>
                <span>{value.toFixed(3)}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function ModelSelect({ model, setModel }) {
      return (
        <select value={model} onChange={(e) => setModel(e.target.value)}>
          <option value="10k_1epoch">10,000 reviews, 1 epoch</option>
          <option value="500k_1epoch">500,000 reviews, 1 epoch</option>
          <option value="500k_5epochs">500,000 reviews, 5 epochs</option>
        </select>
      );
    }

    function EmbeddingMath() {
      const analogyExamples = [
        { label: "king - man + woman", a: "king", b: "man", c: "woman" },
        { label: "italy - france + paris", a: "italy", b: "france", c: "paris" },
        { label: "walking - running + ran", a: "walking", b: "running", c: "ran" },
        { label: "pizza - italy + japan", a: "pizza", b: "italy", c: "japan" },
        { label: "sushi - japan + italy", a: "sushi", b: "japan", c: "italy" },
        { label: "actor - man + woman", a: "actor", b: "man", c: "woman" },
        { label: "nurse - woman + man", a: "nurse", b: "woman", c: "man" },
      ];
      const [word, setWord] = useState("king");
      const [nearest, setNearest] = useState(null);
      const [a, setA] = useState("king");
      const [b, setB] = useState("man");
      const [c, setC] = useState("woman");
      const [limit, setLimit] = useState(5);
      const [analogy, setAnalogy] = useState(null);
      const [status, setStatus] = useState("");
      const [busy, setBusy] = useState(false);

      async function runNearest() {
        try {
          setBusy(true); setStatus("");
          const data = await postJson("/api/nearest", { word, limit });
          setNearest(data);
        } catch (err) {
          setStatus(err.message);
        } finally {
          setBusy(false);
        }
      }

      async function runAnalogy(nextA = a, nextB = b, nextC = c) {
        try {
          setBusy(true); setStatus("");
          const data = await postJson("/api/analogy", { a: nextA, b: nextB, c: nextC, limit });
          setAnalogy(data);
        } catch (err) {
          setStatus(err.message);
        } finally {
          setBusy(false);
        }
      }

      function useExample(example) {
        setA(example.a);
        setB(example.b);
        setC(example.c);
        runAnalogy(example.a, example.b, example.c);
      }

      useEffect(() => { runNearest(); runAnalogy(); }, []);

      return (
        <div className="grid">
          <section className="panel">
            <h2>Embedding Math</h2>
            <p>Use real word vectors to find nearby words and compute analogies by starting with A, subtracting B, and adding C.</p>
            <label>Nearest neighbors</label>
            <input value={word} onChange={(e) => setWord(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") runNearest(); }} />
            <button onClick={runNearest} disabled={busy}>Find Neighbors</button>

            <label>Embedding math: A - B + C</label>
            <div className="row">
              <input value={a} onChange={(e) => setA(e.target.value)} placeholder="A" />
              <input value={b} onChange={(e) => setB(e.target.value)} placeholder="B" />
              <input value={c} onChange={(e) => setC(e.target.value)} placeholder="C" />
            </div>
            <label>Examples</label>
            <div className="preset-grid">
              {analogyExamples.map((example) => (
                <button
                  className="preset-btn"
                  key={example.label}
                  onClick={() => useExample(example)}
                  disabled={busy}
                >
                  {example.label}
                </button>
              ))}
            </div>
            <label>Ranked results</label>
            <select value={limit} onChange={(e) => setLimit(Number(e.target.value))}>
              <option value={5}>Top 5</option>
              <option value={10}>Top 10</option>
            </select>
            <button className="secondary" onClick={() => runAnalogy()} disabled={busy}>Compute A - B + C</button>
            <div className={`status ${status ? "error" : ""}`}>{status || (busy ? "Loading..." : "")}</div>
          </section>

          <section>
            <div className="card">
              <h3>Nearest Words</h3>
              {nearest && <p>Words closest to <strong>{nearest.word}</strong>.</p>}
              <ScoreList rows={nearest?.neighbors} />
            </div>
            <div className="card">
              <h3>Embedding Math Results</h3>
              {analogy && <p><span className="mono">{analogy.relationship} ({analogy.formula} ≈ ?)</span></p>}
              <ScoreList rows={analogy?.results} />
            </div>
          </section>
        </div>
      );
    }

    function NextToken() {
      const [prompt, setPrompt] = useState("the fish tacos were");
      const [model, setModel] = useState("500k_5epochs");
      const [topK, setTopK] = useState(10);
      const [data, setData] = useState(null);
      const [status, setStatus] = useState("");
      const [busy, setBusy] = useState(false);

      async function run() {
        try {
          setBusy(true); setStatus("");
          const result = await postJson("/api/llm/next-token", { prompt, model, top_k: topK });
          setData(result);
        } catch (err) {
          setStatus(err.message);
        } finally {
          setBusy(false);
        }
      }

      useEffect(() => { run(); }, []);

      return (
        <div className="grid">
          <section className="panel">
            <h2>Next Token</h2>
            <p>The pretrained Tiny LLM predicts a probability distribution over the next token after your prompt.</p>
            <label>Prompt</label>
            <input value={prompt} onChange={(e) => setPrompt(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") run(); }} />
            <label>Pretrained model</label>
            <ModelSelect model={model} setModel={setModel} />
            <label>Ranked tokens</label>
            <select value={topK} onChange={(e) => setTopK(Number(e.target.value))}>
              <option value={5}>Top 5</option>
              <option value={10}>Top 10</option>
            </select>
            <button onClick={run} disabled={busy}>Predict Next Token</button>
            <div className={`status ${status ? "error" : ""}`}>{status || (busy ? "Loading model inference..." : "")}</div>
          </section>

          <section>
            <div className="card">
              <h3>{data?.model?.label || "Model Results"}</h3>
              {data?.model && (
                <div className="metric-row">
                  <div className="metric"><div className="value">{data.model.train_loss?.toFixed(3)}</div><div className="label">train loss</div></div>
                  <div className="metric"><div className="value">{data.model.val_loss?.toFixed(3)}</div><div className="label">validation loss</div></div>
                  <div className="metric"><div className="value">{data.top_tokens?.[0]?.token || ""}</div><div className="label">top next token</div></div>
                </div>
              )}
              <ScoreList rows={data?.top_tokens} tokenMode />
            </div>
          </section>
        </div>
      );
    }

    function Generation() {
      const [prompt, setPrompt] = useState("the fish tacos were");
      const [model, setModel] = useState("500k_5epochs");
      const [length, setLength] = useState(20);
      const [temperature, setTemperature] = useState(0.8);
      const [data, setData] = useState(null);
      const [status, setStatus] = useState("");
      const [busy, setBusy] = useState(false);

      async function run() {
        try {
          setBusy(true); setStatus("");
          const result = await postJson("/api/llm/generate", { prompt, model, length, temperature });
          setData(result);
        } catch (err) {
          setStatus(err.message);
        } finally {
          setBusy(false);
        }
      }

      useEffect(() => { run(); }, []);

      return (
        <div className="grid">
          <section className="panel">
            <h2>Generation</h2>
            <p>Generation repeats next-token prediction many times. Temperature controls how adventurous the sampling is.</p>
            <label>Prompt</label>
            <input value={prompt} onChange={(e) => setPrompt(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") run(); }} />
            <label>Pretrained model</label>
            <ModelSelect model={model} setModel={setModel} />
            <div className="two">
              <div>
                <label>Tokens</label>
                <select value={length} onChange={(e) => setLength(Number(e.target.value))}>
                  <option value={8}>8</option>
                  <option value={20}>20</option>
                  <option value={40}>40</option>
                </select>
              </div>
              <div>
                <label>Temperature</label>
                <select value={temperature} onChange={(e) => setTemperature(Number(e.target.value))}>
                  <option value={0.5}>0.5</option>
                  <option value={0.8}>0.8</option>
                  <option value={1.1}>1.1</option>
                </select>
              </div>
            </div>
            <button onClick={run} disabled={busy}>Generate Text</button>
            <div className={`status ${status ? "error" : ""}`}>{status || (busy ? "Generating..." : "")}</div>
          </section>

          <section>
            <div className="card">
              <h3>{data?.model?.label || "Generated Text"}</h3>
              {data?.model && (
                <div className="metric-row">
                  <div className="metric"><div className="value">{data.model.train_loss?.toFixed(3)}</div><div className="label">train loss</div></div>
                  <div className="metric"><div className="value">{data.model.val_loss?.toFixed(3)}</div><div className="label">validation loss</div></div>
                  <div className="metric"><div className="value">{temperature}</div><div className="label">temperature</div></div>
                </div>
              )}
              <div className="mono">{data?.text || "No generation yet."}</div>
            </div>
          </section>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState("embedding");
      return (
        <>
          <div className="tabs">
            <button className={`tab ${tab === "embedding" ? "active" : ""}`} onClick={() => setTab("embedding")}>Embedding Math</button>
            <button className={`tab ${tab === "next" ? "active" : ""}`} onClick={() => setTab("next")}>Next Token</button>
            <button className={`tab ${tab === "generation" ? "active" : ""}`} onClick={() => setTab("generation")}>Generation</button>
          </div>
          {tab === "embedding" && <EmbeddingMath />}
          {tab === "next" && <NextToken />}
          {tab === "generation" && <Generation />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
