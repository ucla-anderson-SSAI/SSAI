<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // Theme colors - Hybrid (dark header, light content)
        const colors = {
            // UCLA Brand colors (for header only)
            primary: '#2774AE',
            primaryLight: '#2774AE',
            accent: '#FFD100',
            accentDark: '#e6bc00',
            darkBlue: '#005587',
            lightBlue: '#8BB8E8',
            // Simplified - all same color for body
            positive: '#1a1a1a',
            negative: '#1a1a1a',
            warning: '#1a1a1a',
            // Content areas - clean white backgrounds
            cardBg: '#ffffff',
            cardBorder: 'rgba(0,0,0,0.1)',
            text: '#1a1a1a',
            textMuted: '#666666',
            // Legacy names mapped to simple scheme
            darkBg: '#ffffff',
            darkText: '#1a1a1a',
            darkMuted: '#c0c0c0',
            lightBg: '#ffffff',
            lightCard: '#ffffff',
            lightBorder: 'rgba(0,0,0,0.1)',
            lightText: '#1a1a1a',
            lightMuted: '#666666',
        };

        const API_BASE = window.location.origin;

        // Extended feature set (matches Week 1 notebook)
        const ALL_FEATURES = [
            // Base
            'price',
            // Lags
            'lag_1', 'lag_2', 'lag_3', 'lag_4', 'lag_5', 'lag_6',
            // Rolling stats
            'ma_3', 'ma_5', 'ma_7', 'std_3', 'std_5', 'std_7',
            // Price features
            'price_change', 'price_pct_change',
            // Squared terms
            'price_sq', 'lag_1_sq', 'lag_2_sq', 'lag_3_sq',
            // Price × lag interactions
            'price_x_lag_1', 'price_x_lag_2', 'price_x_lag_3', 'price_x_lag_4',
            // Price × rolling interactions
            'price_x_ma_3', 'price_x_ma_5', 'price_x_ma_7',
            // Cross-lag interactions
            'lag1_x_lag2', 'lag1_x_lag3', 'lag2_x_lag3',
            // Momentum ratios
            'lag1_over_lag2', 'lag1_over_ma3'
        ];

        const FEATURE_LABELS = {
            price: 'Price',
            lag_1: 'Lag 1',
            lag_2: 'Lag 2',
            lag_3: 'Lag 3',
            lag_4: 'Lag 4',
            lag_5: 'Lag 5',
            lag_6: 'Lag 6',
            ma_3: '3-Mo MA',
            ma_5: '5-Mo MA',
            ma_7: '7-Mo MA',
            std_3: '3-Mo Std',
            std_5: '5-Mo Std',
            std_7: '7-Mo Std',
            price_change: 'Price Δ',
            price_pct_change: 'Price Δ%',
            price_sq: 'Price²',
            lag_1_sq: 'Lag 1²',
            lag_2_sq: 'Lag 2²',
            lag_3_sq: 'Lag 3²',
            price_x_lag_1: 'Price×Lag1',
            price_x_lag_2: 'Price×Lag2',
            price_x_lag_3: 'Price×Lag3',
            price_x_lag_4: 'Price×Lag4',
            price_x_ma_3: 'Price×MA3',
            price_x_ma_5: 'Price×MA5',
            price_x_ma_7: 'Price×MA7',
            lag1_x_lag2: 'Lag1×Lag2',
            lag1_x_lag3: 'Lag1×Lag3',
            lag2_x_lag3: 'Lag2×Lag3',
            lag1_over_lag2: 'Lag1/Lag2',
            lag1_over_ma3: 'Lag1/MA3'
        };

        const FEATURE_DESCRIPTIONS = {
            price: 'Current price',
            lag_1: 'Sales from 1 month ago',
            lag_2: 'Sales from 2 months ago',
            lag_3: 'Sales from 3 months ago',
            lag_4: 'Sales from 4 months ago',
            lag_5: 'Sales from 5 months ago',
            lag_6: 'Sales from 6 months ago',
            ma_3: '3-month moving average of sales',
            ma_5: '5-month moving average of sales',
            ma_7: '7-month moving average of sales',
            std_3: '3-month rolling std dev of sales',
            std_5: '5-month rolling std dev of sales',
            std_7: '7-month rolling std dev of sales',
            price_change: 'Absolute price change',
            price_pct_change: 'Percentage price change',
            price_sq: 'Price squared (non-linear)',
            lag_1_sq: 'Lag 1 squared',
            lag_2_sq: 'Lag 2 squared',
            lag_3_sq: 'Lag 3 squared',
            price_x_lag_1: 'Price × Lag 1 interaction',
            price_x_lag_2: 'Price × Lag 2 interaction',
            price_x_lag_3: 'Price × Lag 3 interaction',
            price_x_lag_4: 'Price × Lag 4 interaction',
            price_x_ma_3: 'Price × 3-month MA interaction',
            price_x_ma_5: 'Price × 5-month MA interaction',
            price_x_ma_7: 'Price × 7-month MA interaction',
            lag1_x_lag2: 'Lag 1 × Lag 2 interaction',
            lag1_x_lag3: 'Lag 1 × Lag 3 interaction',
            lag2_x_lag3: 'Lag 2 × Lag 3 interaction',
            lag1_over_lag2: 'Lag 1 / Lag 2 momentum ratio',
            lag1_over_ma3: 'Lag 1 / 3-month MA momentum ratio'
        };

        // Mock data generator with extended features
        const generateMockData = (numPoints = 80) => {
            const data = [];
            for (let i = 0; i < numPoints; i++) {
                const price = 50 + Math.random() * 100;
                const lag1 = 100 + Math.random() * 200;
                const lag2 = 90 + Math.random() * 180;
                const lag3 = 85 + Math.random() * 170;
                const lag4 = 80 + Math.random() * 160;
                const lag5 = 78 + Math.random() * 155;
                const lag6 = 75 + Math.random() * 150;
                const noise = (Math.random() - 0.5) * 40;
                const std3 = 5 + Math.random() * 15;

                // True relationship with some features
                const sales = 300 - 1.5 * price + 0.6 * lag1 + 0.3 * lag2 + 0.1 * lag3 - 0.5 * std3 + noise;

                data.push({
                    id: i,
                    price,
                    lag_1: lag1,
                    lag_2: lag2,
                    lag_3: lag3,
                    lag_4: lag4,
                    lag_5: lag5,
                    lag_6: lag6,
                    ma_3: (lag1 + lag2 + lag3) / 3,
                    ma_5: (lag1 + lag2 + lag3 + lag4 + lag5) / 5,
                    ma_7: (lag1 + lag2 + lag3 + lag4 + lag5 + lag6 + (70 + Math.random() * 140)) / 7,
                    std_3: std3,
                    std_5: std3 * (0.9 + Math.random() * 0.3),
                    std_7: std3 * (0.85 + Math.random() * 0.4),
                    price_change: (Math.random() - 0.5) * 20,
                    price_pct_change: (Math.random() - 0.5) * 0.2,
                    price_sq: price * price,
                    lag_1_sq: lag1 * lag1,
                    lag_2_sq: lag2 * lag2,
                    lag_3_sq: lag3 * lag3,
                    price_x_lag_1: price * lag1,
                    price_x_lag_2: price * lag2,
                    price_x_lag_3: price * lag3,
                    price_x_lag_4: price * lag4,
                    price_x_ma_3: price * (lag1 + lag2 + lag3) / 3,
                    price_x_ma_5: price * (lag1 + lag2 + lag3 + lag4 + lag5) / 5,
                    price_x_ma_7: price * (lag1 + lag2 + lag3 + lag4 + lag5 + lag6 + 100) / 7,
                    lag1_x_lag2: lag1 * lag2,
                    lag1_x_lag3: lag1 * lag3,
                    lag2_x_lag3: lag2 * lag3,
                    lag1_over_lag2: lag2 !== 0 ? lag1 / lag2 : 0,
                    lag1_over_ma3: ((lag1 + lag2 + lag3) / 3) !== 0 ? lag1 / ((lag1 + lag2 + lag3) / 3) : 0,
                    actual_sales: Math.max(0, sales),
                });
            }
            return data;
        };

        // Compute regression with separate L1/L2 parameters
        const computeRegression = (data, features, modelType, lambdaVal, alphaVal, runCV, cvFolds) => {
            if (!data || data.length === 0 || features.length === 0) {
                return {
                    predictions: [],
                    coefficients: {},
                    metrics: { mae: 0, rmse: 0, r2: 0, n_train: 0, n_test: 0 },
                    cvResults: null
                };
            }

            const n = data.length;
            const coefficients = {};

            // Base coefficients (ground truth + noise)
            const baseCoeffs = {
                price: -1.4,
                lag_1: 0.55,
                lag_2: 0.28,
                lag_3: 0.12,
                lag_4: 0.08,
                lag_5: 0.05,
                lag_6: 0.03,
                ma_3: 0.45,
                ma_5: 0.30,
                ma_7: 0.20,
                std_3: -0.5,
                std_5: -0.35,
                std_7: -0.25,
                price_change: -0.8,
                price_pct_change: -25.0,
                price_sq: 0.002,
                lag_1_sq: 0.0001,
                lag_2_sq: 0.00005,
                lag_3_sq: 0.00003,
                price_x_lag_1: -0.005,
                price_x_lag_2: -0.003,
                price_x_lag_3: -0.002,
                price_x_lag_4: -0.001,
                price_x_ma_3: -0.004,
                price_x_ma_5: -0.003,
                price_x_ma_7: -0.002,
                lag1_x_lag2: 0.0002,
                lag1_x_lag3: 0.0001,
                lag2_x_lag3: 0.0001,
                lag1_over_lag2: 5.0,
                lag1_over_ma3: 3.0
            };

            // Add noise to base coefficients
            const noisyCoeffs = {};
            Object.keys(baseCoeffs).forEach(k => {
                noisyCoeffs[k] = baseCoeffs[k] * (0.85 + Math.random() * 0.3);
            });

            // Apply regularization effects
            let cvResults = null;
            let bestLambda = lambdaVal;
            let bestAlpha = alphaVal;

            if (runCV && modelType !== 'ols') {
                // Simulate cross-validation
                const cvScores = [];
                const lambdaValues = [0.01, 0.1, 0.5, 1.0, 2.0, 5.0];
                const alphaValues = modelType === 'elasticnet' ? [0.1, 0.3, 0.5, 0.7, 0.9, 1.0] : [null];

                lambdaValues.forEach(lam => {
                    alphaValues.forEach(alp => {
                        // Simulate CV score (lower is better)
                        const baseScore = 15 + Math.random() * 5;
                        const penaltyEffect = Math.abs(lam - 0.5) * 2 + (alp != null ? Math.abs(alp - 0.5) * 2 : 0);
                        const score = baseScore + penaltyEffect + (features.length > 8 ? -2 : 0);
                        cvScores.push({ lambda: lam, alpha: alp, score: score.toFixed(2), std: (Math.random() * 2).toFixed(2) });
                    });
                });

                // Find best
                const best = cvScores.reduce((a, b) => parseFloat(a.score) < parseFloat(b.score) ? a : b);
                bestLambda = best.lambda;
                bestAlpha = best.alpha != null ? best.alpha : alphaVal;
                cvResults = { lambda: bestLambda, alpha: bestAlpha, folds: cvFolds, modelType: modelType, nCombinations: cvScores.length };
            }

            // Apply regularization
            features.forEach(f => {
                let coeff = noisyCoeffs[f] || 0;

                if (modelType === 'lasso' || modelType === 'elasticnet') {
                    // L1: can shrink to zero
                    const l1Effect = bestLambda * (modelType === 'elasticnet' ? bestAlpha : 1) * 0.15;
                    if (Math.abs(coeff) < l1Effect * 2) {
                        coeff = 0;
                    } else {
                        coeff = coeff > 0 ? coeff - l1Effect : coeff + l1Effect;
                    }
                }

                if (modelType === 'ridge' || modelType === 'elasticnet') {
                    // L2: shrink toward zero
                    const l2Effect = bestLambda * (modelType === 'elasticnet' ? (1 - bestAlpha) : 1);
                    coeff = coeff / (1 + l2Effect * 0.1);
                }

                coefficients[f] = coeff;
            });

            // Compute predictions
            const predictions = [];
            let sumSquaredError = 0, sumAbsError = 0, sumActual = 0;
            const intercept = 180 + Math.random() * 40;

            data.forEach((point, i) => {
                let predicted = intercept;
                features.forEach(f => {
                    predicted += (coefficients[f] || 0) * (point[f] || 0);
                });
                predicted = Math.max(0, predicted);
                const actual = point.actual_sales;
                const error = actual - predicted;
                sumSquaredError += error * error;
                sumAbsError += Math.abs(error);
                sumActual += actual;
                predictions.push({
                    id: i,
                    x: point.price,
                    actual,
                    predicted,
                    residual: actual - predicted,
                    ...point
                });
            });

            const meanActual = sumActual / n;
            let ssTot = 0;
            data.forEach(point => { ssTot += Math.pow(point.actual_sales - meanActual, 2); });

            // Adjust metrics based on model complexity
            const overfitPenalty = modelType === 'ols' && features.length > 6 ? 1.2 : 1;

            return {
                predictions,
                coefficients,
                metrics: {
                    train_mae: (sumAbsError / n * 0.85).toFixed(2),
                    train_rmse: (Math.sqrt(sumSquaredError / n) * 0.85).toFixed(2),
                    train_r2: Math.min(0.99, Math.max(0, (1 - sumSquaredError * 0.7 / ssTot))).toFixed(3),
                    test_mae: (sumAbsError / n * overfitPenalty).toFixed(2),
                    test_rmse: (Math.sqrt(sumSquaredError / n) * overfitPenalty).toFixed(2),
                    test_r2: Math.max(0, Math.min(0.99, (1 - sumSquaredError / ssTot) / overfitPenalty)).toFixed(3),
                    n_train: Math.floor(n * 0.8),
                    n_test: Math.ceil(n * 0.2),
                },
                cvResults
            };
        };

        // Chart.js Scatter Component
        function ScatterChart({ data, xKey, yKey, title, xLabel, yLabel, color }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: title,
                            data: data.map(d => ({ x: d[xKey], y: d[yKey] })),
                            backgroundColor: color || colors.primary,
                            borderColor: color || colors.primary,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: {
                                title: { display: true, text: xLabel, color: colors.lightMuted, font: { size: 11 } },
                                grid: { color: 'rgba(0,0,0,0.06)' },
                                ticks: { color: colors.lightMuted, font: { size: 10 } }
                            },
                            y: {
                                title: { display: true, text: yLabel, color: colors.lightMuted, font: { size: 11 } },
                                grid: { color: 'rgba(0,0,0,0.06)' },
                                ticks: { color: colors.lightMuted, font: { size: 10 } }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, xKey, yKey, title, xLabel, yLabel, color]);

            return <canvas ref={canvasRef} />;
        }

        // Histogram Component
        function HistogramChart({ data, dataKey, label, color, bins = 15 }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data.length) return;
                if (chartRef.current) chartRef.current.destroy();

                // Calculate histogram bins
                const values = data.map(d => d[dataKey]).filter(v => v !== undefined && !isNaN(v));
                if (values.length === 0) return;

                const min = Math.min(...values);
                const max = Math.max(...values);
                const binWidth = (max - min) / bins || 1;
                const histogram = Array(bins).fill(0);
                const binLabels = [];

                for (let i = 0; i < bins; i++) {
                    const binStart = min + i * binWidth;
                    const binEnd = binStart + binWidth;
                    binLabels.push(binStart.toFixed(1));
                }

                values.forEach(v => {
                    const binIndex = Math.min(Math.floor((v - min) / binWidth), bins - 1);
                    histogram[binIndex]++;
                });

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: binLabels,
                        datasets: [{
                            label: 'Frequency',
                            data: histogram,
                            backgroundColor: color + '80',
                            borderColor: color,
                            borderWidth: 1,
                            borderRadius: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: {
                                title: { display: true, text: label, color: colors.lightMuted, font: { size: 11 } },
                                grid: { display: false },
                                ticks: { color: colors.lightMuted, font: { size: 9 }, maxRotation: 45 }
                            },
                            y: {
                                title: { display: true, text: 'Frequency', color: colors.lightMuted, font: { size: 11 } },
                                grid: { color: 'rgba(0,0,0,0.06)' },
                                ticks: { color: colors.lightMuted, font: { size: 10 } },
                                beginAtZero: true
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, dataKey, label, color, bins]);

            return <canvas ref={canvasRef} />;
        }

        // Data Explorer Component - flexible visualization panel
        function DataExplorer({ data, selectedFeatures, featureLabels }) {
            const [vizType, setVizType] = useState('scatter');
            const [xVar, setXVar] = useState('price');
            const [yVar, setYVar] = useState('actual_sales');
            const [histVar, setHistVar] = useState('actual_sales');

            // All available variables for visualization
            const allVars = ['actual_sales', ...ALL_FEATURES];
            const varLabels = { actual_sales: 'Sales (Y)', ...featureLabels };

            // Color palette for different variables
            const varColors = {
                actual_sales: colors.primary,
                price: colors.darkBlue,
                lag_1: colors.positive,
                lag_2: colors.positive,
                lag_3: colors.positive,
                lag_4: colors.positive,
                lag_5: colors.positive,
                lag_6: colors.positive,
                ma_3: colors.primaryDark,
                ma_5: colors.primaryDark,
                ma_7: colors.primaryDark,
                std_3: colors.lightBlue,
                std_5: colors.lightBlue,
                std_7: colors.lightBlue,
                price_change: colors.negative,
                price_pct_change: colors.negative,
                price_sq: colors.darkBlue,
                lag_1_sq: colors.positive,
                lag_2_sq: colors.positive,
                lag_3_sq: colors.positive,
                price_x_lag_1: '#8B5CF6',
                price_x_lag_2: '#8B5CF6',
                price_x_lag_3: '#8B5CF6',
                price_x_lag_4: '#8B5CF6',
                price_x_ma_3: '#8B5CF6',
                price_x_ma_5: '#8B5CF6',
                price_x_ma_7: '#8B5CF6',
                lag1_x_lag2: '#059669',
                lag1_x_lag3: '#059669',
                lag2_x_lag3: '#059669',
                lag1_over_lag2: '#D97706',
                lag1_over_ma3: '#D97706'
            };

            return (
                <div>
                    {/* Controls */}
                    <div style={{ display: 'flex', gap: '12px', marginBottom: '12px', flexWrap: 'wrap', alignItems: 'center' }}>
                        {/* Visualization Type Toggle */}
                        <div style={{ display: 'flex', gap: '4px', background: '#ffffff', borderRadius: '6px', padding: '3px' }}>
                            {[
                                { id: 'scatter', label: 'Scatter' },
                                { id: 'distribution', label: 'Distribution' }
                            ].map(type => (
                                <button
                                    key={type.id}
                                    onClick={() => setVizType(type.id)}
                                    style={{
                                        padding: '6px 12px',
                                        fontSize: '0.7rem',
                                        fontWeight: vizType === type.id ? '600' : '400',
                                        background: vizType === type.id ? colors.primary : 'transparent',
                                        color: vizType === type.id ? 'white' : colors.lightMuted,
                                        border: 'none',
                                        borderRadius: '4px',
                                        cursor: 'pointer',
                                        transition: 'all 0.2s ease'
                                    }}
                                >
                                    {type.label}
                                </button>
                            ))}
                        </div>

                        {vizType === 'scatter' && (
                            <>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                    <span style={{ fontSize: '0.7rem', color: colors.lightMuted, fontWeight: '500' }}>X:</span>
                                    <select
                                        value={xVar}
                                        onChange={(e) => setXVar(e.target.value)}
                                        style={{
                                            padding: '6px 10px',
                                            fontSize: '0.75rem',
                                            background: '#ffffff',
                                            border: `1px solid ${colors.lightBorder}`,
                                            borderRadius: '4px',
                                            color: colors.lightText,
                                            cursor: 'pointer'
                                        }}
                                    >
                                        {allVars.map(v => (
                                            <option key={v} value={v}>{varLabels[v]}</option>
                                        ))}
                                    </select>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                    <span style={{ fontSize: '0.7rem', color: colors.lightMuted, fontWeight: '500' }}>Y:</span>
                                    <select
                                        value={yVar}
                                        onChange={(e) => setYVar(e.target.value)}
                                        style={{
                                            padding: '6px 10px',
                                            fontSize: '0.75rem',
                                            background: '#ffffff',
                                            border: `1px solid ${colors.lightBorder}`,

        // Regularization Path Chart
        function RegPathChart({ regPath, bestAlpha, yKey, yLabel, title, color }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !regPath || regPath.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const alphas = regPath.map(p => p.alpha);
                const yValues = regPath.map(p => p[yKey]);

                const ctx = canvasRef.current.getContext('2d');

                // Build a plugin to draw the best-alpha vertical line
                const bestAlphaPlugin = {
                    id: 'bestAlphaLine',
                    afterDraw(chart) {
                        if (!bestAlpha) return;
                        const xScale = chart.scales.x;
                        const yScale = chart.scales.y;
                        const xPixel = xScale.getPixelForValue(bestAlpha);
                        if (xPixel < xScale.left || xPixel > xScale.right) return;
                        const drawCtx = chart.ctx;
                        drawCtx.save();
                        drawCtx.beginPath();
                        drawCtx.setLineDash([6, 3]);
                        drawCtx.strokeStyle = '#e74c3c';
                        drawCtx.lineWidth = 2;
                        drawCtx.moveTo(xPixel, yScale.top);
                        drawCtx.lineTo(xPixel, yScale.bottom);
                        drawCtx.stroke();
                        drawCtx.setLineDash([]);
                        drawCtx.fillStyle = '#e74c3c';
                        drawCtx.font = '10px Inter, sans-serif';
                        drawCtx.textAlign = 'center';
                        drawCtx.fillText('best λ', xPixel, yScale.top - 4);
                        drawCtx.restore();
                    }
                };

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: alphas,
                        datasets: [{
                            label: yLabel,
                            data: yValues,
                            borderColor: color,
                            backgroundColor: color + '20',
                            borderWidth: 2,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                            fill: false,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: {
                                type: 'logarithmic',
                                title: { display: true, text: 'λ (log scale)', color: '#666', font: { size: 11 } },
                                grid: { color: 'rgba(0,0,0,0.06)' },
                                ticks: {
                                    color: '#666',
                                    font: { size: 10 },
                                    callback: function(value) {
                                        if (value >= 1) return value.toFixed(0);
                                        if (value >= 0.01) return value.toFixed(2);
                                        return value.toExponential(0);
                                    }
                                }
                            },
                            y: {
                                title: { display: true, text: yLabel, color: '#666', font: { size: 11 } },
                                grid: { color: 'rgba(0,0,0,0.06)' },
                                ticks: { color: '#666', font: { size: 10 } },
                                beginAtZero: yKey === 'n_nonzero'
                            }
                        }
                    },
                    plugins: [bestAlphaPlugin]
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [regPath, bestAlpha, yKey, yLabel, title, color]);

            return <canvas ref={canvasRef} />;
        }

                                                    }}>
                                                        <input type="checkbox" checked={runCV} onChange={(e) => setRunCV(e.target.checked)}
                                                            disabled={modelType === 'ols'}
                                                            style={{ width: '16px', height: '16px' }} />
                                                        <span style={{ fontSize: '0.85rem', color: colors.lightText }}>Choose regularization parameters with CV</span>
                                                    </label>
                                                    <select value={cvFolds} onChange={(e) => setCvFolds(parseInt(e.target.value))}
                                                        disabled={!runCV || modelType === 'ols'}
                                                        style={{
                                                            padding: '8px 12px', background: '#ffffff',
                                                            border: `1px solid ${colors.lightBorder}`, borderRadius: '6px',
                                                            color: colors.lightText, fontSize: '0.8rem',
                                                            opacity: (!runCV || modelType === 'ols') ? 0.4 : 1
                                                        }}>
                                                        {[3, 5, 10].map(k => <option key={k} value={k}>{k}-fold</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Features Selection */}
                                        <div style={{ marginBottom: '24px' }}>
                                            <label style={{ display: 'block', fontSize: '0.7rem', color: colors.lightMuted, marginBottom: '12px', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: '600' }}>
                                                Engineered Features ({selectedFeatures.length} selected)
                                            </label>
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '8px' }}>
                                                {ALL_FEATURES.map(feature => (
                                                    <label key={feature} title={FEATURE_DESCRIPTIONS[feature]} style={{
                                                        display: 'flex', alignItems: 'center', gap: '8px', padding: '10px 14px',
                                                        background: selectedFeatures.includes(feature) ? 'rgba(39, 116, 174, 0.12)' : colors.lightBg,
                                                        border: `2px solid ${selectedFeatures.includes(feature) ? colors.primary : 'transparent'}`,
                                                        borderRadius: '8px', cursor: 'pointer', fontSize: '0.8rem',
                                                        color: selectedFeatures.includes(feature) ? colors.primary : colors.lightMuted,
                                                        transition: 'all 0.2s ease',
                                                        fontWeight: selectedFeatures.includes(feature) ? '600' : '400'
                                                    }}>
                                                        <input type="checkbox" checked={selectedFeatures.includes(feature)}
                                                            onChange={() => toggleFeature(feature)}
                                                            style={{ width: '14px', height: '14px' }} />
                                                        {FEATURE_LABELS[feature]}
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Train Button */}
                                        <div style={{ textAlign: 'center' }}>
                                            <button onClick={trainModel} disabled={isAnimating} style={{
                                                background: isAnimating ? '#ccc' : `linear-gradient(135deg, ${colors.primary} 0%, ${colors.darkBlue} 100%)`,
                                                border: 'none', color: 'white', padding: '14px 48px', borderRadius: '8px',
                                                fontSize: '0.9rem', fontWeight: '600', cursor: isAnimating ? 'not-allowed' : 'pointer',
                                                transition: 'all 0.2s ease',
                                                boxShadow: isAnimating ? 'none' : '0 4px 16px rgba(39, 116, 174, 0.3)'
                                            }}>
                                                {isAnimating ? 'Fitting Model...' : 'Train Model'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* CV Results (if enabled) */}
                                    {cvResults && (
                                        <div style={{
                                            background: 'rgba(39, 116, 174, 0.08)',
                                            borderRadius: '12px',
                                            padding: '16px 20px',
                                            border: `1px solid rgba(39, 116, 174, 0.2)`,
                                            marginBottom: '24px'
                                        }}>
                                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '16px' }}>
                                                <div>
                                                    <span style={{ fontSize: '0.75rem', color: colors.lightMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                                        {cvResults.folds}-Fold Cross-Validation Results
                                                    </span>
                                                    <div style={{ marginTop: '4px', fontSize: '0.9rem', color: colors.lightText }}>
                                                        {cvResults.lambda != null ? (
                                                            <>
                                                                Best parameters: <strong style={{ color: colors.text }}>λ = {typeof cvResults.lambda === 'number' ? cvResults.lambda.toFixed(4) : cvResults.lambda}</strong>
                                                                {cvResults.alpha != null && cvResults.modelType === 'elasticnet' && <>, <strong style={{ color: colors.darkBlue }}>α = {typeof cvResults.alpha === 'number' ? cvResults.alpha.toFixed(2) : cvResults.alpha}</strong></>}
                                                            </>
                                                        ) : (
                                                            <>
                                                                Best parameters: <strong style={{ color: colors.text }}>λ = {cvResults.bestL1}</strong>
                                                                {showAlpha && <>, <strong style={{ color: colors.darkBlue }}>α = {cvResults.bestL2}</strong></>}
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                                <div style={{ fontSize: '0.8rem', color: colors.lightMuted }}>
                                                    Tested {cvResults.nCombinations || '~100'} hyperparameter combinations
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Metrics */}
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', marginBottom: '24px' }}>
                                        {[
                                            { label: 'Train MAE (in-sample)', value: metrics.train_mae, color: colors.lightMuted },
                                            { label: 'Test MAE (out-of-sample)', value: metrics.test_mae, color: colors.text },
                                            { label: 'Train R²', value: metrics.train_r2, color: colors.lightMuted },
                                            { label: 'Test R²', value: metrics.test_r2, color: colors.text },
                                        ].map((m, i) => (
                                            <div key={i} style={{
                                                background: colors.lightCard,
                                                borderRadius: '12px',
                                                padding: '16px 12px',
                                                border: `1px solid ${colors.lightBorder}`,
                                                textAlign: 'center',
                                                boxShadow: '0 2px 8px rgba(0,0,0,0.04)'
                                            }}>
                                                <div style={{ fontSize: '0.6rem', color: colors.lightMuted, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: '600' }}>{m.label}</div>
                                                <div style={{ fontSize: '1.4rem', fontWeight: '700', color: m.color, marginTop: '6px' }}>{m.value}</div>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', marginBottom: '24px' }}>
                                        {[
                                            { label: 'Train RMSE', value: metrics.train_rmse, color: colors.lightMuted },
                                            { label: 'Test RMSE', value: metrics.test_rmse, color: colors.darkBlue },
                                            { label: 'Train Size', value: metrics.n_train, color: colors.lightMuted },
                                            { label: 'Test Size', value: metrics.n_test, color: colors.lightMuted },
                                        ].map((m, i) => (
                                            <div key={i} style={{
                                                background: colors.lightCard,
                                                borderRadius: '12px',
                                                padding: '16px 12px',
                                                border: `1px solid ${colors.lightBorder}`,
                                                textAlign: 'center',
                                                boxShadow: '0 2px 8px rgba(0,0,0,0.04)'
                                            }}>
                                                <div style={{ fontSize: '0.6rem', color: colors.lightMuted, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: '600' }}>{m.label}</div>
                                                <div style={{ fontSize: '1.4rem', fontWeight: '700', color: m.color, marginTop: '6px' }}>{m.value}</div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Charts and Coefficients */}
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '24px' }}>
                                        <div style={{ background: colors.lightCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.lightBorder}`, boxShadow: '0 2px 8px rgba(0,0,0,0.04)' }}>
                                            <h3 style={{ marginBottom: '12px', fontSize: '0.85rem', color: colors.lightText, fontWeight: '600' }}>
                                                Data Explorer
                                            </h3>
                                            <DataExplorer
                                                data={predictions}
                                                selectedFeatures={selectedFeatures}
                                                featureLabels={FEATURE_LABELS}
                                            />
                                        </div>

                                        <div style={{ background: colors.lightCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.lightBorder}`, boxShadow: '0 2px 8px rgba(0,0,0,0.04)' }}>
                                            <h3 style={{ marginBottom: '16px', fontSize: '0.85rem', color: colors.lightText, fontWeight: '600' }}>Residual Plot</h3>
                                            <div style={{ height: '240px' }}>
                                                <ScatterChart data={residualsData} xKey="predicted" yKey="residual" title="Residuals" xLabel="Predicted" yLabel="Residual" color={colors.lightBlue} />
                                            </div>
                                        </div>

                                        <div style={{ background: colors.lightCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.lightBorder}`, boxShadow: '0 2px 8px rgba(0,0,0,0.04)' }}>
                                            <h3 style={{ marginBottom: '16px', fontSize: '0.85rem', color: colors.lightText, fontWeight: '600' }}>Actual vs Predicted</h3>
                                            <div style={{ height: '240px' }}>
                                                <ScatterChart data={predictions} xKey="actual" yKey="predicted" title="Predicted" xLabel="Actual" yLabel="Predicted" color={colors.accentDark} />
                                            </div>
                                        </div>

                                        <div style={{ background: colors.lightCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.lightBorder}`, boxShadow: '0 2px 8px rgba(0,0,0,0.04)' }}>
                                            <h3 style={{ marginBottom: '16px', fontSize: '0.85rem', color: colors.lightText, fontWeight: '600' }}>
                                                Feature Coefficients <span style={{ fontWeight: '400', color: colors.lightMuted }}>(Normalized)</span>
                                            </h3>
                                            <div style={{ height: '240px', overflow: 'auto' }}>
                                                <CoefficientTable coefficients={coefficients} featureLabels={FEATURE_LABELS} />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Regularization Path Plots (shown when CV is used) */}
                                    {regPath && regPath.length > 0 && (
                                        <div style={{
                                            background: colors.lightCard,
                                            borderRadius: '12px',
                                            padding: '24px',
                                            border: `1px solid ${colors.lightBorder}`,
                                            marginBottom: '24px',
                                            boxShadow: '0 2px 8px rgba(0,0,0,0.04)'
                                        }}>
                                            <h3 style={{ marginBottom: '4px', fontSize: '0.85rem', color: colors.lightText, fontWeight: '600' }}>
                                                Regularization Path
                                            </h3>
                                            <p style={{ marginBottom: '20px', fontSize: '0.75rem', color: colors.lightMuted }}>
                                                How cross-validated error and feature count change as regularization strength (λ) increases
                                            </p>
                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }}>
                                                <div>
                                                    <h4 style={{ marginBottom: '8px', fontSize: '0.75rem', color: colors.lightMuted, textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: '600' }}>
                                                        CV Error vs Regularization Strength
                                                    </h4>
                                                    <div style={{ height: '260px' }}>
                                                        <RegPathChart
                                                            regPath={regPath}
                                                            bestAlpha={cvResults?.lambda}
                                                            yKey="cv_mae"
                                                            yLabel="CV MAE"
                                                            title="CV Error"
                                                            color={colors.primary}
                                                        />
                                                    </div>
                                                </div>
                                                <div>
                                                    <h4 style={{ marginBottom: '8px', fontSize: '0.75rem', color: colors.lightMuted, textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: '600' }}>
                                                        Non-Zero Coefficients vs Regularization Strength
                                                    </h4>
                                                    <div style={{ height: '260px' }}>
                                                        <RegPathChart
                                                            regPath={regPath}
                                                            bestAlpha={cvResults?.lambda}
                                                            yKey="n_nonzero"
                                                            yLabel="Non-Zero Features"
                                                            title="Feature Selection"
                                                            color="#D97706"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </>
                        </div>
                    </div>

                    {/* FOOTER */}
                    <p style={{ color: colors.textDim || '#888', fontSize: '0.75rem', marginTop: '20px', textAlign: 'center' }}>
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LinearRegressionApp />);
    </script>
</body>
</html>
