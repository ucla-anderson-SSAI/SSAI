                                <CNNPipeline config={config} isTraining={isTraining} />
                            </div>
                        </div>
                    </div>

                    <div className="grid-2" style={{ marginTop: '1.5rem' }}>
                        <div className="section-card">
                            <div className="section-title">Accuracy vs Epoch</div>
                            <div className="chart-container"><TrainingChart trainingHistory={trainingHistory} totalEpochs={config.epochs} /></div>
                        </div>
                        <div className="section-card">
                            <div className="section-title">Loss vs Epoch</div>
                            <div className="chart-container"><LossChart trainingHistory={trainingHistory} totalEpochs={config.epochs} /></div>
                        </div>
                    </div>

                    <div className="grid-2" style={{ marginTop: '1.5rem' }}>
                        <div className="section-card">
                            <div className="section-title">Training Samples (Bears, Lions, Tigers)</div>
                            <div className="grid-4">
                                {sampleImages.map((img, idx) => (
                                    <SampleImage key={idx} imageData={img.imageData} trueLabel={img.trueLabel} predictedLabel={img.trueLabel} showResult={false} />
                                ))}
                            </div>
                        </div>
                        <div className="section-card">
                            <div className="section-title">Classification Results</div>
                            {classificationResults.length > 0 ? (
                                <div className="grid-4">
                                    {classificationResults.map((img, idx) => (
                                        <SampleImage key={idx} imageData={img.imageData} trueLabel={img.trueLabel} predictedLabel={img.predictedLabel} showResult={true} probabilities={img.probabilities} />
                                    ))}
                                </div>
                            ) : (
                                <div style={{ textAlign: 'center', padding: '2rem', color: '#888' }}>Train the model to see classification results</div>
                            )}
                        </div>
                    </div>

                </div>
            );
        };

        // Transfer Learning Tab - Real MobileNetV2 fine-tuning
        const TransferLearningTab = () => {
            const [strategy, setStrategy] = useState('finetune');
            const [freezeLayers, setFreezeLayers] = useState(90);
            const [numSamples, setNumSamples] = useState(300);
            const [isTraining, setIsTraining] = useState(false);
            const [trainingHistory, setTrainingHistory] = useState([]);
            const [trainingStatus, setTrainingStatus] = useState('');
            const [testAccuracy, setTestAccuracy] = useState(null);
            const [classificationResults, setClassificationResults] = useState([]);
            const [modelInfo, setModelInfo] = useState(null);
            const [backendStatus, setBackendStatus] = useState('checking');

            const TOTAL_MOBILENET_LAYERS = 155; // MobileNetV2 layer count
            const frozenLayers = Math.round(TOTAL_MOBILENET_LAYERS * freezeLayers / 100);
            const MAX_EPOCHS = 5;

            useEffect(() => {
                fetch(`${API_BASE_URL}/api/health`)
                    .then(r => r.json())
                    .then(() => setBackendStatus('connected'))
                    .catch(() => setBackendStatus('disconnected'));
            }, []);

            const runTransferLearning = async () => {
                setIsTraining(true);
                setTrainingHistory([]);
                setClassificationResults([]);
                setTestAccuracy(null);
                setModelInfo(null);
                setTrainingStatus('Starting MobileNetV2 transfer learning...');

                try {
                    const response = await fetch(`${API_BASE_URL}/api/transfer/train`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            strategy,
                            freezeLayers,
                            numSamples,
                            epochs: MAX_EPOCHS
                        })
                    });

                    if (!response.ok) throw new Error('Failed to start transfer learning');

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    const historyAccum = [];

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            const msg = JSON.parse(line);

                            if (msg.type === 'model_info') {
                                setModelInfo(msg.model_info);
                            }

                            if (msg.type === 'epoch') {
                                setTrainingStatus(`Epoch ${msg.epoch}/${msg.total_epochs}`);
                                historyAccum.push({
                                    trainAcc: msg.trainAcc,
                                    valAcc: msg.valAcc,
                                    trainLoss: msg.trainLoss,
                                    valLoss: msg.valLoss
                                });
                                setTrainingHistory([...historyAccum]);
                            }

                            if (msg.type === 'final') {
                                if (msg.test_accuracy) setTestAccuracy(msg.test_accuracy);
                                if (msg.model_info) setModelInfo(msg.model_info);
                                if (msg.sample_predictions) {
                                    setClassificationResults(msg.sample_predictions.map(pred => ({
                                        imageData: pred.imageData,
                                        trueLabel: CLASSES[pred.true],
                                        predictedLabel: CLASSES[pred.predicted],
                                        probabilities: pred.probabilities || null
                                    })));
                                }
                                setTrainingStatus('Training complete!');
                            }

                            if (msg.type === 'error') {
                                throw new Error(msg.detail || 'Training failed');
                            }
                        }
                    }
                } catch (error) {
                    console.error('Transfer learning error:', error);
                    setTrainingStatus(`Error: ${error.message}`);
                }

                setIsTraining(false);
            };

            const latestMetrics = trainingHistory.length > 0 ? trainingHistory[trainingHistory.length - 1] : null;

            return (
                <div>
                    <div className="grid-2-fixed">
                        <div className="section-card">
                            <div className="section-title">MobileNetV2 Transfer Learning</div>

                            <div style={{
                                padding: '0.75rem 1rem', borderRadius: '8px', marginBottom: '1rem',
                                background: 'rgba(39,116,174,0.05)', border: '1px solid rgba(39,116,174,0.15)'
                            }}>
                                <div style={{ fontWeight: 600, fontSize: '0.85rem', color: '#2774AE' }}>MobileNetV2</div>
                                <div style={{ fontSize: '0.75rem', color: '#666', marginTop: '0.25rem' }}>
                                    Lightweight CNN (3.4M params) pre-trained on ImageNet's 1.2M images across 1,000 categories · We reuse its learned visual features and replace the final classifier to distinguish our 3 animal classes
                                </div>
                            </div>

                            <div className="control-group">
                                <div className="control-label">Transfer Strategy</div>
                                <div className="button-group">
                                    <button className={`option-btn ${strategy === 'feature' ? 'active' : ''}`}
                                        onClick={() => setStrategy('feature')}>Frozen Backbone</button>
                                    <button className={`option-btn ${strategy === 'finetune' ? 'active' : ''}`}
                                        onClick={() => setStrategy('finetune')}>Fine-tuning</button>
                                </div>
                                <div style={{ fontSize: '0.7rem', color: '#888', marginTop: '0.3rem' }}>
                                    {strategy === 'feature'
                                        ? 'Use MobileNetV2 as a fixed feature extractor — all backbone layers are frozen, and only the new 3-class classifier head is trained'
                                        : ''}
                                </div>
                            </div>

                            {strategy !== 'feature' && (
                                <div className="control-group" style={{ marginTop: '1rem' }}>
                                    <div className="control-label">
                                        <span>Freeze Layers</span>
                                        <span className="control-value">{freezeLayers}% (~{frozenLayers}/{TOTAL_MOBILENET_LAYERS})</span>
                                    </div>
                                    <input type="range" className="slider" min="50" max="100" value={freezeLayers}
                                        onChange={(e) => setFreezeLayers(parseInt(e.target.value))} />
                                </div>
                            )}

                            <div style={{ display: 'flex', gap: '0.5rem', marginTop: '0.5rem' }}>
                                <div style={{
                                    flex: strategy === 'feature' ? 100 : freezeLayers,
                                    background: 'linear-gradient(90deg, #8BB8E8, #2774AE)',
                                    padding: '0.4rem', borderRadius: '6px', color: 'white', fontSize: '0.7rem', textAlign: 'center'
                                }}>Frozen</div>
                                {strategy !== 'feature' && (
                                    <div style={{
                                        flex: 100 - freezeLayers,
                                        background: 'linear-gradient(90deg, #FFD100, #FFA500)',
                                        padding: '0.4rem', borderRadius: '6px', color: '#333', fontSize: '0.7rem', textAlign: 'center'
                                    }}>Trainable</div>
                                )}
                            </div>

                            <div className="control-group" style={{ marginTop: '1rem' }}>
                                <div className="control-label">Training Samples</div>
                                <div style={{ display: 'flex', gap: '0.5rem' }}>
                                    {[100, 300, 500].map(n => (
                                        <button key={n} onClick={() => setNumSamples(n)}
                                            style={{
                                                flex: 1, padding: '0.5rem', border: numSamples === n ? '2px solid #2774AE' : '1px solid #ddd',
                                                borderRadius: '6px', background: numSamples === n ? '#2774AE' : '#f5f5f5',
                                                color: numSamples === n ? 'white' : '#333', cursor: 'pointer',
                                                fontWeight: numSamples === n ? 'bold' : 'normal', fontSize: '0.85rem'
                                            }}>{n}</button>
                                    ))}
                                </div>
                            </div>


                            <button className={`train-btn ${isTraining ? 'training' : ''}`} onClick={runTransferLearning}
                                disabled={isTraining || backendStatus !== 'connected'}>
                                {isTraining ? 'Training on Google Cloud...' : `Train MobileNetV2 (TensorFlow/Keras)`}
                            </button>

                            {isTraining && (
                                <div className="training-progress">
                                    <div className="progress-bar">
                                        <div className="progress-fill" style={{ width: `${trainingHistory.length / MAX_EPOCHS * 100}%` }} />
                                    </div>
                                    <div className="progress-text">
                                        {trainingStatus} — {Math.round(trainingHistory.length / MAX_EPOCHS * 100)}% complete
                                    </div>
                                </div>
                            )}

                            {testAccuracy && (
                                <div style={{ marginTop: '0.5rem', fontSize: '0.8rem', color: '#4CAF50' }}>
                                    ✓ Test Accuracy: {testAccuracy.toFixed(1)}%
                                </div>
                            )}
                        </div>

                        <div className="section-card">
                            <div className="section-title">Training Progress</div>
                            <div className="chart-container">
                                <TrainingChart trainingHistory={trainingHistory} totalEpochs={MAX_EPOCHS} />
                            </div>

                            {latestMetrics && (
                                <div className="metrics-grid" style={{ marginTop: '1rem', gridTemplateColumns: 'repeat(2, 1fr)' }}>
                                    <div className="metric-item">
                                        <div className="metric-value">{latestMetrics.valAcc.toFixed(1)}%</div>
                                        <div className="metric-label">Val Accuracy</div>
                                    </div>
                                    <div className="metric-item">
                                        <div className="metric-value">{latestMetrics.trainLoss.toFixed(3)}</div>
                                        <div className="metric-label">Train Loss</div>
                                    </div>
                                </div>
                            )}

                            {modelInfo && (
                                <div style={{ marginTop: '1rem', padding: '0.75rem', background: '#f8f9fa', borderRadius: '8px', fontSize: '0.75rem', color: '#555' }}>
                                    <div style={{ fontWeight: 600, marginBottom: '0.25rem', color: '#333' }}>Model Details</div>
                                    <div>Total params: {(modelInfo.total_params / 1e6).toFixed(1)}M</div>
                                    <div>Trainable params: {(modelInfo.trainable_params / 1e6).toFixed(2)}M</div>
                                    <div>Frozen / Trainable layers: {modelInfo.frozen_layers} / {modelInfo.trainable_layers}</div>
                                </div>
                            )}
                        </div>
                    </div>

                    {classificationResults.length > 0 && (
                        <div className="section-card" style={{ marginTop: '1.5rem' }}>
                            <div className="section-title">Classification Results (MobileNetV2)</div>
                            <div className="grid-4">
                                {classificationResults.map((img, idx) => (
                                    <SampleImage key={idx} imageData={img.imageData} trueLabel={img.trueLabel}
                                        predictedLabel={img.predictedLabel} showResult={true} probabilities={img.probabilities} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Facial Expression Recognition Tab
        const FacialExpressionTab = () => {
            const [isModelLoaded, setIsModelLoaded] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [loadingStatus, setLoadingStatus] = useState('Loading face detection models...');
            const [isRunning, setIsRunning] = useState(false);
            const [expressions, setExpressions] = useState(null);
            const [error, setError] = useState(null);
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamRef = useRef(null);
            const animationRef = useRef(null);
            
            const expressionLabels = {
                neutral: 'Neutral',
                happy: 'Happy',
                sad: 'Sad',
                angry: 'Angry',
                fearful: 'Fearful',
                disgusted: 'Disgusted',
                surprised: 'Surprised'
            };
            
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
            
            // Load models on mount
            useEffect(() => {
                const loadModels = async () => {
                    try {
                        setLoadingStatus('Loading face detection model...');
                        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                        
                        setLoadingStatus('Loading expression recognition model...');
                        await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                        
                        setIsModelLoaded(true);
                        setIsLoading(false);
                        setLoadingStatus('Models loaded! Click "Start Camera" to begin.');
                    } catch (err) {
                        console.error('Error loading models:', err);
                        setError('Failed to load face detection models. Please refresh the page.');
                        setIsLoading(false);
                    }
                };
                
                loadModels();
                
                return () => {
                    stopCamera();
                };
            }, []);
            
            const startCamera = async () => {
                try {
                    setError(null);
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
                    });
                    
                    streamRef.current = stream;
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        videoRef.current.onloadedmetadata = () => {
                            if (canvasRef.current) {
                                canvasRef.current.width = videoRef.current.videoWidth;
                                canvasRef.current.height = videoRef.current.videoHeight;
                            }
                            setIsRunning(true);
                            detectExpressions();
                        };
                    }
                } catch (err) {
                    console.error('Camera error:', err);
                    setError('Could not access camera. Please allow camera permissions.');
                }
            };
            
            const stopCamera = () => {
                setIsRunning(false);
                if (animationRef.current) {
                    cancelAnimationFrame(animationRef.current);
                    animationRef.current = null;
                }
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
                if (canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                }
                setExpressions(null);
            };
            
            const detectExpressions = async () => {
                if (!videoRef.current || !canvasRef.current || !isModelLoaded) return;
                
                const detections = await faceapi
                    .detectAllFaces(videoRef.current, new faceapi.TinyFaceDetectorOptions())
                    .withFaceExpressions();
                
                const ctx = canvasRef.current.getContext('2d');
                ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                
                if (detections.length > 0) {
                    // Draw face boxes
                    detections.forEach(detection => {
                        const box = detection.detection.box;
                        ctx.strokeStyle = '#2774AE';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        
                        // Draw expression label above box
                        const sorted = Object.entries(detection.expressions).sort((a, b) => b[1] - a[1]);
                        const [topExpr, topConf] = sorted[0];
                        const label = `${topExpr} (${(topConf * 100).toFixed(0)}%)`;
                        
                        ctx.fillStyle = '#2774AE';
                        ctx.fillRect(box.x, box.y - 25, ctx.measureText(label).width + 16, 22);
                        ctx.fillStyle = 'white';
                        ctx.font = '14px Inter, sans-serif';
                        ctx.fillText(label, box.x + 8, box.y - 8);
                    });
                    
                    setExpressions(detections[0].expressions);
                } else {
                    setExpressions(null);
                }
                
                if (streamRef.current) {
                    animationRef.current = requestAnimationFrame(detectExpressions);
                }
            };
            
            const sortedExpressions = expressions 
                ? Object.entries(expressions).sort((a, b) => b[1] - a[1])
                : null;
            
            const topExpression = sortedExpressions ? sortedExpressions[0] : null;
            
            return (
                <div>
                    <div className="grid-2">
                        <div className="section-card">
                            <div className="section-title">Live Camera Feed</div>
                            
                            <div style={{ position: 'relative', width: '100%', borderRadius: '8px', overflow: 'hidden', background: '#000' }}>
                                <video 
                                    ref={videoRef} 
                                    autoPlay 
                                    muted 
                                    playsInline
                                    style={{ width: '100%', display: 'block', transform: 'scaleX(-1)' }}
                                />
                                <canvas 
                                    ref={canvasRef}
                                    style={{ 
                                        position: 'absolute', 
                                        top: 0, 
                                        left: 0, 
                                        width: '100%', 
                                        height: '100%',
                                        transform: 'scaleX(-1)'
                                    }}
                                />
                                {!isRunning && (
                                    <div style={{
                                        position: 'absolute',
                                        top: 0, left: 0, right: 0, bottom: 0,
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        background: 'rgba(0,0,0,0.7)',
                                        color: 'white',
                                        fontSize: '1.2rem'
                                    }}>
                                        {isLoading ? 'Loading models...' : 'Camera not started'}
                                    </div>
                                )}
                            </div>
                            
                            <div style={{
                                marginTop: '1rem',
                                padding: '0.75rem 1rem',
                                background: isLoading ? '#fff3cd' : error ? '#f8d7da' : isRunning ? '#d4edda' : '#f8f9fa',
                                borderRadius: '8px',
                                fontSize: '0.85rem',
                                color: isLoading ? '#856404' : error ? '#721c24' : isRunning ? '#155724' : '#666'
                            }}>
                                {error || loadingStatus}
                            </div>
                            
                            <button
                                className="train-btn"
                                style={{ marginTop: '1rem' }}
                                onClick={isRunning ? stopCamera : startCamera}
                                disabled={isLoading || !!error}
                            >
                                {isRunning ? 'Stop Camera' : 'Start Camera'}
                            </button>
                        </div>
                        
                        <div className="section-card">
                            <div className="section-title">Expression Detection</div>
                            
                            {sortedExpressions && topExpression ? (
                                <>
                                    <div style={{ textAlign: 'center', padding: '1.5rem' }}>
                                        <div style={{ fontSize: '1.5rem', fontWeight: 700, color: '#2774AE', textTransform: 'capitalize' }}>
                                            {topExpression[0]}
                                        </div>
                                        <div style={{ fontSize: '0.9rem', color: '#666', marginTop: '0.25rem' }}>
                                            {(topExpression[1] * 100).toFixed(1)}% confidence
                                        </div>
                                    </div>
                                    
                                    <div style={{ marginTop: '1rem' }}>
                                        {sortedExpressions.map(([expr, conf], idx) => (
                                            <div key={expr} className="confidence-bar-item">
                                                <div className="confidence-bar-label" style={{ width: '100px', textTransform: 'capitalize' }}>
                                                    {expr}
                                                </div>
                                                <div className="confidence-bar-track">
                                                    <div 
                                                        className="confidence-bar-fill" 
                                                        style={{ 
                                                            width: `${Math.max(conf * 100, 2)}%`,
                                                            background: idx === 0 ? '#2774AE' : '#94a3b8'
                                                        }}
                                                    >
                                                        {conf > 0.1 ? `${(conf * 100).toFixed(0)}%` : ''}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : (
                                <div style={{ textAlign: 'center', padding: '3rem', color: '#888' }}>
                                    <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>
                                        {isRunning ? '' : ''}
                                    </div>
                                    {isRunning 
                                        ? 'No face detected — make sure your face is visible'
                                        : 'Start the camera to detect expressions'}
                                </div>
                            )}
                        </div>
                    </div>
                    
                </div>
            );
        };

        // Main App with Context Provider
        const App = () => {
            const [activeTab, setActiveTab] = useState('cnn');
            const [config, setConfig] = useState({
                convBlocks: 2, filters: 32, kernelSize: 3,
                poolType: 'max', batchNorm: false, epochs: 10, numSamples: 300
            });
            const [trainingHistory, setTrainingHistory] = useState([]);
            const [isModelTrained, setIsModelTrained] = useState(false);
            const [trainedFilters, setTrainedFilters] = useState(null);

            const modelState = {
                config, setConfig,
                trainingHistory, setTrainingHistory,
                isModelTrained, setIsModelTrained,
                trainedFilters, setTrainedFilters
            };

            const tabs = [
                { id: 'cnn', label: 'CNN Builder' },
                { id: 'transfer', label: 'Transfer Learning' },
                { id: 'expression', label: 'Expression Recognition' }
            ];

            return (
                <ModelContext.Provider value={{ modelState, setModelState: () => {} }}>
                    <div className="app-container">
                        <header className="header">
                            <div className="header-content">
                                <div className="header-left">
                                    <div className="course-label">MGMT298D: Science and Strategy of AI</div>
                                    <h1>Week 5: Convolutional Neural Networks</h1>
                                    <p>Train a CNN to classify animals from CIFAR-100</p>
                                </div>
                                <div className="header-right">
                                    <span className="ucla-anderson">UCLA Anderson</span>
                                </div>
                            </div>
                            <div className="header-gold-line"></div>
                        </header>

                        <nav className="tab-navigation">
                            {tabs.map(tab => (
                                <button key={tab.id}
                                    className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}>
                                    {tab.label}
                                </button>
                            ))}
                        </nav>

                        <main className="main-content">
                            {activeTab === 'cnn' && <CNNBuilderTab />}
                            {activeTab === 'transfer' && <TransferLearningTab />}
                            {activeTab === 'expression' && <FacialExpressionTab />}
                        </main>

                        <div className="footer">
                            MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                        </div>
                    </div>
                </ModelContext.Provider>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
