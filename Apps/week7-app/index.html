<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7: Word Embeddings & Transformers | UCLA Anderson</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2774AE;
            --darkBlue: #005587;
            --lightBlue: #8BB8E8;
            --gold: #FFD100;
            --bg: #ffffff;
            --card: #ffffff;
            --text: #1a1a1a;
            --textMuted: #666;
            --border: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            color: var(--text);
        }

        .app-container { min-height: 100vh; }

        /* Header */
        .header {
            background: var(--primary);
            padding: 1rem 2rem 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left .course-label {
            font-size: 0.65rem;
            font-weight: 400;
            color: #FFD100;
            margin-bottom: 0.25rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
        }

        .header-left .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .header-right {
            text-align: right;
            color: #ffffff;
            font-weight: 500;
        }

        .header-gold-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold);
        }

        /* Tabs */
        .tabs-container {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: sticky;
            top: 72px;
            z-index: 99;
        }

        .tabs {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 0;
        }

        .tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            color: var(--textMuted);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover { color: var(--primary); }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        /* Grid layouts */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }

        @media (max-width: 900px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        /* Input styles */
        .input-group {
            margin-bottom: 1rem;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--textMuted);
            margin-bottom: 0.5rem;
        }

        .text-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover { background: var(--darkBlue); }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--text);
        }

        .btn-secondary:hover { background: #e0e0e0; }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-option {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            color: var(--textMuted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-option:hover { border-color: var(--primary); }

        .btn-option.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-option:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Explanation box */
        .explanation {
            background: linear-gradient(135deg, rgba(39, 116, 174, 0.08), rgba(139, 184, 232, 0.08));
            border-left: 3px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--textMuted);
            margin-top: 0.25rem;
        }

        /* Result display */
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--textMuted);
            margin-top: 0.5rem;
        }

        /* Word chips */
        .word-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 0.25rem;
        }

        .word-chip.result {
            background: var(--gold);
            color: #333;
        }

        .word-chip .score {
            background: rgba(255,255,255,0.2);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--textMuted);
            font-size: 0.85rem;
        }

        /* Comparison cards */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .comparison-grid { grid-template-columns: 1fr; }
        }

        .comparison-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .comparison-card.winner {
            background: linear-gradient(135deg, rgba(39, 116, 174, 0.1), rgba(139, 184, 232, 0.1));
            border: 2px solid var(--primary);
        }

        .comparison-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .comparison-title .badge {
            background: var(--gold);
            color: #333;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Heatmap for attention */
        .heatmap-container {
            overflow-x: auto;
            padding: 1rem 0;
        }

        .heatmap-grid {
            display: inline-block;
            min-width: 100%;
        }

        .heatmap-row {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 2px;
        }

        .heatmap-label {
            width: 60px;
            font-size: 0.75rem;
            text-align: right;
            padding-right: 8px;
            color: var(--textMuted);
            font-family: 'JetBrains Mono', monospace;
        }

        .heatmap-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
        }

        .heatmap-header {
            display: flex;
            margin-left: 68px;
            margin-bottom: 4px;
        }

        .heatmap-header-cell {
            width: 40px;
            margin-right: 2px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--textMuted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Error message */
        .error-box {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        /* Success message */
        .success-box {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid #28a745;
            color: #28a745;
            padding: 1rem;
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // API Base URL - empty string uses same origin
        const API_BASE = '';

        // ===========================================
        // Tab 1: Word Embeddings
        // ===========================================
        const EmbeddingsTab = () => {
            const [word1, setWord1] = useState('king');
            const [word2, setWord2] = useState('queen');
            const [similarity, setSimilarity] = useState(null);
            const [similarityLoading, setSimilarityLoading] = useState(false);
            const [similarityError, setSimilarityError] = useState(null);

            const [analogyA, setAnalogyA] = useState('king');
            const [analogyB, setAnalogyB] = useState('man');
            const [analogyC, setAnalogyC] = useState('woman');
            const [analogyResults, setAnalogyResults] = useState(null);
            const [analogyLoading, setAnalogyLoading] = useState(false);
            const [analogyError, setAnalogyError] = useState(null);

            const [availableWords, setAvailableWords] = useState([]);

            // Fetch available words on mount
            useEffect(() => {
                fetch(`${API_BASE}/available_words?limit=100`)
                    .then(res => res.json())
                    .then(data => setAvailableWords(data.sample_words || []))
                    .catch(err => console.log('Could not fetch words:', err));
            }, []);

            const computeSimilarity = async () => {
                setSimilarityLoading(true);
                setSimilarityError(null);
                setSimilarity(null);

                try {
                    const response = await fetch(`${API_BASE}/similarity`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ word1, word2 })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'Failed to compute similarity');
                    }

                    const data = await response.json();
                    setSimilarity(data.similarity);
                } catch (err) {
                    setSimilarityError(err.message);
                } finally {
                    setSimilarityLoading(false);
                }
            };

            const solveAnalogy = async () => {
                setAnalogyLoading(true);
                setAnalogyError(null);
                setAnalogyResults(null);

                try {
                    const response = await fetch(`${API_BASE}/analogy`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_a: analogyA,
                            word_b: analogyB,
                            word_c: analogyC,
                            top_n: 5
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'Failed to solve analogy');
                    }

                    const data = await response.json();
                    setAnalogyResults(data);
                } catch (err) {
                    setAnalogyError(err.message);
                } finally {
                    setAnalogyLoading(false);
                }
            };

            const examplePairs = [
                ['king', 'queen'],
                ['man', 'woman'],
                ['dog', 'cat'],
                ['happy', 'sad'],
                ['france', 'paris'],
                ['good', 'bad']
            ];

            const exampleAnalogies = [
                ['king', 'man', 'woman'],      // queen
                ['france', 'paris', 'tokyo'],  // japan
                ['big', 'small', 'fast'],      // slow
            ];

            return (
                <div>
                    <div className="explanation">
                        <strong>Word Embeddings</strong> are vector representations of words where similar words have similar vectors.
                        Words are mapped to 50-dimensional vectors using GloVe embeddings trained on billions of words.
                        This allows us to compute semantic relationships mathematically!
                    </div>

                    <div className="grid-2">
                        {/* Word Similarity */}
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                                    <line x1="9" y1="9" x2="9.01" y2="9"/>
                                    <line x1="15" y1="9" x2="15.01" y2="9"/>
                                </svg>
                                Word Similarity
                            </div>

                            <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>
                                Cosine similarity measures how similar two word vectors are (-1 to 1, higher = more similar).
                            </p>

                            <div className="input-group">
                                <label className="input-label">Word 1:</label>
                                <input
                                    type="text"
                                    className="text-input"
                                    value={word1}
                                    onChange={(e) => setWord1(e.target.value.toLowerCase())}
                                    placeholder="Enter first word"
                                />
                            </div>

                            <div className="input-group">
                                <label className="input-label">Word 2:</label>
                                <input
                                    type="text"
                                    className="text-input"
                                    value={word2}
                                    onChange={(e) => setWord2(e.target.value.toLowerCase())}
                                    placeholder="Enter second word"
                                />
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label className="input-label">Try these pairs:</label>
                                <div className="btn-group">
                                    {examplePairs.map(([w1, w2], i) => (
                                        <button
                                            key={i}
                                            className="btn-option"
                                            onClick={() => { setWord1(w1); setWord2(w2); }}
                                        >
                                            {w1} / {w2}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button
                                className="btn btn-primary"
                                onClick={computeSimilarity}
                                disabled={similarityLoading || !word1 || !word2}
                                style={{ width: '100%', justifyContent: 'center' }}
                            >
                                {similarityLoading ? (
                                    <><div className="spinner" style={{ width: 16, height: 16, borderTopColor: 'white' }} /> Computing...</>
                                ) : 'Compute Similarity'}
                            </button>

                            {similarityError && (
                                <div className="error-box">{similarityError}</div>
                            )}

                            {similarity !== null && (
                                <div className="result-box" style={{ marginTop: '1rem' }}>
                                    <div className="result-value">{(similarity * 100).toFixed(1)}%</div>
                                    <div className="result-label">
                                        Cosine Similarity between "{word1}" and "{word2}"
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Word Analogies */}
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                    <path d="M2 17l10 5 10-5"/>
                                    <path d="M2 12l10 5 10-5"/>
                                </svg>
                                Word Analogies
                            </div>

                            <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>
                                Solve: <strong>A - B + C = ?</strong><br/>
                                Example: king - man + woman = queen
                            </p>

                            <div className="grid-3" style={{ marginBottom: '1rem' }}>
                                <div className="input-group" style={{ marginBottom: 0 }}>
                                    <label className="input-label">A:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={analogyA}
                                        onChange={(e) => setAnalogyA(e.target.value.toLowerCase())}
                                        placeholder="king"
                                    />
                                </div>
                                <div className="input-group" style={{ marginBottom: 0 }}>
                                    <label className="input-label">B:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={analogyB}
                                        onChange={(e) => setAnalogyB(e.target.value.toLowerCase())}
                                        placeholder="man"
                                    />
                                </div>
                                <div className="input-group" style={{ marginBottom: 0 }}>
                                    <label className="input-label">C:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={analogyC}
                                        onChange={(e) => setAnalogyC(e.target.value.toLowerCase())}
                                        placeholder="woman"
                                    />
                                </div>
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label className="input-label">Try these analogies:</label>
                                <div className="btn-group">
                                    {exampleAnalogies.map(([a, b, c], i) => (
                                        <button
                                            key={i}
                                            className="btn-option"
                                            onClick={() => { setAnalogyA(a); setAnalogyB(b); setAnalogyC(c); }}
                                        >
                                            {a} - {b} + {c}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button
                                className="btn btn-primary"
                                onClick={solveAnalogy}
                                disabled={analogyLoading || !analogyA || !analogyB || !analogyC}
                                style={{ width: '100%', justifyContent: 'center' }}
                            >
                                {analogyLoading ? (
                                    <><div className="spinner" style={{ width: 16, height: 16, borderTopColor: 'white' }} /> Solving...</>
                                ) : 'Solve Analogy'}
                            </button>

                            {analogyError && (
                                <div className="error-box">{analogyError}</div>
                            )}

                            {analogyResults && (
                                <div style={{ marginTop: '1rem' }}>
                                    <div style={{
                                        background: '#f8f9fa',
                                        padding: '1rem',
                                        borderRadius: '8px',
                                        textAlign: 'center',
                                        marginBottom: '1rem'
                                    }}>
                                        <span style={{ fontSize: '1.1rem' }}>
                                            <strong>{analogyA}</strong> - <strong>{analogyB}</strong> + <strong>{analogyC}</strong> = ?
                                        </span>
                                    </div>
                                    <label className="input-label">Top Results:</label>
                                    <div>
                                        {analogyResults.results.map((result, i) => (
                                            <div key={i} className="word-chip result" style={{
                                                display: 'inline-flex',
                                                opacity: 1 - (i * 0.15)
                                            }}>
                                                {result.word}
                                                <span className="score">{(result.similarity * 100).toFixed(0)}%</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Available words */}
                    {availableWords.length > 0 && (
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                                </svg>
                                Available Words in Vocabulary
                            </div>
                            <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>
                                Click any word to use it in the similarity or analogy calculations.
                            </p>
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                                {availableWords.slice(0, 60).map((word, i) => (
                                    <button
                                        key={i}
                                        className="btn-option"
                                        onClick={() => setWord1(word)}
                                        style={{ fontSize: '0.8rem', padding: '0.4rem 0.8rem' }}
                                    >
                                        {word}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===========================================
        // Architecture Visualization Component - 3D Canvas Style
        // ===========================================
        const ArchitectureDiagram = ({ config }) => {
            const canvasRef = React.useRef(null);
            const animationRef = React.useRef(null);

            const layers = React.useMemo(() => {
                const result = [];
                let x = 40;

                // UCLA color scheme for transformer layers
                const colors = {
                    input: '#4CAF50',      // green (input)
                    embedding: '#FFD100',  // UCLA gold
                    attention: '#8B5CF6',  // purple
                    ffn: '#10B981',        // emerald
                    pooling: '#8BB8E8',    // UCLA light blue
                    dense: '#2774AE',      // UCLA blue
                    output: '#FFD100'      // UCLA gold
                };

                // Input - increased size
                result.push({ type: 'Input', x, h: 110, w: 50, d: 20, color: colors.input });
                x += 75;

                // Embeddings - increased size
                result.push({ type: 'Embeddings', x, h: 115, w: 60, d: 24, color: colors.embedding });
                x += 95;

                // Transformer blocks (attention + ffn pairs) - increased size
                for (let i = 0; i < config.num_blocks; i++) {
                    result.push({ type: 'Attention', x, h: 105, w: 55, d: 22, color: colors.attention });
                    x += 75;
                    result.push({ type: 'Feed-Fwd', x, h: 100, w: 52, d: 21, color: colors.ffn });
                    x += 75;
                }

                // Pooling - increased size
                result.push({ type: 'Pooling', x, h: 90, w: 50, d: 20, color: colors.pooling });
                x += 72;

                // Dense - increased size
                result.push({ type: 'Dense', x, h: 95, w: 50, d: 21, color: colors.dense });
                x += 74;

                // Output - increased size
                result.push({ type: 'Output', x, h: 85, w: 46, d: 19, color: colors.output });

                return result;
            }, [config.num_blocks]);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;

                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                let time = 0;

                function shadeColor(color, percent) {
                    const num = parseInt(color.replace('#', ''), 16);
                    const amt = Math.round(2.55 * percent);
                    const R = Math.min(255, Math.max(0, (num >> 16) + amt));
                    const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
                    const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
                    return `rgb(${R},${G},${B})`;
                }

                function drawBlock(x, y, w, h, d, color) {
                    // Right face (darker)
                    ctx.fillStyle = shadeColor(color, -18);
                    ctx.beginPath();
                    ctx.moveTo(x + w, y);
                    ctx.lineTo(x + w + d * 0.7, y - d * 0.4);
                    ctx.lineTo(x + w + d * 0.7, y + h - d * 0.4);
                    ctx.lineTo(x + w, y + h);
                    ctx.closePath();
                    ctx.fill();

                    // Top face (lighter)
                    ctx.fillStyle = shadeColor(color, 12);
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + d * 0.7, y - d * 0.4);
                    ctx.lineTo(x + w + d * 0.7, y - d * 0.4);
                    ctx.lineTo(x + w, y);
                    ctx.closePath();
                    ctx.fill();

                    // Front face
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, w, h);

                    // Subtle edge highlight
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + w, y);
                    ctx.stroke();
                }

                const draw = () => {
                    const width = rect.width;
                    const height = rect.height;
                    ctx.clearRect(0, 0, width, height);

                    const centerY = height / 2;

                    // Draw connection lines
                    ctx.strokeStyle = 'rgba(120, 120, 120, 0.25)';
                    ctx.lineWidth = 1.5;

                    for (let i = 0; i < layers.length - 1; i++) {
                        const from = layers[i];
                        const to = layers[i + 1];
                        const fromX = from.x + from.w + from.d * 0.7;
                        const toX = to.x;

                        ctx.beginPath();
                        ctx.moveTo(fromX, centerY);
                        ctx.lineTo(toX, centerY);
                        ctx.stroke();
                    }

                    // Draw blocks
                    layers.forEach(layer => {
                        const y = centerY - layer.h / 2;
                        drawBlock(layer.x, y, layer.w, layer.h, layer.d, layer.color);
                    });

                    // Labels
                    ctx.fillStyle = '#333';
                    ctx.font = 'bold 14px Inter, -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.textAlign = 'center';
                    layers.forEach(layer => {
                        const labelX = layer.x + layer.w / 2 + layer.d * 0.35;
                        ctx.fillText(layer.type, labelX, centerY + layer.h / 2 + 22);
                    });

                    time++;
                    animationRef.current = requestAnimationFrame(draw);
                };

                draw();

                return () => {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                };
            }, [layers]);

            return (
                <div style={{ background: '#f8f9fa', borderRadius: '12px', padding: '1.5rem' }}>

            // Poll for training progress

                        </div>

                        {/* Training & Test Samples Visualization */}

                                                    background: pred.correct ? 'rgba(40, 167, 69, 0.05)' : 'rgba(220, 53, 69, 0.05)',
                                                    borderRadius: 8,
                                                    border: `2px solid ${pred.correct ? '#28a745' : '#dc3545'}`,
                                                    fontSize: '0.8rem'
                                                }}>
                                                    <div style={{ marginBottom: '0.5rem', fontSize: '0.75rem', color: '#666', fontStyle: 'italic', lineHeight: '1.4' }}>
                                                        "{pred.text}..."
                                                    </div>
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.5rem' }}>
                                                        <div>
                                                            <span style={{ fontWeight: 600 }}>True:</span> {'⭐'.repeat(pred.true + 1)}<br/>
                                                            <span style={{ fontWeight: 600 }}>Pred:</span> {'⭐'.repeat(pred.predicted + 1)}
                                                        </div>
                                                        <div style={{ fontSize: '0.7rem', color: pred.correct ? '#28a745' : '#dc3545', fontWeight: 600 }}>
                                                            {pred.correct ? '✓' : '✗'}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    {/* Attention Weights Visualization */}
                    {status === 'complete' && results && results.attention_weights && (
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                Learned Attention Weights
                            </div>

                            <div className="explanation">
                                These are the actual attention patterns learned by your trained transformer. Each head learns different patterns - some focus on nearby tokens, others on specific relationships.
                            </div>

                            <div style={{ display: 'flex', gap: '1rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                                <div>
                                    <label className="input-label">Block:</label>
                                    <div className="btn-group">
                                        {Object.keys(results.attention_weights).map((block, i) => (
                                            <button key={i}
                                                className={`btn-option ${activeBlock === i ? 'active' : ''}`}
                                                onClick={() => setActiveBlock(i)}
                                            >
                                                Block {i + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="input-label">Head:</label>
                                    <div className="btn-group">
                                        {results.attention_weights[`block_${activeBlock}`] &&
                                            Object.keys(results.attention_weights[`block_${activeBlock}`]).map((head, i) => (
                                                <button key={i}
                                                    className={`btn-option ${activeHead === i ? 'active' : ''}`}
                                                    onClick={() => setActiveHead(i)}
                                                >
                                                    Head {i + 1}
                                                </button>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>

                            <div className="heatmap-container">
                                {results.attention_tokens && (
                                    <div className="heatmap-header">
                                        {results.attention_tokens.slice(0, 8).map((tok, i) => (
                                            <div key={i} className="heatmap-header-cell">{tok}</div>
                                        ))}
                                    </div>
                                )}
                                <div className="heatmap-grid">
                                    {results.attention_weights[`block_${activeBlock}`] &&
                                     results.attention_weights[`block_${activeBlock}`][activeHead] &&
                                        results.attention_weights[`block_${activeBlock}`][activeHead].slice(0, 8).map((row, i) => (
                                            <div key={i} className="heatmap-row">
                                                <div className="heatmap-label">
                                                    {results.attention_tokens ? results.attention_tokens[i] : `pos ${i}`}
                                                </div>
                                                {row.slice(0, 8).map((weight, j) => (
                                                    <div
                                                        key={j}
                                                        className="heatmap-cell"
                                                        style={{
                                                            background: getColor(weight),
                                                            color: weight > 0.4 ? 'white' : '#333'
                                                        }}
                                                        title={`${(weight * 100).toFixed(1)}%`}
                                                    >
                                                        {(weight * 100).toFixed(0)}
                                                    </div>
                                                ))}
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===========================================
        // Tab 3: Fine-tune Pre-trained Models
        // ===========================================
        const FinetuneTab = () => {
            const [config, setConfig] = useState({
                freeze_percent: 70,  // 70% frozen = only train last ~2 layers
                learning_rate: 5e-5,
                num_samples: 200,  // Reduced from 500 for faster training on Railway
                epochs: 3
            });
            const [status, setStatus] = useState('idle');
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [trainingSamples, setTrainingSamples] = useState([]);
            const [progress, setProgress] = useState({ epoch: 0, totalEpochs: 3, batch: 0, totalBatches: 0 });

            // Fetch training samples
            useEffect(() => {
                fetch(`${API_BASE}/api/training_samples?num=8`)
                    .then(res => res.json())
                    .then(data => setTrainingSamples(data.samples || []))
                    .catch(err => console.log('Could not fetch training samples:', err));
            }, []);

            const startFineTuning = async () => {
                setStatus('training');
                setError(null);
                setResults(null);
                
                // Initialize progress
                const totalBatches = Math.ceil(config.num_samples / 16); // batch_size = 16
                setProgress({ epoch: 0, totalEpochs: config.epochs, batch: 0, totalBatches });

                // Simulate progress updates
                const progressInterval = setInterval(() => {
                    setProgress(prev => {
                        if (prev.batch < prev.totalBatches) {
                            return { ...prev, batch: prev.batch + 1 };
                        } else if (prev.epoch < prev.totalEpochs - 1) {
                            return { ...prev, epoch: prev.epoch + 1, batch: 0 };
                        }
                        return prev;
                    });
                }, 200); // Update every 200ms for smooth progress

                try {
                    const response = await fetch(`${API_BASE}/api/finetune`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });

                    clearInterval(progressInterval);

                    if (!response.ok) {
                        throw new Error('Fine-tuning failed');
                    }

                    const data = await response.json();
                    setResults(data);
                    setStatus('complete');
                    setProgress({ epoch: config.epochs, totalEpochs: config.epochs, batch: totalBatches, totalBatches });
                } catch (err) {
                    clearInterval(progressInterval);
                    setError(err.message);
                    setStatus('error');
                }
            };

            // DistilBERT Architecture Diagram
            const DistilBERTDiagram = () => {
                const canvasRef = React.useRef(null);
                const animationRef = React.useRef(null);

                const layers = React.useMemo(() => {
                    const result = [];
                    let x = 30;

                    const colors = {
                        input: '#4CAF50',
                        embedding: '#FFD100',
                        transformer: '#2774AE',
                        output: '#FFD100'
                    };

                    // Input
                    result.push({ type: 'Input', x, h: 70, w: 32, d: 12, color: colors.input });
                    x += 48;

                    // Embeddings
                    result.push({ type: 'Embeddings', x, h: 75, w: 40, d: 15, color: colors.embedding });
                    x += 60;

                    // 6 Transformer layers
                    for (let i = 0; i < 6; i++) {
                        const frozen = i < Math.floor(6 * config.freeze_percent / 100);
                        result.push({
                            type: `Layer ${i + 1}`,
                            x,
                            h: 65,
                            w: 35,
                            d: 14,
                            color: frozen ? '#95a5a6' : colors.transformer,
                            frozen
                        });
                        x += 48;
                    }

                    // Classification Head
                    result.push({ type: 'Classifier', x, h: 60, w: 38, d: 14, color: colors.output });

                    return result;
                }, [config.freeze_percent]);

                React.useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    const dpr = window.devicePixelRatio || 1;

                    const rect = canvas.getBoundingClientRect();
                    canvas.width = rect.width * dpr;
                    canvas.height = rect.height * dpr;
                    ctx.scale(dpr, dpr);

                    function shadeColor(color, percent) {
                        const num = parseInt(color.replace('#', ''), 16);
                        const amt = Math.round(2.55 * percent);
                        const R = Math.min(255, Math.max(0, (num >> 16) + amt));
                        const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
                        const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
                        return `rgb(${R},${G},${B})`;
                    }

                    function drawBlock(x, y, w, h, d, color) {
                        ctx.fillStyle = shadeColor(color, -18);
                        ctx.beginPath();
                        ctx.moveTo(x + w, y);
                        ctx.lineTo(x + w + d * 0.7, y - d * 0.4);
                        ctx.lineTo(x + w + d * 0.7, y + h - d * 0.4);
                        ctx.lineTo(x + w, y + h);
                        ctx.closePath();
                        ctx.fill();

                        ctx.fillStyle = shadeColor(color, 12);
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + d * 0.7, y - d * 0.4);
                        ctx.lineTo(x + w + d * 0.7, y - d * 0.4);
                        ctx.lineTo(x + w, y);
                        ctx.closePath();
                        ctx.fill();

                        ctx.fillStyle = color;
                        ctx.fillRect(x, y, w, h);

                        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + w, y);
                        ctx.stroke();
                    }

                    const draw = () => {
                        const width = rect.width;
                        const height = rect.height;
                        ctx.clearRect(0, 0, width, height);

                        const centerY = height / 2;

                        // Connection lines
                        ctx.strokeStyle = 'rgba(120, 120, 120, 0.25)';
                        ctx.lineWidth = 1.5;

                        for (let i = 0; i < layers.length - 1; i++) {
                            const from = layers[i];
                            const to = layers[i + 1];
                            const fromX = from.x + from.w + from.d * 0.7;
                            const toX = to.x;

                            ctx.beginPath();
                            ctx.moveTo(fromX, centerY);
                            ctx.lineTo(toX, centerY);
                            ctx.stroke();
                        }

                        // Draw blocks
                        layers.forEach(layer => {
                            const y = centerY - layer.h / 2;
                            drawBlock(layer.x, y, layer.w, layer.h, layer.d, layer.color);
                        });

                        // Labels
                        ctx.fillStyle = '#666';
                        ctx.font = '9px Inter, sans-serif';
                        ctx.textAlign = 'center';
                        layers.forEach(layer => {
                            const labelX = layer.x + layer.w / 2 + layer.d * 0.35;
                            ctx.fillText(layer.type, labelX, centerY + layer.h / 2 + 14);

                            if (layer.frozen) {
                                ctx.font = '7px Inter, sans-serif';
                                ctx.fillStyle = '#95a5a6';
                                ctx.fillText('🔒', labelX, centerY + layer.h / 2 + 24);
                                ctx.font = '9px Inter, sans-serif';
                                ctx.fillStyle = '#666';
                            }
                        });

                        animationRef.current = requestAnimationFrame(draw);
                    };

                    draw();

                    return () => {
                        if (animationRef.current) cancelAnimationFrame(animationRef.current);
                    };
                }, [layers]);

                return (
                    <div style={{ background: '#f8f9fa', borderRadius: '12px', padding: '1.5rem' }}>
                        <canvas ref={canvasRef} style={{ width: '100%', height: '150px', display: 'block' }} />
                    </div>
                );
            };

            const numFrozenLayers = Math.floor(6 * config.freeze_percent / 100);
            const numTrainableLayers = 6 - numFrozenLayers;

            return (
                <div>
                    {/* DistilBERT Info Card */}
                    <div className="card">
                        <div className="card-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            DistilBERT Architecture
                        </div>
                        <p style={{ marginBottom: '1rem', fontSize: '0.85rem', color: 'var(--textMuted)' }}>
                            Gray blocks 🔒 are frozen. Blue blocks are trainable.
                        </p>
                        <DistilBERTDiagram />
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '1.5rem', marginTop: '1rem', fontSize: '0.85rem' }}>
                            <div><strong>Total Parameters:</strong> 66M</div>
                            <div><strong>Layers:</strong> 6</div>
                            <div><strong>Hidden Size:</strong> 768</div>
                        </div>
                    </div>

                    <div className="grid-2">
                        {/* Configuration */}
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
                                </svg>
                                Fine-tuning Configuration
                            </div>

                            <div className="input-group">
                                <label className="input-label">
                                    Freeze Layers: {config.freeze_percent}% ({numFrozenLayers}/6 frozen)
                                </label>
                                <input
                                    type="range"
                                    min="50"
                                    max="100"
                                    step="10"
                                    value={config.freeze_percent}
                                    onChange={(e) => setConfig({...config, freeze_percent: parseInt(e.target.value)})}
                                    disabled={status === 'training'}
                                    style={{ width: '100%' }}
                                />
                                <div style={{ display: 'flex', marginTop: '0.5rem', gap: '0.5rem' }}>
                                    <div style={{
                                        flex: config.freeze_percent,
                                        background: 'linear-gradient(90deg, #95a5a6, #7f8c8d)',
                                        padding: '0.5rem',
                                        borderRadius: '6px',
                                        color: 'white',
                                        fontSize: '0.75rem',
                                        textAlign: 'center'
                                    }}>Frozen 🔒</div>
                                    <div style={{
                                        flex: 100 - config.freeze_percent,
                                        background: 'linear-gradient(90deg, #2774AE, #005587)',
                                        padding: '0.5rem',
                                        borderRadius: '6px',
                                        color: 'white',
                                        fontSize: '0.75rem',
                                        textAlign: 'center'
                                    }}>Trainable ✏️</div>
                                </div>
                            </div>

                            <div className="input-group">
                                <label className="input-label">Learning Rate:</label>
                                <div className="btn-group">
                                    {[1e-5, 5e-5, 1e-4].map(lr => (
                                        <button
                                            key={lr}
                                            className={`btn-option ${config.learning_rate === lr ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, learning_rate: lr})}
                                            disabled={status === 'training'}
                                        >{lr}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="input-group">
                                <label className="input-label">Training Samples:</label>
                                <div className="btn-group">
                                    {[100, 200, 500].map(n => (
                                        <button
                                            key={n}
                                            className={`btn-option ${config.num_samples === n ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, num_samples: n})}
                                            disabled={status === 'training'}
                                        >{n}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="input-group">
                                <label className="input-label">Epochs:</label>
                                <div className="btn-group">
                                    {[2, 3, 5].map(n => (
                                        <button
                                            key={n}
                                            className={`btn-option ${config.epochs === n ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, epochs: n})}
                                            disabled={status === 'training'}
                                        >{n}</button>
                                    ))}
                                </div>
                            </div>

                            <button
                                className="btn btn-primary"
                                onClick={startFineTuning}
                                disabled={status === 'training'}
                                style={{ width: '100%', marginTop: '1rem', justifyContent: 'center' }}
                            >
                                {status === 'training' ? (
                                    <>
                                        <div className="spinner" style={{
                                            width: 16,
                                            height: 16,
                                            border: '2px solid rgba(255,255,255,0.3)',
                                            borderTopColor: 'white'
                                        }} />
                                        Fine-tuning...
                                    </>
                                ) : '▶ Start Fine-tuning'}
                            </button>

                            {error && (
                                <div style={{ marginTop: '1rem', padding: '1rem', background: 'rgba(220, 53, 69, 0.1)', borderRadius: '8px', color: '#dc3545' }}>
                                    Error: {error}
                                </div>
                            )}
                        </div>

                        {/* Results */}
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                                </svg>
                                Results Comparison
                            </div>

                            {status === 'idle' && (
                                <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--textMuted)' }}>
                                    Configure parameters and click "Start Fine-tuning"
                                </div>
                            )}

                            {status === 'training' && (
                                <div style={{ padding: '2rem' }}>
                                    <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                                        <div className="loading-spinner" style={{ margin: '0 auto 1rem' }} />
                                        <div style={{ fontSize: '1.1rem', fontWeight: 500, marginBottom: '0.5rem' }}>
                                            Fine-tuning DistilBERT...
                                        </div>
                                        <div style={{ fontSize: '0.85rem', color: 'var(--textMuted)' }}>
                                            This may take 1-3 minutes (or longer on slower servers)
                                        </div>
                                    </div>

                                    {/* Epoch Progress */}
                                    <div style={{ marginBottom: '1.5rem' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                                            <span style={{ fontSize: '0.9rem', fontWeight: 500 }}>Epoch Progress</span>
                                            <span style={{ fontSize: '0.9rem', color: 'var(--textMuted)' }}>
                                                {progress.epoch + 1} / {progress.totalEpochs}
                                            </span>
                                        </div>
                                        <div style={{ 
                                            height: '8px', 
                                            background: '#e9ecef', 
                                            borderRadius: '4px', 
                                            overflow: 'hidden' 
                                        }}>
                                            <div style={{
                                                height: '100%',
                                                width: `${((progress.epoch + 1) / progress.totalEpochs) * 100}%`,
                                                background: 'linear-gradient(90deg, #2774AE, #8BB8E8)',
                                                transition: 'width 0.3s ease'
                                            }} />
                                        </div>
                                    </div>

                                    {/* Batch Progress */}
                                    <div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                                            <span style={{ fontSize: '0.9rem', fontWeight: 500 }}>Batch Progress</span>
                                            <span style={{ fontSize: '0.9rem', color: 'var(--textMuted)' }}>
                                                {progress.batch} / {progress.totalBatches} batches
                                            </span>
                                        </div>
                                        <div style={{ 
                                            height: '8px', 
                                            background: '#e9ecef', 
                                            borderRadius: '4px', 
                                            overflow: 'hidden' 
                                        }}>
                                            <div style={{
                                                height: '100%',
                                                width: `${(progress.batch / progress.totalBatches) * 100}%`,
                                                background: 'linear-gradient(90deg, #FFD100, #FFA500)',
                                                transition: 'width 0.1s linear'
                                            }} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {status === 'complete' && results && (
                                <div>
                                    <div className="grid-2" style={{ gap: '1rem', marginBottom: '1.5rem' }}>
                                        <div style={{ padding: '1rem', background: 'rgba(39, 116, 174, 0.1)', borderRadius: '8px', border: '2px solid #2774AE' }}>
                                            <div style={{ fontSize: '0.85rem', color: '#666', marginBottom: '0.5rem' }}>Base Model</div>
                                            <div style={{ fontSize: '2rem', fontWeight: 700, color: '#2774AE' }}>
                                                {results.base_accuracy.toFixed(1)}%
                                            </div>
                                            <div style={{ fontSize: '0.75rem', color: '#666', marginTop: '0.25rem' }}>No fine-tuning</div>
                                        </div>

                                        <div style={{ padding: '1rem', background: 'rgba(40, 167, 69, 0.1)', borderRadius: '8px', border: '2px solid #28a745' }}>
                                            <div style={{ fontSize: '0.85rem', color: '#666', marginBottom: '0.5rem' }}>Fine-tuned Model</div>
                                            <div style={{ fontSize: '2rem', fontWeight: 700, color: '#28a745' }}>
                                                {results.finetuned_accuracy.toFixed(1)}%
                                            </div>
                                            <div style={{ fontSize: '0.75rem', color: '#28a745', marginTop: '0.25rem', fontWeight: 600 }}>
                                                +{results.improvement.toFixed(1)}% improvement!
                                            </div>
                                        </div>
                                    </div>

                                    <div style={{ marginBottom: '1.5rem' }}>
                                        <div style={{ fontSize: '0.85rem', marginBottom: '0.5rem', color: '#666' }}>
                                            <strong>Parameters:</strong> {(results.frozen_params / 1e6).toFixed(1)}M frozen, {(results.trainable_params / 1e6).toFixed(1)}M trainable
                                        </div>
                                        <div style={{ fontSize: '0.85rem', color: '#666' }}>
                                            <strong>Layers:</strong> {results.num_frozen_layers} frozen, {results.num_trainable_layers} trainable
                                        </div>
                                    </div>

                                    {results.history && results.history.train_acc.length > 0 && (
                                        <div>
                                            <h4 style={{ fontSize: '0.9rem', marginBottom: '0.75rem' }}>Training Progress</h4>
                                            <svg width="100%" height="150" viewBox="0 0 400 150">
                                                <line x1="50" y1="130" x2="380" y2="130" stroke="#ccc" strokeWidth="1"/>
                                                <line x1="50" y1="20" x2="50" y2="130" stroke="#ccc" strokeWidth="1"/>

                                                {[0, 25, 50, 75, 100].map((v, i) => (
                                                    <g key={i}>
                                                        <line x1="50" y1={130 - v * 1.1} x2="380" y2={130 - v * 1.1} stroke="#eee" strokeWidth="1"/>
                                                        <text x="45" y={135 - v * 1.1} textAnchor="end" fontSize="10" fill="#999">{v}</text>
                                                    </g>
                                                ))}

                                                <polyline
                                                    fill="none"
                                                    stroke="var(--primary)"
                                                    strokeWidth="2"
                                                    points={results.history.train_acc.map((acc, i) =>
                                                        `${50 + (i + 1) * (330 / results.epochs)},${130 - acc * 1.1}`
                                                    ).join(' ')}
                                                />

                                                <polyline
                                                    fill="none"
                                                    stroke="var(--gold)"
                                                    strokeWidth="2"
                                                    points={results.history.val_acc.map((acc, i) =>
                                                        `${50 + (i + 1) * (330 / results.epochs)},${130 - acc * 1.1}`
                                                    ).join(' ')}
                                                />

                                                <rect x="280" y="25" width="12" height="12" fill="var(--primary)"/>
                                                <text x="297" y="35" fontSize="10" fill="#666">Train</text>
                                                <rect x="330" y="25" width="12" height="12" fill="var(--gold)"/>
                                                <text x="347" y="35" fontSize="10" fill="#666">Val</text>
                                            </svg>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Sample Predictions */}
                    {status === 'complete' && results && results.sample_predictions && (
                        <div className="card" style={{ marginTop: '1.5rem' }}>
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M9 11l3 3L22 4"/>
                                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                                </svg>
                                Fine-tuned Model Predictions
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '0.75rem' }}>
                                {results.sample_predictions.map((pred, i) => (
                                    <div key={i} style={{
                                        padding: '0.75rem',
                                        background: pred.correct ? 'rgba(40, 167, 69, 0.05)' : 'rgba(220, 53, 69, 0.05)',
                                        borderRadius: 8,
                                        border: `2px solid ${pred.correct ? '#28a745' : '#dc3545'}`,
                                        fontSize: '0.8rem'
                                    }}>
                                        <div style={{ marginBottom: '0.5rem', fontSize: '0.75rem', color: '#666', fontStyle: 'italic', lineHeight: '1.4' }}>
                                            "{pred.text}..."
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.5rem' }}>
                                            <div>
                                                <span style={{ fontWeight: 600 }}>True:</span> {'⭐'.repeat(pred.true + 1)}<br/>
                                                <span style={{ fontWeight: 600 }}>Pred:</span> {'⭐'.repeat(pred.predicted + 1)}
                                            </div>
                                            <div style={{ fontSize: '0.7rem', color: pred.correct ? '#28a745' : '#dc3545', fontWeight: 600 }}>
                                                {pred.correct ? '✓' : '✗'}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===========================================
        // Main App
        // ===========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('embeddings');

            const tabs = [
                { id: 'embeddings', label: 'Word Embeddings' },
                { id: 'training', label: 'Train Transformers' },
                { id: 'finetune', label: 'Fine-tune Pre-trained' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'embeddings': return <EmbeddingsTab />;
                    case 'training': return <TrainTransformerTab />;
                    case 'finetune': return <FinetuneTab />;
                    default: return <EmbeddingsTab />;
                }
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="header-left">
                                <p className="course-label">MGMT298D: Science and Strategy of AI</p>
                                <h1>Week 7: Word Embeddings & Transformers</h1>
                                <p className="subtitle">Explore word embeddings and train real transformer models</p>
                            </div>
                            <div className="header-right">
                                UCLA Anderson
                            </div>
                        </div>
                        <div className="header-gold-line" />
                    </header>

                    <div className="tabs-container">
                        <div className="tabs">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    className={`tab ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="main-content">
                        {renderTab()}
                    </main>

                    <footer className="footer">
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
