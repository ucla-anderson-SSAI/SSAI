<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7: How LLMs Work | UCLA Anderson</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2774AE;
            --darkBlue: #005587;
            --lightBlue: #8BB8E8;
            --gold: #FFD100;
            --bg: #ffffff;
            --card: #ffffff;
            --text: #1a1a1a;
            --textMuted: #666;
            --border: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            color: var(--text);
        }

        .app-container { min-height: 100vh; }

        /* Header */
        .header {
            background: var(--primary);
            padding: 1rem 2rem 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left .course-label {
            font-size: 0.65rem;
            font-weight: 400;
            color: #FFD100;
            margin-bottom: 0.25rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
        }

        .header-left .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .header-right {
            text-align: right;
            color: #ffffff;
            font-weight: 500;

        .header-gold-line {

            height: 4px;

            display: flex;

            color: var(--textMuted);

            border-bottom-color: var(--primary);

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;

        /* Cards */
        .card {

        .card-title {

        /* Grid layouts */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }

        /* Input styles */

            display: block;

        .head-tab:hover {

        }

        .head-tab.active {

            color: white;
            border-color: var(--primary);
        }

        .heatmap-grid {
            display: inline-block;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .heatmap-row {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .heatmap-cell {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .heatmap-cell:hover {
            transform: scale(1.1);

        .heatmap-label {
            font-size: 0.8rem;
            color: var(--textMuted);
            width: 70px;
            text-align: right;
            padding-right: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .heatmap-header {
            display: flex;
            gap: 2px;
            margin-left: 70px;
            margin-bottom: 6px;
        }

        .heatmap-header-cell {
            width: 50px;
            font-size: 0.8rem;
            color: var(--textMuted);
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Positional encoding viz */
        .pos-encoding-viz {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pos-row {
            display: flex;
            align-items: center;

        }

        .pos-label {

            font-size: 0.75rem;
            color: var(--textMuted);

            padding-right: 8px;

            height: 24px;
            border-radius: 3px;

        .prob-bar-container {

        .prob-bar-label {

        .prob-bar-value {

        }

            background: #f0f0f0;
            border-radius: 4px;

        .prob-bar-fill {

            border-radius: 4px;

        .prob-bar-fill.selected {

        /* Slider */
        .slider-container {

        }

        .slider-label {
            display: flex;

            margin-bottom: 0.5rem;

        .slider {
            width: 100%;

            -webkit-appearance: none;

        .slider::-webkit-slider-thumb {

            height: 18px;
            border-radius: 50%;

        /* Generated text display */
        .generated-text {

        .generated-text .prompt {

        }

        .generated-text .completion {

        .generated-text .cursor {
            display: inline-block;

            height: 1.2em;
            background: var(--primary);
            animation: blink 1s infinite;

            margin-left: 2px;

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }

        /* Stats/metrics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--textMuted);
            margin-top: 0.25rem;
        }

        /* Explanation boxes */
        .explanation {
            background: rgba(39, 116, 174, 0.05);
            border-left: 3px solid var(--primary);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: var(--textMuted);
        }

        .explanation strong {
            color: var(--text);
        }

        /* Code block */
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
        }

        .code-block .keyword { color: #569cd6; }
        .code-block .string { color: #ce9178; }
        .code-block .number { color: #b5cea8; }
        .code-block .comment { color: #6a9955; }

        /* Causal mask viz */
        .mask-grid {
            display: inline-block;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .mask-row {
            display: flex;
            gap: 3px;
            align-items: center;
        }

        .mask-cell {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .mask-cell.allowed {
            background: rgba(39, 116, 174, 0.2);
            color: var(--primary);
        }

        .mask-cell.blocked {
            background: #f0f0f0;
            color: #ccc;
        }

        .mask-label {
            font-size: 0.8rem;
            color: var(--textMuted);
            width: 50px;
            text-align: right;
            padding-right: 8px;
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--textMuted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // API Configuration - Update this URL after Railway deployment
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? ''  // Local development
            : '';  // Will be same-origin when served from Flask

        // ===========================================
        // TAB 1: Tokenization
        // ===========================================
        const TokenizerTab = () => {
            const [inputText, setInputText] = useState("The quick brown fox jumps over the lazy dog.");
            const [tokens, setTokens] = useState([]);
            const [tokenMethod, setTokenMethod] = useState('bpe');
            const [isLoading, setIsLoading] = useState(false);

            // Simulated BPE tokenization (simplified)
            const tokenizeBPE = (text) => {
                // This simulates GPT-style BPE tokenization
                const bpeTokens = [];
                const words = text.split(/(\s+)/);
                let id = 0;

                words.forEach(word => {
                    if (word.match(/^\s+$/)) {
                        // Whitespace token
                        bpeTokens.push({ text: word.replace(/ /g, '·'), id: id++, type: 'space' });
                    } else if (word.length <= 3) {
                        bpeTokens.push({ text: word, id: id++, type: 'word' });
                    } else {
                        // Split longer words into subwords (simulated BPE)
                        const subwords = [];
                        let remaining = word;

                        // Common prefixes
                        const prefixes = ['un', 'pre', 're', 'dis'];
                        for (const prefix of prefixes) {
                            if (remaining.toLowerCase().startsWith(prefix) && remaining.length > prefix.length + 2) {
                                subwords.push(prefix);
                                remaining = remaining.slice(prefix.length);
                                break;
                            }
                        }

                        // Common suffixes
                        const suffixes = ['ing', 'tion', 'ed', 'ly', 'er', 'est', 'ness'];
                        let suffix = '';
                        for (const suf of suffixes) {
                            if (remaining.toLowerCase().endsWith(suf) && remaining.length > suf.length + 1) {
                                suffix = suf;
                                remaining = remaining.slice(0, -suf.length);
                                break;
                            }
                        }

                        if (remaining.length > 0) subwords.push(remaining);
                        if (suffix) subwords.push(suffix);

                        subwords.forEach((sub, i) => {
                            bpeTokens.push({
                                text: (i > 0 ? '##' : '') + sub,
                                id: id++,
                                type: i === 0 ? 'word' : 'subword'
                            });
                        });
                    }
                });

                // Add special tokens
                return [
                    { text: '<|start|>', id: 0, type: 'special' },
                    ...bpeTokens.map((t, i) => ({ ...t, id: i + 1 })),
                    { text: '<|end|>', id: bpeTokens.length + 1, type: 'special' }
                ];
            };

            // Character-level tokenization
            const tokenizeChar = (text) => {
                return [
                    { text: '<SOS>', id: 0, type: 'special' },
                    ...text.split('').map((char, i) => ({
                        text: char === ' ' ? '·' : char,
                        id: i + 1,
                        type: char === ' ' ? 'space' : 'char'
                    })),
                    { text: '<EOS>', id: text.length + 1, type: 'special' }
                ];
            };

            // Word-level tokenization
            const tokenizeWord = (text) => {
                const words = text.split(/\s+/).filter(w => w.length > 0);
                return [
                    { text: '[CLS]', id: 0, type: 'special' },
                    ...words.map((word, i) => ({ text: word, id: i + 1, type: 'word' })),
                    { text: '[SEP]', id: words.length + 1, type: 'special' }
                ];
            };

            useEffect(() => {
                if (!inputText.trim()) {
                    setTokens([]);
                    return;
                }

                setIsLoading(true);
                setTimeout(() => {
                    let result;
                    switch (tokenMethod) {
                        case 'char':
                            result = tokenizeChar(inputText);
                            break;
                        case 'word':
                            result = tokenizeWord(inputText);
                            break;
                        case 'bpe':
                        default:
                            result = tokenizeBPE(inputText);
                    }
                    setTokens(result);
                    setIsLoading(false);
                }, 100);
            }, [inputText, tokenMethod]);

            return (
                <div>
                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
                                </svg>
                                Tokenization
                            </div>

                            <div className="explanation">
                                <strong>What is tokenization?</strong> LLMs don't see text as characters or words—they see <em>tokens</em>.
                                Tokenization splits text into subword units that balance vocabulary size with meaning preservation.
                                GPT uses ~50,000 tokens; common words are single tokens, rare words get split.
                            </div>

                            <div className="input-group">
                                <label className="input-label">Enter text to tokenize:</label>
                                <textarea
                                    className="text-input"
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    placeholder="Type any text here..."
                                />
                            </div>

                            <div className="input-group">
                                <label className="input-label">Tokenization method:</label>
                                <div className="btn-group">
                                    <button
                                        className={`btn-option ${tokenMethod === 'bpe' ? 'active' : ''}`}
                                        onClick={() => setTokenMethod('bpe')}
                                    >
                                        BPE (GPT-style)
                                    </button>
                                    <button
                                        className={`btn-option ${tokenMethod === 'word' ? 'active' : ''}`}
                                        onClick={() => setTokenMethod('word')}
                                    >
                                        Word-level
                                    </button>
                                    <button
                                        className={`btn-option ${tokenMethod === 'char' ? 'active' : ''}`}
                                        onClick={() => setTokenMethod('char')}
                                    >
                                        Character-level
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                                    <path d="M3 9h18M9 21V9"/>
                                </svg>
                                Tokens ({tokens.length})
                            </div>

                            <div className="tokens-display">
                                {isLoading ? (
                                    <span style={{ color: 'var(--textMuted)' }}>Tokenizing...</span>
                                ) : tokens.length === 0 ? (
                                    <span style={{ color: 'var(--textMuted)' }}>Enter text to see tokens</span>
                                ) : (
                                    tokens.map((token, i) => (
                                        <div
                                            key={i}
                                            className={`token ${token.type === 'special' ? 'special' : ''}`}
                                            title={`Token ID: ${token.id}`}
                                        >
                                            {token.text}
                                            <span className="token-id">{token.id}</span>
                                        </div>
                                    ))
                                )}
                            </div>

                            <div style={{ marginTop: '1rem' }}>
                                <div className="stats-grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
                                    <div className="stat-card">
                                        <div className="stat-value">{inputText.length}</div>
                                        <div className="stat-label">Characters</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value">{tokens.length}</div>
                                        <div className="stat-label">Tokens</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value">{tokens.length > 0 ? (inputText.length / tokens.length).toFixed(1) : 0}</div>
                                        <div className="stat-label">Chars/Token</div>
                                    </div>
                                </div>
                            </div>

                            <div className="explanation" style={{ marginTop: '1rem' }}>
                                <strong>Why BPE?</strong> Byte-Pair Encoding finds a balance: common words like "the" stay whole,
                                while rare words like "tokenization" get split into "token" + "ization". This keeps the vocabulary
                                manageable (~50K tokens) while handling any text.
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ===========================================
        // TAB 2: Attention Mechanism
        // ===========================================
        const AttentionTab = () => {
            const [sentence, setSentence] = useState("The cat sat on the mat");
            const [tokens, setTokens] = useState([]);
            const [step, setStep] = useState(0);
            const [embedDim, setEmbedDim] = useState(4);
            const [numHeads, setNumHeads] = useState(2);
            const [activeHead, setActiveHead] = useState(0);

            // Generate random but reproducible embeddings
            const generateEmbeddings = useCallback((toks, dim) => {
                const seededRandom = (seed) => {
                    const x = Math.sin(seed) * 10000;
                    return x - Math.floor(x);
                };

                return toks.map((tok, i) =>
                    Array(dim).fill(0).map((_, j) =>
                        (seededRandom(i * dim + j + tok.charCodeAt(0)) * 2 - 1).toFixed(2)
                    )
                );
            }, []);

            useEffect(() => {
                const toks = sentence.split(' ').filter(t => t.length > 0);
                setTokens(toks);
            }, [sentence]);

            const embeddings = useMemo(() => generateEmbeddings(tokens, embedDim), [tokens, embedDim]);

            // Generate Q, K, V matrices (simulated linear projections)
            const { Q, K, V } = useMemo(() => {
                if (tokens.length === 0) return { Q: [], K: [], V: [] };

                const seededRandom = (seed) => {
                    const x = Math.sin(seed * 9999) * 10000;
                    return x - Math.floor(x);
                };

                const headDim = Math.floor(embedDim / numHeads);

                const Q = embeddings.map((emb, i) =>
                    emb.slice(0, headDim).map((v, j) => (parseFloat(v) * 0.8 + seededRandom(i + j + 1) * 0.4 - 0.2).toFixed(2))
                );
                const K = embeddings.map((emb, i) =>
                    emb.slice(0, headDim).map((v, j) => (parseFloat(v) * 0.7 + seededRandom(i + j + 100) * 0.5 - 0.25).toFixed(2))
                );
                const V = embeddings.map((emb, i) =>
                    emb.slice(0, headDim).map((v, j) => (parseFloat(v) * 0.9 + seededRandom(i + j + 200) * 0.3 - 0.15).toFixed(2))
                );

                return { Q, K, V };
            }, [embeddings, numHeads, embedDim]);

            // Compute attention scores
            const attentionScores = useMemo(() => {
                if (Q.length === 0 || K.length === 0) return [];

                // QK^T / sqrt(d_k)
                const headDim = Q[0]?.length || 1;
                const scale = Math.sqrt(headDim);

                return Q.map((q, i) =>
                    K.map((k, j) => {
                        const dot = q.reduce((sum, qi, idx) => sum + parseFloat(qi) * parseFloat(k[idx]), 0);
                        return dot / scale;
                    })
                );
            }, [Q, K]);

            // Apply softmax to get attention weights
            const attentionWeights = useMemo(() => {
                return attentionScores.map(row => {
                    const maxVal = Math.max(...row);
                    const expRow = row.map(x => Math.exp(x - maxVal));
                    const sum = expRow.reduce((a, b) => a + b, 0);
                    return expRow.map(x => x / sum);
                });
            }, [attentionScores]);

            const getColor = (weight) => {
                const intensity = Math.pow(weight, 0.6);
                const r = Math.round(39 + (255 - 39) * intensity);
                const g = Math.round(116 + (209 - 116) * intensity);
                const b = Math.round(174 + (0 - 174) * intensity);
                return `rgba(${r}, ${g}, ${b}, ${0.3 + intensity * 0.7})`;
            };

            const steps = [
                { name: 'Input Embeddings', desc: 'Each token is converted to a dense vector representation' },
                { name: 'Query (Q)', desc: 'Linear projection of embeddings to create queries - "what am I looking for?"' },
                { name: 'Key (K)', desc: 'Linear projection to create keys - "what do I contain?"' },
                { name: 'Value (V)', desc: 'Linear projection to create values - "what information do I carry?"' },
                { name: 'Attention Scores', desc: 'QK^T / √d_k - How much should each token attend to others?' },
                { name: 'Softmax → Weights', desc: 'Normalize scores to get attention weights (sum to 1 per row)' },
            ];

            const renderMatrix = (matrix, label, highlight = false) => (
                <div style={{ marginBottom: '1rem' }}>
                    <div className="matrix-label">{label}</div>
                    <div className="matrix-container">
                        <div className="matrix" style={{ opacity: highlight ? 1 : 0.5 }}>
                            {matrix.map((row, i) => (
                                <div key={i} className="matrix-row">
                                    {row.map((val, j) => (
                                        <div key={j} className="matrix-cell">
                                            {typeof val === 'number' ? val.toFixed(2) : val}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div>
                    <div className="card">
                        <div className="card-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            Self-Attention Step by Step
                        </div>

                        <div className="explanation">
                            <strong>Self-attention</strong> is the core mechanism of transformers. It allows each token to look at
                            all other tokens and decide which ones are relevant. The formula is: <code>Attention(Q,K,V) = softmax(QK^T/√d_k)V</code>
                        </div>

                        <div className="grid-2">
                            <div>
                                <div className="input-group">
                                    <label className="input-label">Input sentence:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={sentence}
                                        onChange={(e) => setSentence(e.target.value)}
                                    />
                                </div>

                                <div className="input-group">
                                    <label className="input-label">Embedding dimension:</label>
                                    <div className="btn-group">
                                        {[4, 8].map(d => (
                                            <button
                                                key={d}
                                                className={`btn-option ${embedDim === d ? 'active' : ''}`}
                                                onClick={() => setEmbedDim(d)}
                                            >
                                                {d}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div className="input-group">
                                    <label className="input-label">Walk through the steps:</label>
                                    <div className="btn-group">
                                        {steps.map((s, i) => (
                                            <button
                                                key={i}
                                                className={`btn-option ${step === i ? 'active' : ''}`}
                                                onClick={() => setStep(i)}
                                                style={{ fontSize: '0.75rem', padding: '0.4rem 0.8rem' }}
                                            >
                                                {i + 1}. {s.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="explanation">
                                    <strong>Step {step + 1}:</strong> {steps[step].desc}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">Matrices</div>

                            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                                {tokens.map((tok, i) => (
                                    <div key={i} className="token">{tok}</div>
                                ))}
                            </div>

                            {step >= 0 && renderMatrix(embeddings, 'Input Embeddings (X)', step === 0)}
                            {step >= 1 && renderMatrix(Q, 'Query (Q = X·W_Q)', step === 1)}
                            {step >= 2 && renderMatrix(K, 'Key (K = X·W_K)', step === 2)}
                            {step >= 3 && renderMatrix(V, 'Value (V = X·W_V)', step === 3)}
                            {step >= 4 && renderMatrix(attentionScores.map(row => row.map(v => v.toFixed(2))), 'Attention Scores (QK^T/√d)', step === 4)}
                        </div>

                        <div className="card">
                            <div className="card-title">Attention Weights (after Softmax)</div>

                            {step >= 5 && attentionWeights.length > 0 && (
                                <div className="heatmap-container">
                                    <div className="heatmap-header">
                                        {tokens.map((tok, i) => (
                                            <div key={i} className="heatmap-header-cell">{tok}</div>
                                        ))}
                                    </div>
                                    <div className="heatmap-grid">
                                        {attentionWeights.map((row, i) => (
                                            <div key={i} className="heatmap-row">
                                                <div className="heatmap-label">{tokens[i]}</div>
                                                {row.map((weight, j) => (
                                                    <div
                                                        key={j}
                                                        className="heatmap-cell"
                                                        style={{
                                                            backgroundColor: getColor(weight),
                                                            color: weight > 0.4 ? '#111' : '#333'
                                                        }}
                                                    >
                                                        {weight.toFixed(2)}
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step < 5 && (
                                <div style={{ padding: '2rem', textAlign: 'center', color: 'var(--textMuted)' }}>
                                    Complete steps 1-5 to see attention weights
                                </div>
                            )}

                            <div className="explanation" style={{ marginTop: '1rem' }}>
                                <strong>Reading the heatmap:</strong> Each row shows how much one token "attends" to all other tokens.
                                Higher values (yellow) mean stronger attention. Notice how related words attend to each other.
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ===========================================
        // TAB 3: Positional Encoding
        // ===========================================
        const PositionalEncodingTab = () => {
            const [seqLength, setSeqLength] = useState(8);
            const [embedDim, setEmbedDim] = useState(16);
            const [encodingType, setEncodingType] = useState('sinusoidal');

            // Generate positional encodings
            const positionalEncodings = useMemo(() => {
                const encodings = [];

                for (let pos = 0; pos < seqLength; pos++) {
                    const encoding = [];
                    for (let i = 0; i < embedDim; i++) {
                        if (encodingType === 'sinusoidal') {
                            const denominator = Math.pow(10000, (2 * Math.floor(i / 2)) / embedDim);
                            if (i % 2 === 0) {
                                encoding.push(Math.sin(pos / denominator));
                            } else {
                                encoding.push(Math.cos(pos / denominator));
                            }
                        } else {
                            // Learned (simulated)
                            const seededRandom = (seed) => {
                                const x = Math.sin(seed * 12345) * 10000;
                                return (x - Math.floor(x)) * 2 - 1;
                            };
                            encoding.push(seededRandom(pos * embedDim + i));
                        }
                    }
                    encodings.push(encoding);
                }

                return encodings;
            }, [seqLength, embedDim, encodingType]);

            const getColor = (value) => {
                // value is between -1 and 1
                const normalized = (value + 1) / 2; // 0 to 1
                const r = Math.round(39 + (255 - 39) * normalized);
                const g = Math.round(116 + (209 - 116) * normalized);
                const b = Math.round(174 * (1 - normalized));
                return `rgb(${r}, ${g}, ${b})`;
            };

            return (
                <div>
                    <div className="card">
                        <div className="card-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <line x1="12" y1="20" x2="12" y2="4"/>
                                <polyline points="6 10 12 4 18 10"/>
                            </svg>
                            Positional Encoding
                        </div>

                        <div className="explanation">
                            <strong>Why positional encoding?</strong> Unlike RNNs, transformers process all tokens in parallel.
                            Without position information, "The cat sat on the mat" would be the same as "mat the on sat cat The"!
                            Positional encodings add position information to each token's embedding.
                        </div>

                        <div className="grid-3">
                            <div className="input-group">
                                <label className="input-label">Sequence length:</label>
                                <div className="btn-group">
                                    {[4, 8, 12, 16].map(n => (
                                        <button
                                            key={n}
                                            className={`btn-option ${seqLength === n ? 'active' : ''}`}
                                            onClick={() => setSeqLength(n)}
                                        >
                                            {n}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="input-group">
                                <label className="input-label">Embedding dimension:</label>
                                <div className="btn-group">
                                    {[8, 16, 32].map(n => (
                                        <button
                                            key={n}
                                            className={`btn-option ${embedDim === n ? 'active' : ''}`}
                                            onClick={() => setEmbedDim(n)}
                                        >
                                            {n}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="input-group">
                                <label className="input-label">Encoding type:</label>
                                <div className="btn-group">
                                    <button
                                        className={`btn-option ${encodingType === 'sinusoidal' ? 'active' : ''}`}
                                        onClick={() => setEncodingType('sinusoidal')}
                                    >
                                        Sinusoidal (GPT-2)
                                    </button>
                                    <button
                                        className={`btn-option ${encodingType === 'learned' ? 'active' : ''}`}
                                        onClick={() => setEncodingType('learned')}
                                    >
                                        Learned
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">Positional Encoding Matrix</div>
                            <div style={{ overflowX: 'auto' }}>
                                <div className="pos-encoding-viz">
                                    <div className="pos-row">
                                        <div className="pos-label">dim →</div>
                                        {Array(Math.min(embedDim, 24)).fill(0).map((_, i) => (
                                            <div key={i} className="pos-cell" style={{ background: '#f0f0f0', fontSize: '0.6rem', color: '#888' }}>
                                                {i}
                                            </div>
                                        ))}
                                    </div>
                                    {positionalEncodings.map((row, pos) => (
                                        <div key={pos} className="pos-row">
                                            <div className="pos-label">pos {pos}</div>
                                            {row.slice(0, 24).map((val, i) => (
                                                <div
                                                    key={i}
                                                    className="pos-cell"
                                                    style={{ background: getColor(val) }}
                                                    title={val.toFixed(3)}
                                                />
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div style={{ display: 'flex', justifyContent: 'center', gap: '2rem', marginTop: '1rem' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem' }}>
                                    <div style={{ width: 16, height: 16, background: 'rgb(39, 116, 174)', borderRadius: 2 }}/>
                                    <span>-1</span>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem' }}>
                                    <div style={{ width: 16, height: 16, background: 'rgb(147, 162, 87)', borderRadius: 2 }}/>
                                    <span>0</span>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem' }}>
                                    <div style={{ width: 16, height: 16, background: 'rgb(255, 209, 0)', borderRadius: 2 }}/>
                                    <span>+1</span>
                                </div>
                            </div>
                        </div>

                        <div className="card">
                            <div className="card-title">The Formula</div>

                            {encodingType === 'sinusoidal' ? (
                                <>
                                    <div className="code-block">
                                        <span className="comment"># Sinusoidal Positional Encoding</span><br/>
                                        PE(pos, 2i) = <span className="keyword">sin</span>(pos / 10000^(2i/d_model))<br/>
                                        PE(pos, 2i+1) = <span className="keyword">cos</span>(pos / 10000^(2i/d_model))
                                    </div>

                                    <div className="explanation" style={{ marginTop: '1rem' }}>
                                        <strong>Why sine and cosine?</strong>
                                        <ul style={{ marginTop: '0.5rem', paddingLeft: '1.5rem' }}>
                                            <li>Different frequencies capture different position scales</li>
                                            <li>Any position can attend to relative positions (PE(pos+k) can be expressed as a linear function of PE(pos))</li>
                                            <li>Smooth, continuous representation</li>
                                            <li>Can generalize to longer sequences than seen in training</li>
                                        </ul>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="code-block">
                                        <span className="comment"># Learned Positional Encoding</span><br/>
                                        PE = nn.Embedding(max_seq_len, d_model)<br/>
                                        positions = PE(torch.arange(seq_len))
                                    </div>

                                    <div className="explanation" style={{ marginTop: '1rem' }}>
                                        <strong>Learned vs Sinusoidal:</strong>
                                        <ul style={{ marginTop: '0.5rem', paddingLeft: '1.5rem' }}>
                                            <li>Learned: More flexible, can adapt to data patterns</li>
                                            <li>Learned: Cannot generalize beyond training sequence length</li>
                                            <li>Modern LLMs (GPT-3+) often use learned positional encodings</li>
                                            <li>Some use Rotary Position Embedding (RoPE) for better extrapolation</li>
                                        </ul>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ===========================================
        // TAB 4: Causal Masking
        // ===========================================
        const CausalMaskingTab = () => {
            const [tokens] = useState(['The', 'quick', 'brown', 'fox', 'jumps']);
            const [highlightToken, setHighlightToken] = useState(null);

            return (
                <div>
                    <div className="card">
                        <div className="card-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            Causal (Autoregressive) Masking
                        </div>

                        <div className="explanation">
                            <strong>Why causal masking?</strong> LLMs are trained to predict the next token. During training,
                            they shouldn't be able to "peek" at future tokens—that would be cheating! Causal masking ensures each
                            position can only attend to previous positions (and itself).
                        </div>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">Attention Mask</div>

                            <div style={{ marginBottom: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                                {tokens.map((tok, i) => (
                                    <button
                                        key={i}
                                        className={`btn-option ${highlightToken === i ? 'active' : ''}`}
                                        onClick={() => setHighlightToken(highlightToken === i ? null : i)}
                                    >
                                        {tok}
                                    </button>
                                ))}
                            </div>

                            <div style={{ overflowX: 'auto' }}>
                                <div style={{ marginLeft: '50px', display: 'flex', gap: '3px', marginBottom: '6px' }}>
                                    {tokens.map((tok, i) => (
                                        <div key={i} style={{ width: 40, textAlign: 'center', fontSize: '0.75rem', color: 'var(--textMuted)' }}>
                                            {tok}
                                        </div>
                                    ))}
                                </div>
                                <div className="mask-grid">
                                    {tokens.map((tok, i) => (
                                        <div key={i} className="mask-row">
                                            <div className="mask-label">{tok}</div>
                                            {tokens.map((_, j) => {
                                                const allowed = j <= i;
                                                const highlighted = highlightToken !== null && i === highlightToken;
                                                return (
                                                    <div
                                                        key={j}
                                                        className={`mask-cell ${allowed ? 'allowed' : 'blocked'}`}
                                                        style={{
                                                            opacity: highlighted ? 1 : 0.7,
                                                            transform: highlighted && allowed ? 'scale(1.1)' : 'none',
                                                            transition: 'all 0.2s'
                                                        }}
                                                    >
                                                        {allowed ? '✓' : '✗'}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="explanation" style={{ marginTop: '1rem' }}>
                                <strong>Reading the mask:</strong> Row = current token being processed. Column = tokens it can see.
                                ✓ means attention is allowed, ✗ means it's blocked (set to -∞ before softmax).
                            </div>
                        </div>

                        <div className="card">
                            <div className="card-title">Encoder vs Decoder</div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                                <div style={{ padding: '1rem', background: '#f8f9fa', borderRadius: 8 }}>
                                    <h4 style={{ marginBottom: '0.5rem', color: 'var(--primary)' }}>Encoder (BERT)</h4>
                                    <p style={{ fontSize: '0.85rem', color: 'var(--textMuted)' }}>
                                        • Bidirectional attention<br/>
                                        • Each token sees ALL other tokens<br/>
                                        • Good for understanding/classification<br/>
                                        • Cannot generate text autoregressively
                                    </p>
                                </div>
                                <div style={{ padding: '1rem', background: 'rgba(39, 116, 174, 0.1)', borderRadius: 8 }}>
                                    <h4 style={{ marginBottom: '0.5rem', color: 'var(--primary)' }}>Decoder (GPT)</h4>
                                    <p style={{ fontSize: '0.85rem', color: 'var(--textMuted)' }}>
                                        • Causal (unidirectional) attention<br/>
                                        • Each token only sees PAST tokens<br/>
                                        • Good for generation<br/>
                                        • Used by ChatGPT, Claude, etc.
                                    </p>
                                </div>
                            </div>

                            <div className="code-block" style={{ marginTop: '1rem' }}>
                                <span className="comment"># Creating a causal mask</span><br/>
                                mask = torch.triu(torch.ones(seq_len, seq_len), diagonal=<span className="number">1</span>)<br/>
                                mask = mask.masked_fill(mask == <span className="number">1</span>, <span className="keyword">float</span>(<span className="string">'-inf'</span>))<br/><br/>
                                <span className="comment"># Apply to attention scores</span><br/>
                                attention = softmax(QK^T / sqrt(d_k) + mask)
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ===========================================
        // TAB 5: Text Generation
        // ===========================================
        const TextGenerationTab = () => {
            const [prompt, setPrompt] = useState("The future of artificial intelligence");
            const [temperature, setTemperature] = useState(0.7);
            const [topP, setTopP] = useState(0.9);
            const [maxTokens, setMaxTokens] = useState(50);
            const [samplingMethod, setSamplingMethod] = useState('temperature');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedText, setGeneratedText] = useState('');
            const [tokenProbs, setTokenProbs] = useState([]);
            const [currentStep, setCurrentStep] = useState(0);

            // Simulated next-token probabilities
            const generateNextTokenProbs = (context) => {
                // This would come from real API, simulating for demo
                const probs = [
                    { token: 'is', prob: 0.25 },
                    { token: 'will', prob: 0.20 },
                    { token: 'has', prob: 0.15 },
                    { token: 'represents', prob: 0.12 },
                    { token: 'holds', prob: 0.08 },
                    { token: 'remains', prob: 0.06 },
                    { token: 'seems', prob: 0.05 },
                    { token: 'brings', prob: 0.04 },
                    { token: 'offers', prob: 0.03 },
                    { token: 'continues', prob: 0.02 },
                ];

                // Apply temperature
                if (samplingMethod === 'temperature') {
                    const tempProbs = probs.map(p => ({
                        ...p,
                        prob: Math.pow(p.prob, 1 / temperature)
                    }));
                    const sum = tempProbs.reduce((a, b) => a + b.prob, 0);
                    return tempProbs.map(p => ({ ...p, prob: p.prob / sum }));
                }

                return probs;
            };

            const handleGenerate = async () => {
                setIsGenerating(true);
                setGeneratedText('');
                setTokenProbs([]);
                setCurrentStep(0);

                try {
                    const response = await fetch(`${API_BASE}/api/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt,
                            temperature,
                            top_p: topP,
                            max_tokens: maxTokens,
                            stream: true
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        // Animate the generation
                        const words = data.text.split(' ');
                        for (let i = 0; i < words.length; i++) {
                            await new Promise(r => setTimeout(r, 50));
                            setGeneratedText(prev => prev + (prev ? ' ' : '') + words[i]);
                            setCurrentStep(i + 1);
                        }
                        if (data.token_probs) {
                            setTokenProbs(data.token_probs);
                        }
                    } else {
                        // Simulate generation
                        const simulated = "is both exciting and uncertain. As we develop more sophisticated systems, we must carefully consider the ethical implications and ensure that AI benefits all of humanity.";
                        const words = simulated.split(' ');
                        for (let i = 0; i < Math.min(words.length, maxTokens / 2); i++) {
                            await new Promise(r => setTimeout(r, 80));
                            setGeneratedText(prev => prev + (prev ? ' ' : '') + words[i]);
                            setCurrentStep(i + 1);
                            setTokenProbs(generateNextTokenProbs(prompt + ' ' + words.slice(0, i + 1).join(' ')));
                        }
                    }
                } catch (error) {
                    // Fallback simulation
                    const simulated = "is both exciting and uncertain. As we develop more sophisticated systems, we must carefully consider the ethical implications.";
                    const words = simulated.split(' ');
                    for (let i = 0; i < Math.min(words.length, maxTokens / 2); i++) {
                        await new Promise(r => setTimeout(r, 80));
                        setGeneratedText(prev => prev + (prev ? ' ' : '') + words[i]);
                        setCurrentStep(i + 1);
                        setTokenProbs(generateNextTokenProbs(prompt));
                    }

            };

        // ===========================================
        // TAB 6: Architecture Overview

        const ArchitectureTab = () => {

            const [embedDim, setEmbedDim] = useState(64);
            const [numHeads, setNumHeads] = useState(4);
            const [ffDim, setFfDim] = useState(256);

            const calculateParams = () => {
                const vocabSize = 50000;
                const seqLen = 2048;

                const embedding = vocabSize * embedDim;
                const positional = seqLen * embedDim;
                const attention = numBlocks * (4 * embedDim * embedDim); // Q, K, V, O projections
                const ffn = numBlocks * (2 * embedDim * ffDim);
                const layernorm = numBlocks * 4 * embedDim;
                const output = vocabSize * embedDim;

                return {
                    embedding,
                    positional,
                    attention,
                    ffn,
                    layernorm,
                    output,
                    total: embedding + positional + attention + ffn + layernorm + output
                };
            };

            const params = calculateParams();

            return (
                <div>

            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [serverStatus, setServerStatus] = useState(null);
            const [activeHead, setActiveHead] = useState(0);
            const [activeBlock, setActiveBlock] = useState(0);

            // Check server health on mount
            useEffect(() => {

            // Poll for training progress
            useEffect(() => {

                                setResults(data);

                                setStatus('error');
                                setError(data.error);
                            }

                            setError(err.message);
                            setStatus('error');

                                                background: 'var(--primary)',
                                                transition: 'width 0.3s'
                                            }} />
                                        </div>
                                    </div>

                                    {progress.queue_position > 0 && (
                                        <div className="explanation">
                                            ⏳ Your job is in queue. Position: {progress.queue_position}
                                        </div>
                                    )}

                                    {progress.history && progress.history.length > 0 && (
                                        <div style={{ marginTop: '1rem' }}>
                                            <svg width="100%" height="200" viewBox="0 0 400 200">
                                                {/* Axes */}
                                                <line x1="50" y1="170" x2="380" y2="170" stroke="#ccc" strokeWidth="1"/>
                                                <line x1="50" y1="20" x2="50" y2="170" stroke="#ccc" strokeWidth="1"/>
                                                <text x="215" y="195" textAnchor="middle" fontSize="12" fill="#666">Epoch</text>
                                                <text x="20" y="95" textAnchor="middle" fontSize="12" fill="#666" transform="rotate(-90, 20, 95)">Accuracy %</text>

                                                {/* Grid lines */}
                                                {[0, 25, 50, 75, 100].map((v, i) => (
                                                    <g key={i}>
                                                        <line x1="50" y1={170 - v * 1.5} x2="380" y2={170 - v * 1.5} stroke="#eee" strokeWidth="1"/>
                                                        <text x="45" y={175 - v * 1.5} textAnchor="end" fontSize="10" fill="#999">{v}</text>
                                                    </g>
                                                ))}

                                                {/* Training accuracy line */}
                                                <polyline
                                                    fill="none"
                                                    stroke="var(--primary)"
                                                    strokeWidth="2"
                                                    points={progress.history.map((h, i) =>
                                                        `${50 + (i + 1) * (330 / (progress.total_epochs || 10))},${170 - h.trainAcc * 1.5}`
                                                    ).join(' ')}
                                                />

                                                {/* Validation accuracy line */}
                                                <polyline
                                                    fill="none"
                                                    stroke="var(--gold)"
                                                    strokeWidth="2"
                                                    points={progress.history.map((h, i) =>
                                                        `${50 + (i + 1) * (330 / (progress.total_epochs || 10))},${170 - h.valAcc * 1.5}`
                                                    ).join(' ')}
                                                />

                                                {/* Legend */}
                                                <rect x="280" y="25" width="12" height="12" fill="var(--primary)"/>
                                                <text x="297" y="35" fontSize="10" fill="#666">Train</text>
                                                <rect x="330" y="25" width="12" height="12" fill="var(--gold)"/>
                                                <text x="347" y="35" fontSize="10" fill="#666">Val</text>
                                            </svg>
                                        </div>
                                    )}
                                </>
                            )}

                            {status === 'complete' && results && (
                                <div>
                                    <div className="stats-grid" style={{ gridTemplateColumns: '1fr 1fr', marginBottom: '1rem' }}>
                                        <div className="stat-card">
                                            <div className="stat-value">{results.test_accuracy?.toFixed(1)}%</div>
                                            <div className="stat-label">Test Accuracy</div>
                                        </div>
                                        <div className="stat-card">
                                            <div className="stat-value">{results.num_params ? (results.num_params / 1000).toFixed(0) + 'K' : '-'}</div>
                                            <div className="stat-label">Parameters</div>
                                        </div>
                                    </div>

                                    {/* Final accuracy plot */}
                                    {results.history && (
                                        <div style={{ marginBottom: '1.5rem' }}>
                                            <h4 style={{ fontSize: '0.9rem', marginBottom: '0.75rem' }}>Training History</h4>
                                            <svg width="100%" height="200" viewBox="0 0 400 200">
                                                <line x1="50" y1="170" x2="380" y2="170" stroke="#ccc" strokeWidth="1"/>
                                                <line x1="50" y1="20" x2="50" y2="170" stroke="#ccc" strokeWidth="1"/>
                                                {[0, 25, 50, 75, 100].map((v, i) => (
                                                    <g key={i}>
                                                        <line x1="50" y1={170 - v * 1.5} x2="380" y2={170 - v * 1.5} stroke="#eee" strokeWidth="1"/>
                                                        <text x="45" y={175 - v * 1.5} textAnchor="end" fontSize="10" fill="#999">{v}</text>
                                                    </g>
                                                ))}
                                                <polyline
                                                    fill="none"
                                                    stroke="var(--primary)"
                                                    strokeWidth="2"
                                                    points={results.history.map((h, i) =>
                                                        `${50 + (i + 1) * (330 / results.history.length)},${170 - h.trainAcc * 1.5}`
                                                    ).join(' ')}
                                                />
                                                <polyline
                                                    fill="none"
                                                    stroke="var(--gold)"
                                                    strokeWidth="2"
                                                    points={results.history.map((h, i) =>
                                                        `${50 + (i + 1) * (330 / results.history.length)},${170 - h.valAcc * 1.5}`
                                                    ).join(' ')}
                                                />
                                                <rect x="280" y="25" width="12" height="12" fill="var(--primary)"/>
                                                <text x="297" y="35" fontSize="10" fill="#666">Train</text>
                                                <rect x="330" y="25" width="12" height="12" fill="var(--gold)"/>
                                                <text x="347" y="35" fontSize="10" fill="#666">Val</text>
                                            </svg>
                                        </div>
                                    )}

                                    {/* Sample predictions */}
                                    {results.sample_predictions && (
                                        <div>
                                            <h4 style={{ fontSize: '0.9rem', marginBottom: '0.75rem' }}>Sample Predictions</h4>
                                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                                                {results.sample_predictions.map((pred, i) => (
                                                    <div key={i} style={{
                                                        padding: '0.5rem 1rem',
                                                        background: pred.correct ? 'rgba(40, 167, 69, 0.1)' : 'rgba(220, 53, 69, 0.1)',
                                                        borderRadius: 8,
                                                        border: `1px solid ${pred.correct ? '#28a745' : '#dc3545'}`,
                                                        fontSize: '0.8rem'
                                                    }}>
                                                        <div>True: {pred.true} → Pred: {pred.predicted}</div>
                                                        <div style={{ color: 'var(--textMuted)' }}>{(pred.confidence * 100).toFixed(0)}% conf</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Attention Weights Visualization */}
                    {status === 'complete' && results && results.attention_weights && (
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                Learned Attention Weights
                            </div>

                            <div className="explanation">
                                These are the actual attention patterns learned by your trained transformer. Each head learns different patterns - some focus on nearby tokens, others on specific relationships.
                            </div>

                            <div style={{ display: 'flex', gap: '1rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                                <div>
                                    <label className="input-label">Block:</label>
                                    <div className="btn-group">
                                        {Object.keys(results.attention_weights).map((block, i) => (
                                            <button key={i}
                                                className={`btn-option ${activeBlock === i ? 'active' : ''}`}
                                                onClick={() => setActiveBlock(i)}
                                            >
                                                Block {i + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="input-label">Head:</label>
                                    <div className="btn-group">
                                        {results.attention_weights[`block_${activeBlock}`] &&
                                            Object.keys(results.attention_weights[`block_${activeBlock}`]).map((head, i) => (
                                                <button key={i}
                                                    className={`btn-option ${activeHead === i ? 'active' : ''}`}
                                                    onClick={() => setActiveHead(i)}
                                                >
                                                    Head {i + 1}
                                                </button>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>

                            <div className="heatmap-container">
                                {results.attention_tokens && (
                                    <div className="heatmap-header">
                                        {results.attention_tokens.slice(0, 8).map((tok, i) => (
                                            <div key={i} className="heatmap-header-cell">{tok}</div>
                                        ))}
                                    </div>
                                )}
                                <div className="heatmap-grid">
                                    {results.attention_weights[`block_${activeBlock}`] &&
                                     results.attention_weights[`block_${activeBlock}`][activeHead] &&
                                        results.attention_weights[`block_${activeBlock}`][activeHead].slice(0, 8).map((row, i) => (
                                            <div key={i} className="heatmap-row">
                                                <div className="heatmap-label">
                                                    {results.attention_tokens ? results.attention_tokens[i] : `pos ${i}`}
                                                </div>
                                                {row.slice(0, 8).map((weight, j) => (
                                                    <div
                                                        key={j}
                                                        className="heatmap-cell"
                                                        style={{
                                                            background: getColor(weight),
                                                            color: weight > 0.4 ? 'white' : '#333'
                                                        }}
                                                        title={`${(weight * 100).toFixed(1)}%`}
                                                    >
                                                        {(weight * 100).toFixed(0)}
                                                    </div>
                                                ))}
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===========================================
        // Main App
        // ===========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('tokenizer');

            const tabs = [
                { id: 'tokenizer', label: '🔤 Tokenization' },
                { id: 'attention', label: '🎯 Attention' },
                { id: 'positional', label: '📍 Positional Encoding' },
                { id: 'masking', label: '🔒 Causal Masking' },
                { id: 'generation', label: '✨ Text Generation' },
                { id: 'architecture', label: '🏗️ Architecture' },
                { id: 'training', label: '🚀 Train Transformer' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'tokenizer': return <TokenizerTab />;
                    case 'attention': return <AttentionTab />;
                    case 'positional': return <PositionalEncodingTab />;
                    case 'masking': return <CausalMaskingTab />;
                    case 'generation': return <TextGenerationTab />;
                    case 'architecture': return <ArchitectureTab />;
                    case 'training': return <TrainTransformerTab />;
                    default: return <TokenizerTab />;
                }
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="header-left">
                                <p className="course-label">MGMT298D: Science and Strategy of AI</p>
                                <h1>Week 7: How LLMs Work</h1>
                                <p className="subtitle">Interactive exploration of transformer architecture and text generation</p>
                            </div>
                            <div className="header-right">
                                UCLA Anderson
                            </div>
                        </div>
                        <div className="header-gold-line" />
                    </header>

                    <div className="tabs-container">
                        <div className="tabs">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    className={`tab ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="main-content">
                        {renderTab()}
                    </main>

                    <footer className="footer">
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
