<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7: Word Embeddings & Transformers | UCLA Anderson</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2774AE;
            --darkBlue: #005587;
            --lightBlue: #8BB8E8;
            --gold: #FFD100;
            --bg: #ffffff;
            --card: #ffffff;
            --text: #1a1a1a;
            --textMuted: #666;
            --border: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            color: var(--text);
        }

        .app-container { min-height: 100vh; }

        /* Header */
        .header {
            background: var(--primary);
            padding: 1rem 2rem 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left .course-label {
            font-size: 0.65rem;
            font-weight: 400;
            color: #FFD100;
            margin-bottom: 0.25rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
        }

        .header-left .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .header-right {
            text-align: right;
            color: #ffffff;
            font-weight: 500;
        }

        .header-gold-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold);
        }

        /* Tabs */
        .tabs-container {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: sticky;
            top: 72px;
            z-index: 99;
        }

        .tabs {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 0;
        }

        .tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            color: var(--textMuted);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover { color: var(--primary); }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        /* Grid layouts */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }

        @media (max-width: 900px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        /* Input styles */
        .input-group {
            margin-bottom: 1rem;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--textMuted);
            margin-bottom: 0.5rem;
        }

        .text-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover { background: var(--darkBlue); }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--text);
        }

        .btn-secondary:hover { background: #e0e0e0; }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-option {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            color: var(--textMuted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-option:hover { border-color: var(--primary); }

        .btn-option.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-option:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Explanation box */
        .explanation {
            background: linear-gradient(135deg, rgba(39, 116, 174, 0.08), rgba(139, 184, 232, 0.08));
            border-left: 3px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--textMuted);
            margin-top: 0.25rem;
        }

        /* Result display */
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--textMuted);
            margin-top: 0.5rem;
        }

        /* Word chips */
        .word-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 0.25rem;
        }

        .word-chip.result {
            background: var(--gold);
            color: #333;
        }

        .word-chip .score {
            background: rgba(255,255,255,0.2);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--textMuted);
            font-size: 0.85rem;
        }

        /* Comparison cards */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .comparison-grid { grid-template-columns: 1fr; }
        }

        .comparison-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .comparison-card.winner {
            background: linear-gradient(135deg, rgba(39, 116, 174, 0.1), rgba(139, 184, 232, 0.1));
            border: 2px solid var(--primary);
        }

        .comparison-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .comparison-title .badge {
            background: var(--gold);
            color: #333;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Heatmap for attention */
        .heatmap-container {
            overflow-x: auto;
            padding: 1rem 0;
        }

        .heatmap-grid {
            display: inline-block;
            min-width: 100%;
        }

        .heatmap-row {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 2px;
        }

        .heatmap-label {
            width: 60px;
            font-size: 0.75rem;
            text-align: right;
            padding-right: 8px;
            color: var(--textMuted);
            font-family: 'JetBrains Mono', monospace;
        }

        .heatmap-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
        }

        .heatmap-header {
            display: flex;
            margin-left: 68px;
            margin-bottom: 4px;
        }

        .heatmap-header-cell {
            width: 40px;
            margin-right: 2px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--textMuted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Error message */
        .error-box {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        /* Success message */
        .success-box {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid #28a745;
            color: #28a745;
            padding: 1rem;
            border-radius: 8px;
        }

        /* Architecture diagram styles */
        .arch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 12px;
            overflow-x: auto;
        }

        .arch-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 300px;
        }

        .arch-layer {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0.25rem 0;
            position: relative;
        }

        .arch-layer.input {
            background: linear-gradient(135deg, #e8f4f8, #d0e8f0);
            border: 2px solid #8BB8E8;
            color: #005587;
        }

        .arch-layer.embedding {
            background: linear-gradient(135deg, #fff3d0, #ffe69c);
            border: 2px solid #FFD100;
            color: #665200;
        }

        .arch-layer.transformer {
            background: linear-gradient(135deg, #d4e5f7, #a8c8e8);
            border: 2px solid #2774AE;
            color: #005587;
        }

        .arch-layer.attention {
            background: linear-gradient(135deg, #e8d4f7, #d4b8e8);
            border: 2px solid #8B5CF6;
            color: #4c1d95;
            margin-left: 1.5rem;
            width: calc(100% - 1.5rem);
        }

        .arch-layer.ffn {
            background: linear-gradient(135deg, #d4f7e8, #a8e8c8);
            border: 2px solid #10B981;
            color: #065f46;
            margin-left: 1.5rem;
            width: calc(100% - 1.5rem);
        }

        .arch-layer.output {
            background: linear-gradient(135deg, #fde8e8, #f8c4c4);
            border: 2px solid #dc3545;
            color: #991b1b;
        }

        .arch-arrow {
            width: 2px;
            height: 20px;
            background: #999;
            position: relative;
        }

        .arch-arrow::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #999;
        }

        .arch-bracket {
            border: 2px dashed #2774AE;
            border-radius: 12px;
            padding: 0.5rem;
            margin: 0.5rem 0;
            width: 100%;
        }

        .arch-bracket-label {
            font-size: 0.75rem;
            color: #2774AE;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .arch-layer-detail {
            font-size: 0.7rem;
            color: inherit;
            opacity: 0.8;
            margin-top: 0.25rem;
        }

        .arch-params {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .arch-param {
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }

        .arch-param-value {
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // API Base URL
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8000'
            : '';

        // ===========================================
        // Tab 1: Word Embeddings
        // ===========================================
        const EmbeddingsTab = () => {
            const [word1, setWord1] = useState('king');
            const [word2, setWord2] = useState('queen');
            const [similarity, setSimilarity] = useState(null);
            const [similarityLoading, setSimilarityLoading] = useState(false);
            const [similarityError, setSimilarityError] = useState(null);

            const [analogyA, setAnalogyA] = useState('king');
            const [analogyB, setAnalogyB] = useState('man');
            const [analogyC, setAnalogyC] = useState('woman');
            const [analogyResults, setAnalogyResults] = useState(null);
            const [analogyLoading, setAnalogyLoading] = useState(false);
            const [analogyError, setAnalogyError] = useState(null);

            const [availableWords, setAvailableWords] = useState([]);

            // Fetch available words on mount
            useEffect(() => {
                fetch(`${API_BASE}/available_words?limit=100`)
                    .then(res => res.json())
                    .then(data => setAvailableWords(data.sample_words || []))
                    .catch(err => console.log('Could not fetch words:', err));
            }, []);

            const computeSimilarity = async () => {
                setSimilarityLoading(true);
                setSimilarityError(null);
                setSimilarity(null);

                try {
                    const response = await fetch(`${API_BASE}/similarity`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ word1, word2 })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'Failed to compute similarity');
                    }

                    const data = await response.json();
                    setSimilarity(data.similarity);
                } catch (err) {
                    setSimilarityError(err.message);
                } finally {
                    setSimilarityLoading(false);
                }
            };

            const solveAnalogy = async () => {
                setAnalogyLoading(true);
                setAnalogyError(null);
                setAnalogyResults(null);

                try {
                    const response = await fetch(`${API_BASE}/analogy`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_a: analogyA,
                            word_b: analogyB,
                            word_c: analogyC,
                            top_n: 5
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'Failed to solve analogy');
                    }

                    const data = await response.json();
                    setAnalogyResults(data);
                } catch (err) {
                    setAnalogyError(err.message);
                } finally {
                    setAnalogyLoading(false);
                }
            };

            const examplePairs = [
                ['king', 'queen'],
                ['man', 'woman'],
                ['dog', 'cat'],
                ['happy', 'sad'],
                ['france', 'paris'],
                ['good', 'bad']
            ];

            const exampleAnalogies = [
                ['king', 'man', 'woman'],      // queen
                ['france', 'paris', 'tokyo'],  // japan
                ['big', 'small', 'fast'],      // slow
            ];

            return (
                <div>
                    <div className="explanation">
                        <strong>Word Embeddings</strong> are vector representations of words where similar words have similar vectors.
                        Words are mapped to 50-dimensional vectors using GloVe embeddings trained on billions of words.
                        This allows us to compute semantic relationships mathematically!
                    </div>

                    <div className="grid-2">
                        {/* Word Similarity */}
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                                    <line x1="9" y1="9" x2="9.01" y2="9"/>
                                    <line x1="15" y1="9" x2="15.01" y2="9"/>
                                </svg>
                                Word Similarity
                            </div>

                            <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>
                                Cosine similarity measures how similar two word vectors are (-1 to 1, higher = more similar).
                            </p>

                            <div className="input-group">
                                <label className="input-label">Word 1:</label>
                                <input
                                    type="text"
                                    className="text-input"
                                    value={word1}
                                    onChange={(e) => setWord1(e.target.value.toLowerCase())}
                                    placeholder="Enter first word"
                                />
                            </div>

                            <div className="input-group">
                                <label className="input-label">Word 2:</label>
                                <input
                                    type="text"
                                    className="text-input"
                                    value={word2}
                                    onChange={(e) => setWord2(e.target.value.toLowerCase())}
                                    placeholder="Enter second word"
                                />
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label className="input-label">Try these pairs:</label>
                                <div className="btn-group">
                                    {examplePairs.map(([w1, w2], i) => (
                                        <button
                                            key={i}
                                            className="btn-option"
                                            onClick={() => { setWord1(w1); setWord2(w2); }}
                                        >
                                            {w1} / {w2}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button
                                className="btn btn-primary"
                                onClick={computeSimilarity}
                                disabled={similarityLoading || !word1 || !word2}
                                style={{ width: '100%', justifyContent: 'center' }}
                            >
                                {similarityLoading ? (
                                    <><div className="spinner" style={{ width: 16, height: 16, borderTopColor: 'white' }} /> Computing...</>
                                ) : 'Compute Similarity'}
                            </button>

                            {similarityError && (
                                <div className="error-box">{similarityError}</div>
                            )}

                            {similarity !== null && (
                                <div className="result-box" style={{ marginTop: '1rem' }}>
                                    <div className="result-value">{(similarity * 100).toFixed(1)}%</div>
                                    <div className="result-label">
                                        Cosine Similarity between "{word1}" and "{word2}"
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Word Analogies */}
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                    <path d="M2 17l10 5 10-5"/>
                                    <path d="M2 12l10 5 10-5"/>
                                </svg>
                                Word Analogies
                            </div>

                            <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>
                                Solve: <strong>A - B + C = ?</strong><br/>
                                Example: king - man + woman = queen
                            </p>

                            <div className="grid-3" style={{ marginBottom: '1rem' }}>
                                <div className="input-group" style={{ marginBottom: 0 }}>
                                    <label className="input-label">A:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={analogyA}
                                        onChange={(e) => setAnalogyA(e.target.value.toLowerCase())}
                                        placeholder="king"
                                    />
                                </div>
                                <div className="input-group" style={{ marginBottom: 0 }}>
                                    <label className="input-label">B:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={analogyB}
                                        onChange={(e) => setAnalogyB(e.target.value.toLowerCase())}
                                        placeholder="man"
                                    />
                                </div>
                                <div className="input-group" style={{ marginBottom: 0 }}>
                                    <label className="input-label">C:</label>
                                    <input
                                        type="text"
                                        className="text-input"
                                        value={analogyC}
                                        onChange={(e) => setAnalogyC(e.target.value.toLowerCase())}
                                        placeholder="woman"
                                    />
                                </div>
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label className="input-label">Try these analogies:</label>
                                <div className="btn-group">
                                    {exampleAnalogies.map(([a, b, c], i) => (
                                        <button
                                            key={i}
                                            className="btn-option"
                                            onClick={() => { setAnalogyA(a); setAnalogyB(b); setAnalogyC(c); }}
                                        >
                                            {a} - {b} + {c}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button
                                className="btn btn-primary"
                                onClick={solveAnalogy}
                                disabled={analogyLoading || !analogyA || !analogyB || !analogyC}
                                style={{ width: '100%', justifyContent: 'center' }}
                            >
                                {analogyLoading ? (
                                    <><div className="spinner" style={{ width: 16, height: 16, borderTopColor: 'white' }} /> Solving...</>
                                ) : 'Solve Analogy'}
                            </button>

                            {analogyError && (
                                <div className="error-box">{analogyError}</div>
                            )}

                            {analogyResults && (
                                <div style={{ marginTop: '1rem' }}>

                    {/* Available words */}
                    {availableWords.length > 0 && (

                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">

                                    <button
                                        key={i}

                                        onClick={() => setWord1(word)}
                                        style={{ fontSize: '0.8rem', padding: '0.4rem 0.8rem' }}

                                        {word}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===========================================
        // Architecture Visualization Component
        // ===========================================
        const ArchitectureDiagram = ({ config }) => {
            const vocabSize = 10000;
            const maxLen = 200;
            const numClasses = 46;

            // Calculate parameter counts
            const tokenEmbParams = vocabSize * config.embed_dim;
            const posEmbParams = maxLen * config.embed_dim;
            const embeddingParams = tokenEmbParams + posEmbParams;

            // Per transformer block
            const attentionParams = 4 * config.embed_dim * config.embed_dim; // Q, K, V, Output projections
            const ffnParams = 2 * config.embed_dim * config.ff_dim; // Two dense layers
            const layerNormParams = 4 * config.embed_dim; // 2 layer norms per block
            const perBlockParams = attentionParams + ffnParams + layerNormParams;
            const totalTransformerParams = perBlockParams * config.num_blocks;

            // Output layers
            const poolingParams = 0; // Global average pooling has no params
            const denseParams = config.embed_dim * 64 + 64; // Hidden dense layer
            const outputParams = 64 * numClasses + numClasses; // Output layer

            const totalParams = embeddingParams + totalTransformerParams + denseParams + outputParams;

            return (
                <div className="arch-container">
                    <div className="arch-block">
                        {/* Input */}
                        <div className="arch-layer input">
                            <div>Input Sequence</div>
                            <div className="arch-layer-detail">Shape: (batch, {maxLen})</div>
                        </div>
                        <div className="arch-arrow" />

                        {/* Embeddings */}
                        <div className="arch-layer embedding">
                            <div>Token + Position Embedding</div>
                            <div className="arch-layer-detail">
                                {vocabSize.toLocaleString()} vocab × {config.embed_dim}d + {maxLen} pos × {config.embed_dim}d
                            </div>
                            <div className="arch-layer-detail">
                                → {(embeddingParams / 1000).toFixed(0)}K params
                            </div>
                        </div>
                        <div className="arch-arrow" />

                        {/* Transformer Blocks */}
                        <div className="arch-bracket">
                            <div className="arch-bracket-label">× {config.num_blocks} Transformer Block{config.num_blocks > 1 ? 's' : ''}</div>

                            <div className="arch-layer attention">
                                <div>Multi-Head Attention</div>
                                <div className="arch-layer-detail">
                                    {config.num_heads} heads × {config.embed_dim / config.num_heads}d per head
                                </div>
                            </div>
                            <div className="arch-arrow" style={{ marginLeft: '1.5rem' }} />

                            <div className="arch-layer ffn">
                                <div>Feed-Forward Network</div>
                                <div className="arch-layer-detail">
                                    {config.embed_dim}d → {config.ff_dim}d → {config.embed_dim}d
                                </div>
                            </div>

                            <div style={{ fontSize: '0.75rem', color: '#666', textAlign: 'center', marginTop: '0.5rem' }}>
                                + LayerNorm + Residual Connections + Dropout ({(config.dropout * 100).toFixed(0)}%)
                            </div>
                        </div>
                        <div className="arch-arrow" />

                        {/* Pooling */}
                        <div className="arch-layer transformer">
                            <div>Global Average Pooling</div>
                            <div className="arch-layer-detail">
                                ({maxLen}, {config.embed_dim}) → ({config.embed_dim})
                            </div>
                        </div>
                        <div className="arch-arrow" />

                        {/* Dense */}
                        <div className="arch-layer transformer">
                            <div>Dense Layer + Dropout</div>
                            <div className="arch-layer-detail">
                                {config.embed_dim}d → 64d (ReLU)
                            </div>
                        </div>
                        <div className="arch-arrow" />

                        {/* Output */}
                        <div className="arch-layer output">
                            <div>Output (Softmax)</div>
                            <div className="arch-layer-detail">
                                64d → {numClasses} classes
                            </div>
                        </div>
                    </div>

                    {/* Parameter Summary */}
                    <div className="arch-params">
                        <div className="arch-param">
                            Embeddings: <span className="arch-param-value">{(embeddingParams / 1000).toFixed(0)}K</span>
                        </div>
                        <div className="arch-param">
                            Transformer: <span className="arch-param-value">{(totalTransformerParams / 1000).toFixed(0)}K</span>
                        </div>
                        <div className="arch-param">
                            Output: <span className="arch-param-value">{((denseParams + outputParams) / 1000).toFixed(1)}K</span>
                        </div>
                        <div className="arch-param" style={{ background: 'var(--primary)', color: 'white' }}>
                            Total: <span style={{ fontWeight: 600 }}>{(totalParams / 1000).toFixed(0)}K params</span>
                        </div>
                    </div>
                </div>
            );
        };

        // ===========================================
        // Tab 2: Train Transformers
        // ===========================================
        const TrainTransformerTab = () => {
            const [mode, setMode] = useState('single'); // 'single' or 'compare'
            const [config, setConfig] = useState({
                numSamples: 2000,
                epochs: 8,
                embed_dim: 64,
                num_heads: 4,
                ff_dim: 128,
                num_blocks: 2,
                dropout: 0.1
            });
            const [sessionId, setSessionId] = useState(null);
            const [status, setStatus] = useState('idle');
            const [progress, setProgress] = useState(null);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [serverStatus, setServerStatus] = useState(null);
            const [activeHead, setActiveHead] = useState(0);
            const [activeBlock, setActiveBlock] = useState(0);

            // Comparison state
            const [compareStatus, setCompareStatus] = useState('idle');
            const [compareResults, setCompareResults] = useState(null);
            const [compareError, setCompareError] = useState(null);

            // Check server health on mount
            useEffect(() => {
                fetch(`${API_BASE}/api/health`)
                    .then(res => res.json())
                    .then(data => setServerStatus(data))
                    .catch(err => {
                        // Try the FastAPI endpoint too
                        fetch(`${API_BASE}/`)
                            .then(res => res.json())
                            .then(data => setServerStatus(data))
                            .catch(() => setServerStatus({ error: 'Server not reachable' }));
                    });
            }, []);

            // Poll for training progress
            useEffect(() => {
                if (!sessionId || status === 'complete' || status === 'error') return;

                const interval = setInterval(() => {
                    fetch(`${API_BASE}/api/train/${sessionId}`)
                        .then(res => res.json())
                        .then(data => {
                            setProgress(data);
                            if (data.status === 'complete') {
                                setStatus('complete');
                                setResults(data);
                            } else if (data.status === 'error') {
                                setStatus('error');
                                setError(data.error);
                            }
                        })
                        .catch(err => {
                            setError(err.message);
                            setStatus('error');
                        });
                }, 1000);

                return () => clearInterval(interval);
            }, [sessionId, status]);

            const startTraining = async () => {
                setStatus('starting');
                setError(null);
                setResults(null);
                setProgress(null);

                try {
                    const response = await fetch(`${API_BASE}/api/train`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });

                    const data = await response.json();
                    setSessionId(data.session_id);
                    setStatus('training');
                } catch (err) {
                    setError(err.message);
                    setStatus('error');
                }
            };

            const startComparison = async () => {
                setCompareStatus('training');
                setCompareError(null);
                setCompareResults(null);

                try {
                    const response = await fetch(`${API_BASE}/compare_transformers?` + new URLSearchParams({
                        embed_dim: config.embed_dim,
                        num_heads: config.num_heads,
                        ff_dim: config.ff_dim,
                        dropout_rate: config.dropout,
                        epochs: config.epochs,
                        max_len: 200,
                        batch_size: 32
                    }));

                    if (!response.ok) {
                        throw new Error('Comparison failed');
                    }

                    const data = await response.json();
                    setCompareResults(data);
                    setCompareStatus('complete');
                } catch (err) {
                    setCompareError(err.message);
                    setCompareStatus('error');
                }
            };

            const getColor = (weight) => {
                const intensity = Math.pow(weight, 0.5);
                return `rgba(39, 116, 174, ${0.1 + intensity * 0.9})`;
            };

            return (
                <div>
                    {/* Server Status Banner */}
                    {serverStatus && (
                        <div className="card" style={{
                            background: serverStatus.error ? 'rgba(220, 53, 69, 0.1)' : 'rgba(40, 167, 69, 0.1)',
                            borderColor: serverStatus.error ? '#dc3545' : '#28a745'
                        }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                <div style={{
                                    width: 12,
                                    height: 12,
                                    borderRadius: '50%',
                                    background: serverStatus.error ? '#dc3545' : '#28a745'
                                }} />
                                <div>
                                    {serverStatus.error ? (
                                        <span>Backend server not available. Please deploy to Railway first.</span>
                                    ) : (
                                        <span>
                                            Server ready • TensorFlow {serverStatus.tf_loaded || serverStatus.tensorflow_version ? 'loaded' : 'loading'} •
                                            {serverStatus.active_trainings !== undefined ? ` ${serverStatus.active_trainings}/${serverStatus.max_concurrent} active trainings` : ` ${serverStatus.num_embeddings || 0} embeddings loaded`}
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="explanation">
                        <strong>Train a Real Transformer!</strong> This uses Keras to train a transformer classifier on the
                        <strong> Reuters news dataset</strong> (46 categories of news articles like earnings, acquisitions, commodities, etc.).
                        Adjust the architecture parameters to see how they affect training, or compare 1-block vs 3-block architectures.
                    </div>

                    {/* Mode Toggle */}
                    <div className="card">
                        <div className="card-title">Training Mode</div>
                        <div className="btn-group">
                            <button
                                className={`btn-option ${mode === 'single' ? 'active' : ''}`}
                                onClick={() => setMode('single')}
                            >
                                Single Model Training
                            </button>
                            <button
                                className={`btn-option ${mode === 'compare' ? 'active' : ''}`}
                                onClick={() => setMode('compare')}
                            >
                                Compare 1-Block vs 3-Block
                            </button>
                        </div>
                    </div>

                    {/* Architecture Diagram */}
                    <div className="card">
                        <div className="card-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="3" y1="15" x2="21" y2="15"/>
                                <line x1="9" y1="3" x2="9" y2="21"/>
                            </svg>
                            Transformer Architecture

                        <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>

                            to classify Reuters news articles into {mode === 'compare' ? '46' : '46'} categories.
                        </p>
                        <ArchitectureDiagram config={config} />
                    </div>

                    {mode === 'single' ? (
                        <div className="grid-2">
                            {/* Configuration */}

                                <div className="card-title">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <circle cx="12" cy="12" r="3"/>
                                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                                    </svg>
                                    Training Configuration
                                </div>

                                <div className="input-group">
                                    <label className="input-label">Training Samples:</label>
                                    <div className="btn-group">
                                        {[1000, 2000, 4000, 8000].map(n => (
                                            <button key={n} className={`btn-option ${config.numSamples === n ? 'active' : ''}`}
                                                onClick={() => setConfig({...config, numSamples: n})}
                                                disabled={status === 'training'}
                                            >{n}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="input-group">
                                    <label className="input-label">Epochs:</label>
                                    <div className="btn-group">
                                        {[4, 6, 8, 10].map(n => (
                                            <button key={n} className={`btn-option ${config.epochs === n ? 'active' : ''}`}
                                                onClick={() => setConfig({...config, epochs: n})}
                                                disabled={status === 'training'}
                                            >{n}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="input-group">
                                    <label className="input-label">Embedding Dimension:</label>
                                    <div className="btn-group">
                                        {[32, 64, 128].map(n => (
                                            <button key={n} className={`btn-option ${config.embed_dim === n ? 'active' : ''}`}
                                                onClick={() => setConfig({...config, embed_dim: n})}
                                                disabled={status === 'training'}
                                            >{n}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="input-group">
                                    <label className="input-label">Attention Heads:</label>
                                    <div className="btn-group">

                                            <button key={n} className={`btn-option ${config.num_heads === n ? 'active' : ''}`}

                                <button

                                >
                                    {status === 'training' || status === 'starting' ? (
                                        <>
                                            <div className="spinner" style={{
                                                width: 16,
                                                height: 16,
                                                border: '2px solid rgba(255,255,255,0.3)',
                                                borderTopColor: 'white'

                                            Training...

                                </button>

                                {error && (
                                    <div className="error-box">{error}</div>
                                )}
                            </div>

                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                    </svg>
                                    Training Progress
                                </div>

                                {status === 'idle' && (
                                    <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--textMuted)' }}>
                                        Configure parameters and click "Start Training" to begin
                                    </div>
                                )}

                                {(status === 'training' || status === 'starting') && progress && (
                                    <>
                                        <div style={{ marginBottom: '1rem' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                                                <span>{progress.status}</span>

                                            </div>
                                            <div style={{ height: 8, background: '#e0e0e0', borderRadius: 4, overflow: 'hidden' }}>
                                                <div style={{
                                                    height: '100%',

                                )}

                                {status === 'complete' && results && (
                                    <div>
                                        <div className="stats-grid" style={{ gridTemplateColumns: '1fr 1fr', marginBottom: '1rem' }}>
                                            <div className="stat-card">
                                                <div className="stat-value">{results.test_accuracy?.toFixed(1)}%</div>
                                                <div className="stat-label">Test Accuracy</div>
                                            </div>
                                            <div className="stat-card">
                                                <div className="stat-value">{results.num_params ? (results.num_params / 1000).toFixed(0) + 'K' : '-'}</div>
                                                <div className="stat-label">Parameters</div>
                                            </div>
                                        </div>

                                        {results.history && (
                                            <div style={{ marginBottom: '1.5rem' }}>
                                                <h4 style={{ fontSize: '0.9rem', marginBottom: '0.75rem' }}>Training History</h4>
                                                <svg width="100%" height="200" viewBox="0 0 400 200">
                                                    <line x1="50" y1="170" x2="380" y2="170" stroke="#ccc" strokeWidth="1"/>

                                                    {[0, 25, 50, 75, 100].map((v, i) => (
                                                        <g key={i}>
                                                            <line x1="50" y1={170 - v * 1.5} x2="380" y2={170 - v * 1.5} stroke="#eee" strokeWidth="1"/>

                                                    <polyline

                                                        <div key={i} style={{
                                                            padding: '0.5rem 1rem',
                                                            background: pred.correct ? 'rgba(40, 167, 69, 0.1)' : 'rgba(220, 53, 69, 0.1)',
                                                            borderRadius: 8,
                                                            border: `1px solid ${pred.correct ? '#28a745' : '#dc3545'}`,
                                                            fontSize: '0.8rem'
                                                        }}>
                                                            <div>True: {pred.true} → Pred: {pred.predicted}</div>
                                                            <div style={{ color: 'var(--textMuted)' }}>{(pred.confidence * 100).toFixed(0)}% conf</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        /* Comparison Mode */
                        <div>
                            <div className="card">
                                <div className="card-title">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M18 20V10M12 20V4M6 20v-6"/>
                                    </svg>
                                    Compare Architectures
                                </div>

                                <p style={{ marginBottom: '1rem', color: 'var(--textMuted)', fontSize: '0.9rem' }}>
                                    Train two transformers with identical settings except for the number of blocks (1 vs 3) to see how depth affects performance.
                                </p>

                                <div className="grid-3" style={{ marginBottom: '1rem' }}>
                                    <div className="input-group" style={{ marginBottom: 0 }}>
                                        <label className="input-label">Epochs:</label>
                                        <div className="btn-group">
                                            {[3, 5, 8].map(n => (
                                                <button key={n} className={`btn-option ${config.epochs === n ? 'active' : ''}`}
                                                    onClick={() => setConfig({...config, epochs: n})}
                                                    disabled={compareStatus === 'training'}
                                                >{n}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="input-group" style={{ marginBottom: 0 }}>
                                        <label className="input-label">Embedding Dim:</label>
                                        <div className="btn-group">
                                            {[32, 64, 128].map(n => (
                                                <button key={n} className={`btn-option ${config.embed_dim === n ? 'active' : ''}`}
                                                    onClick={() => setConfig({...config, embed_dim: n})}
                                                    disabled={compareStatus === 'training'}
                                                >{n}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="input-group" style={{ marginBottom: 0 }}>
                                        <label className="input-label">Attention Heads:</label>
                                        <div className="btn-group">
                                            {[2, 4, 8].map(n => (
                                                <button key={n} className={`btn-option ${config.num_heads === n ? 'active' : ''}`}
                                                    onClick={() => setConfig({...config, num_heads: n})}
                                                    disabled={compareStatus === 'training'}
                                                >{n}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <button
                                    className="btn btn-primary"
                                    onClick={startComparison}
                                    disabled={compareStatus === 'training' || serverStatus?.error}
                                    style={{ width: '100%', justifyContent: 'center' }}
                                >
                                    {compareStatus === 'training' ? (
                                        <>
                                            <div className="spinner" style={{
                                                width: 16,
                                                height: 16,
                                                border: '2px solid rgba(255,255,255,0.3)',
                                                borderTopColor: 'white'
                                            }} />
                                            Training both models (this may take a minute)...
                                        </>
                                    ) : 'Run Comparison'}
                                </button>

                                {compareError && (
                                    <div className="error-box">{compareError}</div>
                                )}
                            </div>

                            {compareResults && (
                                <>
                                    <div className="comparison-grid">
                                        {/* 1-Block Results */}
                                        <div className={`comparison-card ${compareResults.comparison.winner === 'one_block' ? 'winner' : ''}`}>
                                            <div className="comparison-title">
                                                1 Transformer Block
                                                {compareResults.comparison.winner === 'one_block' && <span className="badge">WINNER</span>}
                                            </div>
                                            <div className="stats-grid" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                <div className="stat-card">
                                                    <div className="stat-value">{(compareResults.one_block.test_accuracy * 100).toFixed(1)}%</div>
                                                    <div className="stat-label">Test Accuracy</div>
                                                </div>
                                                <div className="stat-card">
                                                    <div className="stat-value">{(compareResults.one_block.num_params / 1000).toFixed(0)}K</div>
                                                    <div className="stat-label">Parameters</div>
                                                </div>
                                            </div>
                                            <div style={{ fontSize: '0.85rem', color: 'var(--textMuted)', marginTop: '0.5rem' }}>
                                                Training time: {compareResults.one_block.training_time.toFixed(1)}s
                                            </div>
                                        </div>

                                        {/* 3-Block Results */}
                                        <div className={`comparison-card ${compareResults.comparison.winner === 'three_blocks' ? 'winner' : ''}`}>
                                            <div className="comparison-title">
                                                3 Transformer Blocks
                                                {compareResults.comparison.winner === 'three_blocks' && <span className="badge">WINNER</span>}
                                            </div>
                                            <div className="stats-grid" style={{ gridTemplateColumns: '1fr 1fr' }}>
                                                <div className="stat-card">
                                                    <div className="stat-value">{(compareResults.three_blocks.test_accuracy * 100).toFixed(1)}%</div>
                                                    <div className="stat-label">Test Accuracy</div>
                                                </div>
                                                <div className="stat-card">
                                                    <div className="stat-value">{(compareResults.three_blocks.num_params / 1000).toFixed(0)}K</div>
                                                    <div className="stat-label">Parameters</div>
                                                </div>
                                            </div>
                                            <div style={{ fontSize: '0.85rem', color: 'var(--textMuted)', marginTop: '0.5rem' }}>
                                                Training time: {compareResults.three_blocks.training_time.toFixed(1)}s
                                            </div>
                                        </div>
                                    </div>

                                    {/* Summary */}
                                    <div className="card">
                                        <div className="card-title">Comparison Summary</div>
                                        <div className="stats-grid" style={{ gridTemplateColumns: '1fr 1fr 1fr' }}>
                                            <div className="stat-card">
                                                <div className="stat-value" style={{
                                                    color: compareResults.comparison.accuracy_improvement > 0 ? '#28a745' : '#dc3545'
                                                }}>
                                                    {compareResults.comparison.accuracy_improvement > 0 ? '+' : ''}
                                                    {(compareResults.comparison.accuracy_improvement * 100).toFixed(1)}%
                                                </div>
                                                <div className="stat-label">Accuracy Difference (3-block - 1-block)</div>
                                            </div>
                                            <div className="stat-card">
                                                <div className="stat-value">+{(compareResults.comparison.parameter_increase / 1000).toFixed(0)}K</div>
                                                <div className="stat-label">Extra Parameters</div>
                                            </div>
                                            <div className="stat-card">
                                                <div className="stat-value">+{compareResults.comparison.time_increase.toFixed(1)}s</div>
                                                <div className="stat-label">Extra Training Time</div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    )}

                    {/* Attention Weights Visualization (Single mode only) */}
                    {mode === 'single' && status === 'complete' && results && results.attention_weights && (
                        <div className="card">
                            <div className="card-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                Learned Attention Weights
                            </div>

                            <div className="explanation">
                                These are the actual attention patterns learned by your trained transformer. Each head learns different patterns - some focus on nearby tokens, others on specific relationships.
                            </div>

                            <div style={{ display: 'flex', gap: '1rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                                <div>
                                    <label className="input-label">Block:</label>
                                    <div className="btn-group">
                                        {Object.keys(results.attention_weights).map((block, i) => (
                                            <button key={i}
                                                className={`btn-option ${activeBlock === i ? 'active' : ''}`}
                                                onClick={() => setActiveBlock(i)}
                                            >
                                                Block {i + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="input-label">Head:</label>
                                    <div className="btn-group">
                                        {results.attention_weights[`block_${activeBlock}`] &&
                                            Object.keys(results.attention_weights[`block_${activeBlock}`]).map((head, i) => (
                                                <button key={i}
                                                    className={`btn-option ${activeHead === i ? 'active' : ''}`}
                                                    onClick={() => setActiveHead(i)}
                                                >
                                                    Head {i + 1}
                                                </button>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>

                            <div className="heatmap-container">
                                {results.attention_tokens && (
                                    <div className="heatmap-header">
                                        {results.attention_tokens.slice(0, 8).map((tok, i) => (
                                            <div key={i} className="heatmap-header-cell">{tok}</div>
                                        ))}
                                    </div>
                                )}
                                <div className="heatmap-grid">
                                    {results.attention_weights[`block_${activeBlock}`] &&
                                     results.attention_weights[`block_${activeBlock}`][activeHead] &&
                                        results.attention_weights[`block_${activeBlock}`][activeHead].slice(0, 8).map((row, i) => (
                                            <div key={i} className="heatmap-row">
                                                <div className="heatmap-label">
                                                    {results.attention_tokens ? results.attention_tokens[i] : `pos ${i}`}
                                                </div>
                                                {row.slice(0, 8).map((weight, j) => (
                                                    <div
                                                        key={j}
                                                        className="heatmap-cell"
                                                        style={{
                                                            background: getColor(weight),
                                                            color: weight > 0.4 ? 'white' : '#333'
                                                        }}
                                                        title={`${(weight * 100).toFixed(1)}%`}
                                                    >
                                                        {(weight * 100).toFixed(0)}
                                                    </div>
                                                ))}
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ===========================================
        // Main App
        // ===========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('embeddings');

            const tabs = [
                { id: 'embeddings', label: 'Word Embeddings' },
                { id: 'training', label: 'Train Transformers' },
            ];

            const renderTab = () => {
                switch (activeTab) {
                    case 'embeddings': return <EmbeddingsTab />;
                    case 'training': return <TrainTransformerTab />;
                    default: return <EmbeddingsTab />;
                }
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="header-left">
                                <p className="course-label">MGMT298D: Science and Strategy of AI</p>
                                <h1>Week 7: Word Embeddings & Transformers</h1>
                                <p className="subtitle">Explore word embeddings and train real transformer models</p>
                            </div>
                            <div className="header-right">
                                UCLA Anderson
                            </div>
                        </div>
                        <div className="header-gold-line" />
                    </header>

                    <div className="tabs-container">
                        <div className="tabs">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    className={`tab ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="main-content">
                        {renderTab()}
                    </main>

                    <footer className="footer">
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
