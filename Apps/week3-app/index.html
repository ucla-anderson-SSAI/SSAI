<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3: Clustering & Collaborative Filtering | UCLA Anderson</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2774AE;
            --darkBlue: #005587;
            --lightBlue: #8BB8E8;
            --gold: #FFD100;
            --success: #27ae60;
            --lightBg: #f5f5f5;
            --lightCard: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .header {
            background: var(--primary);
            padding: 1rem 2rem 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-gold-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold);
        }

        .main-tabs {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.1);
            padding: 4px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 500px;
        }

        .main-tab {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: #666;
        }

        .main-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(39, 116, 174, 0.3);
        }

        .main-tab:hover:not(.active) {
            background: rgba(39, 116, 174, 0.1);
            color: var(--primary);
        }

        .data-source-bar {
            margin-bottom: 20px;
            background: rgba(39, 116, 174, 0.1);
            border: 1px solid rgba(39, 116, 174, 0.3);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .data-source-bar.netflix {
            background: rgba(39, 174, 96, 0.1);
            border-color: rgba(39, 174, 96, 0.3);
        }

        .data-toggle-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
            color: #666;
            font-weight: 400;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .data-toggle-btn.active {
            border-width: 2px;
            font-weight: 600;
        }

        .data-toggle-btn.synthetic.active {
            border-color: var(--primary);
            background: rgba(39, 116, 174, 0.15);
            color: var(--primary);
        }

        .data-toggle-btn.netflix.active {
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.15);
            color: var(--success);
        }

        .data-toggle-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls-section {
            background: var(--lightBg);
            padding: 20px 40px;
        }

        .control-panel {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .control-panel h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .control-group select,
        .control-group input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .control-group select:focus,
        .control-group input:focus {
            border-color: var(--primary);
            outline: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            width: 100%;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--primary), var(--lightBlue));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(39, 116, 174, 0.5);
        }

        .slider-value {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
            text-align: right;
        }

        .results-section {
            background: var(--lightBg);
            padding: 30px 40px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .metric-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .metric-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .metric-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .metric-card .label {
            font-size: 0.85rem;
            color: #666;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 1200px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .chart-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .chart-card.hero {
            grid-column: 1 / -1;
        }

        .chart-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 15px;
        }

        .scatter-container {
            position: relative;
            width: 100%;
            height: 450px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        .scatter-svg {
            width: 100%;
            height: 100%;
        }

        .cluster-point {
            transition: all 0.5s ease;
        }

        .centroid {
            filter: drop-shadow(0 0 10px currentColor);
        }

        .cluster-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .anim-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .anim-btn.play {
            background: linear-gradient(135deg, var(--primary), var(--lightBlue));
            color: white;
            box-shadow: 0 4px 15px rgba(39, 116, 174, 0.4);
        }

        .anim-btn.play:hover {
            transform: translateY(-2px);
        }

        .anim-btn.reset {
            background: #ffffff;
            color: #666;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .anim-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .speed-selector {
            display: flex;
            gap: 5px;
        }

        .speed-btn {
            padding: 8px 16px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            color: #666;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .speed-btn.active {
            background: rgba(39, 116, 174, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .algorithm-status {
            background: rgba(39, 116, 174, 0.05);
            border: 1px solid rgba(39, 116, 174, 0.2);
            border-radius: 10px;
            padding: 15px 20px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-label {
            font-size: 0.85rem;
            color: #666;
        }

        .status-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
        }

        /* Heatmap styles */
        .heatmap-container {
            overflow-x: auto;
        }

        .heatmap-table {
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        .heatmap-table th,
        .heatmap-table td {
            padding: 8px;
            text-align: center;
            border: 1px solid #eee;
            min-width: 60px;
        }

        .heatmap-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }

        .heatmap-cell {
            font-weight: 500;
        }

        /* Recommendation list */
        .recommendation-list {
            list-style: none;
        }

        .recommendation-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s ease;
        }

        .recommendation-item:hover {
            background: rgba(39, 116, 174, 0.05);
        }

        .recommendation-item:last-child {
            border-bottom: none;
        }

        .rec-rank {
            width: 30px;
            height: 30px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .rec-info {
            flex: 1;
            margin-left: 12px;
        }

        .rec-title {
            font-weight: 600;
            color: #333;
        }

        .rec-subtitle {
            font-size: 0.8rem;
            color: #888;
        }

        .rec-rating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rec-stars {
            color: var(--gold);
        }

        .rec-score {
            font-weight: 600;
            color: var(--primary);
        }

        /* Neighbors list */
        .neighbors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .neighbor-card {
            background: rgba(39, 116, 174, 0.05);
            border: 1px solid rgba(39, 116, 174, 0.2);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .neighbor-id {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .neighbor-sim {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #666;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(39, 116, 174, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            color: #888;
            font-size: 0.75rem;
            margin-top: 20px;
            text-align: center;
            padding-bottom: 20px;
        }

        /* CF Evaluation Styles */
        .cf-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .cf-section-desc {
            font-size: 0.82rem;
            color: #888;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .mae-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .mae-table th {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 2px solid #eee;
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .mae-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .mae-bar-track {
            display: inline-block;
            width: 80px;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 8px;
            overflow: hidden;
        }

        .mae-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .predict-result-box {
            background: linear-gradient(135deg, rgba(39, 116, 174, 0.05), rgba(39, 174, 96, 0.05));
            border: 1px solid rgba(39, 116, 174, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .big-predicted-rating {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .confidence-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .confidence-high { background: rgba(39, 174, 96, 0.15); color: #27ae60; }
        .confidence-medium { background: rgba(243, 156, 18, 0.15); color: #f39c12; }
        .confidence-low { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }

        .user-taste-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 0.82rem;
        }

        .user-taste-row .movie-name {
            width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #333;
        }

        .user-taste-row .taste-bar {
            flex: 1;
            max-width: 80px;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .user-taste-row .taste-fill {
            height: 100%;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // API Configuration
        const API_BASE = window.location.origin;

        // Cluster colors - UCLA themed
        const CLUSTER_COLORS = [
            '#2774AE', '#005587', '#8BB8E8', '#27ae60', '#e74c3c',
            '#9b59b6', '#f39c12', '#1abc9c', '#34495e', '#e91e63'
        ];

        // ==================== CHART COMPONENTS ====================

        function LineChartComponent({ data, dataKey, xKey, title }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d[xKey]),
                        datasets: [{
                            label: title,
                            data: data.map(d => d[dataKey]),
                            borderColor: '#2774AE',
                            backgroundColor: 'rgba(39, 116, 174, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointBackgroundColor: '#2774AE',
                            pointRadius: 5,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(0, 0, 0, 0.05)' }, ticks: { color: '#666' } },
                            y: { grid: { color: 'rgba(0, 0, 0, 0.05)' }, ticks: { color: '#666' } }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, dataKey, xKey, title]);

            return <div style={{height: '250px'}}><canvas ref={canvasRef} /></div>;
        }

        function BarChartComponent({ data, dataKey, xKey, title, highlightValue }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d[xKey]),
                        datasets: [{
                            label: title,
                            data: data.map(d => d[dataKey]),
                            backgroundColor: data.map(d => d[xKey] === highlightValue ? '#2774AE' : '#8BB8E8'),
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#666' } },
                            y: { grid: { color: 'rgba(0, 0, 0, 0.05)' }, ticks: { color: '#666' }, min: -0.2, max: 1 }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, dataKey, xKey, title, highlightValue]);

            return <div style={{height: '250px'}}><canvas ref={canvasRef} /></div>;
        }

        function PieChartComponent({ data }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.map(d => d.name),
                        datasets: [{
                            data: data.map(d => d.value),
                            backgroundColor: data.map(d => d.color),
                            borderColor: '#ffffff',
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '60%',
                        plugins: {
                            legend: { display: true, position: 'right', labels: { color: '#666', padding: 15, usePointStyle: true } }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <div style={{height: '250px'}}><canvas ref={canvasRef} /></div>;
        }

        function MultiLineChartComponent({ data, datasets, xKey, title }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const colors = ['#2774AE', '#e74c3c', '#27ae60', '#f39c12'];
                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d[xKey]),
                        datasets: datasets.map((ds, i) => ({
                            label: ds.label,
                            data: data.map(d => d[ds.key]),
                            borderColor: colors[i % colors.length],
                            backgroundColor: 'transparent',
                            tension: 0.3,
                            pointRadius: 2,
                            pointHoverRadius: 6,
                            borderWidth: 2.5,
                        }))
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top', labels: { color: '#666', usePointStyle: true, padding: 15 } },
                        },
                        scales: {
                            x: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#666' }, title: { display: true, text: 'k (neighbors)', color: '#666' } },
                            y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#666' }, title: { display: true, text: 'Mean Absolute Error', color: '#666' } }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, datasets, xKey]);

            return <div style={{height: '300px'}}><canvas ref={canvasRef} /></div>;
        }

        // ==================== MOCK DATA GENERATORS ====================

        const generateSyntheticClusterData = (numPoints = 150) => {
            const data = [];
            const clusterCenters = [
                { x: 0.2, y: 0.8, genre: 'Action Lovers' },
                { x: 0.8, y: 0.7, genre: 'Comedy Fans' },
                { x: 0.5, y: 0.2, genre: 'Drama Enthusiasts' },
                { x: 0.3, y: 0.4, genre: 'Horror Buffs' },
            ];

            for (let i = 0; i < numPoints; i++) {
                const clusterIdx = Math.floor(Math.random() * clusterCenters.length);
                const center = clusterCenters[clusterIdx];

                data.push({
                    id: i,
                    x: center.x + (Math.random() - 0.5) * 0.3,
                    y: center.y + (Math.random() - 0.5) * 0.3,
                    cluster: -1,
                    userId: `User_${1000 + i}`,
                    trueCluster: clusterIdx
                });
            }
            return data;
        };

        const generateSyntheticCFData = () => {
            const users = [];
            const items = ['The Matrix', 'Titanic', 'The Godfather', 'Pulp Fiction', 'Forrest Gump',
                          'Inception', 'The Dark Knight', 'Fight Club', 'Goodfellas', 'The Shawshank Redemption'];

            for (let i = 0; i < 50; i++) {
                const ratings = {};
                items.forEach(item => {
                    if (Math.random() > 0.3) { // 70% chance of rating
                        ratings[item] = Math.floor(Math.random() * 5) + 1;
                    }
                });
                users.push({
                    id: i,
                    userId: `User_${1000 + i}`,
                    ratings
                });
            }
            return { users, items };
        };

        // ==================== K-MEANS ALGORITHMS ====================

        const euclideanDistance = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));

        const initializeCentroids = (data, k) => {
            const shuffled = [...data].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, k).map((d, i) => ({
                id: i, x: d.x, y: d.y, prevX: d.x, prevY: d.y
            }));
        };

        const assignClusters = (data, centroids) => {
            return data.map(point => {
                let minDist = Infinity;
                let cluster = 0;
                centroids.forEach((centroid, idx) => {
                    const dist = euclideanDistance(point, centroid);
                    if (dist < minDist) {
                        minDist = dist;
                        cluster = idx;
                    }
                });
                return { ...point, cluster, distance: minDist };
            });
        };

        const updateCentroids = (data, centroids, k) => {
            const newCentroids = [];
            for (let i = 0; i < k; i++) {
                const clusterPoints = data.filter(d => d.cluster === i);
                if (clusterPoints.length > 0) {
                    const avgX = clusterPoints.reduce((sum, p) => sum + p.x, 0) / clusterPoints.length;
                    const avgY = clusterPoints.reduce((sum, p) => sum + p.y, 0) / clusterPoints.length;
                    newCentroids.push({ id: i, x: avgX, y: avgY, prevX: centroids[i].x, prevY: centroids[i].y });
                } else {
                    newCentroids.push(centroids[i]);
                }
            }
            return newCentroids;
        };

        const calculateInertia = (data) => data.reduce((sum, point) => sum + (point.distance || 0) ** 2, 0);

        const calculateSilhouette = (data, k) => {
            if (k <= 1 || data.length === 0) return 0;
            let totalSilhouette = 0;
            let validPoints = 0;

            data.forEach(point => {
                const sameCluster = data.filter(d => d.cluster === point.cluster && d.id !== point.id);
                const otherClusters = [...new Set(data.map(d => d.cluster))].filter(c => c !== point.cluster);
                if (sameCluster.length === 0) return;

                const a = sameCluster.reduce((sum, p) => sum + euclideanDistance(point, p), 0) / sameCluster.length;
                let b = Infinity;
                otherClusters.forEach(cluster => {
                    const clusterPoints = data.filter(d => d.cluster === cluster);
                    if (clusterPoints.length > 0) {
                        const avgDist = clusterPoints.reduce((sum, p) => sum + euclideanDistance(point, p), 0) / clusterPoints.length;
                        b = Math.min(b, avgDist);
                    }
                });

                if (b !== Infinity) {
                    totalSilhouette += (b - a) / Math.max(a, b);
                    validPoints++;
                }
            });

            return validPoints > 0 ? totalSilhouette / validPoints : 0;
        };

        // ==================== COLLABORATIVE FILTERING ALGORITHMS ====================

        const cosineSimilarity = (ratings1, ratings2, items) => {
            let dotProduct = 0;
            let norm1 = 0;
            let norm2 = 0;
            let commonItems = 0;

            items.forEach(item => {
                const r1 = ratings1[item];
                const r2 = ratings2[item];
                if (r1 !== undefined && r2 !== undefined) {
                    dotProduct += r1 * r2;
                    norm1 += r1 * r1;
                    norm2 += r2 * r2;
                    commonItems++;
                }
            });

            if (commonItems < 2 || norm1 === 0 || norm2 === 0) return 0;
            return dotProduct / (Math.sqrt(norm1) * Math.sqrt(norm2));
        };

        const findKNearestNeighbors = (targetUser, users, items, k) => {
            const similarities = users
                .filter(u => u.id !== targetUser.id)
                .map(u => ({
                    user: u,
                    similarity: cosineSimilarity(targetUser.ratings, u.ratings, items)
                }))
                .filter(s => s.similarity > 0)
                .sort((a, b) => b.similarity - a.similarity)
                .slice(0, k);

            return similarities;
        };

        const predictRating = (targetUser, neighbors, item) => {
            const validNeighbors = neighbors.filter(n => n.user.ratings[item] !== undefined);
            if (validNeighbors.length === 0) return null;

            const weightedSum = validNeighbors.reduce((sum, n) => sum + n.similarity * n.user.ratings[item], 0);
            const simSum = validNeighbors.reduce((sum, n) => sum + n.similarity, 0);

            return simSum > 0 ? weightedSum / simSum : null;
        };

        const getRecommendations = (targetUser, users, items, k) => {
            const neighbors = findKNearestNeighbors(targetUser, users, items, k);
            const unratedItems = items.filter(item => targetUser.ratings[item] === undefined);

            const predictions = unratedItems.map(item => {
                const predicted = predictRating(targetUser, neighbors, item);
                return { item, predicted };
            }).filter(p => p.predicted !== null)
              .sort((a, b) => b.predicted - a.predicted);

            return { recommendations: predictions.slice(0, 5), neighbors };
        };

        // ==================== SCATTER PLOT COMPONENT ====================

        const AnimatedScatterPlot = ({ data, centroids, animationPhase, highlightedCluster }) => {
            const margin = { top: 20, right: 20, bottom: 40, left: 40 };
            const width = 800;
            const height = 450;
            const plotWidth = width - margin.left - margin.right;
            const plotHeight = height - margin.top - margin.bottom;

            const xScale = (x) => margin.left + x * plotWidth;
            const yScale = (y) => margin.top + (1 - y) * plotHeight;

            return (
                <div className="scatter-container">
                    <svg className="scatter-svg" viewBox={`0 0 ${width} ${height}`}>
                        <defs>
                            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.05)" strokeWidth="1"/>
                            </pattern>
                        </defs>
                        <rect x={margin.left} y={margin.top} width={plotWidth} height={plotHeight} fill="url(#grid)" />

                        <line x1={margin.left} y1={height - margin.bottom} x2={width - margin.right} y2={height - margin.bottom} stroke="rgba(0,0,0,0.2)" />
                        <line x1={margin.left} y1={margin.top} x2={margin.left} y2={height - margin.bottom} stroke="rgba(0,0,0,0.2)" />
                        <text x={width / 2} y={height - 5} fill="#666" fontSize="12" textAnchor="middle">PCA Component 1</text>
                        <text x={15} y={height / 2} fill="#666" fontSize="12" textAnchor="middle" transform={`rotate(-90, 15, ${height/2})`}>PCA Component 2</text>

                        {centroids.map((centroid, idx) => (
                            centroid.prevX !== centroid.x || centroid.prevY !== centroid.y ? (
                                <line key={`path-${idx}`} x1={xScale(centroid.prevX)} y1={yScale(centroid.prevY)}
                                    x2={xScale(centroid.x)} y2={yScale(centroid.y)}
                                    stroke={CLUSTER_COLORS[idx % CLUSTER_COLORS.length]} strokeWidth="2" strokeDasharray="5,3" opacity="0.5" />
                            ) : null
                        ))}

                        {data.map((point) => (
                            <circle key={point.id} className="cluster-point" cx={xScale(point.x)} cy={yScale(point.y)}
                                r={highlightedCluster !== null && point.cluster === highlightedCluster ? 8 : 5}
                                fill={point.cluster >= 0 ? CLUSTER_COLORS[point.cluster % CLUSTER_COLORS.length] : '#94a3b8'}
                                opacity={highlightedCluster !== null && point.cluster !== highlightedCluster ? 0.3 : 0.8}
                                style={{ transition: 'all 0.3s ease' }} />
                        ))}

                        {centroids.map((centroid, idx) => (
                            <g key={`centroid-${idx}`}>
                                <rect className="centroid" x={xScale(centroid.x) - 10} y={yScale(centroid.y) - 10}
                                    width={20} height={20} fill={CLUSTER_COLORS[idx % CLUSTER_COLORS.length]}
                                    stroke="white" strokeWidth="2" transform={`rotate(45, ${xScale(centroid.x)}, ${yScale(centroid.y)})`}
                                    style={{ transition: 'all 0.5s ease' }} />
                                <text x={xScale(centroid.x)} y={yScale(centroid.y) - 20} fill="#333" fontSize="12" fontWeight="bold" textAnchor="middle">
                                    C{idx + 1}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        // ==================== SIMILARITY HEATMAP COMPONENT ====================

        const SimilarityHeatmap = ({ users, items, selectedUser }) => {
            const displayUsers = users.slice(0, 10);

            const getColor = (similarity) => {
                if (similarity >= 0.8) return '#27ae60';
                if (similarity >= 0.6) return '#2ecc71';
                if (similarity >= 0.4) return '#f1c40f';
                if (similarity >= 0.2) return '#e67e22';
                return '#e74c3c';
            };

            return (
                <div className="heatmap-container">
                    <table className="heatmap-table">
                        <thead>
                            <tr>
                                <th></th>
                                {displayUsers.map(u => (
                                    <th key={u.id} style={{
                                        background: u.id === selectedUser?.id ? '#2774AE' : '#f5f5f5',
                                        color: u.id === selectedUser?.id ? 'white' : '#333'
                                    }}>
                                        {u.userId.replace('User_', 'U')}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {displayUsers.map(u1 => (
                                <tr key={u1.id}>
                                    <th style={{
                                        background: u1.id === selectedUser?.id ? '#2774AE' : '#f5f5f5',
                                        color: u1.id === selectedUser?.id ? 'white' : '#333'
                                    }}>
                                        {u1.userId.replace('User_', 'U')}
                                    </th>
                                    {displayUsers.map(u2 => {
                                        const sim = u1.id === u2.id ? 1 : cosineSimilarity(u1.ratings, u2.ratings, items);
                                        return (
                                            <td key={u2.id} className="heatmap-cell" style={{
                                                background: getColor(sim),
                                                color: sim >= 0.6 ? 'white' : '#333'
                                            }}>
                                                {sim.toFixed(2)}
                                            </td>
                                        );
                                    })}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        // ==================== K-MEANS TAB COMPONENT ====================

        const KMeansTab = () => {
            const [dataSource, setDataSource] = useState('synthetic');
            const [apiConnected, setApiConnected] = useState(false);
            const [isLoading, setIsLoading] = useState(false);

            const [k, setK] = useState(4);
            const [speed, setSpeed] = useState('medium');
            const [rawData, setRawData] = useState([]);
            const [data, setData] = useState([]);
            const [centroids, setCentroids] = useState([]);
            const [iteration, setIteration] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isConverged, setIsConverged] = useState(false);
            const [animationPhase, setAnimationPhase] = useState('idle');
            const [highlightedCluster, setHighlightedCluster] = useState(null);

            const [metrics, setMetrics] = useState({ inertia: 0, silhouette: 0, numClusters: 0, iterations: 0 });
            const [elbowData, setElbowData] = useState([]);
            const [silhouetteData, setSilhouetteData] = useState([]);
            const [clusterSizes, setClusterSizes] = useState([]);

            const animationRef = useRef(null);
            const speedMs = { slow: 1500, medium: 800, fast: 300 };

            // Check API connection
            useEffect(() => {
                fetch(`${API_BASE}/`)
                    .then(r => r.ok && setApiConnected(true))
                    .catch(() => setApiConnected(false));
            }, []);

            // Load data based on source
            const loadData = useCallback(async () => {
                setIsLoading(true);
                setIsPlaying(false);
                setIsConverged(false);
                setIteration(0);
                setCentroids([]);

                if (dataSource === 'netflix' && apiConnected) {
                    try {
                        const elbowResponse = await fetch(`${API_BASE}/elbow`);
                        const elbowApiData = await elbowResponse.json();

                        setElbowData(elbowApiData.k_values.map((kVal, i) => ({
                            k: kVal, inertia: elbowApiData.inertia_values[i], silhouette: elbowApiData.silhouette_scores[i]
                        })));
                        setSilhouetteData(elbowApiData.k_values.map((kVal, i) => ({ k: kVal, score: elbowApiData.silhouette_scores[i] })));

                        const clusterResponse = await fetch(`${API_BASE}/cluster`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ algorithm: 'kmeans', n_clusters: k })
                        });
                        const clusterResult = await clusterResponse.json();

                        const clusterCenters = [
                            { x: 0.2, y: 0.8 }, { x: 0.8, y: 0.7 }, { x: 0.5, y: 0.2 },
                            { x: 0.3, y: 0.5 }, { x: 0.7, y: 0.4 }, { x: 0.5, y: 0.7 }
                        ];

                        const netflixData = clusterResult.cluster_assignments.map((cluster, i) => {
                            const center = clusterCenters[cluster % clusterCenters.length];
                            return {
                                id: i, x: center.x + (Math.random() - 0.5) * 0.25, y: center.y + (Math.random() - 0.5) * 0.25,
                                cluster, userId: `User_${i + 1}`
                            };
                        });

                        setRawData(netflixData);
                        setData(netflixData);
                        setMetrics({
                            inertia: clusterResult.inertia?.toFixed(2) || 'N/A',
                            silhouette: clusterResult.silhouette_score?.toFixed(3) || 'N/A',
                            numClusters: clusterResult.n_clusters_found,
                            iterations: 'API'
                        });

                        updateClusterSizes(netflixData);
                    } catch (err) {
                        console.error('Netflix data load failed:', err);
                        loadSyntheticData();
                    }
                } else {
                    loadSyntheticData();
                }

                setIsLoading(false);
            }, [dataSource, apiConnected, k]);

            const loadSyntheticData = () => {
                const mockData = generateSyntheticClusterData(150);
                setRawData(mockData);
                setData(mockData);

                const elbowResults = [];
                for (let testK = 1; testK <= 10; testK++) {
                    let testCentroids = initializeCentroids(mockData, testK);
                    let testData = mockData;
                    for (let i = 0; i < 10; i++) {
                        testData = assignClusters(testData, testCentroids);
                        testCentroids = updateCentroids(testData, testCentroids, testK);
                    }
                    elbowResults.push({ k: testK, inertia: calculateInertia(testData), silhouette: calculateSilhouette(testData, testK) });
                }
                setElbowData(elbowResults);
                setSilhouetteData(elbowResults.map(d => ({ k: d.k, score: d.silhouette })));
                setMetrics({ inertia: 0, silhouette: 0, numClusters: 0, iterations: 0 });
                setClusterSizes([]);
            };

            const updateClusterSizes = (clusteredData) => {
                const sizes = [];
                const uniqueClusters = [...new Set(clusteredData.map(d => d.cluster))].filter(c => c >= 0).sort();
                uniqueClusters.forEach(c => {
                    const count = clusteredData.filter(d => d.cluster === c).length;
                    sizes.push({ name: `Cluster ${c + 1}`, value: count, color: CLUSTER_COLORS[c % CLUSTER_COLORS.length] });
                });
                setClusterSizes(sizes);
            };

            useEffect(() => { loadData(); }, [dataSource]);

            const handleReset = useCallback(() => {
                setIsPlaying(false);
                setIsConverged(false);
                setIteration(0);
                setAnimationPhase('idle');
                if (animationRef.current) clearTimeout(animationRef.current);

                const resetData = rawData.map(d => ({ ...d, cluster: -1, distance: 0 }));
                setData(resetData);
                const newCentroids = initializeCentroids(resetData, k);
                setCentroids(newCentroids);
                setMetrics({ inertia: 0, silhouette: 0, numClusters: 0, iterations: 0 });
                setClusterSizes([]);
            }, [rawData, k]);

            const runStep = useCallback(() => {
                if (isConverged) return;

                setAnimationPhase('assigning');
                setTimeout(() => {
                    const newData = assignClusters(data, centroids);
                    setData(newData);

                    setTimeout(() => {
                        setAnimationPhase('updating');
                        const newCentroids = updateCentroids(newData, centroids, k);
                        const movement = newCentroids.reduce((sum, c, i) => sum + euclideanDistance(c, centroids[i]), 0);

                        setCentroids(newCentroids);
                        setIteration(prev => prev + 1);

                        const inertia = calculateInertia(newData);
                        const silhouette = calculateSilhouette(newData, k);

                        setMetrics({
                            inertia: inertia.toFixed(2),
                            silhouette: silhouette.toFixed(3),
                            numClusters: k,
                            iterations: iteration + 1
                        });

                        updateClusterSizes(newData);

                        if (movement < 0.001) {
                            setIsConverged(true);
                            setIsPlaying(false);
                            setAnimationPhase('converged');
                        } else {
                            setTimeout(() => setAnimationPhase('idle'), 200);
                        }
                    }, speedMs[speed] / 3);
                }, speedMs[speed] / 3);
            }, [data, centroids, k, iteration, isConverged, speed]);

            useEffect(() => {
                if (isPlaying && !isConverged) {
                    animationRef.current = setTimeout(runStep, speedMs[speed]);
                }
                return () => { if (animationRef.current) clearTimeout(animationRef.current); };
            }, [isPlaying, isConverged, runStep, speed]);

            const handlePlay = () => {
                if (iteration === 0) {
                    handleReset();
                    setTimeout(() => setIsPlaying(true), 100);
                } else {
                    setIsPlaying(!isPlaying);
                }
            };

            return (
                <div>
                    <div className="controls-section">
                        <div className={`data-source-bar ${dataSource === 'netflix' ? 'netflix' : ''}`}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                <span style={{ fontWeight: '600' }}>Data Source:</span>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <button className={`data-toggle-btn synthetic ${dataSource === 'synthetic' ? 'active' : ''}`}
                                        onClick={() => setDataSource('synthetic')} disabled={isLoading}>
                                        Synthetic Data
                                    </button>
                                    <button className={`data-toggle-btn netflix ${dataSource === 'netflix' ? 'active' : ''}`}
                                        onClick={() => setDataSource('netflix')} disabled={isLoading || !apiConnected}>
                                        Netflix Ratings
                                    </button>
                                </div>
                            </div>
                            <div style={{ fontSize: '0.8rem', color: '#666' }}>
                                {isLoading ? 'Loading data...' : `${rawData.length} user profiles`}
                                {!apiConnected && <span style={{ marginLeft: '8px', color: '#999' }}>(API offline)</span>}
                            </div>
                        </div>

                        <div className="control-panel">
                            <h3>⚙️ K-Means Configuration</h3>
                            <div className="controls-grid">
                                <div className="control-group">
                                    <label>Number of Clusters (k)</label>
                                    <input type="range" min="2" max="8" value={k} onChange={(e) => setK(parseInt(e.target.value))} />
                                    <div className="slider-value">{k} clusters</div>
                                </div>
                                <div className="control-group">
                                    <label>Animation Speed</label>
                                    <div className="speed-selector">
                                        {['slow', 'medium', 'fast'].map(s => (
                                            <button key={s} className={`speed-btn ${speed === s ? 'active' : ''}`} onClick={() => setSpeed(s)}>
                                                {s.charAt(0).toUpperCase() + s.slice(1)}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div style={{ display: 'flex', gap: '10px', marginTop: '20px', flexWrap: 'wrap' }}>
                                <button className={`anim-btn ${isPlaying ? 'reset' : 'play'}`} onClick={handlePlay} disabled={isConverged || dataSource === 'netflix'}>
                                    {isPlaying ? '⏸ Pause' : '▶ Play'}
                                </button>
                                <button className="anim-btn play" onClick={runStep} disabled={isPlaying || isConverged || dataSource === 'netflix'}>
                                    ⏭ Step
                                </button>
                                <button className="anim-btn reset" onClick={handleReset} disabled={dataSource === 'netflix'}>
                                    ↺ Reset
                                </button>
                            </div>

                            {dataSource === 'synthetic' && (
                                <div className="algorithm-status">
                                    <div className="status-item">
                                        <span className="status-label">Phase:</span>
                                        <span className="status-value">
                                            {animationPhase === 'idle' && 'Ready'}
                                            {animationPhase === 'assigning' && 'Assigning Points...'}
                                            {animationPhase === 'updating' && 'Moving Centroids...'}
                                            {animationPhase === 'converged' && '✓ Converged!'}
                                        </span>
                                    </div>
                                    <div className="status-item">
                                        <span className="status-label">Iteration:</span>
                                        <span className="status-value">{iteration}</span>
                                    </div>
                                    <div className="status-item">
                                        <span className="status-label">Status:</span>
                                        <span className="status-value">{isConverged ? '✓ Done' : isPlaying ? 'Running' : 'Paused'}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="results-section">
                        <div className="metrics-grid">
                            <div className="metric-card"><div className="value">{metrics.inertia}</div><div className="label">Inertia (WCSS)</div></div>
                            <div className="metric-card"><div className="value">{metrics.silhouette}</div><div className="label">Silhouette Score</div></div>
                            <div className="metric-card"><div className="value">{metrics.numClusters}</div><div className="label">Clusters</div></div>
                            <div className="metric-card"><div className="value">{metrics.iterations}</div><div className="label">Iterations</div></div>
                        </div>

                        <div className="main-grid">
                            <div className="chart-card hero">
                                <h3>Clustering Visualization (2D PCA Projection)</h3>
                                {isLoading ? (
                                    <div className="loading"><div className="loading-spinner"></div>Loading data...</div>
                                ) : (
                                    <>
                                        <AnimatedScatterPlot data={data} centroids={centroids} animationPhase={animationPhase} highlightedCluster={highlightedCluster} />
                                        <div className="cluster-legend">
                                            {clusterSizes.map((cluster, idx) => (
                                                <div key={idx} className="legend-item" onMouseEnter={() => setHighlightedCluster(idx)} onMouseLeave={() => setHighlightedCluster(null)}>
                                                    <div className="legend-dot" style={{ background: cluster.color }}></div>
                                                    {cluster.name} ({cluster.value})
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </div>

                            <div className="chart-card">
                                <h3>Elbow Method (Inertia vs k)</h3>
                                <LineChartComponent data={elbowData} dataKey="inertia" xKey="k" title="Inertia" />
                            </div>

                            <div className="chart-card">
                                <h3>Silhouette Score by k</h3>
                                <BarChartComponent data={silhouetteData} dataKey="score" xKey="k" title="Silhouette" highlightValue={k} />
                            </div>

                            <div className="chart-card">
                                <h3>Cluster Size Distribution</h3>
                                {clusterSizes.length > 0 ? <PieChartComponent data={clusterSizes} /> : (
                                    <div style={{ height: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#888' }}>
                                        Run clustering to see distribution
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==================== COLLABORATIVE FILTERING TAB COMPONENT ====================

        const CollaborativeFilteringTab = () => {
            const [apiConnected, setApiConnected] = useState(false);
            const [movies, setMovies] = useState([]);
            const [userIds, setUserIds] = useState([]);

            // CF Evaluation state
            const [cfK, setCfK] = useState(10);
            const [cfTestFrac, setCfTestFrac] = useState(20);
            const [cfResult, setCfResult] = useState(null);
            const [cfEvalLoading, setCfEvalLoading] = useState(false);

            // K Sweep state
            const [sweepData, setSweepData] = useState([]);
            const [sweepLoading, setSweepLoading] = useState(false);
            const [bestSweepK, setBestSweepK] = useState(null);

            // Prediction state
            const [predUser, setPredUser] = useState('');
            const [predMovie, setPredMovie] = useState('');
            const [predK, setPredK] = useState(10);
            const [predResult, setPredResult] = useState(null);
            const [predLoading, setPredLoading] = useState(false);

            useEffect(() => {
                fetch(`${API_BASE}/`)
                    .then(r => { if (r.ok) setApiConnected(true); })
                    .catch(() => {});
            }, []);

            useEffect(() => {
                if (!apiConnected) return;
                Promise.all([
                    fetch(`${API_BASE}/movies`).then(r => r.json()),
                    fetch(`${API_BASE}/users`).then(r => r.json()),
                ]).then(([moviesData, usersData]) => {
                    setMovies(moviesData);
                    setUserIds(usersData.user_ids);
                    setPredUser(usersData.user_ids[0]);
                    setPredMovie(moviesData[0]);
                }).catch(err => console.error('Load failed:', err));
            }, [apiConnected]);

            const runCFEval = async () => {
                setCfEvalLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/cf_evaluate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ k: cfK, test_fraction: cfTestFrac / 100 })
                    });
                    setCfResult(await res.json());
                } catch (err) { console.error(err); }
                setCfEvalLoading(false);
            };

            const runSweep = async () => {
                setSweepLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/cf_sweep`, { method: 'POST' });
                    const data = await res.json();
                    setSweepData(data);
                    const best = data.reduce((a, b) => (b.test_mae && b.test_mae < (a.test_mae || 999)) ? b : a, data[0]);
                    setBestSweepK(best);
                } catch (err) { console.error(err); }
                setSweepLoading(false);
            };

            const runPredict = async (userId, movie, k) => {
                const uid = userId || predUser;
                const mov = movie || predMovie;
                const kVal = k || predK;
                setPredLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/predict_movie?user_id=${uid}&movie=${encodeURIComponent(mov)}&k=${kVal}`, { method: 'POST' });
                    setPredResult(await res.json());
                } catch (err) { console.error(err); }
                setPredLoading(false);
            };

            const randomPredict = () => {
                const rUser = userIds[Math.floor(Math.random() * userIds.length)];
                const rMovie = movies[Math.floor(Math.random() * movies.length)];
                setPredUser(rUser);
                setPredMovie(rMovie);
                runPredict(rUser, rMovie, predK);
            };

            if (!apiConnected) {
                return (
                    <div style={{ padding: '60px 40px', textAlign: 'center', color: '#888' }}>
                        <div className="loading-spinner" style={{ margin: '0 auto 15px' }}></div>
                        Connecting to API... Make sure the backend is running.
                    </div>
                );
            }

            return (
                <div>
                    <div className="controls-section">
                        <div className="data-source-bar netflix">
                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                <span style={{ fontWeight: '600' }}>📊 Netflix Ratings Data</span>
                                <span style={{ fontSize: '0.85rem', color: '#666' }}>
                                    {userIds.length} users · {movies.length} movies · Real ratings (1–5 stars)
                                </span>
                            </div>
                        </div>

                        {/* Predict a Movie Rating */}
                        <div className="control-panel">
                            <h3>🎬 Predict a Movie Rating</h3>
                            <p className="cf-section-desc">Pick a user and a movie to see what our KNN model predicts they'd rate it. Hit "Random" for a surprise!</p>
                            <div className="controls-grid">
                                <div className="control-group">
                                    <label>User</label>
                                    <select value={predUser} onChange={e => setPredUser(parseInt(e.target.value))}>
                                        {userIds.slice(0, 50).map(u => <option key={u} value={u}>User {u}</option>)}
                                    </select>
                                </div>
                                <div className="control-group">
                                    <label>Movie</label>
                                    <select value={predMovie} onChange={e => setPredMovie(e.target.value)}>
                                        {movies.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                                <div className="control-group">
                                    <label>K Neighbors</label>
                                    <input type="range" min="3" max="50" value={predK} onChange={e => setPredK(parseInt(e.target.value))} />
                                    <div className="slider-value">{predK} neighbors</div>
                                </div>
                                <div className="control-group">
                                    <label>&nbsp;</label>
                                    <div style={{ display: 'flex', gap: '8px' }}>
                                        <button className="anim-btn play" onClick={() => runPredict()} disabled={predLoading}>
                                            ⭐ Predict
                                        </button>
                                        <button className="anim-btn reset" onClick={randomPredict} disabled={predLoading}>
                                            🎲 Random
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {predLoading && <div className="loading"><div className="loading-spinner"></div>Predicting...</div>}

                            {predResult && !predLoading && (
                                <div className="predict-result-box">
                                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: '30px', flexWrap: 'wrap' }}>
                                        <div>
                                            <div style={{ fontSize: '0.8rem', color: '#888', marginBottom: '4px' }}>
                                                Predicted rating for <strong style={{ color: '#333' }}>{predMovie}</strong>
                                            </div>
                                            <div className="big-predicted-rating">
                                                {predResult.predicted.toFixed(1)}
                                                <span style={{ fontSize: '1rem', marginLeft: '4px' }}>/ 5</span>
                                            </div>
                                            <div style={{ marginTop: '4px' }}>
                                                {'★'.repeat(Math.round(predResult.predicted))}{'☆'.repeat(5 - Math.round(predResult.predicted))}
                                            </div>
                                            <span className={`confidence-badge confidence-${predResult.confidence}`} style={{ marginTop: '8px' }}>
                                                {predResult.confidence} confidence
                                            </span>
                                        </div>

                                        <div style={{ flex: 1, minWidth: '200px' }}>
                                            {predResult.actual !== null && (
                                                <div style={{ marginBottom: '12px', padding: '10px 14px', background: Math.abs(predResult.predicted - predResult.actual) < 0.5 ? 'rgba(39,174,96,0.1)' : 'rgba(243,156,18,0.1)', borderRadius: '8px' }}>
                                                    <span style={{ color: '#666', fontSize: '0.82rem' }}>Actual rating: </span>
                                                    <strong style={{ fontSize: '1.1rem', color: '#333' }}>{predResult.actual} / 5</strong>
                                                    <span style={{ marginLeft: '8px' }}>{'★'.repeat(predResult.actual)}</span>
                                                    <span style={{ marginLeft: '12px', color: '#666', fontSize: '0.82rem' }}>Error: </span>
                                                    <strong style={{ color: Math.abs(predResult.predicted - predResult.actual) < 0.5 ? '#27ae60' : '#e67e22' }}>
                                                        {Math.abs(predResult.predicted - predResult.actual).toFixed(2)}
                                                    </strong>
                                                </div>
                                            )}
                                            {predResult.actual === null && (
                                                <div style={{ fontSize: '0.82rem', color: '#888', marginBottom: '10px', fontStyle: 'italic' }}>
                                                    This user hasn't rated this movie — no actual to compare.
                                                </div>
                                            )}

                                            <div style={{ fontSize: '0.75rem', color: '#999', marginBottom: '4px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                                User {predUser}'s Top Rated
                                            </div>
                                            {(predResult.user_top_rated || []).map(([m, r], i) => (
                                                <div key={i} className="user-taste-row">
                                                    <span className="movie-name">{m}</span>
                                                    <div className="taste-bar"><div className="taste-fill" style={{ width: `${r/5*100}%`, background: '#27ae60' }}></div></div>
                                                    <span style={{ fontWeight: 600, fontSize: '0.8rem' }}>{r}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div style={{ marginTop: '10px', fontSize: '0.8rem', color: '#999' }}>
                                        Similar users: {(predResult.similar_user_ids || []).join(', ')}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Train/Test Evaluation */}
                        <div className="control-panel">
                            <h3>📐 Train / Test Error (MAE)</h3>
                            <p className="cf-section-desc">
                                We split ratings into training and test sets. The model learns from training data, then we measure
                                <strong> Mean Absolute Error</strong> — the average gap between predicted and actual ratings — on both sets.
                                Lower is better. If train error is much lower than test error, the model may be overfitting.
                            </p>
                            <div className="controls-grid">
                                <div className="control-group">
                                    <label>K Neighbors</label>
                                    <input type="range" min="1" max="80" value={cfK} onChange={e => setCfK(parseInt(e.target.value))} />
                                    <div className="slider-value">{cfK} neighbors</div>
                                </div>
                                <div className="control-group">
                                    <label>Test Fraction</label>
                                    <input type="range" min="5" max="50" step="5" value={cfTestFrac} onChange={e => setCfTestFrac(parseInt(e.target.value))} />
                                    <div className="slider-value">{cfTestFrac}%</div>
                                </div>
                                <div className="control-group">
                                    <label>&nbsp;</label>
                                    <button className="anim-btn play" onClick={runCFEval} disabled={cfEvalLoading}>
                                        🔬 Evaluate
                                    </button>
                                </div>
                            </div>

                            {cfEvalLoading && <div className="loading"><div className="loading-spinner"></div>Evaluating (may take a few seconds)...</div>}
                        </div>
                    </div>

                    <div className="results-section">
                        {cfResult && (
                            <>
                                <div className="metrics-grid">
                                    <div className="metric-card"><div className="value">{cfResult.k}</div><div className="label">K Neighbors</div></div>
                                    <div className="metric-card">
                                        <div className="value" style={{ color: '#2774AE' }}>{cfResult.train_mae.toFixed(4)}</div>
                                        <div className="label">Train MAE</div>
                                    </div>
                                    <div className="metric-card">
                                        <div className="value" style={{ color: cfResult.test_mae < 0.7 ? '#27ae60' : cfResult.test_mae < 0.85 ? '#f39c12' : '#e74c3c' }}>
                                            {cfResult.test_mae.toFixed(4)}
                                        </div>
                                        <div className="label">Test MAE</div>
                                    </div>
                                    <div className="metric-card">
                                        <div className="value" style={{ color: (cfResult.test_mae - cfResult.train_mae) > 0.15 ? '#e74c3c' : '#27ae60' }}>
                                            {(cfResult.test_mae - cfResult.train_mae).toFixed(4)}
                                        </div>
                                        <div className="label">Gap (Overfitting?)</div>
                                    </div>
                                </div>

                                <div className="main-grid">
                                    <div className="chart-card hero">
                                        <h3>Per-Movie Test MAE</h3>
                                        <p style={{ fontSize: '0.8rem', color: '#888', marginBottom: '12px' }}>
                                            How well does the model predict each movie? Lower MAE = easier to predict. Sorted by number of test ratings.
                                        </p>
                                        {cfResult.movie_mae && cfResult.movie_mae.length > 0 && (
                                            <table className="mae-table">
                                                <thead><tr><th>Movie</th><th>MAE</th><th>Test Ratings</th></tr></thead>
                                                <tbody>
                                                    {cfResult.movie_mae.map((m, i) => {
                                                        const maxMAE = Math.max(...cfResult.movie_mae.map(x => x.mae));
                                                        const pct = (m.mae / maxMAE) * 100;
                                                        const color = m.mae < 0.6 ? '#27ae60' : m.mae < 0.75 ? '#f39c12' : '#e74c3c';
                                                        return (
                                                            <tr key={i}>
                                                                <td style={{ fontWeight: 500, color: '#333' }}>{m.movie}</td>
                                                                <td>
                                                                    <span className="mae-bar-track">
                                                                        <span className="mae-bar-fill" style={{ width: `${pct}%`, background: color }}></span>
                                                                    </span>
                                                                    {m.mae.toFixed(3)}
                                                                </td>
                                                                <td style={{ color: '#888' }}>{m.n}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* K Sweep */}
                        <div className="chart-card" style={{ marginTop: '25px' }}>
                            <h3>🔍 Tuning k: Train vs. Test Error Sweep</h3>
                            <p style={{ fontSize: '0.82rem', color: '#888', marginBottom: '12px' }}>
                                Sweep k from 1 to 50 and plot both train and test MAE. Look for the k where test error is minimized —
                                that's the sweet spot. If train error keeps falling but test error rises, the model is overfitting.
                            </p>
                            {!sweepData.length && !sweepLoading && (
                                <button className="anim-btn play" onClick={runSweep}>
                                    ▶ Run k Sweep (takes ~15 seconds)
                                </button>
                            )}
                            {sweepLoading && <div className="loading"><div className="loading-spinner"></div>Evaluating k = 1 to 50...</div>}
                            {sweepData.length > 0 && (
                                <>
                                    <MultiLineChartComponent
                                        data={sweepData}
                                        datasets={[
                                            { key: 'train_mae', label: 'Train MAE' },
                                            { key: 'test_mae', label: 'Test MAE' },
                                        ]}
                                        xKey="k"
                                    />
                                    {bestSweepK && (
                                        <div className="algorithm-status" style={{ marginTop: '15px' }}>
                                            <div className="status-item">
                                                <span className="status-label">Best k:</span>
                                                <span className="status-value">{bestSweepK.k}</span>
                                            </div>
                                            <div className="status-item">
                                                <span className="status-label">Best Test MAE:</span>
                                                <span className="status-value" style={{ color: '#27ae60' }}>{bestSweepK.test_mae?.toFixed(4)}</span>
                                            </div>
                                            <div className="status-item">
                                                <span className="status-label">Train MAE at best k:</span>
                                                <span className="status-value">{bestSweepK.train_mae?.toFixed(4)}</span>
                                            </div>
                                            <button className="anim-btn reset" onClick={runSweep} style={{ marginLeft: 'auto' }}>↺ Re-run</button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ==================== MAIN APP COMPONENT ====================

        const App = () => {
            const [activeTab, setActiveTab] = useState('kmeans');

            return (
                <div>
                    <header className="header">
                        <div className="header-content">
                            <div>
                                <p style={{ fontSize: '0.65rem', color: '#FFD100', marginBottom: '0.25rem', textTransform: 'uppercase', letterSpacing: '0.2em' }}>
                                    MGMT298D: Science and Strategy of AI
                                </p>
                                <h1 style={{ fontSize: '1.4rem', fontWeight: 600, color: '#f5f5f5' }}>
                                    Week 3: Clustering & Collaborative Filtering
                                </h1>
                                <p style={{ fontSize: '0.85rem', color: 'rgba(255,255,255,0.7)', marginTop: '0.25rem' }}>
                                    User Segmentation with K-Means & Recommendations with User-Based CF
                                </p>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <span style={{ fontSize: '1rem', fontWeight: 500, color: '#f5f5f5' }}>UCLA Anderson</span>
                            </div>
                        </div>
                        <div className="header-gold-line"></div>
                    </header>

                    <div className="main-tabs">
                        <button className={`main-tab ${activeTab === 'kmeans' ? 'active' : ''}`} onClick={() => setActiveTab('kmeans')}>
                            K-Means Clustering
                        </button>
                        <button className={`main-tab ${activeTab === 'cf' ? 'active' : ''}`} onClick={() => setActiveTab('cf')}>
                            Collaborative Filtering
                        </button>
                    </div>

                    {activeTab === 'kmeans' && <KMeansTab />}
                    {activeTab === 'cf' && <CollaborativeFilteringTab />}

                    <p className="footer">
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </p>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
