<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2: Tree Models & XGBoost | UCLA Anderson MGMT298D</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track { background: #ffffff;
        }

        ::-webkit-scrollbar-thumb {
            background: #2774AE;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: '#ffffff';
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes growTree {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes nodeAppear {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes lineGrow {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes progressPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 116, 174, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(39, 116, 174, 0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .animate-pulse {
            animation: pulse 2s infinite;
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        .tree-node {
            animation: nodeAppear 0.5s ease-out forwards;
        }

        .tree-line {
            stroke-dasharray: 100;
            animation: lineGrow 0.6s ease-out forwards;
        }

        .bar-animate {
            animation: slideIn 0.5s ease-out forwards;
        }

        .progress-pulse {
            animation: progressPulse 1.5s infinite;
        }
    
        .header-gold-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #FFD100;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // API Configuration
        const API_BASE = window.location.origin;

        // Color palette - UCLA Dark Theme
        const colors = {
            // UCLA Brand colors (for header only)
            primary: '#2774AE',
            primaryLight: '#2774AE',
            accent: '#FFD100',
            accentDark: '#e6bc00',
            darkBlue: '#005587',
            lightBlue: '#8BB8E8',
            // Simplified - all same color for body
            positive: '#1a1a1a',
            negative: '#1a1a1a',
            warning: '#1a1a1a',
            // Content areas - clean white backgrounds
            cardBg: '#ffffff',
            cardBorder: 'rgba(0,0,0,0.1)',
            text: '#1a1a1a',
            textMuted: '#666666',
            // Legacy names mapped to simple scheme
            darkBg: '#ffffff',
            darkText: '#1a1a1a',
            darkMuted: '#c0c0c0',
            lightBg: '#ffffff',
            lightCard: '#ffffff',
            lightBorder: 'rgba(0,0,0,0.1)',
            lightText: '#1a1a1a',
            lightMuted: '#666666',
        };

        // Header Component
        const Header = () => (
            <header style={{
                background: '#2774AE',
                padding: '1rem 2rem 1.5rem 2rem',
                position: 'sticky',
                top: 0,
                zIndex: 100
            }}>
                <div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                        <p style={{ fontSize: '0.65rem', color: '#FFD100', fontWeight: 400, marginBottom: '0.25rem', textTransform: 'uppercase', letterSpacing: '0.2em' }}>
                            MGMT298D: Science and Strategy of AI
                        </p>
                        <h1 style={{ fontSize: '1.4rem', fontWeight: 600, color: '#f5f5f5', letterSpacing: '0' }}>
                            Week 2: XGBoost Hyperparameter Tuning
                        </h1>
                        <p style={{ fontSize: '0.85rem', color: '#c0c0c0', marginTop: '0.25rem' }}>
                            Interactive Machine Learning Simulator
                        </p>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                        <span style={{
                            fontSize: '1rem',
                            fontWeight: 500,
                            color: '#f5f5f5'
                        }}>
                            UCLA Anderson
                        </span>
                    </div>
                </div>
                <div className="header-gold-line"></div>
            </header>
        );


        // Slider Component
        const Slider = ({ label, value, onChange, min, max, step, disabled, description }) => (
            <div style={{ marginBottom: '1.25rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                    <label style={{ fontSize: '0.875rem', color: colors.text, fontWeight: 500 }}>{label}</label>
                    <span style={{
                        fontSize: '0.875rem',
                        fontWeight: 600,
                        color: colors.text,
                        background: 'rgba(39, 116, 174, 0.2)',
                        padding: '0.125rem 0.5rem',
                        borderRadius: '4px'
                    }}>
                        {typeof value === 'number' && value % 1 !== 0 ? value.toFixed(2) : value}
                    </span>
                </div>
                <input
                    type="range"
                    min={min}
                    max={max}
                    step={step}
                    value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value))}
                    disabled={disabled}
                    style={{
                        width: '100%',
                        height: '6px',
                        borderRadius: '3px',
                        background: `linear-gradient(to right, ${colors.primary} 0%, ${colors.primary} ${((value - min) / (max - min)) * 100}%, rgba(39, 116, 174, 0.2) ${((value - min) / (max - min)) * 100}%, rgba(39, 116, 174, 0.2) 100%)`,
                        appearance: 'none',
                        cursor: disabled ? 'not-allowed' : 'pointer',
                        opacity: disabled ? 0.4 : 1
                    }}
                />
                {description && (
                    <p style={{ fontSize: '0.7rem', color: colors.textMuted, marginTop: '0.25rem' }}>
                        {description}
                    </p>
                )}
            </div>
        );

        // Model Type Buttons
        const ModelTypeButtons = ({ modelType, setModelType }) => {
            const models = [
                { id: 'decision_tree', label: 'Decision Tree' },
                { id: 'random_forest', label: 'Random Forest' },
                { id: 'xgboost', label: 'XGBoost' }
            ];

            return (
                <div style={{ marginBottom: '1.5rem' }}>
                    <label style={{
                        fontSize: '0.875rem',
                        color: colors.text,
                        display: 'block',
                        marginBottom: '0.75rem',
                        fontWeight: 500
                    }}>
                        Model Type
                    </label>
                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                        {models.map(model => (
                            <button
                                key={model.id}
                                onClick={() => setModelType(model.id)}
                                style={{
                                    flex: 1,
                                    padding: '0.75rem 0.5rem',
                                    borderRadius: '8px',
                                    border: modelType === model.id
                                        ? `2px solid ${colors.primary}`
                                        : `1px solid ${colors.cardBorder}`,
                                    cursor: 'pointer',
                                    fontWeight: 500,
                                    fontSize: '0.8rem',
                                    transition: 'all 0.2s ease',
                                    background: modelType === model.id
                                        ? 'rgba(39, 116, 174, 0.2)'
                                        : colors.cardBg,
                                    color: modelType === model.id ? colors.primary : colors.text
                                }}
                            >
                                <span style={{ display: 'block', fontSize: '1.25rem', marginBottom: '0.25rem' }}>
                                    {model.icon}
                                </span>
                                {model.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // Animated Decision Tree Visualization - HERO FEATURE
        const DecisionTreeViz = ({ maxDepth, isTraining, modelType }) => {
            const [animationKey, setAnimationKey] = useState(0);
            const [treeData, setTreeData] = useState(null);

            useEffect(() => {
                setAnimationKey(prev => prev + 1);

                const generateTree = (depth, maxD, x, y, width, nodeId = 0) => {
                    if (depth > maxD || depth > 4) return null;

                    const features = ['mileage', 'year', 'engine', 'mpg', 'tax', 'fuel'];
                    const feature = features[nodeId % features.length];
                    const thresholds = { mileage: '50K mi', year: '2020', engine: '3.0L', mpg: '25', tax: '$200', fuel: 'petrol' };
                    const prediction = (15000 + Math.random() * 35000).toFixed(0);

                    const node = {
                        id: nodeId,
                        x,
                        y,
                        depth,
                        feature,
                        threshold: thresholds[feature],
                        prediction,
                        isLeaf: depth === Math.min(maxD, 4)
                    };

                    if (!node.isLeaf) {
                        const childWidth = width / 2;
                        const childY = y + 70;
                        node.left = generateTree(depth + 1, maxD, x - childWidth / 2, childY, childWidth, nodeId * 2 + 1);
                        node.right = generateTree(depth + 1, maxD, x + childWidth / 2, childY, childWidth, nodeId * 2 + 2);
                    }

                    return node;
                };

                const displayDepth = Math.min(maxDepth, 4);
                const tree = generateTree(0, displayDepth, 250, 35, 420);
                setTreeData(tree);
            }, [maxDepth]);

            const renderNode = (node, delay = 0) => {
                if (!node) return null;

                const predValue = parseInt(node.prediction);
                const hue = 200 + ((predValue - 15000) / 35000) * 20;
                const nodeColor = node.isLeaf ? colors.lightBlue : colors.primary;

                return (
                    <g key={node.id}>
                        {/* Connection lines */}
                        {node.left && (
                            <line
                                x1={node.x}
                                y1={node.y + 18}
                                x2={node.left.x}
                                y2={node.left.y - 18}
                                stroke={colors.primary}
                                strokeWidth="2"
                                opacity="0.6"
                                className="tree-line"
                                style={{ animationDelay: `${delay + 100}ms` }}
                            />
                        )}
                        {node.right && (
                            <line
                                x1={node.x}
                                y1={node.y + 18}
                                x2={node.right.x}
                                y2={node.right.y - 18}
                                stroke={colors.primary}
                                strokeWidth="2"
                                opacity="0.6"
                                className="tree-line"
                                style={{ animationDelay: `${delay + 100}ms` }}
                            />
                        )}

                        {/* Branch labels */}
                        {node.left && node.depth < 2 && (
                            <text
                                x={(node.x + node.left.x) / 2 - 15}
                                y={(node.y + node.left.y) / 2}
                                fill={colors.positive}
                                fontSize="9"
                                fontWeight="500"
                            >
                                Yes
                            </text>
                        )}
                        {node.right && node.depth < 2 && (
                            <text
                                x={(node.x + node.right.x) / 2 + 5}
                                y={(node.y + node.right.y) / 2}
                                fill={colors.primary}
                                fontSize="9"
                                fontWeight="500"
                            >
                                No
                            </text>
                        )}

                        {/* Node */}
                        <g className="tree-node" style={{ animationDelay: `${delay}ms` }}>
                            <rect
                                x={node.x - 42}
                                y={node.y - 18}
                                width="84"
                                height="36"
                                rx="6"
                                fill={colors.cardBg}
                                stroke={nodeColor}
                                strokeWidth="2"
                            />

                            {node.isLeaf ? (
                                <>
                                    <text
                                        x={node.x}
                                        y={node.y - 3}
                                        textAnchor="middle"
                                        fill={colors.textMuted}
                                        fontSize="8"
                                    >
                                        Predict
                                    </text>
                                    <text
                                        x={node.x}
                                        y={node.y + 10}
                                        textAnchor="middle"
                                        fill={colors.text}
                                        fontSize="11"
                                        fontWeight="600"
                                    >
                                        ${parseInt(node.prediction).toLocaleString()}
                                    </text>
                                </>
                            ) : (
                                <>
                                    <text
                                        x={node.x}
                                        y={node.y - 2}
                                        textAnchor="middle"
                                        fill={colors.text}
                                        fontSize="10"
                                        fontWeight="600"
                                    >
                                        {node.feature}
                                    </text>
                                    <text
                                        x={node.x}
                                        y={node.y + 11}
                                        textAnchor="middle"
                                        fill={colors.primary}
                                        fontSize="9"
                                    >
                                        {"<"} {node.threshold}
                                    </text>
                                </>
                            )}
                        </g>

                        {/* Render children */}
                        {renderNode(node.left, delay + 150)}
                        {renderNode(node.right, delay + 150)}
                    </g>
                );
            };

            const treeCount = modelType === 'random_forest' ? 'Forest (100 trees)' : modelType === 'xgboost' ? 'Boosted Trees' : 'Single Tree';

            return (
                <div style={{
                    background: colors.cardBg,
                    borderRadius: '12px',
                    padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`,
                    height: '100%'
                }}>
                    <h3 style={{
                        fontSize: '1rem',
                        fontWeight: 600,
                        color: colors.text,
                        marginBottom: '0.5rem',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '0.5rem'
                    }}>
                        <span style={{ color: colors.text }}></span>
                        Decision Tree Structure
                        <span style={{
                            fontSize: '0.7rem',
                            color: colors.text,
                            background: 'rgba(39, 116, 174, 0.3)',
                            padding: '0.2rem 0.5rem',
                            borderRadius: '4px',
                            marginLeft: 'auto'
                        }}>
                            {treeCount}
                        </span>
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        Showing depth {Math.min(maxDepth, 4)} of {maxDepth} | Nodes split on vehicle features
                    </p>
                    <svg
                        width="100%"
                        height="300"
                        viewBox="0 0 500 300"
                        key={animationKey}
                        style={{ overflow: 'visible' }}
                    >
                        {isTraining ? (
                            <g>
                                <text x="250" y="140" textAnchor="middle" fill={colors.primary} fontSize="14" className="animate-pulse">
                                    Growing tree...
                                </text>
                                <text x="250" y="160" textAnchor="middle" fill={colors.textMuted} fontSize="11" className="animate-pulse">
                                    Training on vehicle data
                                </text>
                            </g>
                        ) : treeData && renderNode(treeData)}
                    </svg>
                </div>
            );
        };

        // Learning Curve Chart - Chart.js Version
        const LearningCurveChart = ({ data, optimalPoint }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.round),
                        datasets: [
                            {
                                label: 'Train Error',
                                data: data.map(d => d.trainError),
                                borderColor: colors.primary,
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.3
                            },
                            {
                                label: 'Validation Error',
                                data: data.map(d => d.validError),
                                borderColor: colors.primary,
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: colors.textMuted, font: { size: 10 } } }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                                ticks: { color: colors.textMuted, font: { size: 10 } }
                            },
                            y: {
                                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                                ticks: {
                                    color: colors.textMuted,
                                    font: { size: 10 },
                                    callback: v => `$${(v/1000).toFixed(0)}k`
                                }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, optimalPoint]);

            return (
                <div style={{
                    background: colors.cardBg,
                    borderRadius: '12px',
                    padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`,
                    height: '100%'
                }}>
                    <h3 style={{
                        fontSize: '1rem',
                        fontWeight: 600,
                        color: colors.text,
                        marginBottom: '0.5rem',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '0.5rem'
                    }}>
                        <span style={{ color: colors.text }}></span>
                        Learning Curve
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        Train vs Validation Error over Boosting Rounds
                    </p>
                    <div style={{ height: '260px' }}>
                        <canvas ref={canvasRef} />
                    </div>
                </div>
            );
        };

        // Feature Importance Chart
        const FeatureImportanceChart = ({ data }) => {
            const sortedData = [...data].sort((a, b) => b.importance - a.importance);
            const maxImportance = Math.max(...sortedData.map(d => d.importance));

            return (
                <div style={{
                    background: colors.cardBg,
                    borderRadius: '12px',
                    padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`
                }}>
                    <h3 style={{
                        fontSize: '1rem',
                        fontWeight: 600,
                        color: colors.text,
                        marginBottom: '0.75rem',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '0.5rem'
                    }}>
                        <span style={{ color: colors.text }}></span>
                        Feature Importance
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                        {sortedData.map((item, index) => {
                            const width = (item.importance / maxImportance) * 100;
                            const barColor = index === 0 ? colors.primary : index === 1 ? colors.lightBlue : colors.darkBlue;
                            return (
                                <div key={item.feature} className="bar-animate" style={{ animationDelay: `${index * 100}ms` }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.25rem' }}>
                                        <span style={{ fontSize: '0.8rem', color: colors.text }}>{item.feature}</span>
                                        <span style={{ fontSize: '0.75rem', color: colors.text }}>{(item.importance * 100).toFixed(1)}%</span>
                                    </div>
                                    <div style={{
                                        height: '16px',
                                        background: 'rgba(39, 116, 174, 0.1)',
                                        borderRadius: '4px',
                                        overflow: 'hidden'
                                    }}>
                                        <div style={{
                                            height: '100%',
                                            width: `${width}%`,
                                            background: `linear-gradient(90deg, ${barColor}, ${barColor}aa)`,
                                            borderRadius: '4px',
                                            transition: 'width 0.5s ease-out'
                                        }} />
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // Hyperparameter Heatmap
        const HyperparameterHeatmap = ({ currentDepth, currentEstimators }) => {
            const depths = [3, 5, 7, 9, 11, 13, 15];
            const estimators = [50, 100, 150, 200, 250, 300];

            const heatmapData = useMemo(() => {
                return depths.map((d) =>
                    estimators.map((e) => {
                        const depthFactor = 1 - Math.abs(d - 7) / 12;
                        const estFactor = 1 - Math.abs(e - 150) / 300;
                        const accuracy = 0.78 + depthFactor * 0.08 + estFactor * 0.08 + (Math.random() * 0.04 - 0.02);
                        return Math.min(Math.max(accuracy, 0.75), 0.95);
                    })
                );
            }, []);

            const getColor = (accuracy) => {
                const normalized = (accuracy - 0.75) / 0.20;
                // Use UCLA Blue gradient
                if (normalized < 0.5) {
                    const r = Math.round(0 + normalized * 2 * 39);
                    const g = Math.round(85 + normalized * 2 * 31);
                    const b = Math.round(135 + normalized * 2 * 39);
                    return `rgb(${r}, ${g}, ${b})`;
                } else {
                    const factor = (normalized - 0.5) * 2;
                    const r = Math.round(39 + factor * 200);
                    const g = Math.round(116 + factor * 93);
                    const b = Math.round(174 - factor * 174);
                    return `rgb(${r}, ${g}, ${b})`;
                }
            };

            return (
                <div style={{
                    background: colors.cardBg,
                    borderRadius: '12px',
                    padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`
                }}>
                    <h3 style={{
                        fontSize: '1rem',
                        fontWeight: 600,
                        color: colors.text,
                        marginBottom: '0.5rem',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '0.5rem'
                    }}>
                        <span style={{ color: colors.text }}></span>
                        Hyperparameter Heatmap
                    </h3>
                    <p style={{ fontSize: '0.7rem', color: colors.textMuted, marginBottom: '0.75rem' }}>
                        Test R2 Score: max_depth vs n_estimators
                    </p>
                    <div style={{ position: 'relative', paddingLeft: '35px' }}>
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: `repeat(${estimators.length}, 1fr)`,
                            gap: '3px',
                            fontSize: '0.65rem'
                        }}>
                            {/* Header row */}
                            {estimators.map(e => (
                                <div key={e} style={{ textAlign: 'center', color: colors.textMuted, padding: '2px', fontSize: '0.6rem' }}>
                                    {e}
                                </div>
                            ))}

                            {/* Data rows */}
                            {heatmapData.map((row, di) => (
                                <React.Fragment key={depths[di]}>
                                    {row.map((accuracy, ei) => {
                                        const isSelected = depths[di] === currentDepth &&
                                                          Math.abs(estimators[ei] - currentEstimators) < 30;
                                        return (
                                            <div
                                                key={`${di}-${ei}`}
                                                style={{
                                                    aspectRatio: '1.2',
                                                    background: getColor(accuracy),
                                                    borderRadius: '3px',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    justifyContent: 'center',
                                                    fontSize: '0.55rem',
                                                    color: accuracy > 0.88 ? colors.background : colors.text,
                                                    fontWeight: accuracy > 0.88 ? 600 : 400,
                                                    border: isSelected ? `2px solid ${colors.primary}` : 'none',
                                                    boxShadow: isSelected ? '0 0 8px rgba(39, 116, 174, 0.3)' : 'none',
                                                    transition: 'all 0.3s ease'
                                                }}
                                                title={`Depth: ${depths[di]}, Trees: ${estimators[ei]}, R2: ${(accuracy * 100).toFixed(1)}%`}
                                            >
                                                {(accuracy * 100).toFixed(0)}
                                            </div>
                                        );
                                    })}
                                </React.Fragment>
                            ))}
                        </div>

                        {/* Y-axis labels */}
                        <div style={{
                            position: 'absolute',
                            left: 0,
                            top: '20px',
                            display: 'flex',
                            flexDirection: 'column',
                            gap: '3px'
                        }}>
                            {depths.map(d => (
                                <div key={d} style={{
                                    height: '20px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    fontSize: '0.6rem',
                                    color: colors.textMuted
                                }}>
                                    {d}
                                </div>
                            ))}
                        </div>

                        {/* Axis label */}
                        <div style={{
                            textAlign: 'center',
                            color: colors.textMuted,
                            fontSize: '0.7rem',
                            marginTop: '0.5rem'
                        }}>
                            n_estimators
                        </div>
                    </div>
                </div>
            );
        };

        // Overfitting Gauge
        const OverfittingGauge = ({ trainError, testError }) => {
            const gap = Math.abs(testError - trainError);
            const normalizedGap = Math.min(gap / 3000, 1);
            const rotation = -90 + normalizedGap * 180;

            const getStatus = () => {
                if (normalizedGap < 0.3) return { text: 'Good Fit', color: colors.text };
                if (normalizedGap < 0.6) return { text: 'Slight Overfit', color: colors.text };
                return { text: 'Overfitting!', color: colors.text };
            };

            const status = getStatus();

            return (
                <div style={{
                    background: colors.cardBg,
                    borderRadius: '12px',
                    padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`,
                    textAlign: 'center'
                }}>
                    <h3 style={{
                        fontSize: '0.9rem',
                        fontWeight: 600,
                        color: colors.text,
                        marginBottom: '0.25rem'
                    }}>
                        Overfit Indicator
                    </h3>
                    <svg width="140" height="90" viewBox="0 0 150 100">
                        {/* Gauge background arc */}
                        <path
                            d="M 20 80 A 55 55 0 0 1 130 80"
                            fill="none"
                            stroke="rgba(39, 116, 174, 0.15)"
                            strokeWidth="14"
                            strokeLinecap="round"
                        />
                        {/* Green zone */}
                        <path
                            d="M 20 80 A 55 55 0 0 1 47 38"
                            fill="none"
                            stroke={colors.positive}
                            strokeWidth="14"
                            strokeLinecap="round"
                            opacity="0.6"
                        />
                        {/* Yellow zone */}
                        <path
                            d="M 52 34 A 55 55 0 0 1 98 34"
                            fill="none"
                            stroke={colors.primary}
                            strokeWidth="14"
                            strokeLinecap="round"
                            opacity="0.6"
                        />
                        {/* Red zone */}
                        <path
                            d="M 103 38 A 55 55 0 0 1 130 80"
                            fill="none"
                            stroke={colors.negative}
                            strokeWidth="14"
                            strokeLinecap="round"
                            opacity="0.6"
                        />
                        {/* Needle */}
                        <g transform={`rotate(${rotation}, 75, 80)`} style={{ transition: 'transform 0.5s ease-out' }}>
                            <line
                                x1="75"
                                y1="80"
                                x2="75"
                                y2="35"
                                stroke={status.color}
                                strokeWidth="3"
                                strokeLinecap="round"
                            />
                            <circle cx="75" cy="80" r="6" fill={status.color} />
                        </g>
                    </svg>
                    <div style={{
                        color: status.color,
                        fontWeight: 600,
                        fontSize: '0.85rem',
                        marginTop: '-5px'
                    }}>
                        {status.text}
                    </div>
                    <div style={{
                        color: colors.textMuted,
                        fontSize: '0.7rem',
                        marginTop: '0.25rem'
                    }}>
                        Train-Test Gap: ${gap.toFixed(0)}
                    </div>
                </div>
            );
        };

        // Metrics Display
        const MetricsDisplay = ({ metrics }) => {
            const metricItems = [
                { label: 'Train MAE', value: `$${metrics.trainMAE?.toFixed(0) || '---'}`, color: colors.text },
                { label: 'Test MAE', value: `$${metrics.testMAE?.toFixed(0) || '---'}`, color: colors.text },
                { label: 'R-squared', value: metrics.r2?.toFixed(4) || '---', color: colors.text },
                { label: 'Num Trees', value: metrics.numTrees || '---', color: colors.text },
                { label: 'Max Depth', value: metrics.maxDepth || '---', color: colors.text },
                { label: 'Overfit Gap', value: `$${metrics.overfitGap?.toFixed(0) || '---'}`, color: metrics.overfitGap > 1500 ? colors.negative : colors.positive }
            ];

            return (
                <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(6, 1fr)',
                    gap: '0.75rem',
                    marginBottom: '1rem'
                }}>
                    {metricItems.map((item, idx) => (
                        <div key={idx} style={{
                            background: colors.cardBg,
                            borderRadius: '10px',
                            padding: '0.75rem',
                            border: `1px solid ${colors.cardBorder}`,
                            textAlign: 'center'
                        }}>
                            <div style={{ fontSize: '1rem', marginBottom: '0.25rem' }}>{item.icon}</div>
                            <div style={{ fontSize: '0.7rem', color: colors.textMuted, marginBottom: '0.25rem' }}>
                                {item.label}
                            </div>
                            <div style={{ fontSize: '1rem', fontWeight: 600, color: item.color }}>
                                {item.value}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // Train Button with Progress Animation
        const TrainButton = ({ onClick, isTraining, progress }) => (
            <button
                onClick={onClick}
                disabled={isTraining}
                style={{
                    width: '100%',
                    padding: '1rem',
                    borderRadius: '10px',
                    border: 'none',
                    cursor: isTraining ? 'not-allowed' : 'pointer',
                    fontWeight: 600,
                    fontSize: '1rem',
                    background: isTraining
                        ? 'rgba(39, 116, 174, 0.2)'
                        : colors.primary,
                    color: isTraining ? colors.lightBlue : colors.text,
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '0.5rem',
                    transition: 'all 0.3s ease',
                    boxShadow: isTraining ? 'none' : '0 4px 15px rgba(39, 116, 174, 0.3)',
                    position: 'relative',
                    overflow: 'hidden'
                }}
            >
                {isTraining ? (
                    <>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            <div style={{
                                width: '20px',
                                height: '20px',
                                border: '3px solid rgba(39, 116, 174, 0.3)',
                                borderTop: `3px solid ${colors.primary}`,
                                borderRadius: '50%'
                            }} className="animate-spin" />
                            Training Model...
                        </div>
                        <div style={{
                            width: '100%',
                            height: '4px',
                            background: 'rgba(39, 116, 174, 0.2)',
                            borderRadius: '2px',
                            marginTop: '0.25rem'
                        }}>
                            <div
                                className="progress-pulse"
                                style={{
                                    width: `${progress}%`,
                                    height: '100%',
                                    background: colors.primary,
                                    borderRadius: '2px',
                                    transition: 'width 0.3s ease'
                                }}
                            />
                        </div>
                    </>
                ) : (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        <span></span>
                        Train Model
                    </div>
                )}
            </button>
        );

        // Simulator Tab
        const SimulatorTab = () => {
            const [modelType, setModelType] = useState('xgboost');
            const [maxDepth, setMaxDepth] = useState(6);
            const [nEstimators, setNEstimators] = useState(100);
            const [learningRate, setLearningRate] = useState(0.1);
            const [minChildWeight, setMinChildWeight] = useState(1);
            const [subsample, setSubsample] = useState(0.8);
            const [isTraining, setIsTraining] = useState(false);
            const [progress, setProgress] = useState(0);
            const [metrics, setMetrics] = useState({});
            const [learningCurveData, setLearningCurveData] = useState([]);
            const [featureImportance, setFeatureImportance] = useState([]);
            const [optimalPoint, setOptimalPoint] = useState(null);

            const generateLearningCurve = useCallback((nEst, lr, depth) => {
                const data = [];
                const baseTrainError = 2500 - depth * 80;
                const baseValidError = 2800 - depth * 50;

                for (let i = 10; i <= nEst; i += Math.max(5, Math.floor(nEst / 30))) {
                    const decay = Math.exp(-lr * i / 25);
                    const trainError = baseTrainError * decay + 400 + Math.random() * 100;
                    const overfit = i > nEst * 0.6 ? (i - nEst * 0.6) * (depth / 10) * 3 : 0;
                    const validError = baseValidError * decay + 600 + Math.random() * 150 + overfit;
                    data.push({ round: i, trainError: Math.max(trainError, 400), validError: Math.max(validError, 500) });
                }
                return data;
            }, []);

            const generateFeatureImportance = useCallback(() => {
                return [
                    { feature: 'Mileage', importance: 0.28 + Math.random() * 0.06 },
                    { feature: 'Year', importance: 0.24 + Math.random() * 0.05 },
                    { feature: 'Engine Size', importance: 0.16 + Math.random() * 0.04 },
                    { feature: 'MPG', importance: 0.12 + Math.random() * 0.03 },
                    { feature: 'Tax', importance: 0.08 + Math.random() * 0.02 },
                    { feature: 'Fuel Type', importance: 0.06 + Math.random() * 0.02 },
                    { feature: 'Transmission', importance: 0.04 + Math.random() * 0.01 }
                ];
            }, []);

            const handleTrain = async () => {
                setIsTraining(true);
                setProgress(0);

                // Simulate training progress
                for (let i = 0; i <= 100; i += 5) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    setProgress(i);
                }

                const depthFactor = maxDepth / 15;
                const lrFactor = learningRate / 0.5;
                const estFactor = nEstimators / 300;

                const baseTrainMAE = 1100;
                const trainMAE = baseTrainMAE + (1 - depthFactor) * 400 - lrFactor * 100 + Math.random() * 150;

                let overfitPenalty;
                if (modelType === 'decision_tree') {
                    overfitPenalty = depthFactor * 1200;
                } else if (modelType === 'random_forest') {
                    overfitPenalty = depthFactor * 400;
                } else {
                    overfitPenalty = depthFactor * 300 + (1 - subsample) * 200 + lrFactor * 150;
                }

                const testMAE = trainMAE + overfitPenalty + Math.random() * 200;

                setMetrics({
                    trainMAE,
                    testMAE,
                    r2: Math.min(0.92, 0.82 + depthFactor * 0.06 + estFactor * 0.04 - overfitPenalty / 5000),
                    numTrees: modelType === 'decision_tree' ? 1 : nEstimators,
                    maxDepth,
                    overfitGap: testMAE - trainMAE
                });

                setLearningCurveData(generateLearningCurve(nEstimators, learningRate, maxDepth));
                setFeatureImportance(generateFeatureImportance());
                setOptimalPoint(Math.floor(nEstimators * (0.6 + Math.random() * 0.15)));

                setIsTraining(false);
            };

            useEffect(() => {
                setLearningCurveData(generateLearningCurve(nEstimators, learningRate, maxDepth));
                setFeatureImportance(generateFeatureImportance());
                setMetrics({
                    trainMAE: 1280,
                    testMAE: 1650,
                    r2: 0.8856,
                    numTrees: nEstimators,
                    maxDepth,
                    overfitGap: 370
                });
                setOptimalPoint(70);
            }, []);

            return (
                <div style={{
                    display: 'grid',
                    gridTemplateColumns: '300px 1fr',
                    gap: '1.25rem',
                    padding: '1.25rem',
                    maxWidth: '1450px',
                    margin: '0 auto'
                }}>
                    {/* Control Panel */}
                    <div style={{
                        background: colors.cardBg,
                        borderRadius: '12px',
                        padding: '1.25rem',
                        border: `1px solid ${colors.cardBorder}`,
                        height: 'fit-content'
                    }}>
                        <h2 style={{
                            fontSize: '1.1rem',
                            fontWeight: 600,
                            color: colors.text,
                            marginBottom: '1.25rem',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.5rem'
                        }}>
                            <span style={{ color: colors.text }}></span>
                            Hyperparameters
                        </h2>

                        <ModelTypeButtons modelType={modelType} setModelType={setModelType} />

                        <Slider
                            label="max_depth"
                            value={maxDepth}
                            onChange={setMaxDepth}
                            min={1}
                            max={15}
                            step={1}
                            description="Maximum tree depth (higher = more complex)"
                        />

                        <Slider
                            label="n_estimators"
                            value={nEstimators}
                            onChange={setNEstimators}
                            min={10}
                            max={300}
                            step={10}
                            disabled={modelType === 'decision_tree'}
                            description="Number of trees in ensemble"
                        />

                        <Slider
                            label="learning_rate"
                            value={learningRate}
                            onChange={setLearningRate}
                            min={0.01}
                            max={0.5}
                            step={0.01}
                            disabled={modelType !== 'xgboost'}
                            description="Step size shrinkage (XGBoost only)"
                        />

                        <Slider
                            label="min_child_weight"
                            value={minChildWeight}
                            onChange={setMinChildWeight}
                            min={1}
                            max={10}
                            step={1}
                            disabled={modelType === 'decision_tree'}
                            description="Minimum sum of instance weight in child"
                        />

                        <Slider
                            label="subsample"
                            value={subsample}
                            onChange={setSubsample}
                            min={0.5}
                            max={1.0}
                            step={0.05}
                            disabled={modelType === 'decision_tree'}
                            description="Fraction of samples per tree"
                        />

                        <div style={{ marginTop: '1.25rem' }}>
                            <TrainButton onClick={handleTrain} isTraining={isTraining} progress={progress} />
                        </div>
                    </div>

                    {/* Visualizations */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                        <MetricsDisplay metrics={metrics} />

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                            <DecisionTreeViz maxDepth={maxDepth} isTraining={isTraining} modelType={modelType} />
                            <LearningCurveChart data={learningCurveData} optimalPoint={optimalPoint} />
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 180px', gap: '1rem' }}>
                            <FeatureImportanceChart data={featureImportance} />
                            <HyperparameterHeatmap currentDepth={maxDepth} currentEstimators={nEstimators} />
                            <OverfittingGauge trainError={metrics.trainMAE || 1280} testError={metrics.testMAE || 1650} />
                        </div>
                    </div>
                </div>
            );
        };


        // Main App Component
        const App = () => {
            return (
                <div style={{ minHeight: '100vh', paddingBottom: '2rem' }}>
                    <Header />
                    <main className="animate-fade-in">
                        <SimulatorTab />
                    </main>
                    {/* Footer */}
                    <div style={{ textAlign: 'center', marginTop: '40px', paddingTop: '20px' }}>
                        <p style={{ color: '#888', fontSize: '0.75rem' }}>
                            MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
