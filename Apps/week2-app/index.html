<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2: Tree Models & XGBoost | UCLA Anderson</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #1f2937; padding: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { margin-bottom: 2rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; align-items: start; }
        .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.25rem; color: #111827; }
        h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #374151; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #4b5563; }
        select, input[type="number"] { width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1.25rem; font-family: inherit; }
        input[type="range"] { width: 100%; margin-bottom: 1.25rem; accent-color: #2563eb; }
        button { background: #2563eb; color: white; padding: 0.8rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { padding: 1rem; background: #f9fafb; border-radius: 8px; border: 1px solid #f3f4f6; text-align: center; }
        .stat-label { font-size: 0.7rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: #111827; margin-top: 0.25rem; }
        .chart-container { position: relative; height: 260px; width: 100%; margin-bottom: 2rem; }
        .help-text { font-size: 0.8rem; color: #6b7280; margin-bottom: 1.5rem; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BoostingChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data) return;
                const ctx = chartRef.current.getContext('2d');
                if (chartInstance.current) chartInstance.current.destroy();

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.tree),
                        datasets: [{
                            label: 'Test MAE ($)',
                            data: data.map(d => d.test_mae),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { 
                            y: { grid: { display: false }, title: { display: true, text: 'Error' } },
                            x: { grid: { display: false }, title: { display: true, text: 'Sequential Trees' } }
                        }
                    }
                });
            }, [data]);

            return <div className="chart-container"><canvas ref={chartRef} /></div>;
        };

        const FeatureImportanceChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data) return;
                const ctx = chartRef.current.getContext('2d');
                if (chartInstance.current) chartInstance.current.destroy();

                const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: sorted.map(d => d[0]),
                        datasets: [{
                            data: sorted.map(d => d[1]),
                            backgroundColor: '#3b82f6',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { grid: { display: false } }, y: { grid: { display: false } } }
                    }
                });
            }, [data]);

            return <div className="chart-container"><canvas ref={chartRef} /></div>;
        };

        const App = () => {
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [params, setParams] = useState({
                model_type: 'xgboost',
                max_depth: 5,
                n_estimators: 50,
                learning_rate: 0.1
            });

            const trainModel = async () => {
                setLoading(true);
                try {
                    const response = await fetch('/train', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(params)
                    });
                    const data = await response.json();
                    setResults(data);
                } catch (err) {
                    alert("Training failed. Please check if the backend is awake.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1 style={{fontSize: '1.5rem', fontWeight: 800, color: '#111827'}}>Range Rover Pricing Lab</h1>
                        <p style={{color: '#6b7280', fontSize: '0.9rem'}}>Machine Learning Strategy: Tree-Based Methods</p>
                    </div>

                    <div className="grid">
                        <div className="card">
                            <h2>Parameters</h2>
                            
                            <label>Model Type</label>
                            <select value={params.model_type} onChange={e => setParams({...params, model_type: e.target.value})}>
                                <option value="decision_tree">Decision Tree</option>
                                <option value="random_forest">Random Forest</option>
                                <option value="xgboost">XGBoost</option>
                            </select>

                            <label>Max Depth: {params.max_depth}</label>
                            <input type="range" min="1" max="15" value={params.max_depth} 
                                onChange={e => setParams({...params, max_depth: parseInt(e.target.value)})} />

                            {params.model_type !== 'decision_tree' && (
                                <>
                                    <label>Number of Trees: {params.n_estimators}</label>
                                    <input type="range" min="10" max="200" step="10" value={params.n_estimators} 
                                        onChange={e => setParams({...params, n_estimators: parseInt(e.target.value)})} />
                                    
                                    <label>Learning Rate</label>
                                    <input type="number" step="0.01" value={params.learning_rate} 
                                        onChange={e => setParams({...params, learning_rate: parseFloat(e.target.value)})} />
                                </>
                            )}

                            <button onClick={trainModel} disabled={loading}>
                                {loading ? 'Computing...' : 'Train Model'}
                            </button>
                        </div>

                        <div className="card">
                            <h2>Performance Results</h2>
                            {results ? (
                                <div>
                                    <div className="stats-grid">
                                        <div className="stat-box">
                                            <div className="stat-label">Prediction Error (MAE)</div>
                                            <div className="stat-val">${results.test_mae.toLocaleString()}</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className="stat-label">Training Error</div>
                                            <div className="stat-val">${results.train_mae.toLocaleString()}</div>
                                        </div>
                                    </div>

                                    <h3>Feature Drivers</h3>
                                    <FeatureImportanceChart data={results.feature_importances} />

                                    {params.model_type === 'xgboost' && results.boosting_residuals && (
                                        <div style={{marginTop: '2rem', borderTop: '1px solid #eee', paddingTop: '1.5rem'}}>
                                            <h3>Boosting Path</h3>
                                            <p className="help-text">This shows how the model corrects its own errors tree-by-tree.</p>
                                            <BoostingChart data={results.boosting_residuals} />
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div style={{height: '400px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#9ca3af', textAlign: 'center'}}>
                                    <p>Ready to analyze the Range Rover dataset.</p>
                                    <p style={{fontSize: '0.8rem'}}>Select a model and click Train.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
