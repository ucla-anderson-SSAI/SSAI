<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2: Tree Models & XGBoost | UCLA Anderson MGMT298D</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #ffffff; }
        ::-webkit-scrollbar-thumb { background: #2774AE; border-radius: 4px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes nodeAppear {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes lineGrow {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes progressPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 116, 174, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(39, 116, 174, 0); }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-pulse { animation: pulse 2s infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .tree-node { animation: nodeAppear 0.5s ease-out forwards; }
        .tree-line { stroke-dasharray: 100; animation: lineGrow 0.6s ease-out forwards; }
        .bar-animate { animation: slideIn 0.5s ease-out forwards; }
        .progress-pulse { animation: progressPulse 1.5s infinite; }

        .header-gold-line {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 4px; background: #FFD100;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const API_BASE = window.location.origin;

        const colors = {
            primary: '#2774AE',
            primaryLight: '#2774AE',
            accent: '#FFD100',
            accentDark: '#e6bc00',
            darkBlue: '#005587',
            lightBlue: '#8BB8E8',
            positive: '#1a1a1a',
            negative: '#1a1a1a',
            warning: '#1a1a1a',
            cardBg: '#ffffff',
            cardBorder: 'rgba(0,0,0,0.1)',
            text: '#1a1a1a',
            textMuted: '#666666',
            // Chart colors
            trainLine: '#2774AE',
            testLine: '#E8600F',
        };

        // ──────────── Header ────────────
        const Header = () => (
            <header style={{
                background: '#2774AE',
                padding: '1rem 2rem 1.5rem 2rem',
                position: 'sticky',
                top: 0,
                zIndex: 100
            }}>
                <div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                        <p style={{ fontSize: '0.65rem', color: '#FFD100', fontWeight: 400, marginBottom: '0.25rem', textTransform: 'uppercase', letterSpacing: '0.2em' }}>
                            MGMT298D: Science and Strategy of AI
                        </p>
                        <h1 style={{ fontSize: '1.4rem', fontWeight: 600, color: '#f5f5f5' }}>
                            Week 2: Tree Models & XGBoost
                        </h1>
                        <p style={{ fontSize: '0.85rem', color: '#c0c0c0', marginTop: '0.25rem' }}>
                            Range Rover Pricing Prediction
                        </p>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                        <span style={{ fontSize: '1rem', fontWeight: 500, color: '#f5f5f5' }}>
                            UCLA Anderson
                        </span>
                    </div>
                </div>
                <div className="header-gold-line"></div>
            </header>
        );

        // ──────────── Slider ────────────
        const Slider = ({ label, value, onChange, min, max, step, disabled, description }) => (
            <div style={{ marginBottom: '1.25rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                    <label style={{ fontSize: '0.875rem', color: colors.text, fontWeight: 500 }}>{label}</label>
                    <span style={{
                        fontSize: '0.875rem', fontWeight: 600, color: colors.text,
                        background: 'rgba(39, 116, 174, 0.2)',
                        padding: '0.125rem 0.5rem', borderRadius: '4px'
                    }}>
                        {typeof value === 'number' && value % 1 !== 0 ? value.toFixed(2) : value}
                    </span>
                </div>
                <input
                    type="range" min={min} max={max} step={step} value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value))}
                    disabled={disabled}
                    style={{
                        width: '100%', height: '6px', borderRadius: '3px',
                        background: `linear-gradient(to right, ${colors.primary} 0%, ${colors.primary} ${((value - min) / (max - min)) * 100}%, rgba(39, 116, 174, 0.2) ${((value - min) / (max - min)) * 100}%, rgba(39, 116, 174, 0.2) 100%)`,
                        appearance: 'none',
                        cursor: disabled ? 'not-allowed' : 'pointer',
                        opacity: disabled ? 0.4 : 1
                    }}
                />
                {description && (
                    <p style={{ fontSize: '0.7rem', color: colors.textMuted, marginTop: '0.25rem' }}>{description}</p>
                )}
            </div>
        );

        // ──────────── Model Type Buttons ────────────
        const ModelTypeButtons = ({ modelType, setModelType }) => {
            const models = [
                { id: 'decision_tree', label: 'Decision Tree' },
                { id: 'random_forest', label: 'Random Forest' },
                { id: 'xgboost', label: 'XGBoost' }
            ];
            return (
                <div style={{ marginBottom: '1.5rem' }}>
                    <label style={{ fontSize: '0.875rem', color: colors.text, display: 'block', marginBottom: '0.75rem', fontWeight: 500 }}>
                        Model Type
                    </label>
                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                        {models.map(model => (
                            <button key={model.id} onClick={() => setModelType(model.id)} style={{
                                flex: 1, padding: '0.75rem 0.5rem', borderRadius: '8px',
                                border: modelType === model.id ? `2px solid ${colors.primary}` : `1px solid ${colors.cardBorder}`,
                                cursor: 'pointer', fontWeight: 500, fontSize: '0.8rem',
                                transition: 'all 0.2s ease',
                                background: modelType === model.id ? 'rgba(39, 116, 174, 0.2)' : colors.cardBg,
                                color: modelType === model.id ? colors.primary : colors.text
                            }}>
                                {model.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // ──────────── Train Button ────────────
        const TrainButton = ({ onClick, isTraining, progress }) => (
            <button onClick={onClick} disabled={isTraining} style={{
                width: '100%', padding: '1rem', borderRadius: '10px', border: 'none',
                cursor: isTraining ? 'not-allowed' : 'pointer',
                fontWeight: 600, fontSize: '1rem',
                background: isTraining ? 'rgba(39, 116, 174, 0.2)' : colors.primary,
                color: isTraining ? colors.lightBlue : '#ffffff',
                display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                gap: '0.5rem', transition: 'all 0.3s ease',
                boxShadow: isTraining ? 'none' : '0 4px 15px rgba(39, 116, 174, 0.3)',
                position: 'relative', overflow: 'hidden'
            }}>
                {isTraining ? (
                    <>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            <div style={{
                                width: '20px', height: '20px',
                                border: '3px solid rgba(39, 116, 174, 0.3)',
                                borderTop: `3px solid ${colors.primary}`,
                                borderRadius: '50%'
                            }} className="animate-spin" />
                            Training Model...
                        </div>
                        <div style={{ width: '100%', height: '4px', background: 'rgba(39, 116, 174, 0.2)', borderRadius: '2px', marginTop: '0.25rem' }}>
                            <div className="progress-pulse" style={{
                                width: `${progress}%`, height: '100%',
                                background: colors.primary, borderRadius: '2px',
                                transition: 'width 0.3s ease'
                            }} />
                        </div>
                    </>
                ) : (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        Train Model
                    </div>
                )}
            </button>
        );

        // ──────────── Metrics Display ────────────
        const MetricsDisplay = ({ metrics }) => {
            const metricItems = [
                { label: 'Train MAE', value: metrics.train_mae != null ? `$${metrics.train_mae.toLocaleString()}` : '---' },
                { label: 'Test MAE', value: metrics.test_mae != null ? `$${metrics.test_mae.toLocaleString()}` : '---' },
                { label: 'Train R²', value: metrics.train_r2 != null ? metrics.train_r2.toFixed(4) : '---' },
                { label: 'Test R²', value: metrics.test_r2 != null ? metrics.test_r2.toFixed(4) : '---' },
                { label: 'Train Size', value: metrics.n_train || '---' },
                { label: 'Test Size', value: metrics.n_test || '---' },
            ];
            return (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: '0.75rem' }}>
                    {metricItems.map((item, idx) => (
                        <div key={idx} style={{
                            background: colors.cardBg, borderRadius: '10px', padding: '0.75rem',
                            border: `1px solid ${colors.cardBorder}`, textAlign: 'center'
                        }}>
                            <div style={{ fontSize: '0.7rem', color: colors.textMuted, marginBottom: '0.25rem' }}>{item.label}</div>
                            <div style={{ fontSize: '1rem', fontWeight: 600, color: colors.text }}>{item.value}</div>
                        </div>
                    ))}
                </div>
            );
        };

        // ──────────── Decision Tree Visualization ────────────
        const DecisionTreeViz = ({ treeData, maxDepth }) => {
            const [animationKey, setAnimationKey] = useState(0);

            useEffect(() => {
                setAnimationKey(prev => prev + 1);
            }, [treeData]);

            const featureDisplayNames = {
                'year': 'Year', 'mileage': 'Mileage', 'trim_enc': 'Trim',
                'state_enc': 'State', 'color_enc': 'Color', 'interior_enc': 'Interior'
            };

            const layoutTree = (node, x, y, width, depth = 0) => {
                if (!node) return null;
                const positioned = { ...node, x, y, layoutDepth: depth };
                if (!node.is_leaf && node.left && node.right) {
                    const childWidth = width / 2;
                    const childY = y + 80;
                    positioned.left = layoutTree(node.left, x - childWidth / 2, childY, childWidth, depth + 1);
                    positioned.right = layoutTree(node.right, x + childWidth / 2, childY, childWidth, depth + 1);
                }
                return positioned;
            };

            const renderNode = (node, delay = 0) => {
                if (!node) return null;
                const nodeColor = node.is_leaf ? colors.lightBlue : colors.primary;
                const displayFeature = featureDisplayNames[node.feature] || node.feature;

                let thresholdDisplay = '';
                if (!node.is_leaf && node.threshold != null) {
                    if (node.feature === 'mileage') {
                        thresholdDisplay = `< ${(node.threshold / 1000).toFixed(0)}K mi`;
                    } else if (node.feature === 'year') {
                        thresholdDisplay = `< ${node.threshold.toFixed(0)}`;
                    } else {
                        thresholdDisplay = `< ${node.threshold.toFixed(1)}`;
                    }
                }

                return (
                    <g key={`node-${node.id}`}>
                        {node.left && (
                            <line x1={node.x} y1={node.y + 22} x2={node.left.x} y2={node.left.y - 22}
                                stroke={colors.primary} strokeWidth="2" opacity="0.5" className="tree-line"
                                style={{ animationDelay: `${delay + 100}ms` }} />
                        )}
                        {node.right && (
                            <line x1={node.x} y1={node.y + 22} x2={node.right.x} y2={node.right.y - 22}
                                stroke={colors.primary} strokeWidth="2" opacity="0.5" className="tree-line"
                                style={{ animationDelay: `${delay + 100}ms` }} />
                        )}
                        {node.left && node.layoutDepth < 2 && (
                            <text x={(node.x + node.left.x) / 2 - 15} y={(node.y + node.left.y) / 2}
                                fill={colors.textMuted} fontSize="9" fontWeight="500">Yes</text>
                        )}
                        {node.right && node.layoutDepth < 2 && (
                            <text x={(node.x + node.right.x) / 2 + 5} y={(node.y + node.right.y) / 2}
                                fill={colors.textMuted} fontSize="9" fontWeight="500">No</text>
                        )}
                        <g className="tree-node" style={{ animationDelay: `${delay}ms` }}>
                            <rect x={node.x - 48} y={node.y - 22} width="96" height="44" rx="6"
                                fill={colors.cardBg} stroke={nodeColor} strokeWidth="2" />
                            {node.is_leaf ? (
                                <>
                                    <text x={node.x} y={node.y - 4} textAnchor="middle" fill={colors.textMuted} fontSize="8">Predict</text>
                                    <text x={node.x} y={node.y + 12} textAnchor="middle" fill={colors.text} fontSize="11" fontWeight="600">
                                        ${Math.round(node.value).toLocaleString()}
                                    </text>
                                </>
                            ) : (
                                <>
                                    <text x={node.x} y={node.y - 4} textAnchor="middle" fill={colors.text} fontSize="10" fontWeight="600">
                                        {displayFeature}
                                    </text>
                                    <text x={node.x} y={node.y + 12} textAnchor="middle" fill={colors.primary} fontSize="9">
                                        {thresholdDisplay}
                                    </text>
                                </>
                            )}
                        </g>
                        {renderNode(node.left, delay + 150)}
                        {renderNode(node.right, delay + 150)}
                    </g>
                );
            };

            const positionedTree = treeData ? layoutTree(treeData, 400, 40, 700) : null;

            return (
                <div style={{
                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`
                }}>
                    <h3 style={{ fontSize: '1rem', fontWeight: 600, color: colors.text, marginBottom: '0.25rem' }}>
                        Decision Tree Structure
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        Showing up to depth 4 of {maxDepth} · Nodes split on Range Rover features
                    </p>
                    <svg width="100%" height="380" viewBox="0 0 800 380" key={animationKey} style={{ overflow: 'visible' }}>
                        {positionedTree ? renderNode(positionedTree) : (
                            <text x="400" y="190" textAnchor="middle" fill={colors.textMuted} fontSize="14">
                                Click "Train Model" to see tree structure
                            </text>
                        )}
                    </svg>
                </div>
            );
        };

        // ──────────── Random Forest Visualization ────────────
        const RandomForestViz = ({ treeData, nEstimators, maxFeatures }) => {
            const numTreesShown = Math.min(nEstimators, 7);
            const treeWidth = 90;
            const treeGap = 12;
            const totalWidth = numTreesShown * treeWidth + (numTreesShown - 1) * treeGap;
            const startX = (800 - totalWidth) / 2;

            // Mini tree renderer
            const renderMiniTree = (xOffset, yOffset, idx, isHighlighted) => {
                const color = isHighlighted ? colors.primary : colors.lightBlue;
                const opacity = isHighlighted ? 1 : 0.65;
                return (
                    <g key={idx} style={{ opacity }} className="tree-node" >
                        {/* Trunk */}
                        <rect x={xOffset + 35} y={yOffset + 60} width="20" height="25" rx="3" fill="#8B6914" opacity="0.6" />
                        {/* Canopy layers */}
                        <ellipse cx={xOffset + 45} cy={yOffset + 42} rx="35" ry="22" fill={color} opacity="0.3" />
                        <ellipse cx={xOffset + 45} cy={yOffset + 30} rx="28" ry="18" fill={color} opacity="0.5" />
                        <ellipse cx={xOffset + 45} cy={yOffset + 20} rx="20" ry="14" fill={color} opacity="0.7" />
                        {/* Label */}
                        <text x={xOffset + 45} y={yOffset + 100} textAnchor="middle" fill={colors.textMuted} fontSize="9">
                            Tree {idx + 1}
                        </text>
                    </g>
                );
            };

            const featureLabels = ['Year', 'Mileage', 'Trim', 'State', 'Color'];
            const maxFeatNum = maxFeatures ? Math.round(maxFeatures * 5) : 5;

            return (
                <div style={{
                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`
                }}>
                    <h3 style={{ fontSize: '1rem', fontWeight: 600, color: colors.text, marginBottom: '0.25rem' }}>
                        Random Forest — Bagging Ensemble
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        {nEstimators} independent trees, each trained on a bootstrap sample · {maxFeatNum} of {featureLabels.length} features per split · Predictions averaged
                    </p>
                    <svg width="100%" height="320" viewBox="0 0 800 320">
                        {/* Data label */}
                        <rect x="300" y="5" width="200" height="28" rx="6" fill="rgba(39,116,174,0.1)" stroke={colors.primary} strokeWidth="1.5" />
                        <text x="400" y="24" textAnchor="middle" fill={colors.primary} fontSize="12" fontWeight="600">Training Data (Bootstrap Samples)</text>

                        {/* Arrows from data to trees */}
                        {Array.from({ length: numTreesShown }).map((_, i) => {
                            const treeX = startX + i * (treeWidth + treeGap) + 45;
                            return (
                                <line key={`arrow-${i}`} x1="400" y1="33" x2={treeX} y2="70"
                                    stroke={colors.primary} strokeWidth="1" opacity="0.3"
                                    strokeDasharray="4,3" />
                            );
                        })}

                        {/* Trees */}
                        {Array.from({ length: numTreesShown }).map((_, i) => (
                            renderMiniTree(startX + i * (treeWidth + treeGap), 65, i, i === 0)
                        ))}

                        {nEstimators > 7 && (
                            <text x="400" y="185" textAnchor="middle" fill={colors.textMuted} fontSize="11">
                                ... + {nEstimators - 7} more trees
                            </text>
                        )}

                        {/* Arrows from trees to average */}
                        {Array.from({ length: numTreesShown }).map((_, i) => {
                            const treeX = startX + i * (treeWidth + treeGap) + 45;
                            return (
                                <line key={`arrow2-${i}`} x1={treeX} y1="200" x2="400" y2="240"
                                    stroke={colors.testLine} strokeWidth="1" opacity="0.3"
                                    strokeDasharray="4,3" />
                            );
                        })}

                        {/* Average box */}
                        <rect x="300" y="240" width="200" height="32" rx="6" fill="rgba(232,96,15,0.1)" stroke={colors.testLine} strokeWidth="1.5" />
                        <text x="400" y="260" textAnchor="middle" fill={colors.testLine} fontSize="12" fontWeight="600">Average Predictions</text>

                        {/* Feature subset note */}
                        <rect x="580" y="100" width="180" height="60" rx="8" fill="rgba(39,116,174,0.05)" stroke={colors.cardBorder} strokeWidth="1" />
                        <text x="670" y="120" textAnchor="middle" fill={colors.text} fontSize="10" fontWeight="600">Feature Subsampling</text>
                        <text x="670" y="138" textAnchor="middle" fill={colors.textMuted} fontSize="9">Each split considers</text>
                        <text x="670" y="152" textAnchor="middle" fill={colors.primary} fontSize="10" fontWeight="600">{maxFeatNum} of {featureLabels.length} features</text>

                        {/* Variance reduction note */}
                        <rect x="30" y="100" width="170" height="60" rx="8" fill="rgba(39,116,174,0.05)" stroke={colors.cardBorder} strokeWidth="1" />
                        <text x="115" y="120" textAnchor="middle" fill={colors.text} fontSize="10" fontWeight="600">Why It Works</text>
                        <text x="115" y="138" textAnchor="middle" fill={colors.textMuted} fontSize="9">Averaging reduces variance</text>
                        <text x="115" y="152" textAnchor="middle" fill={colors.textMuted} fontSize="9">without increasing bias</text>
                    </svg>
                </div>
            );
        };

        // ──────────── XGBoost Visualization ────────────
        const XGBoostViz = ({ nEstimators, learningRate }) => {
            const numSteps = Math.min(nEstimators, 5);

            return (
                <div style={{
                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`
                }}>
                    <h3 style={{ fontSize: '1rem', fontWeight: 600, color: colors.text, marginBottom: '0.25rem' }}>
                        XGBoost — Sequential Boosting
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        {nEstimators} trees added sequentially · Each tree corrects errors of prior trees · Learning rate η = {learningRate}
                    </p>
                    <svg width="100%" height="320" viewBox="0 0 800 320">
                        {/* Initial prediction */}
                        <rect x="20" y="30" width="110" height="44" rx="8" fill="rgba(39,116,174,0.1)" stroke={colors.primary} strokeWidth="1.5" />
                        <text x="75" y="48" textAnchor="middle" fill={colors.textMuted} fontSize="9">Initial Prediction</text>
                        <text x="75" y="64" textAnchor="middle" fill={colors.primary} fontSize="12" fontWeight="600">ŷ₀ = mean(y)</text>

                        {/* Sequential trees */}
                        {Array.from({ length: numSteps }).map((_, i) => {
                            const xPos = 170 + i * 125;
                            const residualShrink = Math.pow(1 - learningRate, i);
                            const barH = Math.max(10, 40 * residualShrink);

                            return (
                                <g key={i} className="tree-node" style={{ animationDelay: `${i * 200}ms` }}>
                                    {/* Arrow from previous */}
                                    <line x1={xPos - 30} y1="52" x2={xPos} y2="52"
                                        stroke={colors.primary} strokeWidth="1.5" markerEnd="url(#arrowhead)" />

                                    {/* Tree box */}
                                    <rect x={xPos} y="25" width="90" height="54" rx="8"
                                        fill={i === 0 ? 'rgba(39,116,174,0.15)' : 'rgba(39,116,174,0.08)'}
                                        stroke={colors.primary} strokeWidth="1" />
                                    <text x={xPos + 45} y="44" textAnchor="middle" fill={colors.text} fontSize="10" fontWeight="600">
                                        Tree {i + 1}
                                    </text>
                                    <text x={xPos + 45} y="58" textAnchor="middle" fill={colors.textMuted} fontSize="8">
                                        fits residuals
                                    </text>
                                    <text x={xPos + 45} y="72" textAnchor="middle" fill={colors.primary} fontSize="8">
                                        × η = {learningRate}
                                    </text>

                                    {/* Residual bars below */}
                                    <text x={xPos + 45} y="110" textAnchor="middle" fill={colors.textMuted} fontSize="8">Residual magnitude</text>
                                    <rect x={xPos + 15} y={125 - barH/2 + 20} width="60" height={barH} rx="3"
                                        fill={colors.testLine} opacity={0.3 + 0.5 * residualShrink} />
                                </g>
                            );
                        })}

                        {nEstimators > 5 && (
                            <text x={170 + 5 * 125 + 10} y="55" fill={colors.textMuted} fontSize="12">
                                ... +{nEstimators - 5} more
                            </text>
                        )}

                        {/* Arrow marker definition */}
                        <defs>
                            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                                <polygon points="0 0, 8 3, 0 6" fill={colors.primary} />
                            </marker>
                        </defs>

                        {/* Formula at bottom */}
                        <rect x="150" y="200" width="500" height="50" rx="8" fill="rgba(39,116,174,0.05)" stroke={colors.cardBorder} strokeWidth="1" />
                        <text x="400" y="222" textAnchor="middle" fill={colors.text} fontSize="11" fontWeight="600">
                            Final prediction: ŷ = ŷ₀ + η·Tree₁(x) + η·Tree₂(x) + ... + η·Tree_n(x)
                        </text>
                        <text x="400" y="240" textAnchor="middle" fill={colors.textMuted} fontSize="9">
                            Each tree is small (weak learner) · Together they form a strong learner
                        </text>

                        {/* Key insight */}
                        <rect x="150" y="265" width="500" height="40" rx="8" fill="rgba(232,96,15,0.06)" stroke={colors.testLine} strokeWidth="1" strokeDasharray="4,3" />
                        <text x="400" y="285" textAnchor="middle" fill={colors.testLine} fontSize="10" fontWeight="500">
                            Lower learning rate → more trees needed → often better generalization (but slower training)
                        </text>
                    </svg>
                </div>
            );
        };

        // ──────────── Learning Curve Chart ────────────
        const LearningCurveChart = ({ data, xKey, xLabel, title }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d[xKey]),
                        datasets: [
                            {
                                label: 'Train MAE',
                                data: data.map(d => d.train_mae),
                                borderColor: colors.trainLine,
                                backgroundColor: 'rgba(39, 116, 174, 0.1)',
                                borderWidth: 2.5,
                                pointRadius: 3,
                                pointBackgroundColor: colors.trainLine,
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'Test MAE',
                                data: data.map(d => d.test_mae),
                                borderColor: colors.testLine,
                                backgroundColor: 'rgba(232, 96, 15, 0.1)',
                                borderWidth: 2.5,
                                pointRadius: 3,
                                pointBackgroundColor: colors.testLine,
                                tension: 0.3,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: colors.text,
                                    font: { size: 11, weight: '500' },
                                    usePointStyle: true,
                                    pointStyle: 'circle',
                                    padding: 20
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => `${ctx.dataset.label}: $${ctx.parsed.y.toLocaleString()}`
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: xLabel,
                                    color: colors.text,
                                    font: { size: 12, weight: '600' }
                                },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                                ticks: { color: colors.textMuted, font: { size: 10 } }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Mean Absolute Error ($)',
                                    color: colors.text,
                                    font: { size: 12, weight: '600' }
                                },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                                ticks: {
                                    color: colors.textMuted,
                                    font: { size: 10 },
                                    callback: v => `$${(v / 1000).toFixed(1)}k`
                                }
                            }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, xKey, xLabel]);

            return (
                <div style={{
                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`, flex: 1
                }}>
                    <h3 style={{ fontSize: '1rem', fontWeight: 600, color: colors.text, marginBottom: '0.25rem' }}>
                        {title || 'Learning Curve'}
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        Train vs Test error — the gap indicates overfitting
                    </p>
                    <div style={{ height: '280px' }}>
                        <canvas ref={canvasRef} />
                    </div>
                </div>
            );
        };

        // ──────────── Scatter Plot (Predicted vs Actual) ────────────
        const ScatterPlot = ({ predictions, actuals }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !predictions || predictions.length === 0) return;
                if (chartRef.current) chartRef.current.destroy();

                const scatterData = predictions.map((p, i) => ({ x: actuals[i], y: p }));
                const allVals = [...predictions, ...actuals];
                const minVal = Math.min(...allVals) * 0.9;
                const maxVal = Math.max(...allVals) * 1.1;

                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            {
                                label: 'Predictions',
                                data: scatterData,
                                backgroundColor: 'rgba(39, 116, 174, 0.4)',
                                borderColor: colors.primary,
                                borderWidth: 1,
                                pointRadius: 4,
                                pointHoverRadius: 6
                            },
                            {
                                label: 'Perfect Prediction',
                                data: [{ x: minVal, y: minVal }, { x: maxVal, y: maxVal }],
                                type: 'line',
                                borderColor: colors.testLine,
                                borderWidth: 2,
                                borderDash: [6, 4],
                                pointRadius: 0,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: colors.text,
                                    font: { size: 11, weight: '500' },
                                    usePointStyle: true,
                                    padding: 20
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        if (ctx.datasetIndex === 0) {
                                            return `Actual: $${ctx.parsed.x.toLocaleString()} | Predicted: $${ctx.parsed.y.toLocaleString()}`;
                                        }
                                        return '';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Actual Price ($)',
                                    color: colors.text,
                                    font: { size: 12, weight: '600' }
                                },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                                ticks: {
                                    color: colors.textMuted, font: { size: 10 },
                                    callback: v => `$${(v / 1000).toFixed(0)}k`
                                },
                                min: minVal,
                                max: maxVal
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Predicted Price ($)',
                                    color: colors.text,
                                    font: { size: 12, weight: '600' }
                                },
                                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                                ticks: {
                                    color: colors.textMuted, font: { size: 10 },
                                    callback: v => `$${(v / 1000).toFixed(0)}k`
                                },
                                min: minVal,
                                max: maxVal
                            }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [predictions, actuals]);

            return (
                <div style={{
                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`, flex: 1
                }}>
                    <h3 style={{ fontSize: '1rem', fontWeight: 600, color: colors.text, marginBottom: '0.25rem' }}>
                        Predicted vs Actual
                    </h3>
                    <p style={{ fontSize: '0.75rem', color: colors.textMuted, marginBottom: '0.5rem' }}>
                        Points closer to the dashed line = better predictions
                    </p>
                    <div style={{ height: '280px' }}>
                        <canvas ref={canvasRef} />
                    </div>
                </div>
            );
        };

        // ──────────── Feature Importance ────────────
        const FeatureImportanceChart = ({ data }) => {
            if (!data || Object.keys(data).length === 0) return null;

            const featureDisplayNames = {
                'year': 'Year', 'mileage': 'Mileage', 'trim_enc': 'Trim',
                'state_enc': 'State', 'color_enc': 'Color', 'interior_enc': 'Interior'
            };

            const sortedData = Object.entries(data)
                .map(([k, v]) => ({ feature: featureDisplayNames[k] || k, importance: v }))
                .sort((a, b) => b.importance - a.importance);
            const maxImportance = Math.max(...sortedData.map(d => d.importance));

            return (
                <div style={{
                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                    border: `1px solid ${colors.cardBorder}`
                }}>
                    <h3 style={{ fontSize: '1rem', fontWeight: 600, color: colors.text, marginBottom: '0.75rem' }}>
                        Feature Importance
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                        {sortedData.map((item, index) => {
                            const width = (item.importance / maxImportance) * 100;
                            const barColor = index === 0 ? colors.primary : index === 1 ? colors.lightBlue : colors.darkBlue;
                            return (
                                <div key={item.feature} className="bar-animate" style={{ animationDelay: `${index * 100}ms` }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.25rem' }}>
                                        <span style={{ fontSize: '0.8rem', color: colors.text }}>{item.feature}</span>
                                        <span style={{ fontSize: '0.75rem', color: colors.text }}>{(item.importance * 100).toFixed(1)}%</span>
                                    </div>
                                    <div style={{ height: '16px', background: 'rgba(39, 116, 174, 0.1)', borderRadius: '4px', overflow: 'hidden' }}>
                                        <div style={{
                                            height: '100%', width: `${width}%`,
                                            background: `linear-gradient(90deg, ${barColor}, ${barColor}aa)`,
                                            borderRadius: '4px', transition: 'width 0.5s ease-out'
                                        }} />
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ──────────── Main Simulator ────────────
        const SimulatorTab = () => {
            const [modelType, setModelType] = useState('decision_tree');
            const [maxDepth, setMaxDepth] = useState(6);
            const [nEstimators, setNEstimators] = useState(100);
            const [learningRate, setLearningRate] = useState(0.1);
            const [minChildWeight, setMinChildWeight] = useState(1);
            const [subsample, setSubsample] = useState(0.8);
            const [maxFeatures, setMaxFeatures] = useState(1.0);
            const [isTraining, setIsTraining] = useState(false);
            const [progress, setProgress] = useState(0);
            const [results, setResults] = useState(null);

            const handleTrain = async () => {
                setIsTraining(true);
                setProgress(10);

                try {
                    const body = {
                        model_type: modelType,
                        max_depth: maxDepth,
                        n_estimators: nEstimators,
                        learning_rate: learningRate,
                        min_child_weight: minChildWeight,
                        subsample: subsample,
                        max_features: maxFeatures
                    };

                    setProgress(30);

                    const response = await fetch(`${API_BASE}/train`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    setProgress(80);
                    const data = await response.json();
                    setProgress(100);
                    setResults(data);
                } catch (err) {
                    console.error('Training failed:', err);
                    alert('Training failed. Is the backend running?');
                }

                setIsTraining(false);
            };

            const metrics = results ? {
                train_mae: results.train_mae,
                test_mae: results.test_mae,
                train_r2: results.train_r2,
                test_r2: results.test_r2,
                n_train: results.n_train,
                n_test: results.n_test
            } : { train_mae: null, test_mae: null, train_r2: null, test_r2: null, n_train: null, n_test: null };

            // Determine learning curve data
            let curveData = null;
            let curveXKey = 'n_estimators';
            let curveXLabel = 'Number of Trees (n_estimators)';
            let curveTitle = 'Learning Curve';

            if (results) {
                if (results.depth_curve) {
                    curveData = results.depth_curve;
                    curveXKey = 'depth';
                    curveXLabel = 'Tree Depth (max_depth)';
                    curveTitle = 'Error vs Tree Depth';
                } else if (results.learning_curve) {
                    curveData = results.learning_curve;
                    curveXKey = 'n_estimators';
                    curveXLabel = 'Number of Trees (n_estimators)';
                    curveTitle = modelType === 'xgboost' ? 'Error vs Boosting Rounds' : 'Error vs Number of Trees';
                }
            }

            return (
                <div style={{
                    display: 'grid',
                    gridTemplateColumns: '300px 1fr',
                    gap: '1.25rem',
                    padding: '1.25rem',
                    maxWidth: '1450px',
                    margin: '0 auto'
                }}>
                    {/* Control Panel */}
                    <div style={{
                        background: colors.cardBg, borderRadius: '12px', padding: '1.25rem',
                        border: `1px solid ${colors.cardBorder}`, height: 'fit-content'
                    }}>
                        <h2 style={{ fontSize: '1.1rem', fontWeight: 600, color: colors.text, marginBottom: '1.25rem' }}>
                            Hyperparameters
                        </h2>

                        <ModelTypeButtons modelType={modelType} setModelType={setModelType} />

                        <Slider label="max_depth" value={maxDepth} onChange={setMaxDepth}
                            min={1} max={20} step={1}
                            description="Maximum tree depth (higher = more complex)" />

                        <Slider label="n_estimators" value={nEstimators} onChange={setNEstimators}
                            min={10} max={300} step={10}
                            disabled={modelType === 'decision_tree'}
                            description="Number of trees in ensemble" />

                        <Slider label="learning_rate" value={learningRate} onChange={setLearningRate}
                            min={0.01} max={0.5} step={0.01}
                            disabled={modelType !== 'xgboost'}
                            description="Step size shrinkage (XGBoost only)" />

                        <Slider label="max_features" value={maxFeatures} onChange={setMaxFeatures}
                            min={0.2} max={1.0} step={0.1}
                            disabled={modelType !== 'random_forest'}
                            description="Fraction of features per split (RF only)" />

                        <Slider label="subsample" value={subsample} onChange={setSubsample}
                            min={0.5} max={1.0} step={0.05}
                            disabled={modelType !== 'xgboost'}
                            description="Fraction of samples per tree (XGBoost only)" />

                        <Slider label="min_child_weight" value={minChildWeight} onChange={setMinChildWeight}
                            min={1} max={10} step={1}
                            disabled={modelType === 'decision_tree'}
                            description="Minimum samples in child node" />

                        <div style={{ marginTop: '1.25rem' }}>
                            <TrainButton onClick={handleTrain} isTraining={isTraining} progress={progress} />
                        </div>
                    </div>

                    {/* Visualizations */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                        {/* Metrics */}
                        <MetricsDisplay metrics={metrics} />

                        {/* Model Visualization — full width */}
                        {modelType === 'decision_tree' && (
                            <DecisionTreeViz treeData={results?.tree_structure} maxDepth={maxDepth} />
                        )}
                        {modelType === 'random_forest' && (
                            <RandomForestViz treeData={results?.tree_structure} nEstimators={nEstimators} maxFeatures={maxFeatures} />
                        )}
                        {modelType === 'xgboost' && (
                            <XGBoostViz nEstimators={nEstimators} learningRate={learningRate} />
                        )}

                        {/* Bottom row: Learning Curve + Scatter + Feature Importance */}
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                            {curveData ? (
                                <LearningCurveChart data={curveData} xKey={curveXKey} xLabel={curveXLabel} title={curveTitle} />
                            ) : (
                                <div style={{
                                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                                    border: `1px solid ${colors.cardBorder}`, display: 'flex',
                                    alignItems: 'center', justifyContent: 'center', minHeight: '300px'
                                }}>
                                    <p style={{ color: colors.textMuted, fontSize: '0.9rem' }}>Train a model to see the learning curve</p>
                                </div>
                            )}

                            {results?.predictions ? (
                                <ScatterPlot predictions={results.predictions} actuals={results.actuals} />
                            ) : (
                                <div style={{
                                    background: colors.cardBg, borderRadius: '12px', padding: '1rem',
                                    border: `1px solid ${colors.cardBorder}`, display: 'flex',
                                    alignItems: 'center', justifyContent: 'center', minHeight: '300px'
                                }}>
                                    <p style={{ color: colors.textMuted, fontSize: '0.9rem' }}>Train a model to see predictions</p>
                                </div>
                            )}
                        </div>

                        {/* Feature Importance — full width below */}
                        {results?.feature_importances && Object.keys(results.feature_importances).length > 0 && (
                            <FeatureImportanceChart data={results.feature_importances} />
                        )}
                    </div>
                </div>
            );
        };

        // ──────────── App ────────────
        const App = () => (
            <div style={{ minHeight: '100vh', paddingBottom: '2rem' }}>
                <Header />
                <main className="animate-fade-in">
                    <SimulatorTab />
                </main>
                <div style={{ textAlign: 'center', marginTop: '40px', paddingTop: '20px' }}>
                    <p style={{ color: '#888', fontSize: '0.75rem' }}>
                        MGMT298D: Science and Strategy of AI | UCLA Anderson School of Management
                    </p>
                </div>
            </div>
        );

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
