<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Gallery | MGMT298D</title>
  <meta name="description" content="A gallery of AI apps from MGMT298D: Science and Strategy of Artificial Intelligence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ucla-blue: #2774ae;
      --darkest-blue: #003b5c;
      --ucla-gold: #ffd100;
      --darkest-gold: #ffb81c;
      --bright-coral: #f47c30;
      --dark-sea-foam: #4e7e6b;
      --lightest-blue: #c3d7ee;
      --slate: #313339;
      --ink: rgba(49, 51, 57, 0.9);
      --muted: #5c6670;
      --line: #d9dee5;
      --surface: #f7f8fa;
      --white: #ffffff;
      --font-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
      --font-title: "Whitney Bold", Whitney, "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
      --text-base: 1rem;
      --text-small: 0.94rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.5;
    }

    a {
      color: var(--darkest-blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover,
    a:focus {
      color: var(--ucla-blue);
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 34px 24px 44px;
    }

    .hero {
      position: relative;
      padding: 26px 0 26px;
    }

    .hero::after {
      content: "";
      display: block;
      height: 5px;
      margin-top: 24px;
      background: linear-gradient(90deg, var(--ucla-gold), var(--darkest-gold), var(--ucla-blue));
    }

    .brand-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: var(--darkest-blue);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .brand-divider,
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ucla-gold);
    }

    h1,
    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1,
    h2 {
      color: var(--ucla-blue);
      font-family: var(--font-title);
      font-weight: 700;
    }

    h1 {
      margin-top: 8px;
      font-size: clamp(1.8rem, 4vw, 3.25rem);
      line-height: 1.04;
    }

    h2 {
      font-size: clamp(1.34rem, 2.4vw, 1.9rem);
      line-height: 1.15;
    }

    h3 {
      color: var(--darkest-blue);
      font-size: 1.05rem;
      line-height: 1.25;
    }

    .hero-copy {
      max-width: 760px;
      margin: 12px 0 0;
      font-size: 1.04rem;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .button-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 9px 13px;
      color: var(--darkest-blue);
      background: var(--white);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--text-small);
      font-weight: 700;
      line-height: 1.25;
      text-decoration: none;
    }

    .button-link.primary {
      border-color: var(--darkest-blue);
      color: var(--white);
      background: var(--darkest-blue);
    }

    .button-link:hover,
    .button-link:focus {
      border-color: var(--ucla-blue);
      color: var(--darkest-blue);
      background: var(--surface);
    }

    .button-link:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .gallery-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-end;
      margin-top: 24px;
      border-bottom: 1px solid var(--line);
    }

    .tab-button {
      min-height: 42px;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      padding: 10px 16px;
      color: var(--darkest-blue);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: var(--text-small);
      font-weight: 700;
      line-height: 1.2;
    }

    .tab-button:hover,
    .tab-button:focus {
      color: var(--ucla-blue);
      background: var(--surface);
    }

    .tab-button:focus {
      outline: 3px solid rgba(39, 116, 174, 0.16);
      outline-offset: 0;
    }

    .tab-button[aria-selected="true"] {
      position: relative;
      z-index: 1;
      border-color: var(--line);
      color: var(--ucla-blue);
      background: var(--white);
      box-shadow: inset 0 4px 0 var(--ucla-gold);
    }

    .tab-panel[hidden] {
      display: none;
    }

    .section-band {
      margin-top: 38px;
    }

    .tab-panel.section-band {
      margin-top: 24px;
    }

    .section-heading {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .section-dots {
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }

    .section-dots .dot:nth-child(2) {
      background: var(--bright-coral);
    }

    .section-dots .dot:nth-child(3) {
      background: var(--ucla-blue);
    }

    .submit-panel {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-top: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      box-shadow: inset 0 4px 0 var(--ucla-gold);
    }

    .submit-panel::after {
      content: "";
      position: absolute;
      top: 17px;
      right: 17px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bright-coral);
      box-shadow: -15px 0 0 var(--dark-sea-foam), -30px 0 0 var(--ucla-blue);
    }

    .submission-form {
      display: grid;
      gap: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field-group {
      display: grid;
      gap: 6px;
      color: var(--darkest-blue);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .field-group.full {
      grid-column: 1 / -1;
    }

    .field-input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 9px 12px;
      color: var(--ink);
      background: var(--white);
      font: inherit;
      letter-spacing: 0;
      text-transform: none;
    }

    textarea.field-input {
      min-height: 108px;
      resize: vertical;
    }

    .summary-prompts {
      display: grid;
      grid-column: 1 / -1;
      gap: 12px;
      min-width: 0;
      margin: 0;
      border: 1px solid rgba(39, 116, 174, 0.18);
      border-left: 5px solid var(--ucla-gold);
      border-radius: 6px;
      padding: 14px;
      background: var(--surface);
    }

    .summary-title {
      margin-bottom: 2px;
      color: var(--darkest-blue);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .summary-question {
      font-size: 0.9rem;
      letter-spacing: 0;
      line-height: 1.35;
      text-transform: none;
      padding-left: 10px;
      border-left: 2px solid rgba(39, 116, 174, 0.22);
    }

    .summary-question textarea.field-input {
      min-height: 88px;
    }

    .field-input:focus {
      border-color: var(--ucla-blue);
      outline: 3px solid rgba(39, 116, 174, 0.16);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .form-status {
      color: var(--muted);
      font-size: var(--text-small);
      line-height: 1.35;
    }

    .form-status[data-status="error"] {
      color: #9f2d1d;
      font-weight: 700;
    }

    .form-status[data-status="success"] {
      color: var(--dark-sea-foam);
      font-weight: 700;
    }

    .library-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .library-search {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 9px 12px;
      color: var(--ink);
      font: inherit;
    }

    .library-count {
      color: var(--muted);
      font-size: var(--text-small);
      font-weight: 700;
      white-space: nowrap;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .app-card {
      display: grid;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      background: var(--white);
    }

    .app-card h3 {
      font-size: 1rem;
    }

    .app-meta {
      color: var(--muted);
      font-size: var(--text-small);
      font-weight: 700;
      line-height: 1.35;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .keyword-chip {
      border: 1px solid rgba(244, 124, 48, 0.46);
      border-radius: 999px;
      padding: 3px 8px;
      color: #9f3d13;
      background: rgba(244, 124, 48, 0.13);
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .summary-full {
      margin: 0;
      color: var(--ink);
      font-size: var(--text-small);
      line-height: 1.5;
    }

    .summary-part {
      margin-top: 10px;
    }

    .summary-part:first-child {
      margin-top: 0;
    }

    .summary-part strong {
      display: block;
      color: var(--darkest-blue);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .summary-part p {
      margin: 3px 0 0;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .card-link {
      min-height: 0;
      border: 0;
      border-radius: 0;
      padding: 0;
      color: var(--ucla-blue);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
      text-decoration: none;
    }

    .card-link:hover,
    .card-link:focus {
      color: var(--darkest-blue);
      background: transparent;
    }

    .video-preview {
      position: relative;
      display: block;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      aspect-ratio: 16 / 9;
      text-decoration: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.48);
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .summary-modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px;
      background: var(--white);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }

    .modal-header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--ucla-blue);
      font-family: var(--font-title);
      font-size: 1.35rem;
      line-height: 1.15;
    }

    .modal-close {
      min-width: 40px;
      justify-content: center;
      padding-right: 10px;
      padding-left: 10px;
    }

    .video-thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--surface);
    }

    .play-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 59, 92, 0.84);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.24);
      pointer-events: none;
    }

    .play-badge::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 9px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--white);
    }

    .empty-state,
    .setup-note {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      background: var(--surface);
      color: var(--muted);
      font-size: var(--text-small);
      line-height: 1.5;
    }

    .empty-state[hidden],
    .setup-note[hidden] {
      display: none;
    }

    @media (max-width: 760px) {
      .submit-panel,
      .library-tools {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .library-count {
        white-space: normal;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px 14px 32px;
      }

      .hero {
        padding-top: 20px;
      }

      .gallery-tabs {
        gap: 4px;
      }

      .tab-button {
        flex: 1 1 150px;
        padding-right: 12px;
        padding-left: 12px;
      }

      .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modal-overlay {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand-line">
        <span>UCLA Anderson</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="course-code">MGMT298D</span>
      </div>
      <h1>App Gallery</h1>
      <div class="hero-actions">
        <a class="button-link" href="index.html">Course Home</a>
      </div>
    </header>

    <div class="gallery-tabs" role="tablist" aria-label="App gallery sections">
      <button class="tab-button" id="browse-tab" type="button" role="tab" aria-controls="browse" aria-selected="true" data-tab-target="browse">Browse</button>
      <button class="tab-button" id="submit-tab" type="button" role="tab" aria-controls="submit" aria-selected="false" tabindex="-1" data-tab-target="submit">Submit</button>
    </div>

    <section class="section-band tab-panel" id="browse" role="tabpanel" aria-labelledby="browse-tab">
      <div class="section-heading">
        <h2 id="library-heading">Browse Apps</h2>
        <span class="section-dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>
      <div class="library-tools">
        <input class="library-search" id="librarySearch" type="search" placeholder="Search by app, team, keyword, or summary" aria-label="Search submissions">
        <span class="library-count" id="libraryCount">Loading submissions...</span>
      </div>
      <div class="setup-note" id="setupNote" hidden></div>
      <div class="app-grid" id="appGrid" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden>No submissions match the current search.</div>
    </section>

    <section class="section-band tab-panel" id="submit" role="tabpanel" aria-labelledby="submit-tab" hidden>
      <div class="section-heading">
        <h2 id="submit-heading">Submit an App</h2>
        <span class="section-dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>
      <div class="submit-panel">
        <div>
          <form class="submission-form" id="submissionForm">
            <div class="form-grid">
              <label class="field-group">
                App name
                <input class="field-input" name="appName" autocomplete="off" required>
              </label>
              <label class="field-group">
                Team members
                <input class="field-input" name="teamMembers" autocomplete="off" required>
              </label>
              <label class="field-group">
                Live app URL
                <input class="field-input" name="liveUrl" type="url" inputmode="url" required>
              </label>
              <label class="field-group">
                Pitch Video Google Drive URL (.MP4)
                <input class="field-input" name="videoUrl" type="url" inputmode="url" required>
              </label>
              <label class="field-group full">
                Keywords (3-5)
                <input class="field-input" name="keywords" autocomplete="off" placeholder="finance, forecasting, workflow" required>
              </label>
              <div class="summary-prompts" role="group" aria-labelledby="summary-prompts-title">
                <div class="summary-title" id="summary-prompts-title">Written summary (max 500 words total)</div>
                <label class="field-group full summary-question">
                  1. What is the problem?
                  <textarea class="field-input" name="problem" required></textarea>
                </label>
                <label class="field-group full summary-question">
                  2. What did you build and how does it work?
                  <textarea class="field-input" name="build" required></textarea>
                </label>
                <label class="field-group full summary-question">
                  3. Who are the end users, and how does your app deliver value to them?
                  <textarea class="field-input" name="endUsers" required></textarea>
                </label>
                <label class="field-group full summary-question">
                  4. What are the main limitations of your approach?
                  <textarea class="field-input" name="limitations" required></textarea>
                </label>
                <label class="field-group full summary-question">
                  5. How would you improve your product?
                  <textarea class="field-input" name="improvements" required></textarea>
                </label>
              </div>
            </div>
            <div class="form-actions">
              <button class="button-link primary" type="submit">Submit</button>
              <span class="form-status" id="formStatus"></span>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="summaryModalOverlay" hidden>
    <section class="summary-modal" role="dialog" aria-modal="true" aria-labelledby="summaryModalTitle">
      <div class="modal-header">
        <h3 id="summaryModalTitle">App Summary</h3>
        <button class="button-link modal-close" id="summaryModalClose" type="button" aria-label="Close summary">Close</button>
      </div>
      <div class="summary-full" id="summaryModalContent"></div>
    </section>
  </div>

  <script>
    const APP_LIBRARY_CONFIG = {
      apiBaseUrl: "https://ssai-app-gallery-api-production.up.railway.app",
      submissions: []
    };
    const SUMMARY_PROMPTS = [
      { key: "problem", label: "What is the problem?" },
      { key: "build", label: "What did you build and how does it work?" },
      { key: "endUsers", label: "Who are the end users, and how does your app deliver value to them?" },
      { key: "limitations", label: "What are the main limitations of your approach?" },
      { key: "improvements", label: "How would you improve your product?" }
    ];

    const appGrid = document.querySelector("#appGrid");
    const emptyState = document.querySelector("#emptyState");
    const libraryCount = document.querySelector("#libraryCount");
    const librarySearch = document.querySelector("#librarySearch");
    const setupNote = document.querySelector("#setupNote");
    const submissionForm = document.querySelector("#submissionForm");
    const formStatus = document.querySelector("#formStatus");
    const summaryModalOverlay = document.querySelector("#summaryModalOverlay");
    const summaryModalTitle = document.querySelector("#summaryModalTitle");
    const summaryModalContent = document.querySelector("#summaryModalContent");
    const summaryModalClose = document.querySelector("#summaryModalClose");
    const tabButtons = [...document.querySelectorAll("[data-tab-target]")];
    const tabPanels = [...document.querySelectorAll(".tab-panel")];
    let submissions = [];
    let visibleSubmissions = [];
    let lastModalTrigger = null;

    function normalize(value) {
      return String(value || "").trim();
    }

    function driveFileId(url) {
      const value = normalize(url);
      if (!value.includes("drive.google.com")) return "";
      const match = value.match(/[-\w]{25,}/);
      return match ? match[0] : "";
    }

    function drivePreviewUrl(url) {
      const fileId = driveFileId(url);
      return fileId ? `https://drive.google.com/file/d/${fileId}/preview` : "";
    }

    function driveThumbnailUrl(url) {
      const fileId = driveFileId(url);
      return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w640` : "";
    }

    function isDriveVideoUrl(url) {
      return Boolean(drivePreviewUrl(url));
    }

    function escapeHtml(value) {
      return normalize(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isValidUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (error) {
        return false;
      }
    }

    function wordCount(value) {
      return normalize(value).split(/\s+/).filter(Boolean).length;
    }

    function keywordList(value) {
      return normalize(value).split(",").map((keyword) => keyword.trim()).filter(Boolean);
    }

    function truncateWords(value, limit) {
      const words = normalize(value).split(/\s+/).filter(Boolean);
      if (words.length <= limit) return normalize(value);
      return `${words.slice(0, limit).join(" ")}...`;
    }

    function setFormStatus(message, status = "") {
      formStatus.textContent = message;
      formStatus.dataset.status = status;
    }

    function submissionPayload() {
      const formData = new FormData(submissionForm);
      return {
        appName: normalize(formData.get("appName")),
        teamMembers: normalize(formData.get("teamMembers")),
        liveUrl: normalize(formData.get("liveUrl")),
        keywords: normalize(formData.get("keywords")),
        problem: normalize(formData.get("problem")),
        build: normalize(formData.get("build")),
        endUsers: normalize(formData.get("endUsers")),
        limitations: normalize(formData.get("limitations")),
        improvements: normalize(formData.get("improvements")),
        videoUrl: normalize(formData.get("videoUrl"))
      };
    }

    function summaryResponses(source) {
      const structured = source?.summary && typeof source.summary === "object" ? source.summary : {};
      return Object.fromEntries(SUMMARY_PROMPTS.map(({ key }) => [key, normalize(structured[key] || source?.[key])]));
    }

    function combinedSummary(source) {
      const responses = summaryResponses(source);
      const sections = SUMMARY_PROMPTS.map(({ key, label }) => {
        const answer = responses[key];
        return answer ? `${label}\n${answer}` : "";
      }).filter(Boolean);
      return sections.length ? sections.join("\n\n") : normalize(source?.writeup);
    }

    function submissionMetadata(payload) {
      const summary = summaryResponses(payload);
      return {
        appName: payload.appName,
        teamMembers: payload.teamMembers,
        liveUrl: payload.liveUrl,
        videoUrl: payload.videoUrl,
        keywords: keywordList(payload.keywords),
        summary,
        writeup: combinedSummary(payload),
        submittedAt: new Date().toISOString()
      };
    }

    function baseSubmissions() {
      return Array.isArray(APP_LIBRARY_CONFIG.submissions)
        ? APP_LIBRARY_CONFIG.submissions.filter((app) => app.appName && app.liveUrl)
        : [];
    }

    function apiBaseUrl() {
      const params = new URLSearchParams(window.location.search);
      return normalize(params.get("api") || APP_LIBRARY_CONFIG.apiBaseUrl).replace(/\/+$/, "");
    }

    async function apiRequest(path, options = {}) {
      const baseUrl = apiBaseUrl();
      if (!baseUrl) {
        throw new Error("Submission repository is not configured yet. Add the Railway API URL to APP_LIBRARY_CONFIG.apiBaseUrl.");
      }

      const response = await fetch(`${baseUrl}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      const payload = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(payload.error || "Submission repository request failed.");
      }

      return payload;
    }

    async function fetchRepositorySubmissions() {
      const payload = await apiRequest("/submissions");
      return Array.isArray(payload.submissions)
        ? payload.submissions.filter((app) => app.appName && app.liveUrl)
        : [];
    }

    async function saveRepositorySubmission(submission) {
      const payload = await apiRequest("/submissions", {
        method: "POST",
        body: JSON.stringify(submission)
      });
      if (!payload.submission) {
        throw new Error("Submission repository did not return the saved record.");
      }
      return payload.submission;
    }

    function tabFromHash() {
      const tabId = window.location.hash.replace("#", "");
      return tabPanels.some((panel) => panel.id === tabId) ? tabId : "browse";
    }

    function selectTab(tabId, updateHash = true) {
      tabButtons.forEach((button) => {
        const selected = button.dataset.tabTarget === tabId;
        button.setAttribute("aria-selected", String(selected));
        button.tabIndex = selected ? 0 : -1;
      });

      tabPanels.forEach((panel) => {
        panel.hidden = panel.id !== tabId;
      });

      if (updateHash && window.location.hash !== `#${tabId}`) {
        window.history.pushState(null, "", `#${tabId}`);
      }
    }

    function keywordChips(keywords) {
      const items = keywordList(keywords);
      if (!items.length) return "";
      return `
        <ul class="keyword-list" aria-label="Keywords">
          ${items.map((keyword) => `<li class="keyword-chip">${escapeHtml(keyword)}</li>`).join("")}
        </ul>
      `;
    }

    function summarySections(app) {
      const structured = app?.summary && typeof app.summary === "object" ? app.summary : summaryResponses(app);
      const sections = SUMMARY_PROMPTS.map(({ key, label }) => ({
        label,
        answer: normalize(structured[key])
      })).filter((section) => section.answer);

      if (sections.length) return sections;

      const writeup = normalize(app?.writeup);
      return writeup ? [{ label: "Summary", answer: writeup }] : [];
    }

    function summaryHtml(app) {
      const sections = summarySections(app);
      if (!sections.length) return "";

      return `
        ${sections.map((section) => `
          <div class="summary-part">
            <strong>${escapeHtml(section.label)}</strong>
            <p>${escapeHtml(section.answer)}</p>
          </div>
        `).join("")}
      `;
    }

    function appCard(app, index) {
      const videoPreview = drivePreviewUrl(app.videoUrl);
      const videoThumbnail = driveThumbnailUrl(app.videoUrl);
      const hasSummary = summarySections(app).length > 0;
      return `
        <article class="app-card">
          <div>
            <h3>${escapeHtml(app.appName || "Untitled App")}</h3>
            <div class="app-meta">${escapeHtml(app.teamMembers || "Team members pending")}</div>
          </div>
          ${videoPreview ? `
            <a class="video-preview" href="${escapeHtml(videoPreview)}" target="_blank" rel="noopener" aria-label="Open ${escapeHtml(app.appName || "app")} pitch video">
              <img class="video-thumbnail" src="${escapeHtml(videoThumbnail)}" alt="${escapeHtml(app.appName || "App")} pitch video thumbnail" loading="lazy">
              <span class="play-badge" aria-hidden="true"></span>
            </a>
          ` : ""}
          ${keywordChips(app.keywords)}
          <div class="card-actions">
            ${app.liveUrl ? `<a class="card-link" href="${escapeHtml(app.liveUrl)}" target="_blank" rel="noopener">Open App</a>` : ""}
            ${hasSummary ? `<button class="card-link" type="button" data-summary-index="${index}">Summary</button>` : ""}
          </div>
        </article>
      `;
    }

    function openSummaryModal(index, trigger) {
      const app = visibleSubmissions[index];
      if (!app) return;

      lastModalTrigger = trigger || null;
      summaryModalTitle.textContent = `${app.appName || "App"} Summary`;
      summaryModalContent.innerHTML = summaryHtml(app);
      summaryModalOverlay.hidden = false;
      summaryModalClose.focus();
    }

    function closeSummaryModal() {
      summaryModalOverlay.hidden = true;
      summaryModalContent.innerHTML = "";
      if (lastModalTrigger) lastModalTrigger.focus();
      lastModalTrigger = null;
    }

    function render() {
      const query = librarySearch.value.trim().toLowerCase();
      const filtered = submissions.filter((app) => {
        const haystack = `${app.appName} ${app.teamMembers} ${app.keywords} ${combinedSummary(app)}`.toLowerCase();
        return haystack.includes(query);
      });

      visibleSubmissions = filtered;
      appGrid.innerHTML = filtered.map(appCard).join("");
      emptyState.hidden = filtered.length > 0 || submissions.length === 0;
      libraryCount.textContent = submissions.length === 1
        ? "1 submission"
        : `${submissions.length} submissions`;
    }

    async function loadSubmissions() {
      libraryCount.textContent = "Loading submissions...";
      try {
        submissions = [...baseSubmissions(), ...await fetchRepositorySubmissions()];
        setupNote.hidden = true;
      } catch (error) {
        submissions = baseSubmissions();
        setupNote.hidden = false;
        setupNote.textContent = error.message;
      }

      render();
    }

    submissionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = submissionPayload();
      const submitButton = submissionForm.querySelector('button[type="submit"]');

      if (!isValidUrl(payload.liveUrl)) {
        setFormStatus("Please enter a valid live app URL.", "error");
        return;
      }

      if (!isDriveVideoUrl(payload.videoUrl)) {
        setFormStatus("Pitch video must be a valid Google Drive link.", "error");
        return;
      }

      const keywords = keywordList(payload.keywords);
      if (keywords.length < 3 || keywords.length > 5) {
        setFormStatus("Please enter 3 to 5 comma-separated keywords.", "error");
        return;
      }

      if (SUMMARY_PROMPTS.some(({ key }) => !payload[key])) {
        setFormStatus("Please answer all five written summary questions.", "error");
        return;
      }

      if (wordCount(combinedSummary(payload)) > 500) {
        setFormStatus("Written summary must be 500 words or fewer in total.", "error");
        return;
      }

      submitButton.disabled = true;
      try {
        const metadata = submissionMetadata(payload);
        await saveRepositorySubmission(metadata);
        submissions = [...baseSubmissions(), ...await fetchRepositorySubmissions()];
        render();
        submissionForm.reset();
        setFormStatus("Submitted.", "success");
        selectTab("browse");
      } catch (error) {
        setFormStatus(error.message || "Submission could not be saved.", "error");
      }
      submitButton.disabled = false;
    });

    appGrid.addEventListener("click", (event) => {
      const summaryButton = event.target.closest("[data-summary-index]");
      if (!summaryButton) return;
      openSummaryModal(Number(summaryButton.dataset.summaryIndex), summaryButton);
    });

    summaryModalClose.addEventListener("click", closeSummaryModal);

    summaryModalOverlay.addEventListener("click", (event) => {
      if (event.target === summaryModalOverlay) closeSummaryModal();
    });

    tabButtons.forEach((button, index) => {
      button.addEventListener("click", () => {
        selectTab(button.dataset.tabTarget);
      });

      button.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const nextIndex = (index + direction + tabButtons.length) % tabButtons.length;
        tabButtons[nextIndex].focus();
        selectTab(tabButtons[nextIndex].dataset.tabTarget);
      });
    });

    window.addEventListener("hashchange", () => {
      selectTab(tabFromHash(), false);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !summaryModalOverlay.hidden) {
        closeSummaryModal();
      }
    });

    selectTab(tabFromHash(), false);
    librarySearch.addEventListener("input", render);
    loadSubmissions();
  </script>
</body>
</html>
